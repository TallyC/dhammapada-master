BOOKS.push({"id": "c", "n": "心意品", "p": "Cittavagga", "d": "心像箭，像魚，像城：看見它、守護它、把它調直。", "note": "巴利本的第三品；在《法句經》中為第十一品。故事依巴利註釋傳統，參考 Daw Mya Tin 英譯，由編者摘要；漢巴偈頌對應依蘇錦坤對讀表，漢傳沒有對應處已標明。", "u": [{"id": "c1", "t": "梅吉亞與芒果園", "s": "梅吉亞是佛陀的侍者。他托缽時看見一片可愛的芒果園，覺得很適合修行，就請求去那裡禪修。佛陀當時身邊沒有別人，請他等其他比丘來再去，他一再請求，佛陀才答應。他在樹下坐了一整天，心卻不斷飄向貪欲、瞋恚和傷害的念頭，毫無進展。傍晚回來報告，佛陀說：心本來就搖動不定，需要調伏。接著說了這兩首偈，梅吉亞證得初果。", "k": [{"n": "33", "h": ["意使作㺃，", "難護、難禁，", "慧正其本，", "其明乃大。"], "p": ["Phandanaṃ capalaṃ cittaṃ, dūrakkhaṃ dunnivārayaṃ;", "ujuṃ karoti medhāvī, usukārova tejanaṃ."], "hm": "漢譯不用造箭人的比喻，說的是「慧正其本，其明乃大」：以智慧端正心的根本，光明便大。", "d": "心會顫動、飄忽，難以守護、難以制止。智者把它調直，就像造箭的人把箭桿削直。"}, {"n": "34", "hn": "漢傳《法句經》沒有對應的偈。", "p": ["Vārijova thale khitto, okamokataubbhato;", "pariphandatidaṃ cittaṃ, māradheyyaṃ pahātave."], "d": "像魚從水裡被拋到陸地上，這顆心也不停掙扎跳動；所以要設法脫離魔的領域。"}], "g": [["phandana", "顫動"], ["capala", "飄忽、易變"], ["dūrakkha", "難守護"], ["dunnivāraya", "難制止"], ["ujuṃ karoti", "使成筆直"], ["usukāra", "造箭的人"], ["vārija", "水中生的（魚）"], ["māradheyya", "魔的領域"]], "w": [["難護、難禁", "難以守護、難以禁制"], ["慧正其本", "以智慧端正心的根本"]], "i": [["把心削直", "偈頌用造箭人作比喻：不是消滅這顆心，而是一點一點把它削直。"], ["梅吉亞的經驗", "他以為換個好地方就能定下來，結果發現問題在心。可以這樣理解：心沒有調伏，到哪裡都一樣；地方重要，但不是關鍵。"]], "x": "今天找三分鐘，只看著呼吸；每次心跑掉就輕輕帶回來，數數跑了幾次。", "q": {"q": "梅吉亞在芒果園坐了一天沒有進展，佛陀點出的重點是？", "o": [["芒果園不夠安靜", "偈頌沒有談地點。"], ["心本來就搖動，需要調伏", "對。偈頌用削直的箭和離水的魚比喻這顆心。", 1], ["他不該出家", "故事沒有這個意思，他後來證得初果。"]]}}, {"id": "c2", "t": "馬提卡村的比丘", "s": "六十位比丘從佛陀領受禪修題目，在馬提卡村住下。村中的女居士馬提卡之母供養他們，自己也學習觀身無常，很快證果；她以天眼知道比丘們尚未進步，便準備合適的飲食，比丘們後來都成為阿羅漢。後來另一位比丘聽說她，前往該村。她預先知道他的需要，帶著食物來見他。他問她是否能知他人心念，她沒有直接回答，他卻害怕自己的念頭被看穿，回到佛陀那裡。佛陀要他調伏自己的心，專注在禪修題目上。他回去精進，證得阿羅漢。佛陀說了第 35 偈。", "k": [{"n": "35", "h": ["輕躁難持，", "唯欲是從，", "制意為善，", "自調則寧。"], "p": ["Dunniggahassa lahuno, yatthakāmanipātino;", "cittassa damatho sādhu, cittaṃ dantaṃ sukhāvahaṃ."], "d": "心難以制伏、輕快飄動、想到哪裡就落在哪裡。把心調伏是好事，調伏過的心會帶來安樂。"}], "g": [["dunniggaha", "難制伏"], ["lahu", "輕、快"], ["yatthakāmanipātin", "隨欲所之而落"], ["damatha", "調伏"], ["sādhu", "善、好"], ["danta", "已調伏的"], ["sukhāvaha", "帶來樂的"]], "w": [["輕躁", "輕浮、躁動"], ["唯欲是從", "只隨著欲念走"], ["制意為善", "制伏心意是好事"], ["自調則寧", "自己調伏便得寧靜"]], "i": [["調伏，不是壓抑", "damatha 的意思是調練。可以想像成調馬：讓心聽得懂指令，而不是用蠻力壓住。"], ["怕被看穿的比丘", "他害怕念頭被看見，佛陀沒有教他躲開，而是叫他回到自己的禪修題目。心念要自己守，用不著為被看見而慌張。"]], "x": "今天有念頭讓你想逃（例如怕被批評）時，先停一息，回到呼吸。", "q": {"q": "佛陀對害怕被看穿心念的比丘說了什麼？", "o": [["離開那個村子", "佛陀要他回去繼續修。"], ["調伏自己的心，專注禪修題目", "對。", 1], ["去問女居士為什麼知道", "故事裡沒有這個建議。"]]}}, {"id": "c3", "t": "厭倦的年輕比丘", "s": "舍衛城一位銀行家的兒子，請教比丘如何脫離苦，依建議分財、皈依、持戒，後來出家。出家後，一位老師教他阿毘達磨，另一位教他律藏。他覺得內容太多、戒條太細，漸漸厭倦，想還俗，責任也荒廢，人又瘦又憂鬱。佛陀對他說：如果你能調伏好這顆心，其他便不必另外費心；所以要守護自己的心。於是說了第 36 偈。這位年輕比丘和許多人後來證得阿羅漢。", "k": [{"n": "36", "h": ["意微難見，", "隨欲而行，", "慧常自護，", "能守即安。"], "p": ["Sududdasaṃ sunipuṇaṃ, yatthakāmanipātinaṃ;", "cittaṃ rakkhetha medhāvī, cittaṃ guttaṃ sukhāvahaṃ."], "d": "心極難看見、極為細微，想到哪裡就落到哪裡。智者要守護這顆心；守護好的心，帶來安樂。"}, {"n": "漢7", "h": ["佛說心法，", "雖微非真，", "當覺逸意，", "莫隨放心。"], "pn": "巴利本沒有找到對應；放在這裡一起讀。", "d": "佛說心的法則雖然細微，卻不是真實不變；要覺察逸動的心意，不要順著放縱的心。"}, {"n": "漢8", "h": ["見法最安，", "所願得成，", "慧護微意，", "斷苦因緣。"], "pn": "巴利本沒有找到對應的偈。", "d": "見到法最安穩，所求便能成就；用智慧守護細微的心念，就斷了苦的因緣。"}], "g": [["sududdasa", "極難見"], ["sunipuṇa", "極細微"], ["yatthakāmanipātin", "隨欲所之而落"], ["rakkhetha", "應當守護"], ["gutta", "被守護的"]], "w": [["意微難見", "心念細微，難以看見"], ["隨欲而行", "隨著欲望行動"], ["慧常自護", "常以智慧守護自己"], ["因緣", "原因與條件"]], "i": [["先看見，再守護", "偈說心「極難見」：念頭起得又快又細，要先看見，才談得上守護。這正是本工具「看見起心動念」的出發點。"], ["漢傳多出的一偈", "《法句經》這一品有一偈「見法最安…斷苦因緣」，編者在巴利本找不到對應，放在這裡一起讀，因為意思相近：用智慧守護心，苦的因緣就斷了。"]], "x": "今天睡前回想：哪一個念頭最先讓你煩躁？只要看見它就好，不必評斷。", "q": {"q": "偈頌說心「極難見」，所以重點是？", "o": [["放棄", "偈頌的態度相反。"], ["先看見，再守護", "對。", 1], ["把它壓下去", "偈頌用的是「守護」，不是壓制。"]]}}, {"id": "c4", "t": "僧護的外甥", "s": "僧護長老有個外甥，也叫僧護，剛出家。外甥得到兩件衣，想送一件給舅舅，舅舅說自己夠用，不收；外甥覺得被冷落，心裡開始幻想：還俗、養山羊、娶妻、生子，後來為孩子和妻子吵架，竟動手打人。他正替舅舅搧著棕櫚葉扇，恍神之間，真的打到舅舅的頭。舅舅知道他的心念，說：你想打妻子，卻打到老比丘了。年輕人驚慌逃走，被追回，帶到佛陀面前。佛陀說：心能走得很遠，要努力從貪、瞋、癡中解脫。說了第 37 偈，年輕比丘證得初果。", "k": [{"n": "37", "h": ["獨行遠逝，", "覆藏無形，", "損意近道，", "魔繫乃解。"], "p": ["Dūraṅgamaṃ ekacaraṃ, asarīraṃ guhāsayaṃ;", "ye cittaṃ saṃyamessanti, mokkhanti mārabandhanā."], "d": "心走得遠、獨自行動、沒有形體、住在洞穴裡。能夠約束這顆心的人，會從魔的繫縛中解脫。"}], "g": [["dūraṅgama", "遠行"], ["ekacara", "獨行"], ["asarīra", "無身、無形"], ["guhāsaya", "住在洞穴"], ["saṃyamessanti", "將會約束"], ["mokkhanti", "將解脫"], ["mārabandhana", "魔的繫縛"]], "w": [["獨行遠逝", "獨自走得很遠"], ["覆藏無形", "隱藏起來，沒有形體"], ["損意近道", "減損放縱的心意，便接近道"], ["魔繫乃解", "魔的繫縛才解開"]], "i": [["心的特徵", "遠行、獨行、無形、藏在洞穴：念頭一瞬間可以去到千里外，沒有人看得見，也沒有人能替你看管。「洞穴」傳統上解為身體或身內。"], ["一場白日夢", "外甥的故事很像日常：一個小小的受挫，念頭自己編出整齣戲，連動作也跟著失控。"]], "x": "今天留意一次白日夢：它是從哪個小事件開始的？", "q": {"q": "偈頌形容心「獨行」，意思最接近？", "o": [["心只靠自己跑，沒人能替你看管", "對。要靠自己調伏。", 1], ["心不喜歡群體", "偈頌沒有這個意思。"], ["心需要別人代為管理", "偈頌說的是自己約束。"]]}}, {"id": "c5", "t": "出家又還俗的長老", "s": "舍衛城有個人為了找走失的牛，又餓又累，在精舍得到剩飯，覺得出家人的日子輕鬆，就出家了。但他很快厭倦托缽，又還俗。這樣出家、還俗反覆六次，人們說他心念飄忽。最後一次在家時，他看見熟睡的妻子，姿態像一具屍體，忽然看清身體的無常與不淨，立刻回精舍，路上證得初果。比丘們起初不太接納他，最終還是收留，他不久成為阿羅漢。有人問他為何出家還俗這麼久，他說自己的執著已經沒有了。佛陀說：是的，並說了第 38、39 偈。", "k": [{"n": "38", "h": ["心無住息，", "亦不知法，", "迷於世事，", "無有正智。"], "p": ["Anavaṭṭhitacittassa, saddhammaṃ avijānato;", "pariplavapasādassa, paññā na paripūrati."], "d": "心不安定、不了解正法、信心動搖的人，智慧無法圓滿。"}, {"n": "39", "h": ["念無適止，", "不絕無邊，", "福能遏惡，", "覺者為賢。"], "p": ["Anavassutacittassa, ananvāhatacetaso;", "puññapāpapahīnassa, natthi jāgarato bhayaṃ."], "hm": "漢傳這一偈字面與巴利不同：巴利說捨離福與罪，漢傳說「福能遏惡」。對應依蘇錦坤對讀表。", "d": "心不被貪欲浸濕、不被瞋恨擊打，已捨離福與罪的執取、保持覺醒的人，沒有恐懼。"}], "g": [["anavaṭṭhita", "不穩定"], ["saddhamma", "正法"], ["pariplava", "動搖"], ["pasāda", "淨信"], ["paññā", "慧"], ["anavassuta", "不被（貪欲）浸濕"], ["ananvāhata", "未被（瞋恨）打擊"], ["jāgara", "覺醒"]], "w": [["無住息", "沒有停下來的時候"], ["迷於世事", "被世間事務迷惑"], ["正智", "正確的智慧"], ["適止", "可以停靠之處"], ["福能遏惡", "福德能遏止惡"]], "i": [["動搖的心，智慧長不大", "偈說因果：心不定，信就不穩，慧就不圓滿。先安住，才談得上智慧。"], ["不是不會動，是不被牽走", "第 39 偈說心「不被浸濕、不被打擊」，所以沒有恐懼。傳統上這是阿羅漢的境界，我們可以先當作方向：念頭起來，不被牽著走。"]], "x": "今天選一件做到一半就想放棄的小事，多撐五分鐘，觀察想放棄的那個念頭。", "q": {"q": "故事裡的長老為什麼後來不再出家還俗？", "o": [["他被規定不能離開", "故事沒有這樣說。"], ["他看清身體的無常，心定下來", "對。", 1], ["他得到很多供養", "與故事不合。"]]}}, {"id": "c6", "t": "五百比丘與樹神", "s": "五百位比丘到森林深處禪修。樹神不想讓出家人住在自己和家人的樹下，用鬼影、怪聲嚇他們。比丘們向佛陀報告，佛陀說：回去吧，這次帶上慈心當武器。他教了《慈經》，比丘們一邊誦念一邊進入森林，樹神感受到慈心，不再騷擾。比丘們接著觀察身體的無常，佛陀放光為他們印證，並說了第 40 偈：身體像易碎的陶罐，心要像城堡一樣防守，以智慧為武器與魔作戰。五百比丘證得阿羅漢。", "k": [{"n": "40", "h": ["藏六如龜，", "防意如城，", "慧與魔戰，", "勝則無患。"], "p": ["Kumbhūpamaṃ kāyamimaṃ viditvā, nagarūpamaṃ cittamidaṃ ṭhapetvā;", "yodhetha māraṃ paññāvudhena, jitañca rakkhe anivesano siyā."], "d": "知道這個身體像陶罐一樣易碎，把這顆心安立得像一座城；用智慧為武器與魔作戰，勝了以後要守住，不再執著停留。"}], "g": [["kumbhūpama", "如陶罐"], ["kāya", "身"], ["nagarūpama", "如城"], ["ṭhapetvā", "安立"], ["yodhetha", "應當作戰"], ["māra", "魔"], ["paññāvudha", "智慧的武器"], ["anivesana", "無執著的"]], "w": [["藏六如龜", "龜把頭和四肢縮進殼裡，比喻收攝六根"], ["防意如城", "防守心意像守住一座城"], ["慧與魔戰", "以智慧與魔作戰"], ["勝則無患", "得勝便沒有憂患"]], "i": [["兩個比喻", "身像陶罐，一碰就碎；心像城，要守住城門。可以理解成城門就是眼耳鼻舌身意，漢傳「藏六如龜」說的是同一件事。"], ["武器是慈與慧", "故事裡，比丘先用慈心化解樹神的敵意，再用智慧觀身。對外靠慈，對內靠慧。"]], "x": "今天出門前想一次：眼耳最容易被什麼勾走？提醒自己守住這一關。", "q": {"q": "偈頌說要用什麼和魔作戰？", "o": [["刀劍", "偈頌用的是譬喻。"], ["智慧", "對。paññā 就是智慧。", 1], ["多念咒", "偈頌沒有這個說法。"]]}}, {"id": "c7", "t": "提舍與腐臭的身體", "s": "提舍長老精進修行，全身生出瘡，瘡破膿血，浸濕衣服，發出惡臭，連弟子都離開他。佛陀看出他快要證阿羅漢，在火房燒水，來到他的床邊，扶著床的邊緣。弟子們見狀，把提舍抬到火房洗浴，也洗了衣服。身心舒暢後，提舍很快入定。佛陀站在床邊說：這個身體沒有了識，就像被丟棄的木頭一樣無用。說了第 41 偈。提舍成為阿羅漢，不久後去世。", "k": [{"n": "41", "h": ["有身不久，", "皆當歸土，", "形壞神去，", "寄住何貪？"], "p": ["Aciraṃ vatayaṃ kāyo, paṭhaviṃ adhisessati;", "chuddho apetaviññāṇo, niratthaṃva kaliṅgaraṃ."], "d": "不久，這個身體就要躺在地上，被丟棄，沒有了識，像一根沒有用處的木頭。"}], "g": [["aciraṃ", "不久"], ["kāya", "身"], ["paṭhavi", "地"], ["adhisessati", "將躺臥"], ["chuddha", "被丟棄"], ["apetaviññāṇa", "離開了識"], ["niratthaṃ", "無用"], ["kaliṅgara", "木頭"]], "w": [["有身不久", "有這個身體的時間不長"], ["歸土", "回到土裡"], ["形壞神去", "身體敗壞、心識離去"], ["寄住", "暫時借住"]], "i": [["身是暫住", "漢傳問「寄住何貪」：身體像借住的房子，早晚要還。"], ["看見無常，不是冷漠", "故事裡佛陀親自為病比丘洗浴。提醒無常，不等於不照顧；對生病的人，當下該做的就是照顧。"]], "x": "今天做一件照顧身體的小事（喝水、伸展、早睡），並想一想：身體是暫住。", "q": {"q": "第 41 偈說身體失去「識」之後像什麼？", "o": [["一根無用的木頭", "對。", 1], ["一座寶塔", "偈頌的比喻相反。"], ["一朵花", "與偈頌不合。"]]}}, {"id": "c8", "t": "牧牛人難陀", "s": "難陀是牧牛人，替給孤獨長者放牛，自己也有些財產。他在長者家聽過佛陀說法，邀請佛陀到他家。佛陀經過憍薩羅時，特地繞到他的村子；難陀供養佛陀與比丘七天，最後聽法證得初果。佛陀離開時，難陀替他拿了一段缽，才轉身回家，半路被一個舊仇的獵人殺死。比丘們問：是不是佛陀來訪才害了他？佛陀說：死是不可避免的，而一顆放錯方向的心，比盜賊、仇敵造成的傷害更大。說了第 42 偈。", "k": [{"n": "42", "h": ["心豫造處，", "往來無端，", "念多邪僻，", "自為招惡。"], "p": ["Diso disaṃ yaṃ taṃ kayirā, verī vā pana verinaṃ;", "micchāpaṇihitaṃ cittaṃ, pāpiyo naṃ tato kare."], "d": "仇敵對仇敵所做的，怨家對怨家所做的，都比不上一顆放錯方向的心對自己造成的傷害。"}], "g": [["diso", "仇敵"], ["disaṃ", "對仇敵"], ["verī", "怨家"], ["micchāpaṇihita", "安置錯誤（方向）的"], ["pāpiya", "更壞的"]], "w": [["往來無端", "念頭來去沒有頭緒"], ["邪僻", "偏邪不正"], ["招惡", "招來惡果"]], "i": [["最大的敵人在內部", "偈頌不否認外敵會傷人，只是說：一顆放錯方向的心，傷害更大，因為它跟著你，也是你自己養成的。"], ["回到本工具的主題", "起心動念是善惡的起點，這是你寫下的答案。這一偈說的正是：念頭的方向，比外在的對手更要緊。"]], "x": "今天有人讓你不舒服時，先問自己：此刻我的心朝哪個方向？", "q": {"q": "佛陀怎麼回應比丘們「難陀被殺是否因佛陀來訪」的疑問？", "o": [["說是佛陀來訪害了他", "佛陀沒有這樣說。"], ["死不可免，放錯方向的心傷害更大", "對。", 1], ["說獵人必遭報應", "故事重點不在這裡。"]]}}, {"id": "c9", "t": "蘇雷亞的念頭", "s": "蘇雷亞是富家青年，坐車去沐浴時，看見大迦旃延長老托缽，被他金色的膚色吸引，生起一念：但願他是我的妻子。就在那一刻，他的性別轉變了。他羞愧地逃到德叉尸羅，嫁給一位富家青年，生了兩個兒子。多年後，同鄉人認出他，他說出經過；依那人的建議，邀請長老應供，請求原諒。長老原諒了他，他恢復男身。他對自己生活的巨變感到震動，出家了。後來有人問他更愛哪個兒子，他說沒有特別的偏愛，別人以為他說謊。佛陀說：蘇雷亞已是阿羅漢；正確安置的心，帶給他的利益，是父母也給不了的。說了第 43 偈，許多人證得初果。", "k": [{"n": "43", "h": ["是意自造，", "非父母為，", "可勉向正，", "為福勿回。"], "p": ["Na taṃ mātā pitā kayirā, aññe vāpi ca ñātakā;", "sammāpaṇihitaṃ cittaṃ, seyyaso naṃ tato kare."], "d": "母親、父親或其他親族都不能為你做到的，一顆正確安置的心能為你做得更好。"}], "g": [["mātā pitā", "母、父"], ["ñātaka", "親族"], ["sammāpaṇihita", "安置正確（方向）的"], ["seyyaso", "更好"]], "w": [["是意自造", "這些都是心意自己造作"], ["非父母為", "不是父母所做"], ["勉向正", "努力導向正道"], ["為福勿回", "做福事不要退轉"]], "i": [["與第 42 偈成對", "第 42 偈說錯的心比仇敵更壞，第 43 偈說對的心比父母更好。這一品用「敵」與「親」，翻轉我們對外在的依賴。"], ["自己做自己的功課", "父母的愛與護持很重要，但偈頌說的是：心的方向，終究要自己來定。"]], "x": "今天做一件出於善意的小事，並留意做之前那一念。", "q": {"q": "第 43 偈把什麼與父母相比？", "o": [["一顆正確安置的心", "對。", 1], ["財富", "偈頌沒有談財富。"], ["神通", "偈頌沒有談神通。"]]}}]});
BOOKS.push({"id": "p", "n": "華香品", "p": "Pupphavagga", "d": "學著挑選善法，像花匠採花；戒的香，連逆風也能傳到。", "note": "巴利本的第四品；在《法句經》中為第十二品。故事依巴利註釋傳統，參考 Daw Mya Tin 英譯，由編者摘要；漢巴偈頌對應依蘇錦坤對讀表（第 55–59 偈對應為編者依內容比對）。", "u": [{"id": "p1", "t": "談論土地的比丘", "s": "五百位比丘送佛陀到村子後回到祇園精舍，傍晚聚在一起談論當地的土地：平坦還是多山，土是黏土、沙土、紅土還是黑土。佛陀知道他們在談什麼，來到後說：與其談論外面的土地，不如好好觀察自己的身體，這會為禪修做好準備。接著說了第 44 偈，問：誰能徹底了知這大地、閻摩界與天界，並像熟練的花匠採花一樣，採擷善說的法句？第 45 偈回答：有學（已入道、尚未成阿羅漢的修行人）能夠。開示結束時，五百比丘都證得阿羅漢。", "k": [{"n": "44", "h": ["孰能擇地，", "捨鑑取天？", "誰說法句，", "如擇善華？"], "p": ["Ko imaṃ pathaviṃ vicessati, yamalokañca imaṃ sadevakaṃ;", "ko dhammapadaṃ sudesitaṃ, kusalo pupphamiva pacessati."], "d": "誰能徹底了知這大地、閻摩的世界和包括天界的這個世間？誰能像熟練的花匠採花一樣，採擷善說的法句？"}, {"n": "45", "h": ["學者擇地，", "捨鑑取天；", "善說法句，", "能採德華。"], "p": ["Sekho pathaviṃ vicessati, yamalokañca imaṃ sadevakaṃ;", "sekho dhammapadaṃ sudesitaṃ, kusalo pupphamiva pacessati."], "hm": "漢傳以第 2、3 兩偈表達巴利第 45 偈。", "d": "有學者能徹底了知大地、閻摩界與天界；有學者能像熟練的花匠採花一樣，採擷善說的法句。"}], "g": [["pathavi", "大地"], ["vicessati", "將探究、了知"], ["yamaloka", "閻摩界（惡道）"], ["sadevaka", "包括天界的"], ["dhammapada", "法句"], ["sudesita", "善說的"], ["kusala", "熟練的"], ["sekha", "有學（修行者）"]], "w": [["擇地", "選擇、觀察土地"], ["德華", "德行之花"], ["善說法句", "善巧宣說的法句"]], "i": [["花匠採花", "「法句」像花，要有眼光去挑、去採。這部經的名字 dhammapada，就是「法的詞句」。"], ["談地，不如觀身", "比丘們談的是外面的土地，佛陀把目光轉回身心。學習的素材，隨時都在自己身上。"]], "x": "今天挑一句最打動你的偈，抄在便條上，像採一朵花。", "q": {"q": "佛陀為何對談論土地的比丘說了這兩偈？", "o": [["要他們別再聊天", "佛陀是把話題引向更有益的觀察。"], ["把目光從外面的土地轉回自己的身心", "對。", 1], ["要他們去種花", "偈頌的花是比喻。"]]}}, {"id": "p2", "t": "海市蜃樓與泡沫", "s": "一位比丘向佛陀領受禪修題目，到森林修行，進展很少，就動身要去請益。路上看見海市蜃樓，知道那只是水的幻象，想到身體也同樣不實。他一路帶著這個念頭，來到阿致羅婆提河邊，坐在樹下，看見大水泡一個個破滅，體會到身體的無常。佛陀此時以影像顯現，對他說：身體像泡沫，像幻影。並說了第 46 偈：了知這點的人，折斷魔的花箭（註釋解為煩惱、業、果報三種相續），走出死王看不見的地方。比丘證得阿羅漢。", "k": [{"n": "46", "h": ["知世坏喻，", "幻法忽有，", "斷魔華敷，", "不覩生死；", "見身如沫，", "幻法自然，", "斷魔華敷，", "不覩生死。"], "p": ["Pheṇūpamaṃ kāyamimaṃ viditvā, marīcidhammaṃ abhisambudhāno;", "chetvāna mārassa papupphakāni, adassanaṃ maccurājassa gacche."], "hm": "漢傳以兩偈表達（第 4「知世坏喻」、第 5「見身如沫」），合為巴利第 46 偈。", "d": "了知這個身體像泡沫，體悟它具有幻影的本質；折斷魔的花，就能走到死王看不見的地方。"}], "g": [["pheṇa", "泡沫"], ["upama", "如、比喻"], ["marīci", "海市蜃樓"], ["abhisambudhāna", "完全覺悟"], ["papupphaka", "花（魔的花）"], ["chetvā", "折斷"], ["maccurāja", "死王"], ["adassana", "看不見之處"]], "w": [["坏", "未燒的陶坯，易碎"], ["幻法", "幻化不實的事物"], ["華敷", "花開展"], ["不覩", "看不見"]], "i": [["兩個比喻", "泡沫看似一團，一碰就破；海市蜃樓看起來有水，走近就沒有。身體與感受，都有這種性質。"], ["魔的花", "「魔華」是吸引人的外相；折斷它，就不再被牽著走。註釋把它解為煩惱、業、果報三種相續。"]], "x": "今天洗手或洗澡時，看著水泡一個個破掉，想一想：身體也是同樣的性質。", "q": {"q": "故事裡的比丘是怎麼體會到身體不實的？", "o": [["看海市蜃樓與水泡", "對。", 1], ["讀了很多經典", "故事裡是從親身觀察而來。"], ["聽別人說", "故事強調的是自己的觀察。"]]}}, {"id": "p3", "t": "毗琉璃王與洪水", "s": "憍薩羅國的波斯匿王向釋迦族求婚，釋迦族不想得罪他，送去一位摩訶男與女奴所生的女孩。她的兒子毗琉璃十六歲時到迦毗羅衛，受到羞辱，一個女奴譏笑他母親的出身。他發誓報復。後來他成為國王，屠殺釋迦族，只放過跟隨摩訶男的少數人。回程時，他駐紮在阿致羅婆提河的沙洲，上游洪水衝下來，把他和軍隊都捲走。佛陀說明釋迦族遭此結局，是因為過去世曾對一條河下毒、殺死其中的魚。說了第 47 偈：心被欲樂黏住的人，被死亡帶走，就像洪水捲走沉睡的村莊。（依註釋傳統）", "k": [{"n": "47", "h": ["身病則萎，", "若華零落；", "死命來至，", "如水湍驟。"], "p": ["Pupphāni heva pacinantaṃ, byāsattamanasaṃ naraṃ;", "suttaṃ gāmaṃ mahoghova, maccu ādāya gacchati."], "hm": "漢傳以兩偈表達（第 6「身病則萎」、第 7「死命來至」），合為巴利第 47 偈。", "d": "像只顧採花、心思黏著其中的人，死亡把他帶走，如同大洪水捲走沉睡的村莊。"}], "g": [["pupphāni", "花"], ["pacinanta", "採集的"], ["byāsattamanasa", "心黏著的"], ["sutta", "睡著的"], ["gāma", "村"], ["mahogha", "大洪水"], ["maccu", "死亡"], ["ādāya", "帶走"]], "w": [["身病則萎", "身體生病，像花枯萎"], ["零落", "凋零"], ["湍驟", "水流急而猛"]], "i": [["採花的人", "「採花」比喻不斷收集欲樂。人在忙著採的時候，看不見洪水正在上漲。"], ["故事與偈頌", "註釋用毗琉璃王的故事說明：怨恨與復仇終究被無常帶走。偈頌本身談的是死亡的突然，不需要先知道故事也能讀。"]], "x": "今天留意一次「只想再多一點」的念頭（多滑一下手機、多買一點），看它想採的是什麼花。", "q": {"q": "第 47 偈用什麼比喻死亡的來臨？", "o": [["大洪水沖走沉睡的村莊", "對。", 1], ["一陣微風", "偈頌的比喻是大洪水。"], ["野獸襲擊", "偈頌沒有這樣說。"]]}}, {"id": "p4", "t": "轉生天界的女居士", "s": "舍衛城有一位樂善好施的女居士，十六歲出嫁，生了四個兒子，常服侍比丘、打掃精舍。她回憶過去生，曾是忉利天一位天子的妻子，在花園採花時去世，此後每次做功德，都發願再生到那裡。她生病，一天傍晚去世，果然轉生為那位天子的妻子。天上一百人間年才是一天，所以她的缺席幾乎沒人察覺，她向丈夫說出一切。比丘們為她的去世悲傷，佛陀說：眾生的壽命短暫，欲樂還沒滿足，就被死亡制伏。說了第 48 偈。（依註釋傳統）", "k": [{"n": "48", "h": ["貪欲無厭，", "消散人念，", "邪致之財，", "為自侵欺。"], "p": ["Pupphāni heva pacinantaṃ, byāsattamanasaṃ naraṃ;", "atittaññeva kāmesu, antako kurute vasaṃ."], "hm": "漢傳這一偈談「貪欲無厭」與「邪致之財」，偏重貪欲的害處，與巴利大意相近但不完全相同。對應依蘇錦坤對讀表。", "d": "只顧採花、心思黏著的人，對欲樂還沒滿足，死神就制伏了他。"}], "g": [["atitta", "不滿足"], ["kāmesu", "於欲樂中"], ["antaka", "終結者（死神）"], ["vasa", "控制"], ["kurute", "使落入"]], "w": [["無厭", "不滿足"], ["消散人念", "使人的正念消散"], ["邪致之財", "以不正當方式得來的財"], ["侵欺", "侵害欺騙"]], "i": [["欲樂沒有「夠」的一天", "偈頌的重點：欲望從不說「夠了」，而死亡不會等我們滿足。"], ["願與行", "故事中的女居士每次做功德都發願。可以看成：把善行和心願持續連在一起，心的方向就會慢慢被帶領。"]], "x": "今天寫下一個「夠了」的時刻：吃到幾分飽、滑手機滑到哪裡就停。", "q": {"q": "第 48 偈的重點是？", "o": [["欲樂永遠不會滿足，死亡卻不會等待", "對。", 1], ["要拒絕一切花朵", "偈頌的花是比喻。"], ["要趕快賺更多錢", "與偈意相反。"]]}}, {"id": "p5", "t": "吝嗇的科西亞", "s": "王舍城附近薩卡拉有位吝嗇的富人科西亞。有一天他和妻子躲在樓上的密室做煎餅，免得要分給別人。佛陀看出夫婦倆將證初果，派大目犍連去。長老靜靜站在窗邊。科西亞要妻子做一個很小的餅，但每次都做成很大的；最後餅都黏在籃子裡。他失去胃口，把整籃餅都給了大目犍連。長老為夫婦講布施，並把夫婦和食物一起帶到佛陀那裡。用完飯，兩人證得初果。第二天比丘們讚歎大目犍連，佛陀說了第 49 偈：比丘像蜜蜂，採花蜜而不傷花；進村托缽，不要損害村人的信心、布施與財物。（依註釋傳統）", "k": [{"n": "49", "h": ["如蜂集華，", "不嬈色香，", "但取味去，", "仁入聚然。"], "p": ["Yathāpi bhamaro pupphaṃ, vaṇṇagandhamaheṭhayaṃ;", "paleti rasamādāya, evaṃ gāme munī care."], "d": "就像蜜蜂採花，不損傷花的顏色與香氣，只取了花蜜就飛走；聖者在村裡行走，也應如此。"}], "g": [["bhamara", "蜜蜂"], ["vaṇṇa", "顏色"], ["gandha", "香"], ["aheṭhayaṃ", "不傷害"], ["paleti", "離去"], ["rasa", "味（花蜜）"], ["muni", "牟尼、聖者"], ["gāme", "在村中"]], "w": [["不嬈", "不惱亂"], ["取味", "取走花蜜"], ["仁", "仁者"], ["聚", "村落"]], "i": [["蜜蜂的分寸", "蜂取蜜，花依然完整。出家人接受供養，而不增加施主的負擔，施主也因布施而得福。"], ["日常裡的蜜蜂", "工作或相處中，取用別人的時間、心力時，是否讓對方原有的好——顏色與香氣——保持完整？"]], "x": "今天向別人請求幫忙時，想想：我有沒有讓對方保有餘裕與好意？", "q": {"q": "偈頌用蜜蜂比喻什麼樣的行為？", "o": [["取用而不傷害對方", "對。", 1], ["到處飛行", "偈頌的重點不是飛行。"], ["囤積蜂蜜", "與偈意相反。"]]}}, {"id": "p6", "t": "不看他人的過失", "s": "舍衛城一位富有的女居士，收養了外道苦行者帕維耶為義子。她聽說佛陀的功德，邀請佛陀應供。佛陀為她隨喜說法時，帕維耶在隔壁房間大發脾氣，咒罵她竟然供養佛陀。女居士羞愧，無法專心聽法。佛陀對她說：不要被這些咒罵困擾，只要看自己做了什麼、沒做什麼。說了第 50 偈：不要看他人的違逆與作為，只要觀察自己做了與沒做的事。女居士聽完證得初果。（依註釋傳統）", "k": [{"n": "50", "h": ["不務觀彼，", "作與不作，", "常自省身，", "知正不正。"], "p": ["Na paresaṃ vilomāni, na paresaṃ katākataṃ;", "attanova avekkheyya, katāni akatāni ca."], "d": "不要看別人的過失，也不要看別人做了什麼、沒做什麼；只要觀察自己做了什麼、沒做什麼。"}], "g": [["paresaṃ", "他人的"], ["viloma", "違逆、過失"], ["katākata", "已做與未做"], ["attano", "自己的"], ["avekkheyya", "應觀察"], ["katāni akatāni", "已做的與未做的"]], "w": [["不務", "不專心於"], ["省身", "反省自身"], ["知正不正", "知道正確或不正確"]], "i": [["兩個「已做、未做」", "不只看做了什麼，也看該做而沒做的。反省有兩個方向。"], ["被咒罵的時候", "女居士的難受是真的。佛陀沒有要她辯解，而是把注意力帶回自己的行為與心念。"]], "x": "今天遇到別人的不是時，先停一下，問自己：我今天該做而還沒做的是什麼？", "q": {"q": "第 50 偈建議我們觀察什麼？", "o": [["別人的過失", "偈頌說不要。"], ["自己做了與沒做的事", "對。", 1], ["別人的財富", "偈頌沒有談。"]]}}, {"id": "p7", "t": "有色無香的花", "s": "持傘（Chattapāṇi）是位不還果的在家弟子。他在祇園聽佛說法時，波斯匿王到來，他仍坐著不起身，因為怕起身向國王致敬，會顯得比對佛陀更恭敬。國王不悅，佛陀稱讚他通達佛法，國王的態度才軟化。後來國王請他教兩位王后末利夫人和韋沙婆夫人，他建議請佛陀派比丘；佛陀派阿難前往。阿難回報：末利夫人用心學習，韋沙婆夫人則不認真。佛陀說：法要帶著恭敬與專注去學，並去實行，才有利益。說了第 51、52 偈：不實行的善說，像美麗而無香的花；實行的善說，像美麗又芬芳的花。（依註釋傳統）", "k": [{"n": "51", "h": ["如可意華，", "色好無香，", "工語如是，", "不行無得；"], "p": ["Yathāpi ruciraṃ pupphaṃ, vaṇṇavantaṃ agandhakaṃ;", "evaṃ subhāsitā vācā, aphalā hoti akubbato."], "d": "像一朵美麗、有顏色卻沒有香氣的花，善說的話語，對不去實行的人，也沒有果實。"}, {"n": "52", "h": ["如可意華，", "色美且香，", "工語有行，", "必得其福。"], "p": ["Yathāpi ruciraṃ pupphaṃ, vaṇṇavantaṃ sugandhakaṃ;", "evaṃ subhāsitā vācā, saphalā hoti kubbato."], "d": "像一朵美麗、有顏色又芬芳的花，善說的話語，對能實行的人，便結出果實。"}], "g": [["rucira", "可愛的"], ["vaṇṇavanta", "有顏色的"], ["agandhaka", "無香的"], ["sugandhaka", "芬芳的"], ["subhāsita", "善說的"], ["vācā", "語言"], ["aphala", "無果的"], ["saphala", "有果的"], ["kubbato", "實行者的"]], "w": [["可意", "令人喜歡"], ["工語", "巧妙的言語"], ["不行無得", "不實行就沒有收穫"], ["必得其福", "必定得到福報"]], "i": [["說得好，不如做得到", "同一朵花，有香與無香。差別不在外形，而在有沒有「行」。"], ["兩位王后", "故事把「同樣聽法，結果不同」說得很具體：一個認真學，一個不認真。成果在於學習的態度，不只在內容。"]], "x": "今天選一句已讀過的偈，用一個小動作實行它。", "q": {"q": "兩首偈用「有香與無香」比喻什麼差別？", "o": [["是否實行所學", "對。", 1], ["花的品種", "偈頌不是談花種。"], ["說話的音量", "與偈意不合。"]]}}, {"id": "p8", "t": "毗舍佉的歡喜", "s": "毗舍佉是彌迦羅家的媳婦，七歲聽佛陀說法就證得初果。出嫁後，公公對托缽的比丘視而不見，她說公公在「吃舊食」（享用過去的福報）。公公生氣要趕她走，她請八位長老評理，長老認定她無過，還准她邀請比丘供養。後來公公在簾外聽佛陀說法，證得初果，稱她為「彌迦羅之母」。她的珠寶披肩遺失在祇園，她要獻給阿難，阿難不收，她就買回，建了東園精舍。精舍落成時，她繞著精舍歡喜吟誦。佛陀說：她不是發瘋，而是歡喜；過去世也曾行布施。並說了第 53 偈：像花匠用一堆花編成許多花環，生而為人，應該多做善事。（依註釋傳統）", "k": [{"n": "53", "h": ["多作寶花，", "結步搖綺，", "廣積德者，", "所生轉好。"], "p": ["Yathāpi puppharāsimhā, kayirā mālāguṇe bahū;", "evaṃ jātena maccena, kattabbaṃ kusalaṃ bahuṃ."], "d": "就像從一堆花可以編成許多花環，生而為人，應該多做善事。"}], "g": [["puppharāsi", "花堆"], ["mālāguṇa", "花環"], ["bahū", "許多"], ["jāta", "出生的"], ["macca", "凡人、會死的人"], ["kusala", "善"], ["kattabba", "應當做"]], "w": [["寶花", "珍貴的花"], ["步搖", "婦女髮飾，行走時搖動"], ["綺", "華美"], ["廣積德", "廣泛積累德行"], ["轉好", "越來越好"]], "i": [["多一朵，就多一個花環", "偈頌鼓勵「多」做：不必一次做大事，把眼前的小善串成一串。"], ["漢傳用首飾作比", "漢傳不用花環，而說用寶花編成步搖（髮飾），意思相近：把許多花編成美好的物件。"]], "x": "今天做三件小善事（問候、讓位、收拾），把它們想成一串花環。", "q": {"q": "第 53 偈用什麼比喻多行善？", "o": [["一堆花編成許多花環", "對。", 1], ["一棵大樹", "偈頌沒有用樹。"], ["一座山", "偈頌沒有這樣比喻。"]]}}, {"id": "p9", "t": "阿難的問題", "s": "一天傍晚，阿難想：花與樹木的香氣只能順風而去，有沒有一種香，連逆風也能傳到？他去問佛陀。佛陀說：皈依三寶、持守五戒、樂於布施的人，才是真正有德行的人，他的名聲傳遍四方，沙門、婆羅門與在家人，不論他住在哪裡都稱讚他。於是說了第 54 偈：花香、旃檀、多伽羅、茉莉都不能逆風，善人的香氣卻能逆風而行，傳到四面八方。第 55 偈接著說：在旃檀、多伽羅、青蓮、茉莉這些香之中，戒香最為無上。（依註釋傳統）", "k": [{"n": "54", "h": ["奇草芳花，", "不逆風熏，", "近道敷開，", "德人逼香。"], "p": ["Na pupphagandho paṭivātameti, na candanaṃ tagaramallikā;", "satañca gandho paṭivātameti, sabbā disā sappuriso pavāyati."], "d": "花香不能逆風而行，旃檀、多伽羅、茉莉也不能；善人的香卻能逆風，有德的人香遍四方。"}, {"n": "55", "h": ["旃檀多香，", "青蓮芳花，", "雖曰是真，", "不如戒香。"], "p": ["Candanaṃ tagaraṃ vāpi, uppalaṃ atha vassikī;", "etesaṃ gandhajātānaṃ, sīlagandho anuttaro."], "d": "旃檀、多伽羅、青蓮、茉莉，在這些香之中，戒香最為無上。"}], "g": [["paṭivāta", "逆風"], ["candana", "旃檀"], ["tagara", "多伽羅（香木）"], ["mallikā", "茉莉"], ["sappurisa", "善人"], ["sīlagandha", "戒香"], ["anuttara", "無上"]], "w": [["奇草", "珍奇的香草"], ["敷開", "開放"], ["逼香", "香氣遍及"], ["旃檀", "檀香"], ["青蓮", "青色的蓮花"], ["戒香", "持戒的香"]], "i": [["看不見的香", "善行的名聲不靠自己宣傳，別人感受到的，像是一種氣味般的存在。"], ["戒是根", "第 55 偈說最上的香是戒。戒不是限制，而是讓人身上沒有臭味，別人才放心靠近。"]], "x": "今天選一個不傷人的小原則（例如不說人閒話），守一整天。", "q": {"q": "第 55 偈說最上的香是？", "o": [["旃檀", "偈頌說戒香超過旃檀。"], ["戒香", "對。", 1], ["花香", "偈頌說花香不能逆風。"]]}}, {"id": "p10", "t": "大迦葉與帝釋", "s": "佛陀住在王舍城竹林精舍時，大迦葉長老從滅盡定出來，特意到貧窮的街區托缽，希望讓窮人有機會得到大福德。帝釋天化作貧窮的老織工，與妻子須闍多化成的老婦，把米飯與菜盛滿長老的缽，香氣飄遍全城。大迦葉認出了帝釋，帝釋承認身分，禮敬後離去。佛陀在精舍看見這一幕，對比丘們說：長老的德行名聲連天界都知道，所以帝釋親自前來。說了第 56 偈：旃檀與多伽羅的香氣微弱，持戒者的香氣最勝，傳到諸天。（依註釋傳統）", "k": [{"n": "56", "h": ["華香氣微，", "不可謂真，", "持戒之香，", "到天殊勝。"], "p": ["Appamatto ayaṃ gandho, yvāyaṃ tagaracandanaṃ;", "yo ca sīlavataṃ gandho, vāti devesu uttamo."], "d": "旃檀與多伽羅的這種香氣是微弱的；持戒者的香氣卻傳到諸天，最為殊勝。"}], "g": [["appamatta", "微小的"], ["gandha", "香"], ["tagaracandana", "多伽羅與旃檀"], ["sīlavantaṃ", "持戒者的"], ["vāti", "散發、吹送"], ["devesu", "在諸天"], ["uttama", "最勝"]], "w": [["氣微", "氣味微弱"], ["不可謂真", "不能算真正的（香）"], ["殊勝", "特別殊妙"]], "i": [["小供養，大福田", "大迦葉選貧窮人家托缽，為的是讓對方有機會布施。受施的一方，也在成全施的一方。"], ["德行的香", "偈頌的「香」不是被稱讚，而是持戒的人自然散發的。帝釋被吸引而來，是故事的象徵。"]], "x": "今天做一件不求人知道的小善事，讓它像香氣一樣自然傳開。", "q": {"q": "偈頌說比旃檀更勝的香是？", "o": [["持戒者的香", "對。", 1], ["金銀的光", "偈頌沒有談。"], ["香水", "偈頌沒有這個說法。"]]}}, {"id": "p11", "t": "瞿提迦長老", "s": "瞿提迦長老在摩揭陀仙吞山的石板上修止觀，每次到達一心不亂，就被病痛打斷，前後六次。他決心即使犧牲生命，也要證得阿羅漢，繼續修行，臨終之際證得阿羅漢。魔王去尋找他的轉生處，找不到，就化作青年問佛陀：瞿提迦去了哪裡？佛陀說：你問這個沒有用；他已斷盡煩惱，成為阿羅漢，即使魔王有那麼大的力量，也找不到這樣的人往生何處。佛陀說了第 57 偈。（依註釋傳統）", "k": [{"n": "57", "h": ["戒具成就，", "行無放逸，", "定意度脫，", "長離魔道。"], "p": ["Tesaṃ sampannasīlānaṃ, appamādavihārinaṃ;", "sammadaññā vimuttānaṃ, māro maggaṃ na vindati."], "hm": "漢傳寫「定意度脫，長離魔道」，與巴利「以正智解脫」重點略有不同。", "d": "戒行具足、安住於不放逸、以正智解脫的人，魔找不到他們的去處。"}], "g": [["sampanna", "具足的"], ["sīla", "戒"], ["appamāda", "不放逸"], ["vihārin", "安住者"], ["sammadaññā", "以正智"], ["vimutta", "解脫的"], ["maggaṃ", "道路、去處"], ["na vindati", "找不到"]], "w": [["戒具成就", "戒行具足圓滿"], ["行無放逸", "行為沒有放逸"], ["定意", "安定心意"], ["度脫", "度過而得解脫"], ["長離", "永遠離開"]], "i": [["被打斷六次", "瞿提迦的修行不是一氣呵成，被打斷六次，他還是回來。「不放逸」在故事裡可以看成：一次又一次回到修行。"], ["魔找不到", "偈頌的重點不是長老往哪裡去，而是：心完全解脫的人，魔的探測到不了。"]], "x": "今天被打斷的事，找個時間重新接上，不求完美。", "q": {"q": "魔找不到瞿提迦的去處，是因為？", "o": [["他已解脫、成為阿羅漢", "對。", 1], ["他躲起來了", "故事不是這樣。"], ["他死得太快", "故事強調的是證果。"]]}}, {"id": "p12", "t": "糞堆裡的蓮花", "s": "舍衛城的西利古多是佛教徒，他的朋友迦羅哈迪那是尼乾子的信徒。迦羅哈迪那一再勸西利古多跟從自己的老師，說他們知道過去、現在、未來與他人的心。為了測試，西利古多邀請尼乾子們應供，在一條糞坑上設座位，用布蓋著空鍋。他們坐下時座位塌陷，全部掉進糞坑。尼乾子逃走，迦羅哈迪那憤怒，兩週不與他說話，後來設計報復，讓西利古多去邀請佛陀與五百比丘。佛陀知道這兩位朋友將證初果，接受邀請。他踏上蓋著火炭坑的席子時，火炭消失，五百朵蓮花出現；迦羅哈迪那驚慌，卻發現鍋裡盛滿了食物。用完飯，佛陀說了第 58、59 偈：智者弟子像垃圾堆中長出的蓮花。兩位朋友證得初果。（依註釋傳統）", "k": [{"n": "58", "h": ["如作田溝，", "近于大道，", "中生蓮華，", "香潔可意。"], "p": ["Yathā saṅkāraṭhānasmiṃ, ujjhitasmiṃ mahāpathe;", "padumaṃ tattha jāyetha, sucigandhaṃ manoramaṃ."], "d": "就像大路邊被丟棄的垃圾堆裡，生出了芳香又悅人的蓮花。"}, {"n": "59", "h": ["有生死然，", "凡夫處邊，", "慧者樂出，", "為佛弟子。"], "p": ["Evaṃ saṅkārabhūtesu, andhabhūte puthujjane;", "atirocati paññāya, sammāsambuddhasāvako."], "hm": "漢傳第 19 偈與巴利第 59 偈的對應，編者依內容比對（蘇錦坤對讀表此處未讀到）。", "d": "同樣地，在如垃圾般的盲目凡夫之中，正等正覺者的弟子以智慧大放光彩。"}], "g": [["saṅkāraṭhāna", "垃圾堆"], ["ujjhita", "被丟棄的"], ["mahāpatha", "大路"], ["paduma", "蓮花"], ["sucigandha", "清淨的香"], ["manorama", "悅意的"], ["andhabhūta", "盲目的"], ["puthujjana", "凡夫"], ["atirocati", "光耀"], ["sammāsambuddhasāvaka", "正等覺者的弟子"]], "w": [["田溝", "田間的水溝"], ["近于大道", "靠近大路"], ["香潔可意", "清香潔淨，令人喜悅"], ["生死然", "生死相續就是如此"], ["慧者樂出", "智者樂於出離"]], "i": [["蓮花不嫌泥", "蓮花從汙泥生出，卻不被泥污染。偈頌不是貶低凡夫，而是說：智慧像蓮花，環境不能決定它開不開。"], ["故事與偈頌", "傳統故事用火炭變蓮花來表現，偈頌本身的重點是智慧。"]], "x": "今天在一個讓你心煩的場合，試著用平靜的語氣說一句話。", "q": {"q": "偈頌用蓮花比喻什麼？", "o": [["在盲目凡夫之中大放光彩的智慧", "對。", 1], ["漂亮的外貌", "偈頌談的是智慧。"], ["富有的人", "偈頌沒有談財富。"]]}}]});
BOOKS.push({"id": "b", "n": "愚闇品", "p": "Bālavagga", "d": "看清愚的樣子，是為了轉向智。", "note": "巴利本的第五品；在《法句經》中為第十三品。故事依巴利註釋傳統，參考 Daw Mya Tin 英譯，由編者摘要；漢巴偈頌對應依蘇錦坤對讀表，漢傳沒有對應處已標明。第 71 偈的漢傳對應在〈惡行品〉。", "u": [{"id": "b1", "t": "漫長的一夜", "s": "波斯匿王看見一位已婚婦人，起了貪念，設計派她的丈夫去一件幾乎不可能完成的差事：到龍界取蓮花與紅土，要趕在國王傍晚沐浴前回來。青年出發，途中與旅人分食，也餵河裡的魚，並向河神求助；一位化作老人的龍王把東西交給他。城門已關，他把證物放在城牆上，請市民作證，然後前往祇園。那一夜，國王被貪欲折磨，聽到四個人在鐵鍋地獄受苦的哀號。佛陀說明他們是迦葉佛時代犯邪淫的富人。國王懺悔，決心不再貪求他人的妻子。青年與國王各自說起那一夜的漫長，佛陀說了第 60 偈。青年證得初果。（依註釋傳統）", "k": [{"n": "60", "h": ["不寐夜長、", "疲惓道長、", "愚生死長，", "莫知正法。"], "p": ["Dīghā jāgarato ratti, dīghaṃ santassa yojanaṃ;", "dīgho bālānaṃ saṃsāro, saddhammaṃ avijānataṃ."], "d": "對醒著的人，夜很長；對疲倦的人，一由旬路很長；對不了解正法的愚人，輪迴很長。"}], "g": [["dīgha", "長"], ["jāgarato", "醒著者的"], ["ratti", "夜"], ["santa", "疲倦者"], ["yojana", "由旬（路程單位）"], ["bāla", "愚人"], ["saṃsāra", "輪迴"], ["avijānata", "不了解者"]], "w": [["不寐", "睡不著"], ["疲惓", "疲倦"], ["莫知", "不知道"]], "i": [["三種「長」", "失眠的夜、疲累的路、無知的輪迴：感受到的「長」，都和心的狀態有關。"], ["愚是不知正法", "這裡的「愚」不是智商低，而是不了解正法（saddhamma）。不了解，是可以學的。"]], "x": "今天留意哪一件事讓你覺得「好長」，那時你的心在想什麼？", "q": {"q": "偈頌說的「愚人」指？", "o": [["智商低的人", "偈頌說的是不了解正法。"], ["不了解正法的人", "對。", 1], ["年紀小的人", "與年齡無關。"]]}}, {"id": "b2", "t": "寧可獨行", "s": "大迦葉長老住在王舍城附近，身邊有兩位年輕比丘。一位盡責，另一位懶散，被糾正就生氣。懶散的比丘欺騙在家施主，說長老生病，要來好食物，自己在路上吃掉。又被責備，他非常憤怒，趁長老托缽時，砸毀鍋盆並放火燒了精舍。一位王舍城的比丘把這件事告訴佛陀，佛陀說：大迦葉與其和愚昧的同伴同住，不如獨自生活。說了第 61 偈。那位比丘證得初果。（依註釋傳統）", "k": [{"n": "61", "h": ["癡意常冥，", "逝如流川，", "在一行彊，", "獨而無偶。"], "p": ["Carañce nādhigaccheyya, seyyaṃ sadisamattano;", "ekacariyaṃ daḷhaṃ kayirā, natthi bāle sahāyatā."], "hm": "漢傳第 2 偈與巴利第 61 偈字面差異較大，對應依蘇錦坤對讀表。", "d": "若行走時找不到比自己更好或與自己相等的同伴，寧可堅定地獨行；與愚人沒有同伴之誼。"}, {"n": "漢3", "h": ["愚人着數，", "憂慼久長，", "與愚居苦，", "於我猶怨。"], "pn": "巴利本沒有找到對應的偈；主題相近，放在這裡一起讀。", "d": "愚人執著、計較，憂愁悲戚持續很久；與愚人同住是苦，如同與怨家同處。"}], "g": [["carañce", "若行走"], ["nādhigaccheyya", "找不到"], ["seyya", "更好"], ["sadisa", "相等"], ["ekacariya", "獨行"], ["daḷha", "堅定"], ["sahāyatā", "友伴關係"]], "w": [["獨而無偶", "獨自一人，沒有同伴"], ["與愚居苦", "與愚人同住是苦"], ["猶怨", "如同怨家"]], "i": [["寧可獨行", "偈頌不是叫人孤僻，而是說：同伴比自己差、又無意改進時，不要為了合群而降低標準。"], ["反過來想", "懶散弟子的行為很惡劣。這個故事也提醒我們：自己是不是別人眼中的「愚友」？"]], "x": "今天選擇相處的對象時想一想：我是被帶向更好，還是被拉低？", "q": {"q": "佛陀對「與愚人同住」的建議是？", "o": [["與其和愚昧的同伴同住，不如獨自生活", "對。", 1], ["要設法說服對方", "故事沒有這樣說。"], ["要立刻報復", "與佛法不合。"]]}}, {"id": "b3", "t": "連自己都不屬於自己", "s": "舍衛城有位非常富有的長者，不肯布施，還叫兒子慕拉西利把財產全守住。他死前沒說出五罐黃金埋在哪裡，轉生成一個醜陋的乞丐男孩。他出生時乞丐們的收入正好減少，村人怪罪他母親，把她趕走。男孩長大後流浪回舊家，孫輩嚇得尖叫，僕人把他打出去。佛陀托缽時看見，請慕拉西利過來，說：這乞丐是你前世的父親。慕拉西利不信，男孩帶他到埋金之處，他才相信，成為虔誠的在家弟子。佛陀說了第 62 偈。（依註釋傳統）", "k": [{"n": "62", "h": ["有子、有財，", "愚惟汲汲，", "我且非我，", "何憂子財？"], "p": ["Puttā matthi dhanammatthi, iti bālo vihaññati;", "attā hi attano natthi, kuto puttā kuto dhanaṃ."], "d": "「我有兒子，我有財富」，愚人因此憂惱；其實連自己都不屬於自己，哪來的兒子、哪來的財富？"}, {"n": "漢5", "h": ["暑當止此、", "寒當止此，", "愚多務慮，", "莫知來變。"], "pn": "巴利本沒有找到對應的偈；主題相近（愚人的盤算與憂慮），放在這裡。", "d": "「暑期要住這裡，寒期要住這裡」，愚人多方盤算，卻不知道無常的變化將到。"}], "g": [["puttā", "兒子們"], ["matthi", "me atthi，我有"], ["dhana", "財"], ["vihaññati", "憂惱"], ["attā", "自己"], ["kuto", "哪裡來"]], "w": [["汲汲", "急切追求的樣子"], ["我且非我", "自己尚且不是自己的"], ["務慮", "多方謀慮"], ["來變", "將來的變化"]], "i": [["連「我」都不屬於我", "身心是因緣和合，不是能完全掌控的「我」。從這裡看，子與財更是借來的。"], ["守財的父親", "故事中的父親因吝嗇守財而成乞丐。偈頌不是反對擁有，而是說：把「我的」抓得越緊，越苦。"]], "x": "今天放下一個「我的」：別人用了你的東西時，微笑說：沒關係。", "q": {"q": "偈頌說「連自己都不屬於自己」，用意是？", "o": [["說明連最親近的「我」也無法完全掌控，更何況子與財", "對。", 1], ["要大家不要照顧子女", "偈頌沒有這個意思。"], ["財富都是假的", "偈頌談的是執著。"]]}}, {"id": "b4", "t": "兩個扒手", "s": "兩個扒手混在去祇園聽佛陀說法的信眾之中。一個專心聽法，證得初果；另一個心不在焉，趁人多偷了一些錢。回到家，專心聽法的那位沒有帶回錢，他的妻子嘲笑他：你這麼能幹，卻什麼也煮不出來。他心想：愚蠢的其實是她，就帶著親戚去見佛陀。佛陀說了第 63 偈，所有親戚都證得初果。（依註釋傳統）", "k": [{"n": "63", "h": ["愚曚愚極，", "自謂我智，", "愚而勝智，", "是謂極愚。"], "p": ["Yo bālo maññati bālyaṃ, paṇḍito vāpi tena so;", "bālo ca paṇḍitamānī, sa ve bāloti vuccati."], "d": "愚人若自知愚，就因此近於智者；愚人若自以為聰明，才真是所謂的愚人。"}], "g": [["maññati", "認為"], ["bālya", "愚（的本質）"], ["paṇḍita", "智者"], ["tena", "因此"], ["paṇḍitamānī", "自認為智者的人"], ["vuccati", "被稱為"]], "w": [["愚曚", "愚昧蒙昧"], ["自謂", "自己認為"], ["極愚", "最愚"]], "i": [["知愚近智", "能承認自己不知道，是學習的起點；自以為聰明，就關上了門。"], ["兩個扒手", "同樣聽法，一個聽進去，一個沒有。對比不在誰學問大，而在有沒有「自以為」。"]], "x": "今天說一次「我不知道」或「我可能錯了」。", "q": {"q": "偈頌說「真正的愚人」是？", "o": [["自以為聰明的愚人", "對。", 1], ["知道自己不足的人", "這樣的人近於智者。"], ["沒讀過書的人", "偈頌不在談學歷。"]]}}, {"id": "b5", "t": "勺子嘗不出湯味", "s": "優陀夷長老喜歡坐在博學比丘的座位上，讓人誤以為他很有學問。外來的比丘以為他是大學者，向他請教五蘊，他答不出來，眾人很驚訝：一位與佛陀同住的人，竟然知道得這麼少。佛陀說了第 64 偈：愚人即使終身親近智者，也無法了解法，像勺子嘗不出湯的味道。那些外來比丘證得阿羅漢。（依註釋傳統）", "k": [{"n": "64", "h": ["頑闇近智，", "如瓢斟味，", "雖久狎習，", "猶不知法；"], "p": ["Yāvajīvampi ce bālo, paṇḍitaṃ payirupāsati;", "na so dhammaṃ vijānāti, dabbī sūparasaṃ yathā."], "d": "愚人即使終身親近智者，也不能了解法，就像勺子嘗不出湯的味道。"}], "g": [["yāvajīva", "終身"], ["payirupāsati", "親近侍奉"], ["dhamma", "法"], ["vijānāti", "了知"], ["dabbī", "勺子"], ["sūparasa", "湯的味道"]], "w": [["頑闇", "愚鈍昏昧"], ["如瓢斟味", "像瓢勺舀湯"], ["狎習", "親近熟習"]], "i": [["勺子與舌頭", "勺子天天泡在湯裡，卻不知味。親近佛法或智者，不等於理解；要「嘗」：用心去體會。"], ["重點在「頑闇」", "漢傳這一偈的重點在「頑闇」：不是智者不夠好，是自己沒有打開。"]], "x": "今天讀一偈後，不看筆記，試著用自己的話說一遍。", "q": {"q": "偈頌用勺子比喻什麼人？", "o": [["親近智者卻不了解法的愚人", "對。", 1], ["智者的口才", "偈頌沒有談口才。"], ["湯太淡", "偈頌不是在談湯。"]]}}, {"id": "b6", "t": "三十位青年", "s": "三十位年輕人在森林裡和一位妓女嬉遊，她偷走他們貴重的飾物逃走。他們四處找她，遇見佛陀，聽法後證得初果，出家，跟隨佛陀到祇園，修苦行。聽了《無始經》後，全都證得阿羅漢。其他比丘讚歎他們這麼快成就，佛陀說了第 65 偈：有智慧的人即使只親近智者片刻，也很快了解法，像舌頭一嘗就知道湯的味道。（依註釋傳統）", "k": [{"n": "65", "h": ["開達近智，", "如舌甞味，", "雖須臾習，", "即解道要。"], "p": ["Muhuttamapi ce viññū, paṇḍitaṃ payirupāsati;", "khippaṃ dhammaṃ vijānāti, jivhā sūparasaṃ yathā."], "d": "有智慧的人，即使只親近智者片刻，也很快了解法，就像舌頭嘗得出湯的味道。"}], "g": [["muhutta", "片刻"], ["viññū", "明智者"], ["khippaṃ", "迅速"], ["jivhā", "舌"]], "w": [["開達", "心胸開通明達"], ["甞味", "嘗味"], ["須臾", "片刻"], ["道要", "道的要點"]], "i": [["同樣是湯，不同的器官", "勺子無知，舌頭有感。差別在於有沒有「能覺」的心。"], ["不在時間長短", "偈頌的意思是：心開通的人，一點就透；不開通的人，天天相處也不懂。"]], "x": "今天聽人說話時，專心十分鐘，不滑手機，看能體會到什麼。", "q": {"q": "與第 64 偈相對，這一偈說明什麼？", "o": [["有智慧的人短時間也能領會", "對。", 1], ["親近越久越好", "與偈意不合。"], ["只有出家人能領會", "偈頌沒有這樣說。"]]}}, {"id": "b7", "t": "痲瘋病人善覺", "s": "痲瘋病人善覺站在人群後面專心聽佛陀說法，證得初果。他想告訴佛陀，就跟著去精舍。帝釋天來試探他的信心，說只要他捨棄三寶，就給他財富。善覺回答：我已具足七種聖財（如信、戒、慧等）。佛陀說：即使一百位帝釋也不能使他退失。回途中，他被一頭母牛頂死；那頭牛是夜叉女，前世是被他殺害的妓女，來報仇。佛陀說他轉生到忉利天，並說他的痲瘋病來自前世曾向辟支佛吐口水。然後說了第 66 偈。（依註釋傳統）", "k": [{"n": "66", "h": ["愚人施行，", "為身招患，", "快心作惡，", "自致重殃。"], "p": ["Caranti bālā dummedhā, amitteneva attanā;", "karontā pāpakaṃ kammaṃ, yaṃ hoti kaṭukapphalaṃ."], "d": "愚昧缺乏智慧的人，對待自己像對待敵人一般，造作惡業，結出苦澀的果。"}], "g": [["caranti", "行事"], ["dummedha", "缺乏智慧的"], ["amitta", "非友（敵人）"], ["attanā", "對自己"], ["pāpaka", "惡的"], ["kamma", "業"], ["kaṭuka", "苦澀的"], ["phala", "果"]], "w": [["施行", "所作所為"], ["招患", "招來禍患"], ["快心", "稱心快意"], ["重殃", "重大災殃"]], "i": [["自己成了自己的敵人", "偈頌最有力的一句：愚人行惡，是在對自己做敵人才會做的事。"], ["故事與偈頌", "善覺的業果說法（前世吐口水、被牛頂死）是註釋的說法。偈頌本身只談：惡業的果是苦澀的。"]], "x": "今天遇到一個「痛快」的念頭，想一想它的後味。", "q": {"q": "第 66 偈說愚人行惡，是對自己做了什麼？", "o": [["如同敵人對自己所做的事", "對。", 1], ["考驗自己", "偈頌沒有這樣說。"], ["報答自己", "與偈意相反。"]]}}, {"id": "b8", "t": "一千枚金幣與農夫", "s": "小偷把贓物藏在田裡，丟下一包一千枚金幣就逃走。佛陀看出田裡的農夫那天將證初果，與阿難走過時說：這裡有一條很毒的蛇。農夫聽見了，找到錢就藏起來。失主循著腳印找到農夫，打了他，帶他去見國王，國王判他死刑。押赴刑場的路上，農夫不斷重複他聽到的話。國王懷疑他是在呼喚佛陀，便帶他去見佛陀。佛陀說：智者不做事後會後悔的事。說了第 67 偈。農夫證得初果。（依註釋傳統）", "k": [{"n": "67", "h": ["行為不善，", "退見悔悋，", "致涕流面，", "報由宿習；"], "p": ["Na taṃ kammaṃ kataṃ sādhu, yaṃ katvā anutappati;", "yassa assumukho rodaṃ, vipākaṃ paṭisevati."], "d": "做了以後會後悔的事，不是好事；做了它，要淚流滿面地哭著承受果報。"}], "g": [["sādhu", "善、好"], ["katvā", "做了之後"], ["anutappati", "後悔"], ["assumukha", "淚流滿面"], ["rodaṃ", "哭泣"], ["vipāka", "果報"], ["paṭisevati", "承受"]], "w": [["悔悋", "後悔慚愧"], ["涕", "眼淚"], ["宿習", "過去累積的習氣"]], "i": [["用「後悔」當標準", "做事之前問自己：做了之後我會後悔嗎？這是很實用的篩檢。"], ["與下一偈成對", "第 67 偈講會後悔的事，第 68 偈講不後悔的事，並排讀更清楚。"]], "x": "今天做決定前問一次：做了之後，我會後悔嗎？", "q": {"q": "偈頌用什麼標準判斷「不好的事」？", "o": [["做了之後會後悔", "對。", 1], ["別人會不會看見", "偈頌沒有談。"], ["是否賺錢", "偈頌沒有談。"]]}}, {"id": "b9", "t": "花匠須摩那", "s": "花匠須摩那每天早上送茉莉花給頻婆娑羅王。有一天，他看見佛陀光明莊嚴地進入王舍城托缽，決定把花獻給佛陀，即使可能受罰。他把花拋向空中，花在佛陀頭上形成花蓋，又在左右與背後形成花牆，隨佛陀同行。人們出來禮敬。國王是初果聖者，非常歡喜，供養佛陀與比丘一餐，並賞賜須摩那八種東西，包括象、馬、奴僕等。阿難問須摩那會得到什麼，佛陀說：他在極長時間內不墮惡道，將來成為辟支佛。說了第 68 偈。（依註釋傳統）", "k": [{"n": "68", "h": ["行為德善，", "進覩歡喜，", "應來受福，", "喜笑悅習。"], "p": ["Tañca kammaṃ kataṃ sādhu, yaṃ katvā nānutappati;", "yassa patīto sumano, vipākaṃ paṭisevati."], "d": "做了以後不會後悔的事，才是好事；做了它，要歡喜、愉快地承受果報。"}], "g": [["nānutappati", "不後悔"], ["patīta", "歡喜"], ["sumana", "心意愉悅"], ["vipāka", "果報"]], "w": [["德善", "德行善業"], ["進覩", "向前看見"], ["悅習", "歡喜實行"]], "i": [["不後悔的善", "須摩那冒著受罰的風險供養，卻毫無後悔。偈頌說的是行為之後心的狀態：歡喜、無悔。"], ["一把花", "供養的價值不在物品大小，而在當下的心。"]], "x": "今天做一件事前先停三秒，確定做完不會後悔。", "q": {"q": "第 68 偈說的好事特徵是？", "o": [["做了不後悔，心中歡喜", "對。", 1], ["別人稱讚", "偈頌沒有談。"], ["花費很大", "偈頌沒有談。"]]}}, {"id": "b10", "t": "蓮花色比丘尼", "s": "舍衛城富人的女兒，因為美麗被稱為「蓮花色」。許多人來提親，她卻選擇出家為比丘尼，在燈焰前修習禪定，證得阿羅漢。後來她住在安陀林，她的堂弟難陀躲在她床下，意圖侵犯她。她警告他，他不聽。他走開時，大地裂開，把他吞沒。佛陀說了第 69 偈，許多人證得初果。佛陀並勸波斯匿王在城鎮裡或附近建比丘尼的住處，會比較安全。（依註釋傳統）", "k": [{"n": "69", "h": ["過罪未熟，", "愚以恬惔，", "至其熟處，", "自受大罪。"], "p": ["Madhuvā maññati bālo, yāva pāpaṃ na paccati;", "yadā ca paccati pāpaṃ, bālo dukkhaṃ nigacchati."], "d": "惡業還沒成熟的時候，愚人把它當成甜蜜；等到惡業成熟，愚人就陷入苦中。"}, {"n": "漢13", "h": ["愚所望處，", "不謂適苦，", "臨墮厄地，", "乃知不善。"], "pn": "巴利本沒有找到對應的偈；主題相近，放在這裡一起讀。", "d": "愚人所盼望的地方，不覺得會有苦；等到臨近墜入困厄之地，才知道自己做得不善。"}], "g": [["madhu", "蜜"], ["maññati", "認為"], ["yāva", "只要"], ["paccati", "成熟"], ["dukkha", "苦"], ["nigacchati", "陷入"]], "w": [["過罪", "過失罪行"], ["恬惔", "安然、不以為意"], ["熟處", "成熟之時"], ["厄地", "困厄之地"]], "i": [["果子沒熟的時候", "偈頌用「成熟」比喻：種子已經種下，只是果子還沒熟。愚人把沒有立刻發生的後果，當作沒有後果。"], ["漢傳多出的一偈", "漢傳「愚所望處…乃知不善」在巴利本找不到對應：不到臨頭，愚人不知後果。"]], "x": "今天想一件拖著沒處理的小事，看它的「果子」是不是正在成熟。", "q": {"q": "偈頌說愚人把惡業當成「蜜」，是在什麼時候？", "o": [["惡業還沒成熟時", "對。", 1], ["惡業成熟之後", "那時愚人已經受苦。"], ["做善事時", "偈頌談的是惡業。"]]}}, {"id": "b11", "t": "瞻部迦的苦行", "s": "舍衛城富家子瞻部迦從小習慣奇特：睡在地上、吃不淨的東西。苦行者趕走他，他就自稱靠空氣維生、單腳站立、從不坐下。有人供養食物，他只用草尖沾取一點點。這樣過了五十五年。佛陀看出他快要證阿羅漢，住在他附近的洞裡。夜裡三個時段，諸天、帝釋、大梵天先後來拜見佛陀，光明照亮森林。瞻部迦問那些光是什麼，被告知是來訪的諸天。佛陀說他知道瞻部迦的實際習慣，並說他在迦葉佛時代曾擋住一位比丘的食物。瞻部迦悔過，證得阿羅漢並出家。佛陀說了第 70 偈。（依註釋傳統）", "k": [{"n": "70", "h": ["愚好美食，", "月月滋甚，", "於十六分，", "未一思法。"], "p": ["Māse māse kusaggena, bālo bhuñjeyya bhojanaṃ;", "na so saṅkhātadhammānaṃ, kalaṃ agghati soḷasiṃ."], "hm": "漢傳此偈字面是：愚人愛美食、月月增長，連十六分之一的思法也不到，與巴利的苦行意象不同。對應依蘇錦坤對讀表。", "d": "愚人縱然每月只用吉祥草尖取一點食物，也比不上了知法的人的十六分之一。"}], "g": [["māse māse", "每月"], ["kusagga", "吉祥草的尖端"], ["bhuñjeyya", "可能吃"], ["saṅkhātadhamma", "已審知諸法的人"], ["kalā", "分"], ["agghati", "值得、相當"], ["soḷasi", "十六分之一"]], "w": [["滋甚", "越來越多"], ["十六分", "十六分之一"], ["思法", "思惟佛法"]], "i": [["苦行不等於智慧", "瞻部迦苦行五十五年，卻沒有解脫。偈頌說：外表的苦行，連「知法者」的十六分之一都不到。"], ["兩個版本的對比", "巴利偈批評無知的苦行；漢傳偈批評貪吃。重點一樣：不在吃多或吃少，而在心有沒有思法。"]], "x": "今天吃飯時，先放下手機，專心吃第一口。", "q": {"q": "偈頌的比較重點是？", "o": [["外在的苦行不如了知法", "對。", 1], ["要多吃東西", "與偈意相反。"], ["要完全不吃", "偈頌沒有這樣說。"]]}}, {"id": "b12", "t": "灰裡的火", "s": "目犍連長老在王舍城托缽時，微笑了一下。回到精舍，他說自己看見一隻人頭蛇身的餓鬼。佛陀說，他在成道那天也看見過同一個鬼。久遠以前，一位辟支佛的行路被田主放火燒毀，被迫離開精舍，辟支佛的弟子憤怒之下殺了田主。田主轉生阿鼻地獄，後來成為這隻餓鬼。佛陀說：惡業不會立刻成熟，但終究會追上作惡的人。說了第 71 偈。（依註釋傳統）", "k": [{"n": "71", "h": ["惡不即時，", "如搆牛乳，", "罪在陰祠，", "如灰覆火。"], "p": ["Na hi pāpaṃ kataṃ kammaṃ, sajju khīraṃva muccati;", "ḍahantaṃ bālamanveti, bhasmacchannova pāvako."], "hm": "漢傳這一偈在第十七〈惡行品〉第 13 偈，不在〈愚闇品〉。原文「陰祠」，一般寫作「陰伺」，待 CBETA 核對。", "d": "所造的惡業，不會像牛奶一樣立刻變質；它燃燒著，跟隨愚人，像被灰蓋住的火。"}, {"n": "漢14", "h": ["愚憃作惡，", "不能自解，", "殃追自焚，", "罪成熾燃。"], "pn": "巴利本此品沒有找到對應的偈；意象與第 71 偈的「燃燒」相近，放在這裡。", "d": "愚昧的人作惡，自己不能明白；災殃追來，如同自己焚燒，罪成了熾烈的火。"}], "g": [["na hi", "並不"], ["pāpa", "惡"], ["sajju", "立刻"], ["khīra", "牛奶"], ["muccati", "變質、離開"], ["ḍahanta", "燃燒"], ["anveti", "跟隨"], ["bhasmacchanna", "被灰覆蓋的"], ["pāvaka", "火"]], "w": [["搆牛乳", "擠牛奶"], ["自焚", "自己燒自己"], ["熾燃", "熾烈燃燒"], ["愚憃", "愚昧無知"]], "i": [["蓋著灰的火", "火被灰蓋住，看起來冷了，伸手摸才知道還燙。惡業不立刻發作，不代表消失。"], ["同一偈，不同位置", "同一個意思，在漢傳放在〈惡行品〉，在巴利放在〈愚品〉。不同版本編排不同。"]], "x": "今天想一件做錯、一直沒處理的小事，今天補一個道歉。", "q": {"q": "偈頌用什麼比喻惡業的後果？", "o": [["蓋著灰的火", "對。", 1], ["漂走的葉子", "偈頌沒有用這個比喻。"], ["熟透的水果", "第 69 偈用成熟；這一偈用的是火。"]]}}, {"id": "b13", "t": "巨頭餓鬼", "s": "目犍連長老與勒叉那長老一同托缽，看見一隻巨大的餓鬼。佛陀說，他前世是擅長擲石的人，經老師允許，他瞄準一位辟支佛，心想這個目標沒有親人也沒有保護者，打了也沒有後果。石頭從一耳進、另一耳出，辟支佛死在精舍。弟子們殺了那位投石者，他轉生阿鼻地獄，後來成為這隻餓鬼，頭非常巨大，不斷被熱鐵錘敲打。佛陀說：知識與技能只會傷害愚人。說了第 72 偈。（依註釋傳統）", "k": [{"n": "72", "h": ["愚生念慮，", "至終無利，", "自招刀杖，", "報有印章。"], "p": ["Yāvadeva anatthāya, ñattaṃ bālassa jāyati;", "hanti bālassa sukkaṃsaṃ, muddhamassa vipātayaṃ."], "hm": "漢傳第 16 偈與巴利第 72 偈字面差異較大，對應依蘇錦坤對讀表。", "d": "愚人得到知識，只是帶來損害；它毀掉愚人的善分，並使他的頭（智慧）墜落。"}], "g": [["yāvadeva", "只是"], ["anatthāya", "為了無益（損害）"], ["ñatta", "知識"], ["jāyati", "生起"], ["hanti", "毀"], ["sukkaṃsa", "善分"], ["muddha", "頭"], ["vipāteti", "使墜落"]], "w": [["念慮", "思慮、盤算"], ["至終", "最後"], ["刀杖", "刀與棍棒（指刑罰）"]], "i": [["知識不是中性的", "沒有善心與智慧引導的知識，會傷到自己。「愚」不在知道得少，而在心的方向。"], ["技能與正見", "投石者技術高超，卻用來傷害。能力越大，越需要正見。"]], "x": "今天提醒自己：懂得的東西，是拿來幫人，不是拿來贏人。", "q": {"q": "偈頌認為愚人得到知識會怎樣？", "o": [["損害他自己", "對。", 1], ["使他成功", "與偈意不合。"], ["使他快樂", "偈頌沒有這樣說。"]]}}, {"id": "b14", "t": "質多居士與蘇陀摩", "s": "質多居士聽摩訶男長老說法，證得初果，在自己的芒果園建了精舍，請比丘蘇陀摩住持。舍利弗在那裡說法，質多證得不還果。他邀請舍利弗與目犍連應供，也邀請蘇陀摩。蘇陀摩先拒絕，隔天又來，不肯坐下，嫉妒兩位上首弟子受到的供養，辱罵質多後離開。佛陀勸他向質多道歉，質多不肯接受，蘇陀摩回到佛陀那裡。佛陀看出他的傲慢已減，教他比丘不該有執著，不該爭取利養與地位，並說了第 73、74 偈。蘇陀摩後來與質多和解，幾天內證得阿羅漢。（依註釋傳統）", "k": [{"n": "73", "h": ["遠道近欲者，", "為食在學名，", "貪猗家居故，", "多取供異姓。"], "p": ["Asantaṃ bhāvanamiccheyya, purekkhārañca bhikkhusu;", "āvāsesu ca issariyaṃ, pūjā parakulesu ca."], "hm": "漢傳第 18、19 偈與巴利第 73、74 偈字面差異大，重點同樣在貪求利養與名位。對應依蘇錦坤對讀表。", "d": "愚人想要不應有的名聲，想在比丘之中居上位，想在僧院中掌權，想在別人家受供養。"}, {"n": "74", "h": ["學莫墮二望，", "莫作家沙門，", "貪家違聖教，", "為後自匱乏。"], "p": ["Mameva kata maññantu, gihī pabbajitā ubho;", "mamevātivasā assu, kiccākiccesu kismici;", "iti bālassa saṅkappo, icchā māno ca vaḍḍhati."], "d": "「願在家與出家人都認為這是我做的；願他們在大大小小的事上都聽我的。」愚人這樣想，欲望與我慢便增長。"}, {"n": "漢17", "h": ["觀處知其愚，", "不施而廣求，", "所墮無道智，", "往往有惡行。"], "pn": "巴利本沒有找到對應的偈；主題相近（貪求利養），放在這裡。", "d": "從他所處的位置可以看出他的愚昧：自己不布施，卻廣泛求取；落入的境地沒有道的智慧，往往有惡行。"}], "g": [["asanta", "不實在的（不應有的）"], ["bhāvanā", "名聲、尊敬"], ["purekkhāra", "居前、上位"], ["āvāsa", "住處"], ["issariya", "掌權"], ["pūjā", "供養"], ["parakula", "他人家"], ["ativasa", "順從"], ["kiccākicca", "該做與不該做的事"], ["saṅkappa", "想法"], ["māna", "我慢"]], "w": [["遠道近欲", "遠離道而親近欲"], ["貪猗", "貪著依附"], ["家沙門", "依附在家施主的沙門"], ["匱乏", "缺乏"]], "i": [["慢與求", "最後一句：欲望與我慢一起長大。想要被需要、想要說了算，都是「我」在長。"], ["蘇陀摩", "他被嫉妒擾亂，傷了護持他的施主。佛陀勸他道歉，也教他看見自己的執著；他後來和解，並證得阿羅漢。"]], "x": "今天有想「讓別人聽我的」時，改成問對方一個問題。", "q": {"q": "第 74 偈說愚人的欲望與什麼一起增長？", "o": [["我慢", "對。", 1], ["智慧", "與偈意相反。"], ["財富", "偈頌說的是欲求與我慢。"]]}}, {"id": "b15", "t": "森林裡的提舍沙彌", "s": "舍衛城富家子提舍七歲在舍利弗座下出家為沙彌。他厭倦親戚不斷帶著禮物來訪，就向佛陀領受禪修題目，退到森林精舍。他對每位施主都祝願他們快樂、離苦。精進三個月，他證得阿羅漢。舍利弗帶著四千位比丘來訪，村民請求說法，舍利弗堅持由提舍來說，提舍便講了五蘊、六處和通往涅槃的道。有些村民很感動，有些覺得他隱藏了所知。佛陀現身說明，並說他們很有福氣能供養提舍，許多人證得初果。後來佛陀說，不應為了利養而活，要捨棄利養，在獨處中修行。說了第 75 偈。（依註釋傳統）", "k": [{"n": "75", "h": ["此行與愚同，", "但令欲慢增，", "利求之願異，", "求道意亦異。", "是以有識者，", "出為佛弟子，", "棄愛捨世習，", "終不墮生死。"], "p": ["Aññā hi lābhūpanisā, aññā nibbānagāminī;", "evametaṃ abhiññāya, bhikkhu buddhassa sāvako;", "sakkāraṃ nābhinandeyya, vivekamanubrūhaye."], "hm": "漢傳第 20 偈與巴利第 75 偈的對應依蘇錦坤對讀表；第 21 偈為編者依內容併入。", "d": "通往利養的是一條路，通往涅槃的是另一條路。了知這一點的比丘，佛的弟子，不要貪著供養與尊敬，應增長遠離的修行。"}], "g": [["aññā", "另一個"], ["lābha", "利養"], ["upanisā", "因、道"], ["nibbānagāminī", "通往涅槃的"], ["abhiññāya", "了知"], ["sāvaka", "弟子"], ["sakkāra", "尊敬、供養"], ["nābhinandeyya", "不應歡喜"], ["viveka", "遠離、獨處"], ["anubrūhaye", "應增長"]], "w": [["欲慢", "貪欲與傲慢"], ["利求", "求取利養"], ["有識者", "有智慧的人"], ["棄愛", "捨棄愛著"], ["世習", "世俗習氣"]], "i": [["兩條路", "利養的路與涅槃的路是不同的兩條路。這不是拒絕一切供養，而是別把「被供養」當成目標。"], ["以此收尾", "這一品從「夜長、路長、輪迴長」開始，到「棄愛捨世習」結束：看見愚的樣子，是為了轉向智。"]], "x": "今天做一件沒有人看見、也不需要被稱讚的小事。", "q": {"q": "第 75 偈說比丘不應？", "o": [["貪著供養與尊敬", "對。", 1], ["接受任何食物", "偈頌談的是貪著，不是接受。"], ["學習佛法", "偈頌鼓勵修行。"]]}}]});
BOOKS.push({"id": "m", "n": "明哲品", "p": "Paṇḍitavagga", "d": "智者怎樣親近善友、調伏自己、不被毀譽所動。", "note": "巴利本的第六品；在《法句經》中為第十四品。故事依巴利註釋傳統，參考 Daw Mya Tin 英譯，由編者摘要；偈頌對應依蘇錦坤對讀表。蘇錦坤對讀表列出的漢譯對應，有些偈只能依內容判斷（第 76、77 偈沒有清楚的對應，已在頁面標明）。", "u": [{"id": "m1", "t": "指出寶藏的人", "s": "舍衛城祇園裡，有一位貧窮的老婆羅門拉達（Rādha），平日在精舍幫忙做雜事，希望出家，比丘們卻都不願意為他授戒。佛陀問大家：有沒有人記得這個人的恩惠？舍利弗說，拉達曾在他托缽時供養過一匙飯。佛陀說，知恩的人應當接受他。舍利弗便為他授了戒。出家後，拉達誠心受教，被糾正就歡喜接受，不久證得阿羅漢。比丘們談起這件事，佛陀便說：若遇到能指出你過失的智者，要像遇到指出寶藏的人那樣親近他。（依註釋傳統概述）", "k": [{"n": "76", "hn": "漢傳〈明哲品〉沒有字面清楚對應的偈。", "p": ["Nidhīnaṃva pavattāraṃ, yaṃ passe vajjadassinaṃ;", "niggayhavādiṃ medhāviṃ, tādisaṃ paṇḍitaṃ bhaje;", "tādisaṃ bhajamānassa, seyyo hoti na pāpiyo."], "d": "若遇見一位能指出你過失的人，就像遇見指出寶藏的人；這樣的人敢直說、有智慧，應當親近。親近這樣的人，只會更好，不會更壞。"}, {"n": "漢1", "h": ["深觀善惡，", "心知畏忌，", "畏而不犯，", "終吉無憂。"], "pn": "巴利本沒有找到明確對應；蘇錦坤對讀表將它與巴利第 76 偈放在附近，但意思並不相同。放在這裡一起讀。", "d": "深入觀察善與惡，心裡知道畏懼、知道忌諱；畏懼而不去犯，最後吉祥、沒有憂愁。"}, {"n": "漢2", "h": ["故世有福，", "念思紹行，", "善致其願，", "福祿轉勝。"], "pn": "巴利本沒有找到明確對應；放在這裡一起讀。", "d": "所以世間有福報：念念思量、接續去行，善行會成就心願，福祿越來越增勝。"}], "g": [["nidhi", "寶藏"], ["pavattar", "指出者"], ["vajjadassin", "見過失者"], ["niggayhavādin", "直言糾正者"], ["medhāvin", "有智慧者"], ["paṇḍita", "智者"], ["bhaje", "應親近"], ["seyya", "更好"], ["pāpiya", "更壞"]], "w": [["深觀", "仔細觀察"], ["畏忌", "畏懼與忌諱"], ["紹行", "接續去行"]], "i": [["把批評當成地圖", "偈頌把「指出過失的人」比作「指出寶藏的人」：過失是你自己看不到的盲點，指出它，等於替你省下許多彎路。"], ["拉達自己就是例子", "他被拒絕、被糾正，都沒有退縮，反而把糾正當作訓練。能聽，是智慧的開頭。"]], "x": "今天做一件事之前，先深想一次：這樣做是善還是惡？有沒有我該畏忌的地方？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m2", "t": "勸誡的人", "s": "兩位比丘阿濕婆（Assaji）和補那婆素（Punabbasuka）帶著許多弟子，以種花、植樹等事謀取生計，行為不合僧團戒律。佛陀派舍利弗與目犍連前去糾正他們。佛陀說：能勸誡、教導、制止他人做錯事的人，善人喜愛他，惡人討厭他。（依註釋傳統概述）", "k": [{"n": "77", "hn": "〈明哲品〉沒有字面清楚對應的偈。意思相近的偈在《法句經》大正藏 T04, 567c：「起從聖教，禁制不善，近道見愛，離道莫親」（依蘇錦坤對讀表）。", "p": ["Ovadeyyānusāseyya, asabbhā ca nivāraye;", "sataṃ hi so piyo hoti, asataṃ hoti appiyo."], "d": "應當勸誡、教導，並制止不善的事。這樣的人，善人喜愛他，不善的人討厭他。"}, {"n": "漢3", "h": ["信善作福，", "積行不厭，", "信知陰德，", "久而必彰。"], "pn": "巴利本沒有找到明確對應；蘇錦坤對讀表將它放在第 77 偈附近。放在這裡一起讀。", "d": "相信善、做福事，累積善行不厭倦；相信「暗中的功德」，時間久了一定會顯現。"}], "g": [["ovadeyya", "應勸誡"], ["anusāseyya", "應教導"], ["asabbhā", "不善（的事）"], ["nivāraye", "應制止"], ["sataṃ", "善人的"], ["piya", "可愛的"], ["asataṃ", "惡人的"], ["appiya", "不可愛的"]], "w": [["陰德", "暗中累積、不為人知的功德"], ["積行", "累積善行"], ["久而必彰", "日子久了一定顯現"]], "i": [["被討厭的代價", "勸人不一定受歡迎。偈頌坦白說：善人會喜歡你，不善的人會討厭你。這是做這件事要先有的心理準備。"], ["勸也要有分寸", "「勸誡、教導、制止」是三個層次：先說明，再教方法，最後才是制止。目的是幫忙，不是贏過對方。"]], "x": "今天做一件不求人知道的好事，並相信：暗中的功德，時間久了自然顯現。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m3", "t": "遠離惡友", "s": "車匿（Channa）曾是悉達多太子的侍從，出家後，仗著自己和佛陀的舊關係，驕慢自大，常辱罵兩位上首弟子，屢勸不改。佛陀臨涅槃前交代阿難：對車匿施行「梵壇罰」，也就是大家不跟他說話、不給他勸誡。佛陀滅度後，阿難依囑宣布。車匿大為震驚，真心懺悔，專心修行，證得阿羅漢，處分也隨之解除。偈頌提醒人：不親近惡友，要親近善友。（依註釋傳統概述）", "k": [{"n": "78", "h": ["常避無義，", "不親愚人，", "思從賢友，", "押附上士。"], "p": ["Na bhaje pāpake mitte, na bhaje purisādhame;", "bhajetha mitte kalyāṇe, bhajetha purisuttame."], "d": "不要親近惡友，不要親近品格卑下的人；要親近善友，要親近品格高尚的人。"}, {"n": "漢12", "h": ["智人知動搖，", "譬如沙中樹，", "朋友志未強，", "隨色染其素。"], "pn": "巴利本沒有找到明確對應；主題是友伴的影響，放在這裡一起讀。", "d": "智者知道人心容易動搖，像沙地上的樹；朋友的心志還不堅定，就容易被外在的顏色染到。"}], "g": [["bhaje", "應親近"], ["pāpaka", "惡的"], ["mitta", "朋友"], ["purisādhama", "卑劣的人"], ["kalyāṇa", "善的"], ["purisuttama", "最勝的人"]], "w": [["無義", "沒有道義、沒有意義的人事"], ["狎附", "親近依附"], ["上士", "品德高尚的人"], ["沙中樹", "長在沙地上、根不穩的樹"]], "i": [["環境是一種老師", "我們常以為自己意志堅強，偈頌卻說「朋友志未強，隨色染其素」。朋友的氣氛，會悄悄改變我們。"], ["也問自己", "車匿的故事也能反過來想：我是不是別人眼中的「損友」？他最後的轉變，來自被冷處理後的自我反省。"]], "x": "想想最近常相處的三個人，各自讓你變得更好，還是更差？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m4", "t": "法喜", "s": "大劫賓那（Mahākappina）原是邊境國王，聽到佛陀出世，便和一千位大臣離開王國，前往舍衛城見佛，聽法後相繼出家。王后與大臣們的妻子後來也出家為比丘尼。長老常歡喜地發出驚歎：「啊，真快樂！」比丘們不解。佛陀說：他的歡喜是因為法，說了第 79 偈。（依註釋傳統概述）", "k": [{"n": "79", "h": ["喜法臥安，", "心悅意清，", "聖人演法，", "慧常樂行。"], "p": ["Dhammapīti sukhaṃ seti, vippasannena cetasā;", "ariyappavedite dhamme, sadā ramati paṇḍito."], "d": "以法為喜的人，心澄明，睡得安樂；智者常在聖者所說的法中歡喜。"}, {"n": "漢6", "h": ["仁人智者，", "齋戒奉道，", "如星中月，", "照明世間。"], "pn": "巴利本沒有找到明確對應；放在這裡一起讀。", "d": "仁慈的智者持齋戒、奉行道，像星星之間的月亮，照亮世間。"}], "g": [["dhammapīti", "飲法者"], ["sukhaṃ", "安樂地"], ["seti", "睡眠、安住"], ["vippasanna", "澄明"], ["cetasā", "以心"], ["ariya", "聖者"], ["pavedita", "宣說"], ["ramati", "喜樂"]], "w": [["喜法", "歡喜於法"], ["臥安", "躺下也安穩"], ["演法", "宣說法義"], ["樂行", "喜歡去實行"]], "i": [["法喜是一種飲食", "「dhammapīti」直譯是「喝法的人」。聽法、讀經不是任務，是能讓心變清澈的飲水。"], ["王位換法喜", "大劫賓那放下王位，卻說「真快樂」。快樂的來源移了位：從擁有，變成了解與放下。"]], "x": "今天找一句讓你心裡亮一下的經文，念一遍，感受那份「喝到水」的感覺。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m5", "t": "調伏自己", "s": "舍衛城有位七歲的沙彌，名叫般茶（Paṇḍita），是舍利弗的侍者。一天托缽的路上，他看見農夫引水灌溉、造箭的人把箭桿烤直、木匠削整木頭，心想：水、箭桿、木頭都沒有心，人卻能把它們調整好；我有心、有智慧，為什麼不能調伏自己？回去之後，他便專心禪修。佛陀看出他即將證果，讓舍利弗在門口與人談話，不讓他被打擾。這位沙彌在出家的第八天證得阿羅漢。佛陀說了第 80 偈。（依註釋傳統概述）", "k": [{"n": "80", "h": ["弓工調角、", "水人調船、", "材匠調木、", "智者調身。"], "p": ["Udakañhi nayanti nettikā, usukārā namayanti tejanaṃ;", "dāruṃ namayanti tacchakā, attānaṃ damayanti paṇḍitā."], "d": "治水的人引導水流，造箭的人矯正箭桿，木匠整治木材；智者調伏自己。"}], "g": [["udaka", "水"], ["nayanti", "引導"], ["nettikā", "治水者"], ["usukāra", "造箭者"], ["namayanti", "使彎直"], ["tejana", "箭桿"], ["tacchaka", "木匠"], ["attānaṃ", "自己"], ["damayanti", "調伏"]], "w": [["弓工", "製弓的工匠"], ["調角", "調整弓角"], ["水人", "擅長行船的人"], ["材匠", "木匠"], ["調身", "調伏身心"]], "i": [["三種手藝", "農夫、造箭人、木匠，各自用工夫調整不同的材料。偈頌說：智者把同樣的工夫用在自己身上。"], ["漢巴稍有不同", "漢譯寫的是弓工、船夫、木匠；巴利寫農夫、造箭匠、木匠。手藝不同，道理一樣。"]], "x": "選一個你常急躁的場合，今天先停一個呼吸，再回應。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m6", "t": "毀譽不動", "s": "拉昆塔卡·巴提亞（Lakuṇḍaka Bhaddiya）長老身材矮小，年輕比丘常拿他的外貌開玩笑，他從不生氣。後來比丘們把這件事告訴佛陀，佛陀說：阿羅漢的心不為毀譽所動，就像一整塊岩石不被風吹動，並說了第 81 偈。（依註釋傳統概述）", "k": [{"n": "81", "h": ["譬如厚石，", "風不能移，", "智者意重，", "毀譽不傾；"], "p": ["Selo yathā ekaghano, vātena na samīrati;", "evaṃ nindāpasaṃsāsu, na samiñjanti paṇḍitā."], "d": "就像一整塊岩石不被風吹動，智者面對毀謗與讚美，也不動搖。"}], "g": [["selo", "岩石"], ["yathā", "如同"], ["ekaghana", "整塊實心"], ["vātena", "被風"], ["samīrati", "被吹動"], ["nindā", "毀謗"], ["pasaṃsā", "讚美"], ["samiñjanti", "動搖"]], "w": [["厚石", "厚實的石頭"], ["意重", "心意穩重"], ["毀譽", "毀謗與讚美"], ["不傾", "不傾倒"]], "i": [["兩股風", "偈頌把讚美和批評都當成風。受讚美，心也不要飄；被批評，心也不要沉。"], ["一整塊", "「ekaghana」是整塊、沒有縫隙。穩，不是硬，是沒有可以被風鑽進去的空隙。"]], "x": "今天有人誇你或批評你時，先想：這陣風從哪裡來？我要不要被吹動？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m7", "t": "聽法後的澄明", "s": "一位名叫「卡那之母」的優婆夷，女兒卡那出嫁後回娘家探望。母親每次做好餅要給女兒帶回夫家，卻一次又一次把餅供養給前來的比丘。卡那因此多次不能回去，丈夫另娶，她心生怨恨，見到比丘就責罵。佛陀為她說法，她聽後心澄淨，證得初果，從此歡喜布施。佛陀說了第 82 偈。（依註釋傳統概述）", "k": [{"n": "82", "h": ["譬如深淵，", "澄靜清明，", "慧人聞道，", "心淨歡然。"], "p": ["Yathāpi rahado gambhīro, vippasanno anāvilo;", "evaṃ dhammāni sutvāna, vippasīdanti paṇḍitā."], "d": "就像一座深湖，澄淨而不混濁；智者聽聞法義之後，心也變得澄淨。"}], "g": [["rahada", "湖"], ["gambhīra", "深"], ["vippasanna", "澄淨"], ["anāvila", "不混濁"], ["dhammāni", "法義"], ["sutvāna", "聽聞後"], ["vippasīdanti", "變得澄淨"]], "w": [["深淵", "深潭"], ["澄靜", "澄清而安靜"], ["慧人", "有智慧的人"], ["歡然", "歡喜安然"]], "i": [["湖水的比喻", "湖水不是被攪不動，而是讓泥沙慢慢沉下去。聽法也一樣：不是立刻有答案，而是心慢慢清起來。"], ["怨與施", "卡那的怨恨與母親的布施原本互相拉扯。聽法後，兩邊都回到清楚。"]], "x": "心裡有一件事很混濁時，先坐下來靜五分鐘，不急著解決。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m8", "t": "苦樂不動", "s": "註釋傳統說：有一群比丘（傳為五百位）在艱苦的日子裡也保持平靜，不因缺糧而怨嘆；而依靠供養生活的世人，卻因物資一時充足就放縱喧鬧。佛陀說：愚人隨順境逆境而起伏，智者不論苦或樂，都不改變他的穩重。第 83 偈便由此而說。（細節各版本略有出入，這裡只取主旨。）", "k": [{"n": "83", "h": ["大人體無欲，", "在所照然明，", "雖或遭苦樂，", "不高現其智。"], "p": ["Sabbattha ve sappurisā cajanti, na kāmakāmā lapayanti santo;", "sukhena phuṭṭhā atha vā dukhena, na uccāvacaṃ paṇḍitā dassayanti."], "d": "善人在任何處境都能捨棄；寂靜的人不因貪欲而說多餘的話。無論受到快樂或痛苦的觸動，智者都不顯出高低起伏。"}], "g": [["sabbattha", "一切處"], ["sappurisa", "善人"], ["cajanti", "捨離"], ["kāmakāma", "貪愛欲樂者"], ["lapayanti", "閒談"], ["santo", "寂靜者"], ["sukha", "樂"], ["dukkha", "苦"], ["uccāvaca", "高低"], ["dassayanti", "顯現"]], "w": [["體無欲", "自身沒有貪欲"], ["照然明", "清清楚楚地明白"], ["不高現其智", "不炫耀自己的智慧"]], "i": [["不炫耀的智慧", "漢譯最後一句是「不高現其智」：遇到苦樂都不拿智慧來表演。真正穩的人，不需要被看見。"], ["苦樂都是觸動", "「phuṭṭhā」是被接觸、被觸動。偈頌不是說不會被觸動，而是不讓高低起伏顯在臉上、言語和選擇上。"]], "x": "今天遇到順心或不順心的事，試著用同一種聲音說話。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m9", "t": "為法不為利", "s": "達米卡（Dhammika）比丘出家時，妻子苦苦挽留，他仍離家修行，後來證得阿羅漢。他回家教導兒子與妻子，兩人也出家，相繼證得阿羅漢。佛陀說：智者不為自己，也不為別人，不為子女、財富與國土，不以不正當的手段求取自己的成就。第 84 偈是這樣說的。（依註釋傳統概述）", "k": [{"n": "84", "h": ["大賢無世事，", "不願子財國，", "常守戒慧道，", "不貪邪富貴。"], "p": ["Na attahetu na parassa hetu, na puttamicche na dhanaṃ na raṭṭhaṃ;", "na iccheyya adhammena samiddhimattano, sa sīlavā paññavā dhammiko siyā."], "d": "不為自己，不為別人，不求子女、財富、國土；也不用不正當的方法求取自己的成功。這樣的人，才是有戒、有慧、守法的人。"}], "g": [["attahetu", "為了自己"], ["parahetu", "為了別人"], ["putta", "兒子"], ["dhana", "財富"], ["raṭṭha", "國土"], ["adhammena", "以非法"], ["samiddhi", "成就、興盛"], ["sīlavā", "有戒者"], ["paññavā", "有慧者"], ["dhammika", "守法者"]], "w": [["大賢", "德行極高的人"], ["世事", "世俗的俗務"], ["邪富貴", "用不正當手段得到的富貴"]], "i": [["拒絕走捷徑", "偈頌最後一句最有力：不以非法求自己的成就。這不是不要成功，而是不用歪方法換成功。"], ["為誰而做", "「不為自己、不為別人」並非冷漠。意思是：做事的動機，不被私心和人情綁架。"]], "x": "回想最近一次「為了讓事情成功」差點用不正當的方法，是什麼讓你停下來？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m10", "t": "彼岸的人很少", "s": "註釋傳統說：佛陀在一次整夜的說法中，看到聽眾有的打瞌睡，有的中途離開，只有少數人專注聽完。佛陀便說：人群中到達彼岸的人很少，其他人只是沿著這一岸跑來跑去。接著又說：凡是依循已經好好宣說的法而行的人，將能渡過死神領域這難以渡過的地方。第 85、86 偈由此而說。（依註釋傳統概述）", "k": [{"n": "85", "h": ["世皆沒淵，", "鮮尅度岸，", "如或有人，", "欲度必奔。"], "p": ["Appakā te manussesu, ye janā pāragāmino;", "athāyaṃ itarā pajā, tīramevānudhāvati."], "d": "在人群中，到達彼岸的人很少；其餘的人，只是沿著這一岸跑來跑去。"}, {"n": "86", "h": ["誠貪道者，", "覽受正教，", "此近彼岸，", "脫死為上。"], "p": ["Ye ca kho sammadakkhāte, dhamme dhammānuvattino;", "te janā pāramessanti, maccudheyyaṃ suduttaraṃ."], "d": "凡是依循善說之法、隨法而行的人，將渡過死神領域，渡到難以渡過的彼岸。"}], "g": [["appaka", "稀少"], ["pāragāmin", "到彼岸者"], ["itara", "其餘的"], ["pajā", "人群"], ["tīra", "此岸"], ["anudhāvati", "跟著跑"], ["sammadakkhāta", "善說的"], ["anuvattin", "隨順者"], ["maccudheyya", "死神的領域"], ["suduttara", "極難渡過"]], "w": [["沒淵", "沉沒在深淵"], ["鮮尅", "很少能"], ["必奔", "一定奔向"], ["脫死", "脫離死亡"]], "i": [["兩種人", "漢譯寫「世皆沒淵，鮮尅度岸」；巴利寫「沿著這一岸跑」。兩個畫面一個是沉沒，一個是奔忙，都是沒到岸。"], ["「依法而行」", "第 86 偈的關鍵是 dhammānuvattino：隨法而行。知道不夠，要走。"]], "x": "留意今天有沒有「在這一岸跑來跑去」的時刻；停下三十秒，問自己：我現在跑的方向，是岸邊還是彼岸？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "m11", "t": "心離濁，慧留明", "s": "註釋傳統說：有五百位在拘薩羅度過雨安居的比丘來見佛陀。佛陀依他們不同的根性，說了第 87、88、89 偈：智者拋下黑暗的法，修習清白的法；離開家的牽掛，在遠離中尋找喜悅；清淨自己的心；以覺支善加修習心，放下執取，漏盡而在世間證得涅槃。（依註釋傳統概述）", "k": [{"n": "87", "h": ["斷五陰法，", "靜思智慧，", "不反入淵，", "棄猗其明。"], "p": ["Kaṇhaṃ dhammaṃ vippahāya, sukkaṃ bhāvetha paṇḍito;", "okā anokamāgamma, viveke yattha dūramaṃ."], "d": "智者捨棄黑暗的法，修習清白的法；離開家，走向無家，在難以享受的遠離中。"}, {"n": "88", "h": ["抑制情欲，", "絕樂無為，", "能自拯濟，", "使意為慧。"], "p": ["Tatrābhiratimiccheyya, hitvā kāme akiñcano;", "pariyodapeyya attānaṃ, cittaklesehi paṇḍito."], "d": "在那裡尋求喜悅，捨棄欲樂，一無所有；智者應從心的煩惱中，清淨自己。"}, {"n": "89", "h": ["學取正智，", "意惟正道，", "一心受諦，", "不起為樂，", "漏盡習除，", "是得度世。"], "p": ["Yesaṃ sambodhiaṅgesu, sammā cittaṃ subhāvitaṃ;", "ādānapaṭinissagge, anupādāya ye ratā;", "khīṇāsavā jutimanto, te loke parinibbutā."], "hm": "漢傳第 17 偈共六句，對應巴利第 89 偈（對應依蘇錦坤對讀表）。", "d": "心已在覺支中修習純熟，歡喜於放下執取、不再抓取；漏盡而光明的人，在世間證得涅槃。"}], "g": [["kaṇha", "黑的"], ["sukka", "白的"], ["bhāvetha", "應修習"], ["oka", "家"], ["anoka", "無家"], ["viveka", "遠離"], ["akiñcana", "一無所有"], ["pariyodapeyya", "應淨化"], ["sambojjhaṅga", "覺支"], ["khīṇāsava", "漏盡者"], ["parinibbuta", "般涅槃"]], "w": [["五陰", "色受想行識，五種構成身心的集合"], ["受諦", "領受真理"], ["漏盡習除", "煩惱滅盡，習氣除去"], ["度世", "度過世間（的苦）"]], "i": [["由黑到白", "偈頌用顏色說善惡：黑的法要放下，白的法要養成。不是消滅，是換方向。"], ["三偈三步", "87 放下、88 清心、89 成就。順序很實際：先放下，再淨化，最後才說到證果。"]], "x": "今天放下一件「黑」的小習慣（例如一句抱怨），改養一件「白」的（例如一句感謝）。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}]});
BOOKS.push({"id": "r", "n": "羅漢品", "p": "Arahantavagga", "d": "阿羅漢的樣子：不再灼熱、不戀巢穴、毀譽不動。", "note": "巴利本的第七品；在《法句經》中為第十五品。故事依巴利註釋傳統，參考 Daw Mya Tin 英譯，由編者摘要；偈頌對應依蘇錦坤對讀表（第 92、93 偈對應的漢傳偈跨兩偈，已在頁面說明）。", "u": [{"id": "r1", "t": "不再灼熱", "s": "提婆達多（Devadatta）從山上推下巨石想害佛陀，碎石片劃傷了佛陀的腳趾。名醫耆婆（Jīvaka）為他敷藥包紮，之後一時未能及時趕回來拆藥。隔天早晨，傷口已經痊癒。佛陀說：自覺悟以來，他沒有再感到過痛苦與灼熱，並說了第 90 偈。（依註釋傳統概述）", "k": [{"n": "90", "h": ["去離憂患，", "脫於一切，", "縛結已解，", "冷而無煖。"], "p": ["Gataddhino visokassa, vippamuttassa sabbadhi;", "sabbaganthappahīnassa, pariḷāho na vijjati."], "d": "旅程已走完、沒有憂愁、一切處都解脫、斷盡一切繫縛的人，不再有熱惱。"}], "g": [["gataddhino", "走完旅程者"], ["visoka", "無憂"], ["vippamutta", "解脫"], ["sabbadhi", "一切處"], ["sabbagantha", "一切繫縛"], ["pahīna", "斷除"], ["pariḷāha", "熱惱"], ["vijjati", "存在"]], "w": [["去離", "遠離"], ["縛結", "繫縛與煩惱結"], ["冷而無煖", "清涼，沒有熱惱"]], "i": [["熱惱是心的火", "pariḷāha 是「燒灼」，可以是焦慮、怒氣、追逐。偈頌把阿羅漢形容為冷卻：不是沒知覺，而是不再被火燒。"], ["走完旅程", "「gataddhino」是路已走完。輪迴是長途，到了該停的地方就停。"]], "x": "今天感到焦躁時，說一句：「這團火，是我自己點的嗎？」然後深呼吸三次。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r2", "t": "如鵝離池", "s": "佛陀要離開王舍城時，請大迦葉（Mahākassapa）留下處理當地的事務。有些比丘議論說：他是不是捨不得施主？佛陀為他澄清，說：像鵝離開池塘一樣，真正離家的人，什麼地方都能住、什麼地方都不黏。（依註釋傳統概述）", "k": [{"n": "91", "h": ["心淨得念，", "無所貪樂，", "已度癡淵，", "如鴈棄池。"], "p": ["Uyyuñjanti satīmanto, na nikete ramanti te;", "haṃsāva pallalaṃ hitvā, okamokaṃ jahanti te."], "d": "有正念的人努力前行，不愛戀住處；像鵝離開池塘，捨離一個又一個居處。"}], "g": [["uyyuñjanti", "努力出發"], ["satīmanta", "有念者"], ["nikete", "在住處"], ["ramanti", "喜愛"], ["haṃsa", "鵝"], ["pallala", "小池塘"], ["hitvā", "捨下"], ["okamokaṃ", "一處又一處"], ["jahanti", "捨離"]], "w": [["心淨得念", "心清淨，念力現前"], ["已度癡淵", "已經渡過愚癡的深淵"], ["鴈", "雁、鵝"]], "i": [["不戀巢穴", "鵝離池不回頭，不是冷漠，是不把池塘當成自己的。"], ["留下來也能離", "大迦葉留下做事，卻不失去離的心。重點不在去或留，在黏不黏。"]], "x": "挑一個你最放不下的位置、座位或習慣，今天試著鬆手半小時。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r3", "t": "不囤積的食物", "s": "貝拉塔西沙（Belaṭṭhasīsa）長老把乾飯保存起來，這樣可以少出門托缽，多花時間禪修。其他比丘覺得這違反戒律，向佛陀報告。佛陀說：那時「不可囤積」的規定還未制定，且長老為了禪修而非貪心，沒有過失。（依註釋傳統概述）", "k": [{"n": "92", "h": ["量腹而食，", "無所藏積，", "心空無想，", "度眾行地。", "如空中鳥，", "遠逝無礙，", "世間習盡，", "不復仰食。"], "p": ["Yesaṃ sannicayo natthi, ye pariññātabhojanā;", "suññato animitto ca, vimokkho yesaṃ gocaro;", "ākāseva sakuntānaṃ, gati tesaṃ durannayā."], "hm": "漢傳第 3 偈與第 4 偈前半對應巴利第 92 偈；第 4 偈後半（世間習盡，不復仰食）對應巴利第 93 偈，在下一則。", "d": "沒有囤積，了知飲食；以空與無相的解脫為所行境。如同空中飛鳥，他們的去處難以追尋。"}], "g": [["sannicaya", "囤積"], ["pariññāta", "徹底了知"], ["bhojana", "飲食"], ["suññata", "空"], ["animitta", "無相"], ["vimokkha", "解脫"], ["gocara", "所行境"], ["ākāsa", "空中"], ["sakunta", "鳥"], ["gati", "去處"], ["durannaya", "難追蹤"]], "w": [["量腹而食", "吃到剛好"], ["藏積", "囤積"], ["心空無想", "心空、無相"], ["行地", "修行的境地"]], "i": [["吃到剛好", "「pariññātabhojanā」是徹底了知飲食。不貪、不拒，剛剛好。"], ["鳥跡", "天空飛鳥不留痕。偈頌用這個畫面說：解脫者沒有可以追蹤的路線，因為他不把自己留在東西上。"]], "x": "今天吃一餐，留意「夠了」的那一刻。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r4", "t": "天人供衣的長老", "s": "阿那律（Anuruddha）長老撿拾破布來縫製袈裟。他前世的妻子，如今是天女闍利尼（Jālinī），暗中把上好的布放進垃圾堆，之後又促使村民供養食物。有些比丘責怪阿那律，佛陀說：這些食物是天女所供，不是他開口求來的。他沒有牽掛飲食，就像鳥在空中，去處難追。（依註釋傳統概述）", "k": [{"n": "93", "h": ["虛心無患，", "已到脫處，", "譬如飛鳥，", "暫下輒逝。"], "p": ["Yassāsavā parikkhīṇā, āhāre ca anissito;", "suññato animitto ca, vimokkho yassa gocaro;", "ākāseva sakuntānaṃ, padaṃ tassa durannayaṃ."], "hm": "漢傳第 4 偈後半「世間習盡，不復仰食」與第 5 偈對應巴利第 93 偈。第 4 偈前半已在上一則讀過。", "d": "諸漏已盡、對飲食沒有依賴，以空與無相的解脫為所行境的人，如同空中飛鳥，他的足跡難以追尋。"}], "g": [["yassa", "其人的"], ["āsava", "漏、煩惱"], ["parikkhīṇa", "已盡"], ["āhāre", "對食物"], ["anissita", "不依賴"], ["pada", "足跡"], ["durannaya", "難追蹤"]], "w": [["習盡", "習氣、煩惱已盡"], ["仰食", "仰賴食物"], ["虛心", "心空"], ["暫下輒逝", "飛下片刻便離去"]], "i": [["不倚靠食物", "anissita 是不依賴、不依附。吃，但不把心交給吃。"], ["足跡難追", "與第 92 偈同一句，但這裡主詞換成了人，不是行為。看的角度不同。"]], "x": "今天吃飯時，試著專心吃，不看手機。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r5", "t": "連天人也敬慕", "s": "天帝釋（Sakka）向佛陀供花與香，之後也供養剛從遠方回來的大迦旃延（Mahākaccāna）長老。有些比丘說，天帝釋偏心。佛陀說：諸根調伏的人，不論人間或天上，都會受到敬愛，說了第 94 偈。（依註釋傳統概述）", "k": [{"n": "94", "h": ["制根從止，", "如馬調御，", "捨憍慢習，", "為天所敬。"], "p": ["Yassindriyāni samathaṅgatāni, assā yathā sārathinā sudantā;", "pahīnamānassa anāsavassa, devāpi tassa pihayanti tādino."], "d": "諸根平靜得像被駕馭者調好的馬；斷除我慢、沒有煩惱的這樣的人，連諸天都欽羨他。"}], "g": [["indriya", "諸根"], ["samatha", "止、平靜"], ["assa", "馬"], ["sārathi", "駕馭者"], ["sudanta", "調得很好"], ["pahīnamāna", "已斷我慢"], ["anāsava", "無漏"], ["pihayanti", "欽羨"], ["tādin", "如此的人"]], "w": [["制根", "節制六根"], ["調御", "調教、駕馭"], ["憍慢習", "驕傲的習氣"], ["為天所敬", "受天人敬重"]], "i": [["調馬", "好馬不是不跑，是跑得有節奏。諸根也是：看、聽、想，都在掌握裡。"], ["受敬重的來源", "這裡的敬愛，不是靠權力或表演，而是來自沒有我慢。"]], "x": "今天挑一件容易分心的事，先把手邊的東西放下，再開始。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r6", "t": "如地如門閂", "s": "有一位比丘誣指舍利弗在經過時打了他一拳。舍利弗在眾人面前說：像大地一樣，我對你不憤怒；像門閂一樣，我不動搖；像清澈的湖，我沒有污泥。那位比丘聽了，當眾認錯，舍利弗接受他的懺悔，並請求對方原諒自己。佛陀說了第 95 偈。（依註釋傳統概述）", "k": [{"n": "95", "h": ["不怒如地、", "不動如山，", "真人無垢，", "生死世絕。"], "p": ["Paṭhavisamo no virujjhati, indakhīlūpamo tādi subbato;", "rahadova apetakaddamo, saṃsārā na bhavanti tādino."], "hm": "漢傳第 7 偈與巴利第 95 偈對應較鬆；巴利後半（像無泥的湖）另見漢傳 T04, 573c「受辱心如地，行忍如門閾，淨如水無垢，生盡無彼受」。", "d": "像大地一樣不嗔怒，像門前的石柱一樣穩固；善於持戒的人，像沒有污泥的湖。這樣的人不再有輪迴。"}], "g": [["paṭhavī", "大地"], ["samo", "相同"], ["virujjhati", "起怒"], ["indakhīla", "門前石柱、門閂"], ["subbata", "善持戒者"], ["rahada", "湖"], ["apeta", "去除"], ["kaddama", "污泥"]], "w": [["不怒如地", "像大地不發怒"], ["不動如山", "像山不動搖"], ["真人", "證果的人"], ["無垢", "沒有污垢"]], "i": [["三個比喻", "地是承受，石柱是穩固，湖是清澈。每一個比喻，都是不同的面向。"], ["被誣告也道歉", "故事最動人的是：舍利弗接受懺悔後，也請對方原諒自己。穩定，不是高高在上。"]], "x": "想一件別人誤會你的事，今天先在心裡，用「大地」的方式回應。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r7", "t": "七歲的沙彌", "s": "一位七歲的男孩出家，在剃髮時證得阿羅漢。後來他隨老師帝須（Tissa）出門，帝須不小心用扇子打到他的眼睛，他的一隻眼睛因此受傷失明。小沙彌不怨，只當作是業的果報。佛陀稱讚他的平靜，說了第 96 偈。（依註釋傳統概述）", "k": [{"n": "96", "h": ["心已休息，", "言行亦止，", "從正解脫，", "寂然歸滅。"], "p": ["Santaṃ tassa manaṃ hoti, santā vācā ca kamma ca;", "sammadaññā vimuttassa, upasantassa tādino."], "d": "他的心寂靜，語言與行為也寂靜；以正智解脫、得到平息的這樣的人。"}], "g": [["santa", "寂靜"], ["mano", "心"], ["vācā", "語"], ["kamma", "行為"], ["sammadaññā", "以正智"], ["vimutta", "解脫者"], ["upasanta", "平息者"]], "w": [["休息", "止息"], ["言行亦止", "言語與行為也平靜"], ["從正解脫", "依正道得到解脫"], ["寂然歸滅", "安安靜靜地歸於息滅"]], "i": [["三處安靜", "心、語、行，是一整套。偈頌不只說心靜，說話與做事也要靜。"], ["外傷不等於內傷", "小沙彌的眼睛受傷，心卻沒有亂。傷在身上，不一定要傷在心上。"]], "x": "今天說話前先停半秒，檢查：這句話是從安靜的地方來，還是從煩躁來？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r8", "t": "最上之人", "s": "三十位來自同一村子的比丘來見佛陀。佛陀看出他們已成熟，便問舍利弗：能否從思惟諸根（感官）而證到涅槃？舍利弗答：我不是靠相信別人而說，是自己證知的。佛陀為這番對話作解釋，說了第 97 偈。三十位比丘當下證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "97", "h": ["棄欲無着，", "缺三界障，", "望意已絕，", "是謂上人。"], "p": ["Assaddho akataññū ca, sandhicchedo ca yo naro;", "hatāvakāso vantāso, sa ve uttamaporiso."], "hm": "巴利第 97 偈有雙關：字面可讀作「無信、忘恩、破壞連結的人」，註釋與多數譯者則讀作稱讚阿羅漢，這裡依後者。漢傳第 9 偈（棄欲無著）與它字面差異大，對應依蘇錦坤對讀表。", "d": "不盲信、知無為、斷輪迴之結、盡除業的機會、吐盡貪欲的人，是最上等的人。"}], "g": [["assaddha", "不靠信仰（亦可讀作無信）"], ["akataññū", "知無為者（亦可讀作不知恩）"], ["sandhiccheda", "斷輪迴之結（亦可讀作破壞連結）"], ["hatāvakāsa", "滅盡機會"], ["vantāsa", "吐盡（貪欲）"], ["uttamaporisa", "最上等的人"]], "w": [["棄欲無著", "捨棄貪欲而不執著"], ["缺三界障", "打破三界的障礙"], ["望意", "期待之念"], ["上人", "最上等的人"]], "i": [["雙關的偈", "這一首偈在巴利可以兩種讀法，字面像在罵人，其實是在讚阿羅漢。讀經時要看全文與傳統，不要斷章取義。"], ["不靠信，而靠見", "舍利弗說的是「我是自己證知」。這不是否定信，而是說最後要由自己親見。"]], "x": "今天放下一個「想要」（不買、不看），感覺一下「不抓著」的輕鬆。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r9", "t": "哪裡都是歡喜地", "s": "雷婆多（Revata）是舍利弗最小的弟弟，結婚當天見到一位極老的婦人，深有所感，逃離婚禮出家，後來在一片多刺的兒茶樹林中修行，證得阿羅漢。佛陀帶著舍利弗等人去看他，沿途諸天護持。回程後，毘舍佉（Visākhā）問佛陀：雷婆多的住處是否令人歡喜？佛陀說：不論村落、森林、低地、高地，阿羅漢住的地方，都是令人歡喜的地方。（依註釋傳統概述）", "k": [{"n": "98", "h": ["在聚若野，", "平地高岸，", "應真所過，", "莫不蒙祐。"], "p": ["Gāme vā yadi vāraññe, ninne vā yadi vā thale;", "yattha arahanto viharanti, taṃ bhūmirāmaṇeyyakaṃ."], "d": "不論村落或森林，低地或高地，阿羅漢住的地方，就是令人歡喜的地方。"}], "g": [["gāme", "在村落"], ["araññe", "在森林"], ["ninne", "在低地"], ["thale", "在高地"], ["arahanta", "阿羅漢"], ["viharanti", "居住"], ["bhūmi", "土地"], ["rāmaṇeyyaka", "令人歡喜"]], "w": [["在聚若野", "在村落或荒野"], ["平地高岸", "平地或高處"], ["應真", "阿羅漢"], ["蒙祐", "受到護祐"]], "i": [["地方因人而美", "偈頌不是說哪一種環境最好，而是說：地方因為住在裡面的人而變得令人歡喜。"], ["雷婆多", "一個因為看見衰老而離開婚禮的人，後來在多刺的樹林中找到歡喜地。"]], "x": "你今天所在的地方不一定是理想的。找一件小事，讓它在今天「令人歡喜」。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "r10", "t": "森林為何美好", "s": "一位比丘在一座老舊的園林裡修行，有位行為不端的女子來到那裡，使他既害怕、又莫名歡喜。佛陀以一道光明與一番話，傳去訊息：森林是令人歡喜的，一般人在那裡找不到樂趣；只有離貪的人，才會歡喜，因為他們不尋求欲樂。這是第 99 偈。（依註釋傳統概述）", "k": [{"n": "99", "h": ["彼樂空閑，", "眾人不能，", "快哉無望，", "無所欲求。"], "p": ["Ramaṇīyāni araññāni, yattha na ramatī jano;", "vītarāgā ramissanti, na te kāmagavesino."], "d": "森林令人歡喜，一般人在那裡卻找不到樂趣；離貪的人會歡喜，因為他們不尋找欲樂。"}], "g": [["ramaṇīya", "令人歡喜的"], ["arañña", "森林"], ["jana", "眾人"], ["ramati", "喜樂"], ["vītarāga", "離貪者"], ["kāma", "欲樂"], ["gavesin", "尋求者"]], "w": [["彼樂空閑", "喜愛清靜閒居"], ["眾人不能", "一般人做不到"], ["快哉", "真快樂啊"], ["無望", "沒有所求"]], "i": [["為什麼一般人不歡喜", "森林裡沒有熱鬧、沒有刺激，一般人找不到樂。離貪的人樂在其中，因為他們要的不是刺激。"], ["閱讀這一品", "第 90 至 99 偈，是從「不再灼熱」走到「連荒野都歡喜」。一路下來，是不依賴外境的快樂。"]], "x": "今天找十分鐘什麼都不做，只是安靜待著，看看心會不會慢慢平靜。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}]});
BOOKS.push({"id": "s", "n": "述千品", "p": "Sahassavagga", "d": "千句、千人、百年：數量不重要，一句能用的才重要。", "note": "巴利本的第八品；在《法句經》中為第十六品。故事依巴利註釋傳統，參考 Daw Mya Tin 英譯，由編者摘要。偈頌對應依蘇錦坤對讀表；第 112 至 115 偈的漢巴對應，是編者依內容與順序比對，已在頁面標明。", "u": [{"id": "s1", "t": "一句能安心的話", "s": "過去替國王處決盜賊的劊子手，退休後供養舍利弗長老。舍利弗為他說法，他內心得到安定。後來他被化作母牛的夜叉所害，傳說往生兜率天。佛陀藉此說明：一千句沒有義理的話，不如一句能使人安靜的話。（依註釋傳統概述）", "k": [{"n": "100", "h": ["雖誦千言，", "句義不正，", "不如一要，", "聞可滅意；"], "p": ["Sahassamapi ce vācā, anatthapadasaṃhitā;", "ekaṃ atthapadaṃ seyyo, yaṃ sutvā upasammati."], "d": "即使說上千句話，字句卻沒有義理，不如一句有義理的話，聽了能使人平靜。"}], "g": [["sahassa", "千"], ["vācā", "言語"], ["anattha", "無義理"], ["padasaṃhitā", "由字句組成"], ["atthapada", "有義理的句"], ["seyya", "更好"], ["sutvā", "聽了之後"], ["upasammati", "平息"]], "w": [["句義不正", "字句的意思不正確"], ["一要", "一句要點"], ["滅意", "使亂念平息"]], "i": [["不在多，在於安", "偈頌的標準不是「有多少話」，而是「聽了之後，心有沒有靜下來」。"], ["這一品的主題", "「述千」是說千：許多話，不如一句能用的。整品都在提醒，學不是為了多，是為了用。"]], "x": "今天挑一句經文或一句話，只看一件事：它能不能讓我現在安靜下來？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s2", "t": "一句教導，一念證果", "s": "巴提亞（Bāhiya）在海上遇到船難，只剩一塊木板可以當衣服，漂上岸後，人們看他無所有，把他當成阿羅漢供養。他也漸漸這麼以為。大梵天糾正他：你並不是阿羅漢，去見佛陀吧。他趕到舍衛城，佛陀正在托缽，他攔路再三請求教導，佛陀簡短指示後，他當下證得阿羅漢。不久，被化作母牛的夜叉所害。（依註釋傳統概述）", "k": [{"n": "101", "h": ["雖誦千言，", "不義何益？", "不如一義，", "聞行可度；"], "p": ["Sahassamapi ce gāthā, anatthapadasaṃhitā;", "ekaṃ gāthāpadaṃ seyyo, yaṃ sutvā upasammati."], "d": "即使有上千首偈，字句卻沒有義理，不如一句偈中的一句，聽了能使人平靜。"}], "g": [["gāthā", "偈頌"], ["gāthāpada", "偈中的一句"], ["anatthapadasaṃhitā", "由無義理的字句組成"], ["sutvā", "聽了之後"], ["upasammati", "平息"]], "w": [["不義", "沒有義理"], ["何益", "有什麼好處"], ["聞行可度", "聽了去實行，就能度過"]], "i": [["假的與真的", "巴提亞一度被當成阿羅漢，卻是別人看他沒有衣物而誤會。被供養，不等於證果。"], ["一句夠了", "佛陀路上很短的一番話，加上他全然的專注，就足夠。重點是專注，不是長短。"]], "x": "今天聽一句好話，聽完後，不要馬上滑手機，靜十秒。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s3", "t": "「一」是什麼？", "s": "琨達羅離（Kuṇḍalakesī）是富商之女，愛上一名盜賊，嫁給他。她後來在山上把他推下去，從此離家，成為遊方的外道修行者，所到之處辯論都贏。舍利弗遇見她，反問：「什麼是一？」她答不出來，心服，隨佛陀出家為比丘尼，後來證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "102", "h": ["雖多誦經，", "不解何益？", "解一法句，", "行可得道。"], "p": ["Yo ca gāthā sataṃ bhāse, anatthapadasaṃhitā;", "ekaṃ dhammapadaṃ seyyo, yaṃ sutvā upasammati."], "d": "若有人說一百首偈，卻沒有義理，不如一句法句，聽了能使人平靜。"}, {"n": "103", "h": ["千千為敵，", "一夫勝之，", "未若自勝，", "為戰中上。"], "p": ["Yo sahassaṃ sahassena, saṅgāme mānuse jine;", "ekañca jeyyamattānaṃ, sa ve saṅgāmajuttamo."], "d": "在戰場上戰勝千人的千倍之敵，不如戰勝一個自己，那才是最上的勝者。"}], "g": [["gāthā", "偈頌"], ["dhammapada", "法句"], ["sahassa", "千"], ["saṅgāma", "戰場"], ["mānuse", "人類"], ["jine", "戰勝"], ["attānaṃ", "自己"], ["saṅgāmajuttama", "戰場上最上者"]], "w": [["解一法句", "理解一句法義"], ["千千為敵", "千人對敵"], ["中上", "其中最上"]], "i": [["「法句」這個詞", "第 102 偈出現了 dhammapada，也就是「法句」，書名的來源。偈頌說：誦很多，不如懂一句。"], ["戰勝一個人", "琨達羅離贏過無數場辯論，卻答不出「一」。更大的勝利，是向內看見自己的執著。"]], "x": "今天輸一次辯論，就當作贏了自己一次。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s4", "t": "贏過骰子，贏過自己", "s": "一位婆羅門向佛陀請教會使人衰敗的事（註釋傳統說他好賭）。佛陀列舉幾種導致敗亡的原因，並說：戰勝自己，比在賭桌上贏任何一局，都更值得。接著說了第 104、105 偈。（依註釋傳統概述）", "k": [{"n": "104", "h": ["自勝最賢，", "故曰人雄，", "護意調身，", "自損至終。"], "p": ["Attā have jitaṃ seyyo, yā cāyaṃ itarā pajā;", "attadantassa posassa, niccaṃ saññatacārino."], "d": "戰勝自己，勝過戰勝其他的人群；對於調伏自己、時時自我克制的人而言，自勝才是最好。"}, {"n": "105", "h": ["雖曰尊天，", "神魔梵釋，", "皆莫能勝，", "自勝之人。"], "p": ["Neva devo na gandhabbo, na māro saha brahmunā;", "jitaṃ apajitaṃ kayirā, tathārūpassa jantuno."], "d": "連天神、乾闥婆、魔羅與梵天，也無法把這樣的人的勝利變成失敗。"}], "g": [["attā", "自己"], ["jita", "戰勝"], ["itarā", "其他的"], ["pajā", "人群"], ["attadanta", "自己調伏者"], ["saññata", "自制"], ["devo", "天神"], ["gandhabba", "乾闥婆"], ["māra", "魔羅"], ["brahma", "梵天"]], "w": [["人雄", "人中之雄"], ["護意調身", "守護心意、調伏身行"], ["自損至終", "一直克制到最後"], ["尊天", "尊貴的天神"]], "i": [["最難的對手", "偈頌說最難贏的不是別人，是自己。因為對手每天都在，而且最了解你的弱點。"], ["勝利不可被奪走", "第 105 偈說：自勝的人，沒有任何力量能讓他的勝利變成失敗。因為這個勝利在內，不在名次。"]], "x": "今天想做又不該做的一件事，試著晚五分鐘再決定。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s5", "t": "一念供養，勝過百年", "s": "舍利弗的舅舅是一位婆羅門，每個月供養尼乾子（耆那教苦行者）許多財物。聽佛陀說法後，他明白：供養一位修行者一餐，勝過一年的大祭祀，便證得初果。舍利弗的外甥則每天事奉聖火、舉行火祭；佛陀告訴他：恭敬供養一位修行者片刻，勝過百年火祭。他也證得初果。（依註釋傳統概述）", "k": [{"n": "106", "h": ["月千反祠，", "終身不輟，", "不如須臾，", "一心念法，", "一念道福，", "勝彼終身；"], "p": ["Māse māse sahassena, yo yajetha sataṃ samaṃ;", "ekañca bhāvitattānaṃ, muhuttampi pūjaye;", "sā yeva pūjanā seyyo, yañce vassasataṃ hutaṃ."], "d": "每個月花上千金作祭祀，連續一百年；不如對一位修養自心的人，供養片刻。這一份供養，比百年的祭祀更好。"}, {"n": "107", "h": ["雖終百歲，", "奉事火祠，", "不如須臾，", "供養三尊，", "一供養福，", "勝彼百年。"], "p": ["Yo ca vassasataṃ jantu, aggiṃ paricare vane;", "ekañca bhāvitattānaṃ, muhuttampi pūjaye;", "sā yeva pūjanā seyyo, yañce vassasataṃ hutaṃ."], "d": "若有人在林中事奉火一百年，不如對一位修養自心的人，供養片刻。這一份供養，比百年的祭祀更好。"}], "g": [["māse māse", "每個月"], ["yajetha", "祭祀"], ["bhāvitatta", "修養自心者"], ["muhutta", "片刻"], ["pūjaye", "供養"], ["aggi", "火"], ["paricare", "侍奉"], ["vassasata", "一百年"], ["huta", "祭祀供品"]], "w": [["月千反祠", "每月千次祭祀"], ["須臾", "片刻"], ["三尊", "佛、法、僧"], ["百年", "百歲"]], "i": [["不是否定供養", "偈頌不是說供養沒用，是比較「在哪裡」。對一位真正在修自己的人，片刻的恭敬，勝過長年的形式。"], ["一念與百年", "數量大的、時間長的，不一定重。這是這一品一再出現的邏輯。"]], "x": "今天挑一分鐘，一心一意做一件事（念一句偈，或真心說一句謝謝）：專心的一分鐘，勝過心不在焉的一整天。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s6", "t": "禮敬，使人增長", "s": "舍利弗的一位婆羅門朋友大做祭祀，希望求福。聽佛陀說：把祭祀的福報加起來，不如恭敬正直的修行者的四分之一。他因此轉向。另有一位小孩阿由瓦達那（Āyuvaḍḍhana），被預言很快會夭折；在佛陀的護持與誦念下，他得以脫險。佛陀接著說了第 109 偈：恭敬長者的人，壽命、容貌、安樂、力量都會增長。（依註釋傳統概述）", "k": [{"n": "108", "h": ["祭神以求福，", "從後觀其報，", "四分未望一，", "不如禮賢者。"], "p": ["Yaṃ kiñci yiṭṭhaṃ va hutaṃ va loke, saṃvaccharaṃ yajetha puññapekkho;", "sabbampi taṃ na catubhāgameti, abhivādanā ujjugatesu seyyo."], "d": "世間任何祭祀供養，一個人為了求福而祭祀一整年，這一切都不到禮敬正直者的四分之一。禮敬正直的人更好。"}, {"n": "109", "h": ["能善行禮節，", "常敬長老者，", "四福自然增，", "色力壽而安。"], "p": ["Abhivādanasīlissa, niccaṃ vuḍḍhāpacāyino;", "cattāro dhammā vaḍḍhanti, āyu vaṇṇo sukhaṃ balaṃ."], "d": "習慣禮敬、常尊敬長者的人，有四件事增長：壽命、容色、安樂、力量。"}], "g": [["yiṭṭha", "祭祀"], ["huta", "供品"], ["puññapekkha", "希望得福"], ["catubhāga", "四分之一"], ["abhivādana", "禮敬"], ["ujjugata", "正直者"], ["vuḍḍhāpacāyin", "尊敬長者者"], ["āyu", "壽命"], ["vaṇṇa", "容色"], ["sukha", "安樂"], ["bala", "力量"]], "w": [["祭神求福", "祭祀鬼神來求福"], ["四分未望一", "連四分之一都不到"], ["禮節", "禮敬的規矩"], ["四福", "壽、色、安、力"]], "i": [["禮敬不是低頭", "偈頌說的禮敬對象是「正直者」。尊重的是品行，不是地位。"], ["四件事", "壽命、容色、安樂、力量。這些在說：習慣尊敬別人，也在養自己的心。"]], "x": "今天向一位長輩或老師，主動問候一句。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s7", "t": "持戒的一天", "s": "七歲的沙彌桑吉查（Saṅkicca）已證阿羅漢。有一次，他被一群共五百名的盜賊抓到，要當祭品。他沒有害怕，平靜地面對。盜賊們的刀劍傷不了他，深受感動，都放下武器，隨他出家。佛陀說：一個品行不好、心不安定的人活一百年，不如一個持戒、禪修的人活一天。（依註釋傳統概述）", "k": [{"n": "110", "h": ["若人壽百歲，", "遠正不持戒，", "不如生一日，", "守戒正意禪；"], "p": ["Yo ca vassasataṃ jīve, dussīlo asamāhito;", "ekāhaṃ jīvitaṃ seyyo, sīlavantassa jhāyino."], "d": "若有人活一百年，卻破戒、心不安定；不如活一天，有戒行、能修禪的人。"}], "g": [["vassasata", "一百年"], ["jīve", "活"], ["dussīla", "破戒"], ["asamāhita", "心不定"], ["ekāha", "一天"], ["jīvita", "生命"], ["sīlavanta", "有戒者"], ["jhāyin", "禪修者"]], "w": [["遠正", "遠離正道"], ["不持戒", "不守戒"], ["正意禪", "正念禪思"]], "i": [["衡量生命的方式", "偈頌不用長度算生命，用品質算。這不是勸人短命，而是提醒：該問的不是活多久，而是怎麼活。"], ["有戒，有定", "第 110 偈說兩件事：持戒（行為）與禪定（心）。一個管外，一個管內。"]], "x": "今天結束前，問自己：今天做的事，有哪一件我會願意再做一次？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s8", "t": "石頭上的長老", "s": "康達·拘絺羅（Khāṇu-Koṇḍañña）是阿羅漢，常坐在一塊大石頭上禪修，一動不動。五百名盜賊夜裡經過，誤以為他是樹樁，把搶來的東西放在他身上。天亮後，他們發現那是一個人，嚇壞了。長老開口說明，盜賊們感動，請求出家。佛陀說：活一百年卻沒有智慧、心不安定，不如活一天，有智慧、能禪修。（依註釋傳統概述）", "k": [{"n": "111", "h": ["若人壽百歲，", "邪偽無有智，", "不如生一日，", "一心學正智；"], "p": ["Yo ca vassasataṃ jīve, duppañño asamāhito;", "ekāhaṃ jīvitaṃ seyyo, paññavantassa jhāyino."], "d": "若有人活一百年，卻沒有智慧、心不安定；不如活一天，有智慧、能禪修的人。"}], "g": [["duppañña", "無智慧"], ["paññavanta", "有智慧者"], ["asamāhita", "不專注"], ["jhāyin", "修禪者"], ["jīvita", "生命"], ["seyya", "更好"]], "w": [["邪偽", "邪曲虛偽"], ["無有智", "沒有智慧"], ["學正智", "學習正確的智慧"]], "i": [["靜到被當成樹樁", "長老靜到被人當成樹樁。這也是定的一個形象：不動，卻不是死的。"], ["智慧與定", "第 110 偈講戒與定，第 111 偈講慧與定。連起來，就是戒、定、慧。"]], "x": "今天找一件事，專心做到被打斷之前不去看手機。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s9", "t": "奮力的一天", "s": "有一位比丘對修行感到沮喪疲憊，一度想要放棄生命；但在最後關頭，他轉念專心觀照，竟證得阿羅漢。佛陀說：一個人活一百年卻懶散、不精進，不如活一天，用力精進。（依註釋傳統概述）<br>（這一則提到輕生的念頭。如果你或身邊的人有類似的念頭，請先找信任的人談談；在台灣可撥安心專線 1925，24 小時有人接聽。）", "k": [{"n": "112", "h": ["若人壽百歲，", "懈怠不精進，", "不如生一日，", "勉力行精進；"], "p": ["Yo ca vassasataṃ jīve, kusīto hīnavīriyo;", "ekāhaṃ jīvitaṃ seyyo, vīriyamārabhato daḷhaṃ."], "hm": "漢傳第 13 偈與巴利第 112 偈的對應，是編者依內容與順序比對；蘇錦坤對讀表此處未能完整核對。", "d": "若有人活一百年，卻懶散、缺少精進；不如活一天，堅定地發起精進的人。"}], "g": [["kusīta", "懈怠"], ["hīnavīriya", "精進不足"], ["vīriya", "精進"], ["ārabhato", "發起"], ["daḷhaṃ", "堅定地"], ["ekāha", "一天"]], "w": [["懈怠", "懶散"], ["精進", "用力向前"], ["勉力", "努力"]], "i": [["疲倦也是修行的一部分", "偈頌不責怪疲倦，而是說：把力氣用在當下這一天。累，是可以被看見的。"], ["「一天」", "這一品反覆用「活一天」。一天，是人真正能掌握的單位。"]], "x": "今天做完一件拖延的小事，哪怕只有十分鐘。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s10", "t": "生滅之中看見", "s": "波吒遮羅（Paṭācārā）原是富家女，因一連串災禍，失去丈夫、兩個孩子、父母和兄弟，悲痛到失去常態，赤身遊蕩。佛陀以慈悲安撫她，為她說法，她恢復了清明，證得初果，後來出家。有一天，她洗腳，看見三次倒水，水流到不同的遠近就消失，因而領悟生滅無常，證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "113", "h": ["若人壽百歲，", "不知成敗事，", "不如生一日，", "見微知所忌；"], "p": ["Yo ca vassasataṃ jīve, apassaṃ udayabbayaṃ;", "ekāhaṃ jīvitaṃ seyyo, passato udayabbayaṃ."], "hm": "漢傳第 14 偈與巴利第 113 偈的對應，是編者依內容與順序比對；蘇錦坤對讀表此處未能完整核對。", "d": "若有人活一百年，卻沒有看見事物的生與滅；不如活一天，看見生滅的人。"}], "g": [["apassaṃ", "沒有看見"], ["udaya", "生起"], ["vaya", "消滅"], ["passato", "正看見者"], ["ekāha", "一天"], ["jīvitaṃ", "生命"]], "w": [["成敗", "興起與衰敗"], ["見微", "看見細微的跡象"], ["知所忌", "知道要避忌什麼"]], "i": [["生滅的覺察", "udayabbaya 是生起與消滅。看見東西會起、也會滅，是無常最直接的體驗。"], ["悲痛的人", "波吒遮羅的悲傷極深，她看見的卻是水流自然消失的樣子。有時，領悟來自最平常的畫面。"]], "x": "今天觀察一個念頭「升起」到「消失」，大約花了多久？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s11", "t": "芥菜籽", "s": "吉莎·瞿曇彌（Kisāgotamī）的獨子夭折，她抱著孩子的遺體，到處求藥。有人指引她去見佛陀。佛陀說：你去找一戶沒有死過人的人家，討一把芥菜籽。她挨家挨戶問，沒有一家沒死過人。她這才明白，死亡是人人都會遇到的事。她安葬了孩子，回到佛陀身邊，證得初果，之後出家，後來證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "114", "h": ["若人壽百歲，", "不見甘露道，", "不如生一日，", "服行甘露味；"], "p": ["Yo ca vassasataṃ jīve, apassaṃ amataṃ padaṃ;", "ekāhaṃ jīvitaṃ seyyo, passato amataṃ padaṃ."], "hm": "漢傳第 15 偈與巴利第 114 偈的對應，是編者依內容與順序比對；蘇錦坤對讀表此處未能完整核對。", "d": "若有人活一百年，卻沒有見到不死的境地；不如活一天，見到不死之境的人。"}], "g": [["amata", "不死、甘露"], ["pada", "境地"], ["apassaṃ", "沒有看見"], ["passato", "看見者"], ["vassasata", "一百年"], ["jīve", "活著"]], "w": [["甘露道", "不死之道"], ["服行", "實行、嚐受"], ["甘露味", "不死的滋味"]], "i": [["一個人的悲傷，所有人的事", "芥菜籽的方法，不是否定她的痛，是讓她看見：我不是唯一一個。這份看見，使悲傷能被承載。"], ["amata", "「不死」不是長生，是不再被死亡的恐懼支配。"]], "x": "今天遇到難過的人，陪著就好，不急著解決；晚上想想：什麼能讓我在失去時仍站得穩？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s12", "t": "沒有法的百年", "s": "一位母親（傳為多子者）把財產分給眾多兒女，後來卻被他們冷落。她出家為比丘尼，夜裡專心禪修。佛陀以光明現身在她面前，說：一個人活一百年而沒有見到最上的法，不如活一天，見到最上的法。她聽後證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "115", "h": ["若人壽百歲，", "不知大道義，", "不如生一日，", "學推佛法要。"], "p": ["Yo ca vassasataṃ jīve, apassaṃ dhammamuttamaṃ;", "ekāhaṃ jīvitaṃ seyyo, passato dhammamuttamaṃ."], "hm": "漢傳第 16 偈與巴利第 115 偈的對應，是編者依內容與順序比對；蘇錦坤對讀表此處未能完整核對。", "d": "若有人活一百年，卻沒有見到最上的法；不如活一天，見到最上的法的人。"}], "g": [["dhamma", "法"], ["uttama", "最上"], ["apassaṃ", "沒有看見"], ["passato", "正看見者"], ["vassasata", "一百年"], ["jīvitaṃ", "生命"]], "w": [["大道義", "大道的義理"], ["學推佛法要", "學習探究佛法的要點"], ["百歲", "一百歲"]], "i": [["最後一偈", "從 110 到 115，是同一句型六次：活一百年，不如活一天。最後落在「最上的法」。"], ["述千品的總結", "這一品從「千句話」開始，到「一天的法」結束。看重的是：把一件事真正看懂。"]], "x": "整理這一品，選一句你最想留在心裡的偈，今天用一件小事去活出它。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}]});
