<style>

.enso{width:92px;height:92px;color:var(--acc);opacity:.85;filter:drop-shadow(0 3px 3px var(--sh))}
.ht{font-size:2.3em;letter-spacing:.4em;padding-left:.4em;font-weight:700;margin-top:-6px;text-shadow:0 2px 0 var(--hi),0 3px 6px var(--sh)}
.hs{font-size:11px;letter-spacing:.5em;padding-left:.5em;color:var(--mut)}
html[data-pal=blue] .hs{color:var(--br)}
.hp{font-size:.88em;color:var(--mut);margin:14px 0 18px}
.go{display:block;width:100%;border:none;border-radius:14px;padding:12px 10px;background:var(--acc);color:var(--sf);font-size:1em;letter-spacing:.2em;box-shadow:0 8px 16px -6px var(--sh),0 1px 0 rgba(255,255,255,.18) inset}
.go span{display:block;font-size:.72em;letter-spacing:.05em;opacity:.8;margin-top:2px}
.bk{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;font-size:.95em}
.bk:last-child{border-bottom:none}.bkn{min-width:5.2em}.bkn small{display:block;font-size:.7em;color:var(--mut);letter-spacing:.05em}
.pb{flex:1;height:7px;border-radius:5px;background:var(--bg);box-shadow:inset 0 1px 3px var(--sh);overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bkc{font-size:.8em;color:var(--mut);min-width:3em;text-align:right}
.seg{display:flex;width:max-content;margin:8px auto 10px;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 8px var(--sh)}

.soon{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 2px;font-size:.92em;color:var(--mut);opacity:.7}.soon .no{min-width:1.6em}.soon .tt{flex:1}.soon .pg{font-size:.75em}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.82);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ovin{max-width:420px;width:100%;text-align:center}.ovin img{display:block;margin:0 auto;width:min(100%,calc(64vh*.8));width:min(100%,calc(64dvh*.8));height:auto;border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,.6);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.ovtip{color:#eee;font-size:13px;margin:12px 0 8px;line-height:1.7}.ov .acts button{color:#eee;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1);box-shadow:none}
.rs{text-align:center;line-height:2.15;letter-spacing:.05em;margin:0 0 var(--gap);padding-bottom:var(--gap);border-bottom:1px solid var(--line)}.pre{text-indent:2em;text-align:justify;font-size:.92em}
.rnav{display:flex;justify-content:space-between;gap:8px;margin:22px 0 8px}.rnav button{flex:1;border:1px solid var(--line);background:linear-gradient(145deg,var(--hi),var(--sf));border-radius:12px;padding:8px 6px;font-size:.8em;color:var(--mut);box-shadow:0 3px 8px var(--sh)}.rnav button:disabled{opacity:.3}
.ref a{color:var(--acc)}
.soonb .tt small{font-size:.72em;color:var(--mut);letter-spacing:.03em}
.vp{position:relative;aspect-ratio:16/9;background:var(--bg);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:inset 0 2px 6px var(--sh),0 6px 14px -6px var(--sh);margin-bottom:10px}.vp img{width:100%;height:100%;object-fit:cover;display:block}.vp .pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.65)}.vp iframe{width:100%;height:100%;border:0;display:block}
.ext{display:block;text-align:center;color:var(--acc);font-size:.82em;margin:0 0 12px;text-decoration:none}

</style>

<script>
var BOOKS=[{id:"y",n:"雙要品",p:"Yamakavagga",d:"成對的偈頌，看心念如何帶來苦與樂。",note:"巴利本的第一品；在吳譯《法句經》中為第九品。",u:[
{t:"盲眼長老與心念",
s:"長老已證阿羅漢，雙眼卻失明。夜裡經行時，他不知道腳下踩死了小蟲，早上有比丘看見蟲屍，向佛陀告狀。佛陀問：你們看見他殺蟲嗎？答：沒有。佛陀說：他沒看見蟲，也沒有殺的意圖，所以無過。有人問他為何失明，佛陀說起前世：他曾是醫生，一位女病人答應治好眼睛就帶著孩子當他的奴隸，痊癒後她卻謊稱沒好；醫生知道她欺騙，故意換藥使她全盲。這份惡業讓他多世失明，像車輪跟著牛蹄。",
k:[{n:"1",h:["心為法本，心尊心使，","中心念惡，即言即行，","罪苦自追，車轢于轍。"],p:["Manopubbaṅgamā dhammā, manoseṭṭhā manomayā;","manasā ce paduṭṭhena, bhāsati vā karoti vā;","tato naṃ dukkham anveti, cakkaṃ va vahato padaṃ."],d:"一切行為以心為先導，心是主，由心造作。若帶著染污的心說話或行動，苦就跟著來，像車輪緊隨牛蹄。"}],
g:[["mano","心"],["pubbaṅgamā","為先導（漢譯「本」）"],["seṭṭhā","為主（漢譯「尊」）"],["manomayā","由心所造（漢譯「使」）"],["paduṭṭhena","染污的（漢譯「惡」）"],["dukkha / cakkaṃ","苦 / 輪"]],
w:[["法","此處指一切現象與行為"],["中心","內心"],["轢","碾壓"],["轍","車輪的痕跡"]],
i:[["思即是業","註釋說這裡的「心」主要指意志（cetanā）。佛陀也說：我說「思」就是業。決定業的是意圖，不只是動作。"],["八正道","正思惟、正語、正業一脈相連：念頭先正，言行才正。"]],
x:"今天留意一次：說話或做事之前，心裡先起了什麼念頭？",
q:{q:"長老踩死小蟲卻無過，前世的醫生卻有業果，關鍵差在哪？",o:[["小蟲有沒有死","結果相同，小蟲都死了，所以不是關鍵。"],["起心動念：有沒有惡意","對。同樣的動作，有無惡意，業就不同。",1],["是否已經出家","身分不是關鍵，偈頌講的是心。"]]}},
{t:"淨信的少年",
s:"少年是慳吝婆羅門的獨子，父親連兒子的金飾都自己打造以省工錢。兒子重病，父親捨不得請醫生，等到快不行了，才把他抬到外廊，免得訪客看見家裡的財物。清晨，佛陀以慈悲之眼看見他，托缽時站在門口，放光引他注視。少年虛弱得只能在心裡生起信心，命終後生到忉利天。後來他現身向父親說明，促成父親請佛陀應供。父親聽法證初果，並把大部分財產供養佛法。",
k:[{n:"2",h:["心為法本，心尊心使，","中心念善，即言即行，","福樂自追，如影隨形。"],p:["Manopubbaṅgamā dhammā, manoseṭṭhā manomayā;","manasā ce pasannena, bhāsati vā karoti vā;","tato naṃ sukham anveti, chāyā va anapāyinī."],d:"一切行為以心為先導，心是主，由心造作。若帶著清淨的心說話或行動，樂就跟著來，像不離身的影子。"}],
g:[["pasannena","清淨、澄明的（漢譯「善」）"],["sukha","樂"],["chāyā","影"],["anapāyinī","不離去的"]],
w:[["如影隨形","影子一直跟著身體，形容福樂緊隨"]],
i:[["淨信的力量","少年沒布施也沒持戒，卻因臨終一念淨信而生善處。這不是說不必布施持戒，而是說明心的力量。他的父親後來也大量布施。"],["與第 1 偈成對","同樣的開頭，只換了一個字：「染污」與「清淨」，苦與樂也跟著換。"]],
x:"今天留意一次善意或感謝的念頭，看它帶來的感受。",
q:{q:"少年沒有布施，仍生善處，故事想說明什麼？",o:[["財富決定來生","故事相反，父親有錢卻吝嗇。"],["清淨的心念有很大力量","對。臨終一念淨信，也能帶來善果。",1],["不必再持戒","故事沒有這個意思，父親後來仍大力布施修行。"]]}},
{t:"恨意的反覆",
s:"提舍長老是佛陀姨母之子，年老才出家，卻以資深比丘自居，既不做後進該做的事，還常和年輕比丘爭執。被人指正，他就哭著去向佛陀告狀。佛陀說：不要把「他罵我、打我、勝過我、搶我的東西」這些念頭一直放在心上，怨恨只有不再懷抱才能平息。",
k:[{n:"3–4",h:["慍於怨者，未甞無怨；","不慍自除，是道可宗。"],p:["Akkocchi maṃ avadhi maṃ, ajini maṃ ahāsi me;","ye ca taṃ upanayhanti, veraṃ tesaṃ na sammati;","（第 4 偈前半同上）ye ca taṃ nupanayhanti, veraṃ tesūpasammati."],d:"「他罵我、打我、勝過我、搶了我」，把這些念頭一直放在心上的人，怨恨無法止息；不再放在心上的人，怨恨就平息。"}],
g:[["akkocchi / avadhi","他罵我 / 他打我"],["ajini / ahāsi","他勝過我 / 他搶了我的"],["upanayhanti","把念頭一再繫著、反覆回想"],["na sammati","不止息"]],
w:[["慍","含怒、懷恨"],["怨","怨恨、仇怨"],["道可宗","可作為準則的道路"]],
i:[["恨是被「養」大的","原文 upanayhati 的意思是把念頭一再繫在心上。事件只發生一次，反覆回想卻能發生一百次。"],["吳譯對照","吳譯「不慍自除」與巴利「不懷此念，怨便平息」意思相近。"]],
x:"今天若有人冒犯你，注意心裡是不是在反覆重播，重播時可以輕輕放下。",
q:{q:"偈頌說怨恨如何平息？",o:[["讓對方先道歉","偈頌著重在自己的心，不是對方。"],["不再把那些念頭放在心上","對。不再反覆懷抱，怨恨便止息。",1],["報復回去","偈頌說的正好相反。"]]}},
{t:"怨怨相報",
s:"有位長者的妻子不孕，丈夫另娶；大房因嫉妒使二房流產，二房最後在生產中死去，臨終立願報復。兩人接著世世結怨：先是母雞與母貓，再是母鹿與母豹，最後一個成為舍衛城貴族之女，一個成為夜叉女迦利。夜叉追著抱孩子的母親，她逃到祇園精舍，把孩子放在佛陀腳前。佛陀請夜叉進來，說出兩人多世的怨仇，指出：恨以恨止，只會更恨；唯有以無恨、友善與理解才能止息。夜叉後來證初果。",
k:[{n:"5",h:null,hn:"吳譯雙要品中，「慍於怨者……不慍自除」（見上一則）也涵蓋這一偈的意思。",p:["Na hi verena verāni, sammantīdha kudācanaṃ;","averena ca sammanti, esa dhammo sanantano."],d:"在這世間，怨恨從來不能以怨恨止息；只有以無怨才能止息。這是古老不變的法則。"}],
g:[["vera","怨恨、仇怨"],["averena","以無怨、以慈愛"],["sanantano","古老的、恆常的"],["kudācanaṃ","任何時候"]],
w:[],
i:[["輪迴中的怨","故事用多世輪迴，說明怨怨相報如何一世接一世，正是「怨不止怨」的寫照。"],["慈心","這裡的「無怨」，傳統上理解為慈愛與不懷恨的心。"]],
x:"想一個放不下的小怨，試著不回應、不加料，只當作練習。",
q:{q:"兩人轉世多次仍互相仇視，佛陀指出的出路是？",o:[["讓強者獲勝","力量只會延續怨仇。"],["以無怨、友善來止息","對。這是佛陀教她們的做法。",1],["各自遠離，永不見面","故事中是面對並和解，而不是躲避。"]]}},
{t:"憍賞彌的爭執",
s:"憍賞彌的比丘分成兩派，一派跟隨持律者，一派跟隨說法者，不斷爭吵。佛陀勸不動，便獨自到林中度過雨安居，由大象侍奉。在家信眾得知後，不再供養那些比丘，他們才醒悟並彼此和解，卻仍得向佛陀認錯。雨安居結束，阿難與五百比丘迎請佛陀回舍衛城。佛陀責備他們不聽勸，提醒：人終將死，不要像永遠不死一樣爭吵。",
k:[{n:"6",h:["不好責彼，務自省身，","如有知此，永滅無患。"],p:["Pare ca na vijānanti, mayamettha yamāmase;","ye ca tattha vijānanti, tato sammanti medhagā."],d:"不明理的人不明白「我們都將死去」，因此爭吵不休；明白這一點的智者，爭執就平息了。"}],
g:[["pare","別人（不明理的人）"],["yamāmase","我們都將死去（註釋義）"],["medhagā","爭執、紛爭"],["sammanti","止息"]],
w:[["務自省身","專心反省自己"],["無患","沒有禍患"]],
i:[["無常止爭","死亡是共通的事實。想到這一點，許多非贏不可的爭執就變輕了。"],["退一步","佛陀自己先離開，也是一種示範：爭執升高時，暫時離開現場。"]],
x:"下次爭論前，先問：十年後這件事還重要嗎？",
q:{q:"偈頌認為智者的爭執為何止息？",o:[["贏了辯論","偈頌沒有談輸贏。"],["明白我們終將死去","對。看見無常，便少了爭執的力氣。",1],["找人評理","偈頌從內心的領悟談起。"]]}},
{t:"兩兄弟的差別",
s:"摩訶迦羅與周利迦羅是商人兄弟，聽佛陀說法後一起出家。兄長在墓地修頭陀行，觀照無常，證阿羅漢；弟弟出家，卻想著把哥哥也帶回家。後來周利迦羅被前妻們邀去，被換回在家衣。隔天輪到摩訶迦羅的前妻們邀請，希望如法炮製，並請佛陀留下他「隨喜」。比丘們為此擔心。佛陀說：兩人不同，一個耽於享樂、懈怠，像弱樹；一個精進、信心堅固，像岩山。摩訶迦羅被圍住要脫袈裟時，騰空而去，落在佛陀足前。",
k:[{n:"7",h:["行見身淨，不攝諸根，","飲食不節，慢墮怯弱，","為邪所制，如風靡草；"],p:["Subhānupassiṃ viharantaṃ, indriyesu asaṃvutaṃ;","bhojanamhi cāmattaññuṃ, kusītaṃ hīnavīriyaṃ;","taṃ ve pasahati māro, vāto rukkhaṃva dubbalaṃ."],d:"只看事物美好的一面、不守護諸根、飲食不知節制、懈怠而缺乏精進的人，魔（煩惱）一定能制伏他，像大風吹倒弱樹。"},
{n:"8",h:["觀身不淨，能攝諸根，","食知節度，常樂精進，","不為邪動，如風大山。"],p:["Asubhānupassiṃ viharantaṃ, indriyesu susaṃvutaṃ;","bhojanamhi ca mattaññuṃ, saddhaṃ āraddhavīriyaṃ;","taṃ ve nappasahati māro, vāto selaṃva pabbataṃ."],d:"觀察身體不淨、守護諸根、飲食知量、有信心又精進的人，魔無法制伏，像風吹不動岩山。"}],
g:[["subha / asubha","淨、美好 / 不淨"],["indriya","根（感官）"],["matta-ññu","知量的人"],["Māra","魔，指煩惱"],["sela","岩石"]],
w:[["攝諸根","守護、收攝感官"],["靡","倒伏"],["邪","此處指煩惱、誘惑"]],
i:[["不淨觀是方法","觀身不淨是對治貪欲的修法，不是否定身體，而是看清貪著的虛妄。"],["兄弟對照","同樣出家，差別在於是否守護諸根、是否精進。"]],
x:"今天挑一個容易讓你分心的「入口」，例如手機，伸手前先覺察一下。",
q:{q:"兩兄弟一個像弱樹，一個像岩山，差別在哪？",o:[["年紀大小","與年紀無關。"],["有沒有守護諸根、精進修行","對。弱樹耽樂懈怠，岩山精進而信心堅固。",1],["財產多少","偈頌談的是修行態度。"]]}},
{t:"不相稱的袈裟",
s:"舍利弗與目犍連到王舍城，有人供養了一匹價值十萬的布，主辦人把布供養給常住當地的提婆達多。提婆達多立刻縫成袈裟，得意地穿著四處走。有比丘告訴佛陀，佛陀說這不是第一次：他前世是獵象人，偷了一件黃袈裟披在身上，裝成辟支佛，象群向他下跪，被他一頭頭殺害。象王發現後本想摔死他，看見袈裟而放過了他。",
k:[{n:"9",h:["不吐毒態，欲心馳騁，","未能自調，不應法衣；"],p:["Anikkasāvo kāsāvaṃ, yo vatthaṃ paridahissati;","apeto damasaccena, na so kāsāvamarahati."],d:"自己的染污未除，卻披上袈裟；缺乏調御與真實，便不配穿這件法衣。"},
{n:"10",h:["能吐毒態，戒意安靜，","降心已調，此應法衣。"],p:["Yo ca vantakasāvassa, sīlesu susamāhito;","upeto damasaccena, sa ve kāsāvamarahati."],d:"已吐盡染污、安住於戒、具足調御與真實的人，才真正配得這件袈裟。"}],
g:[["kasāva","染污；袈裟（雙關語）"],["dama","自我調御"],["sacca","真實"],["vantakasāva","已吐盡染污"]],
w:[["毒態","比喻煩惱的毒性"],["法衣","袈裟"]],
i:[["外衣與內心","袈裟只是外衣，真正的條件是戒與調御。偈頌用「染污（kasāva）」與「袈裟（kāsāva）」玩了一個近音雙關。"]],
x:"檢視今天一個外表與內心不一致的地方，不必責備，只是看見。",
q:{q:"偈頌說真正配得袈裟的條件是？",o:[["昂貴的布料","故事中的布雖貴，卻不相稱。"],["戒、調御與真實","對。",1],["年資高低","偈頌沒有以年資論。"]]}},
{t:"本質與非本質",
s:"舍利弗與目犍連（原名優波底沙、拘律陀）早年隨外道刪闍耶學道，不滿意而各自尋求。優波底沙遇見阿說示比丘，聽到「諸法因緣生」的偈而證初果；告訴拘律陀後，拘律陀也證初果。兩人邀刪闍耶同往見佛，他卻因身為師長的自尊而拒絕，說做佛陀的弟子，就像水壺變成水杯，又說智者去找喬達摩，愚者仍會來找我。兩人帶著二百五十位弟子歸佛。佛陀指出：刪闍耶的我慢，讓他把非本質當成本質。",
k:[{n:"11",h:["以真為偽、以偽為真，","是為邪計，不得真利；"],p:["Asāre sāramatino, sāre cāsāradassino;","te sāraṃ nādhigacchanti, micchāsaṅkappagocarā."],d:"把沒有本質的當作本質，把有本質的看成沒有本質，這些人落在邪思惟中，永遠得不到本質。"},
{n:"12",h:["知真為真、見偽知偽，","是為正計，必得真利。"],p:["Sārañca sārato ñatvā, asārañca asārato;","te sāraṃ adhigacchanti, sammāsaṅkappagocarā."],d:"知道本質是本質，非本質是非本質，這些人安住於正思惟，必能得到本質。"}],
g:[["sāra / asāra","本質、核心 / 非本質"],["micchā-saṅkappa","邪思惟"],["sammā-saṅkappa","正思惟"]],
w:[["邪計","錯誤的想法與判斷"],["真利","真正的利益"]],
i:[["正思惟","八正道裡的正見、正思惟，就是分辨什麼是本質、什麼不是。"],["我慢遮眼","故事裡刪闍耶並不是看不到真理，而是放不下身段。"]],
x:"今天分辨一件事：我在意的，是本質，還是面子？",
q:{q:"刪闍耶為何不肯跟隨弟子去見佛？",o:[["路途遙遠","故事的重點不在此。"],["身為老師的自尊與我慢","對。我慢讓他看不見真相。",1],["不知道佛陀是誰","兩位弟子已經告訴他了。"]]}},
{t:"漏雨的屋頂",
s:"佛陀回迦毗羅衛，在堂弟難陀的婚禮當天，把缽交給他便轉身離開，難陀只好捧著缽跟隨，新娘在後面喊他早點回來。難陀就這樣出了家，卻常想起新娘，不快樂。佛陀以神通讓他看到天上的天女，說只要努力修行便能得到。其他比丘笑他是為天女修行的雇工，他又羞又苦，獨自精進，終於證得阿羅漢。後來比丘們懷疑他的說法，佛陀說：他以前像漏雨的屋頂，現在像善蓋的屋子。",
k:[{n:"13",h:["蓋屋不密，天雨則漏，","意不惟行，淫泆為穿；"],p:["Yathā agāraṃ ducchannaṃ, vuṭṭhī samativijjhati;","evaṃ abhāvitaṃ cittaṃ, rāgo samativijjhati."],d:"屋頂蓋得不好，雨就會滲進來；同樣，沒有修習的心，貪欲就會滲進來。"},
{n:"14",h:["蓋屋善密，雨則不漏，","攝意惟行，淫泆不生。"],p:["Yathā agāraṃ suchannaṃ, vuṭṭhī na samativijjhati;","evaṃ subhāvitaṃ cittaṃ, rāgo na samativijjhati."],d:"屋頂蓋得好，雨就滲不進來；同樣，善加修習的心，貪欲便滲不進來。"}],
g:[["agāra","房屋"],["ducchanna / suchanna","屋頂差 / 屋頂好"],["abhāvita / subhāvita","未修習 / 善修習"],["rāga","貪欲"]],
w:[["淫泆","放縱的貪欲"],["攝意","收攝心念"],["惟行","思惟並實行"]],
i:[["修心如補屋頂","修習不是等雨來了才補，而是平日就把屋頂蓋好。止（安定）與觀（洞察）就是兩項工具。"]],
x:"每天固定幾分鐘靜坐或安靜呼吸，像是為心補屋頂。",
q:{q:"偈頌用屋頂比喻什麼？",o:[["住家的安全","這是比喻，不是談房子。"],["心有沒有修習，貪欲能不能滲入","對。",1],["天氣的變化","天氣只是比喻的一部分。"]]}},
{t:"屠夫的憂苦",
s:"王舍城附近有個屠豬人準提，五十五年來殺豬為業，從未做過一件善事。臨終前七天，他像豬一樣嚎叫，用手腳在地上爬行，彷彿已先受地獄的煎熬，死後墮入阿鼻地獄。佛陀因此說了這首偈。",
k:[{n:"15",h:["造憂後憂，行惡兩憂，","彼憂惟懼，見罪心懅；"],p:["Idha socati pecca socati, pāpakārī ubhayattha socati;","so socati so vihaññati, disvā kammakiliṭṭhamattano."],d:"作惡的人今生憂愁，來世也憂愁；他看見自己污濁的行為，便憂愁、苦惱。"}],
g:[["socati","憂愁、悲傷"],["pecca","死後、來世"],["kammakiliṭṭha","行為污濁"],["vihaññati","苦惱、受折磨"]],
w:[["懅","畏懼不安"]],
i:[["此世與來世","偈頌說果報不只在死後，面對自己行為時內心的不安，本身就已是苦。"]],
x:"今天睡前回想：有哪件事做完讓自己不安？下次想怎麼做不同？",
q:{q:"偈頌認為作惡者的憂苦何時開始？",o:[["只有死後","偈頌說「此世、彼世皆憂」。"],["今生看見自己行為時就開始","對。"  ,1],["只有被發現才會","偈頌談的是自己的內心。"]]}},
{t:"歡喜的在家弟子",
s:"舍衛城的達摩迦居士持戒樂施，是五百位在家弟子的領袖，七子七女也都樂善好施。他臨終時請僧團到床邊誦經，誦到《大念處經》時，六座天界的天車前來迎接。他請他們等一下，免得打斷誦經；比丘們誤以為他要他們停下，便離開了。他告訴孩子們天車的事，選了兜率天的車，請孩子把花環拋上去，隨即命終，生到兜率天。",
k:[{n:"16",h:["造喜後喜，行善兩喜，","彼喜惟歡，見福心安；"],p:["Idha modati pecca modati, katapuñño ubhayattha modati;","so modati so pamodati, disvā kammavisuddhimattano."],d:"行善的人今生歡喜，來世也歡喜；他看見自己行為清淨，便歡喜、更加歡喜。"}],
g:[["modati","歡喜"],["katapuñña","作過福德的人"],["kammavisuddhi","行為的清淨"],["pamodati","更加歡喜"]],
w:[["見福心安","看見自己的善行，內心安穩"]],
i:[["與上一偈對照","第 15 偈是「憂」，這一偈是「喜」。同一個結構，只因為所作的行為不同。"]],
x:"今天做一件小善事，事後留意心的感受。",
q:{q:"達摩迦的歡喜來自哪裡？",o:[["財富與名聲","偈頌談的是行為的清淨。"],["看見自己行為清淨而心安","對。",1],["他人的稱讚","偈頌談的是內在的喜悅。"]]}},
{t:"提婆達多的悔恨",
s:"提婆達多見佛陀受人敬重，起了嫉妒，想取代佛陀領導僧團，被拒絕後懷恨，三度想害佛陀：派弓箭手、從山上推落大石、放醉象，都沒成功；又設法分裂僧團，但舍利弗與目犍連把多數比丘帶回。後來他重病，要被抬去見佛，到祇園水池邊，腳一落地便陷入地中，被大地吞沒，死後墮入阿鼻地獄。",
k:[{n:"17",h:["今悔後悔，為惡兩悔，","厥為自殃，受罪熱惱；"],p:["Idha tappati pecca tappati, pāpakārī ubhayattha tappati;","“pāpaṃ me kata”nti tappati, bhiyyo tappati duggatiṃ gato."],d:"作惡的人今生灼惱，來世也灼惱；他悔恨「我造了惡」而灼惱，墮入惡趣後灼惱更甚。"}],
g:[["tappati","灼惱、悔恨"],["pāpa","惡"],["duggati","惡趣"],["bhiyyo","更加"]],
w:[["厥為自殃","這是自己招來的災殃"],["熱惱","如火灼燒般的苦惱"]],
i:[["嫉妒的代價","故事裡的苦，起點是嫉妒與野心；偈頌把重點放在作惡者內心的懊悔。"]],
x:"今天若起了嫉妒，先看見它，不要讓它推著你做事。",
q:{q:"偈頌說作惡者最後的感受是？",o:[["得意","偈頌說的是灼惱與悔恨。"],["悔恨，而且更甚","對。",1],["毫無感覺","偈頌說是灼惱。"]]}},
{t:"蘇摩那的歡喜",
s:"給孤獨長者的幼女蘇摩那，與兩位姊姊一樣常護持供僧；兩位姊姊聽法證初果，蘇摩那更證得斯陀含。她重病臨終時叫父親來，稱他「小弟弟」後便去世。長者以為女兒神智不清，憂愁地請教佛陀。佛陀說她神智清明，之所以稱父親為弟弟，是因為她的證悟高於父親（父親是初果）；她已生到兜率天。佛陀因此說了這首偈。",
k:[{n:"18",h:["今歡後歡，為善兩歡，","厥為自祐，受福悅豫。"],p:["Idha nandati pecca nandati, katapuñño ubhayattha nandati;","“puññaṃ me kata”nti nandati, bhiyyo nandati suggatiṃ gato."],d:"行善的人今生喜樂，來世也喜樂；他想著「我做了福德」而喜樂，生到善趣後更加喜樂。"}],
g:[["nandati","喜樂"],["puñña","福德、善業"],["suggati","善趣"],["bhiyyo","更加"]],

{t:"多聞與實踐",
s:"舍衛城兩位出身高貴的比丘是朋友：一位精通三藏，教導數百比丘；另一位專修觀禪，證得阿羅漢。有一次兩人在祇園相遇，學問比丘不知對方已證阿羅漢，輕視他，還想發問讓他難堪。佛陀為了保護他們，親自提問禪定與道的問題，學者答不出，修行者全部答出。佛陀稱讚實修者，沒有稱讚學者。弟子們不解，佛陀以牧牛人比喻：學者像替人數牛的牧人，實修者才是享用牛乳的主人。",

{t:"舍摩婆帝的不放逸",
s:"憍賞彌的優填王有兩位王后：舍摩婆帝與摩犍提耶。舍摩婆帝的侍女屈屈多羅聽佛陀說法證初果，回宮轉述，王后與五百侍女也都證初果。摩犍提耶因父母求婚被佛陀婉拒而懷恨，屢次陷害：誣指她們私通外人，又在琵琶裡藏蛇，說王后要害王。王拉弓射向她們，她們心中只有慈心，沒有恨意，箭竟折返。最後摩犍提耶使人放火燒宮，舍摩婆帝與五百侍女在火中持續禪修，有人證斯陀含，有人證阿那含。佛陀說：不放逸的人不死，放逸的人雖活如死。",
k:[{n:"21",h:["戒為甘露道，放逸為死徑，","不貪則不死，失道為自喪；"],p:["Appamādo amatapadaṃ, pamādo maccuno padaṃ;","appamattā na mīyanti, ye pamattā yathā matā."],d:"不放逸是通往不死的路，放逸是通往死亡的路。不放逸的人不死，放逸的人如同已死。"},
{n:"22",h:["慧智守道勝，終不為放逸，","不貪致歡喜，從是得道樂。"],p:["Evaṃ visesato ñatvā, appamādamhi paṇḍitā;","appamāde pamodanti, ariyānaṃ gocare ratā."],d:"智者清楚明白這一點，便樂於不放逸，喜悅於聖者的境界。"},

{t:"隱姓的富家子",
s:"王舍城流行瘟疫，長者夫婦病重，叫兒子鳩槃吉離開，並告訴他埋有四十億財寶。他在森林住了十二年，回城時已無人認得。他知道寶藏還在，卻想到現在挖出來，可能被懷疑、沒收，便穿舊衣替人做事，負責清晨叫大家起床。頻婆娑羅王聽到他的聲音，說這是大富之人的聲音。王的侍女前往查訪，最後他在國王面前說出真相，寶藏取回，國王任命他為長者並嫁女給他。他聽佛陀說法，證得初果。",

{t:"愚鈍的周利槃特",
s:"長者有兩個孫子，哥哥摩訶槃特後來證阿羅漢；弟弟周利槃特也出家，卻因前世嘲笑過愚鈍的比丘，今生十分遲鈍，四個月背不起一首偈。哥哥說他不配留在僧團，不再安排他去應供。他失望想還俗，佛陀帶他坐在香室前，給他一塊乾淨的白布，叫他一面搓一面念「除垢」。布漸漸髒了，他領悟一切有為法無常；佛陀以光明現前告訴他：塵垢不只在布上，也在心中，是貪、瞋、癡。他繼續修行，不久證阿羅漢。",

{t:"火中的領悟",
s:"一位比丘向佛陀求得禪修題目，到森林修行，卻進展很少，沮喪地返回祇園。途中遇見大火，他跑上山頂觀看，想到：就像這場火燒盡一切，聖道的智慧也會燒盡一切大小的束縛。佛陀在香室看見，現出光明對他說：你的想法是對的，繼續下去。比丘當下證得阿羅漢。",

{t:"知足的提舍",
s:"提舍出身舍衛城附近的小市鎮，出家後生活簡樸，托缽只回親戚所在的村子，大型供養（如給孤獨長者、波斯匿王的供養）也不參加。有比丘批評他。佛陀召問，他如實說明只是為了得食，夠了就不再去，也不計較食物好壞。佛陀反而稱讚他，說少欲知足正是佛與聖者的作風，又說起鸚鵡王的故事：樹上果實吃完，其他鸚鵡都離去，只有鸚鵡王為報答這棵樹，寧可靠剩下的嫩葉樹皮維生；帝釋考驗後，使枯樹重新結實。後來提舍證阿羅漢。",

{t:"聽我說：諸行無常",sl:"背景",
s:"這一品是整部經的開篇。第一偈先請聽眾放下睡意，歡喜聽法。第二偈點出主題：一切造作的事物都在生滅，生了就會滅，這些生滅止息，才是安樂。傳統上，這偈也連著佛陀般涅槃的場景：據《大般涅槃經》，佛陀圓寂時，帝釋天唱誦的正是這首偈。",
k:[{n:"1",pl:"梵文（Udānavarga 1.1）",h:["睡眠解寤，宜歡喜思，","聽我所說，撰記佛言。"],p:["stīnamiddhaṃ vinodyeha sampraharṣya ca mānasam;","śṛṇutemaṃ pravakṣyāmi udānaṃ jina bhāṣitam."],d:"驅散昏沉睡意，讓心歡喜，請聽我說：這是佛所說的自說偈，我把它記錄下來。"},
{n:"2",pl:"梵文（Udānavarga 1.3）",h:["所行非常，謂興衰法，","夫生輙死，此滅為樂。"],p:["anityā bata saṃskārā utpādavyaya dharmiṇaḥ;","utpadya hi nirudhyante teṣāṃ vyupaśamaḥ sukham."],d:"一切造作的事物都不恆常，有生有滅；生起了就會消失，這些生滅的止息，就是安樂。"}],

{t:"陶器與河流",sl:"譬喻",
s:"這兩偈用兩個畫面說明無常。陶匠用泥土做出的器皿，遲早都會破碎，人的生命也是如此；山上奔下的河水，流過就不再回頭，逝去的生命也不會回來。",
k:[{n:"3",pl:"梵文（Udānavarga 1.12）",h:["譬如陶家，埏埴作器，","一切要壞；人命亦然。"],p:["yathāpi kumbhakāreṇa mṛttikā bhājanaṃ kṛtam;","sarvaṃ bhedana paryantam evaṃ martyasya jīvitam."],d:"就像陶匠用泥土做成器皿，最終都會破碎；人的生命也是這樣。"},
{n:"4",pl:"梵文（Udānavarga 1.15）",h:["如河駛流，往而不返；","人命如是，逝者不還。"],p:["yathā nadī pārvatīyā gacchate na nivartate;","evaṃ āyur manuṣyāṇāṃ gacchate na nivartate."],d:"像山中急流的河水，奔去就不回頭；人的壽命也是這樣，過去的不會回來。"}],

{t:"牧牛人的杖",sl:"譬喻與出處",

{t:"積聚與流逝",sl:"譬喻",

{t:"高必墜，業隨身",sl:"譬喻",
s:"第八偈：存在的都會耗盡，高聳的都會墜落，相聚的都有分離，出生的都會死亡。第九偈：眾生互相爭奪傷害，喪失了生命，之後依自己的行為墮向何處，自己承受福或禍。",
k:[{n:"8",pl:"梵文（Udānavarga 1.22）",h:["常者皆盡，高者亦墮，","合會有離，生者有死。"],p:["sarve kṣayāntā nicayāḥ patanāntāḥ samucchrayāḥ;","saṃyogā viprayogāntā maraṇāntaṃ hi jīvitam."],d:"一切積聚以耗盡為終，一切高升以墜落為終，一切會合以分離為終，一切生命以死亡為終。"},
{n:"9",pl:"梵文（Udānavarga 1.23）",h:["眾生相剋，以喪其命，","隨行所墮，自受殃福。"],hm:"吳譯多了「眾生相剋」一句，梵文本沒有這句；對照為編者依相近內容比對。",p:["sarve sattvā mariṣyanti maraṇāntaṃ hi jīvitam;","yathā karma gamiṣyanti puṇya pāpa phala upagāḥ."],d:"一切眾生都將死去；他們依各自的業而去，隨福或惡的果報而行。"}],

{t:"老的光景",sl:"譬喻",
s:"第十偈：老來看見病痛，死時意識離去，卻仍貪戀家宅，像被關在牢裡。第十一偈直接嘆息：哎，老來了，容貌變得衰老；年輕時隨心所欲，老了卻被踐踏。",
k:[{n:"10",pl:"梵文（Udānavarga 1.27）",h:["老見苦痛，死則意去，","樂家縛獄，貪世不斷。"],p:["jīrṇaṃ ca dṛṣṭveha tathaiva rogiṇaṃ mṛtaṃ ca dṛṣṭvā vyapayāta cetasam;","jahau sa dhīro gṛha bandhanāni kāmā hi lokasya na supraheyāḥ."],d:"看見衰老、疾病與死亡，智者的心便捨離，放下家的束縛；而世間人卻難以斷除貪欲。"},

{t:"百歲也是過客",sl:"譬喻",
s:"第十二偈：即使活到一百歲，終點仍是死亡，老與病隨時會來。第十三偈：每過一天，壽命就少一天，像水漸漸變少的池裡的魚，還有什麼快樂可說？",
k:[{n:"12",pl:"梵文（Udānavarga 1.30）",h:["雖壽百歲，亦死過去，","為老所厭，病條至際。"],p:["yo 'pi varṣa śataṃ jīvet so 'pi mṛtyu parāyaṇaḥ;","anu hy enaṃ jarā hanti vyādhir vā yadi vāntakaḥ."],d:"縱使活到百歲，也以死亡為歸宿；老，或病，或死，會跟著來擊倒他。"},
{n:"13",pl:"梵文（Udānavarga 1.33）",h:["是日已過，命則隨減，","如少水魚，斯有何樂？"],p:["yeṣāṃ rātri divāpāye hy āyur alpataraṃ bhavet;","alpodake va matsyānāṃ kā nu teṣāṃ ratir bhavet."],d:"日夜過去，壽命越來越少；像少水中的魚，哪裡還有快樂？"}],

{t:"這個身體",sl:"故事",
s:"第十四偈：人老了，容貌衰退，疾病損壞身體，形體腐朽，生命終將結束。第十五偈：這個身體有什麼用？常常流出污穢，被疾病所困，還有老死之憂。巴利第 148 偈有相同的偈，註釋說是對一位一百二十歲的優多羅比丘尼說的：她連續三天托缽，食物都被缺少顧慮的比丘取走，沒得吃；第四天在窄路上遇見佛陀，恭敬地讓路。佛陀說了這首偈，她聽完證得初果。",
k:[{n:"14",pl:"巴利（Dhp 148）",h:["老則色衰，所病自壞，","形敗腐朽，命終自然。"],p:["Parijiṇṇamidaṃ rūpaṃ, roganīḍaṃ pabhaṅguraṃ;","bhijjati pūtisandeho, maraṇantañhi jīvitaṃ."],d:"這衰老的身體，是疾病的巢窩，容易壞散；這腐臭的軀體終將破碎，生命必以死亡為終點。"},
{n:"15",pl:"梵文（Udānavarga 1.36）",h:["是身何用？恒漏臭處，","為病所困，有老死患。"],p:["kim anena śarīreṇa sravatā pūtinā sadā;","nityaṃ rogābhibhūtena jarā maraṇa bhīruṇā."],d:"這個身體有什麼用？常流出污穢，常被疾病壓迫，還有老死的恐懼。"}],

{t:"孩子也救不了",sl:"故事",

{t:"該做的事與出路",sl:"譬喻",

k:[{n:"20",pl:"梵文（Udānavarga 1.41）",h:["是務是吾作，當作令致是，","人為此躁擾，履踐老死憂。"],p:["idaṃ kṛtaṃ me kartavyam idaṃ kṛtvā bhaviṣyati;","ity evaṃ spandato martyān jarā mṛtyuś ca mardati."],d:"「這個我已做了，這個我該做；做完這個，會怎樣？」人這樣忙亂不停，老與死便碾壓他。"},
{n:"21",pl:"梵文（Udānavarga 1.42）",h:["知此能自淨，如是見生盡，","比丘厭魔兵，從生死得度。"],p:["tasmāt sadā dhyāna ratāḥ samāhitā hy ātāpino jāti jarānta darśinaḥ;","māraṃ sasainyaṃ hy abhibhūya bhikṣavo bhaveta jātī maraṇasya pāragāḥ."],d:"所以常樂於禪思、心安定、精勤，看見生與老的盡頭；制伏魔與魔軍，比丘便能渡到生死的彼岸。"}],

var FULL={"0":{"n":"法句經序","p":["曇鉢偈者，眾經之要義；曇之言法，鉢者句也。而《法句經》別有數部，有九百偈，或七百偈及五百偈。偈者，結語，猶詩頌也；是佛見事而作，非一時言，各有本末，布在諸經。佛一切智，厥性大仁，愍傷天下，出興于世，開顯道義。所以解人，凡十二部經，總括其要，別為數部。四部阿含，佛去世後阿難所傳，卷無大小，皆稱聞如是，處佛所在，究暢其說。是後五部沙門各自鈔眾經中四句、六句之偈，比次其義條別為品，於十二部經靡不斟酌，無所適名，故曰法句。諸經為法言，法句者，由法言也。近世葛氏傳七百偈，偈義致深，譯人出之頗使其渾。惟佛難值，其文難聞，又諸佛興皆在天竺，天竺言語與漢異音，云其書為天書、語為天語，名物不同，傳實不易。","唯昔藍調安侯世高、都尉佛調，譯梵為秦，實得其體，斯已難繼。後之傳者，雖不能密，猶常貴其寶，粗得大趣。","始者維祇難，出自天竺，以黃武三年來適武昌，僕從受此五百偈本，請其同道竺將焰為譯。將焰雖善天竺語，未備曉漢，其所傳言，或得梵語、或以義出音迎，質真樸。初謙其為辭不雅，維祇難曰：「佛言：『依其義不用飾、取其法不以嚴。』其傳經者令易曉，勿失厥義，是則為善。」坐中咸曰：「老氏稱：『美言不信、信言不美。』仲尼亦云：『書不盡言、言不盡意。』明聖人意深邃無極，今傳梵義，實宜經達。」是以自偈受譯人口，因修本旨不加文飾，譯所不解則闕不傳，故有脫失多不出者。然此雖辭朴而旨深，文約而義博，事鈎眾經，章有本句、有義說。其在天竺，始進業者不學《法句》，謂之越敘。此乃始進者之洪漸、深入者之奧藏也，可以啟曚、辯惑、誘人自立，學之功微而所苞者廣，寔可謂妙要也哉。","昔傳此時，有所不解，會將焰來，更從諮問。受此偈輩，復得十三品，并校往古，有所增定，第其品目合為一部三十九篇，大凡偈七百五十二章，庶有補益，共廣問焉。"]},"1":{"n":"無常品","s":"無常品者，寤欲昏亂，榮命難保，唯道是真。","t":["睡眠解寤，|宜歡喜思，|聽我所說，|撰記佛言。","所行非常，|謂興衰法，|夫生輙死，|此滅為樂。","譬如陶家，|埏埴作器，|一切要壞；","人命亦然。","如河駛流，|往而不返；","人命如是，|逝者不還。","譬人操杖，|行牧食牛；","老死猶然，|亦養命去。","千百非一，|族姓男女，|貯聚財產，|無不衰喪。","生者日夜，|命自攻削，|壽之消盡，|如𢄋䨍水。","常者皆盡，|高者亦墮，|合會有離，|生者有死。","眾生相剋，|以喪其命，|隨行所墮，|自受殃福。","老見苦痛，|死則意去；","樂家縛獄，|貪世不斷。","咄嗟老至，|色變作耄；","少時如意，|老見蹈藉。","雖壽百歲，|亦死過去；","為老所厭，|病條至際。","是日已過，|命則隨減，|如少水魚，|斯有何樂？","老則色衰，|所病自壞，|形敗腐朽，|命終自然。","是身何用？|恒漏臭處，|為病所困，|有老死患。","嗜欲自恣，|非法是增，|不見聞變，|壽命無常。","非有子恃，|亦非父兄，|為死所迫，|無親可怙。","晝夜慢惰，|老不止婬，|有財不施，|不受佛言。","有此四弊，|為自侵欺。","非空非海中，|非入山石間，|無有地方所，|脫之不受死。","是務是吾作，|當作令致是，|人為此𮜒擾，|履踐老死憂。","知此能自淨，|如是見生盡，|比丘厭魔兵，|從生死得度。"]},"2":{"n":"教學品","s":"教學品者，導以所行，釋己愚闇，得見道明。","t":["咄哉！何為寐？|螉螺蜯蠧類，|隱弊以不淨，|迷惑計為身。","焉有被斫創，|心如嬰疾痛，|遘于眾厄難，|而反為用眠？","思而不放逸，|為仁學仁迹，|從是無有憂，|常念自滅意。","正見學務增，|是為世間明，|所生福千倍，|終不墮惡道。","莫學小道，|以信邪見，|莫習放蕩，|令增欲意；","善修法行，|學誦莫犯，|行道無憂，|世世常安。","慜學攝身，|常慎思言，|是到不死，|行滅得安。","非務勿學，|是務宜行，|已知可念，|則漏得滅。","見法利身，|夫到善方，|知利健行，|是謂賢明。","起覺義者，|學滅以固，|着滅自恣，|損而不興。","是向以強，|是學得中，|從是解義，|宜憶念行。","學先斷母，|率君二臣，|廢諸營從，|是上道人。","學無朋類，|不得善友，|寧獨守善，|不與愚偕。","樂戒學行，|奚用伴為？|獨善無憂，|如空野象。","戒聞俱善，|二者孰賢？|方戒稱聞，|宜諦學行。","學先護戒，|開閉必固，|施而無受，|仂行勿臥。","若人壽百歲，|邪學志不善，|不如生一日，|精進受正法。","若人壽百歲，|奉火修異術，|不如須臾頃，|事戒者福稱。","能行說之可，|不能勿空語，|虛偽無誠信，|智者所屏棄。","學當先求解，|觀察別是非，|受諦應誨彼，|慧然不復惑。","被髮學邪道，|草衣內貪濁，|曚曚不識真，|如聾聽五音。","學能捨三惡，|以藥消眾毒，|健夫度生死，|如蛇脫故皮。","學而多聞、|持戒不失，|兩世見譽，|所願者得；","學而寡聞、|持戒不完，|兩世受痛，|喪其本願。","夫學有二：|常親多聞、|安諦解義，|雖困不邪。","稊稗害禾，|多欲妨學，|耘除眾惡，|成收必多。","慮而後言，|辭不強梁，|法說義說，|言而莫違。","善學無犯，|畏法曉忌，|見微知者，|誡無後患。","遠捨罪福，|務成梵行，|終身自攝，|是名善學。"]},"3":{"n":"多聞品","s":"多聞品者，亦勸聞學，積聞成聖，自致正覺。","t":["多聞能持固，|奉法為垣牆，|精進難踰毀，|從是戒慧成；","多聞令志明，|已明智慧增，|智則博解義，|見義行法安；","多聞能除憂，|能以定為歡，|善說甘露法，|自致得泥洹。","聞為知法律，|解疑亦見正，|從聞捨非法，|行到不死處。","為能師現道，|解疑令學明，|亦興清淨本，|能奉持法藏。","能攝為解義，|解則義不穿，|受法猗法者，|從是疾得安。","若多少有聞，|自大以憍人，|是如盲執燭，|炤彼不自明。","夫求爵位財，|尊貴升天福，|辯慧世間悍，|斯聞為第一。","帝王聘禮聞，|天上天亦然，|聞為第一藏，|最富旅力強。","智者為聞屈，|好道者亦樂，|王者盡心事，|雖釋梵亦然。","仙人常敬聞，|況貴巨富人？|是以慧為貴，|可禮無過是。","事日為明故，|事父為恩故，|事君以力故，|聞故事道人。","人為命事醫，|欲勝依豪強，|法在智慧處，|福行世世明。","察友在為謀，|別伴在急時；","觀妻在房樂，|欲知智在說。","聞為今世利，|妻子、昆弟、友，|亦致後世福，|積聞成聖智。","是能散憂恚，|亦除不祥衰，|欲得安隱吉，|當事多聞者。","斫創無過憂，|射箭無過愚，|是壯莫能拔，|唯從多聞除。","盲從是得眼，|闇者從得燭，|亦導世間人，|如目將無目。","是故可捨癡，|離慢豪富樂，|務學事聞者，|是名積聚德。"]},"4":{"n":"篤信品","s":"篤信品者，立道之根，果於因正見，行不回顧。","t":["信慚戒意財，|是法雅士譽，|斯道明智說，|如是昇天世。","愚不修天行，|亦不譽布施，|信施助善者，|從是到彼安。","信者真人長，|念法所住安；","近者意得上，|智壽壽中賢。","信能得道，|法致滅度，|從聞得智，|所到有明；","信能度淵，|攝為船師，|精進除苦，|慧到彼岸。","士有信行，|為聖所譽，|樂無為者，|一切縛解。","信之與戒，|慧意能行，|健夫度恚，|從是脫淵。","信使戒誠，|亦受智慧，|在在能行、|處處見養。","比方世利，|慧信為明，|是財上寶，|家產非常。","欲見諸真，|樂聽講法，|能捨慳垢，|此之為信。","信能度河，|其福難奪，|能禁止盜，|野沙門樂。","無信不習，|好剝正言，|如拙取水，|掘泉揚泥。","賢夫習智，|樂仰清流，|如善取水，|思令不擾。","信不染他，|唯賢與人，|可好則學、|非好則遠。","信為我輿，|莫知斯載，|如大象調，|自調最勝。","信財、戒財，|慚、愧亦財，|聞財、施財、|慧為七財。","從信守戒，|常淨觀法，|慧而利行，|奉敬不忘。","生有此財，|不問男女，|終以不貧，|賢者識真。"]},"5":{"n":"戒慎品","s":"戒慎品者，授與善道，禁制邪非，後無所悔也。","t":["人而常清，|奉律至終，|淨修善行，|如是戒成。","慧人護戒，|福致三寶，|名聞得利，|後上天樂。","常見法處，|護戒為明，|得成真見，|輩中吉祥。","持戒者安，|令身無惱，|夜臥恬淡，|寤則常歡。","修戒、布施，|作福為福，|從是適彼，|常到安處。","何終為善？|何善安止？|何為人寶？|何盜不取？","戒終老安，|戒善安止，|慧為人寶，|福盜不取。","比丘立戒，|守攝諸根，|食知自節，|悟意令應。","以戒降心，|守意正定，|內學正觀，|無忘正智。","明哲守戒，|內思正智，|行道如應，|自清除苦。","蠲除諸垢，|盡慢勿生，|終身求法，|勿暫離聖。","戒、定、慧解，|是當善惟，|都已離垢，|無禍除有。","着解則度，|餘不復生，|越諸魔界，|如日清明。","狂惑自恣，|已常外避，|戒、定、慧行，|求滿勿離。","持戒清淨，|心不自恣，|正智已解，|不覩邪部。","是往吉處，|為無上道，|亦捨非道，|離諸魔界。"]},"6":{"n":"惟念品","s":"惟念品者，守微之始，內思安般，必解道紀。","t":["出息、入息念，|具滿諦思惟，|從初竟通利，|安如佛所說。","是則炤世間，|如雲解月現，|起止學思惟，|坐臥不廢忘。","比丘立是念，|前利後則勝，|始得終必勝，|逝不覩生死。","若見身所住，|六更以為最，|比丘常一心，|便自知泥洹。","已有是諸念，|自身常建行，|若其不如是，|終不得意行。","是隨本行者，|如是度愛勞，|若能悟意念，|知解一心樂。","應時等行法，|是度老死惱，|比丘悟意行，|當令應是念。","諸念生死棄，|為能作苦際，|常當聽微妙，|自覺悟其意。","能覺者為賢，|終始無所會，|以覺意能應，|日夜務學行，|當解甘露要，|令諸漏得盡。","夫人得善利，|乃來自歸佛，|是故當晝夜，|常念佛法眾。","己知自覺意，|是為佛弟子，|常當晝夜念，|佛與法及僧。","念身、念非常、|念戒、布施德，|空、不願、無相，|晝夜當念是。"]},"7":{"n":"慈仁品","s":"慈仁品者，是謂大人、聖人所履，德普無量。","t":["為仁不殺，|常能攝身，|是處不死，|所適無患；","不殺為仁，|慎言守心，|是處不死，|所適無患。","彼亂已整，|守以慈仁，|見怒能忍，|是為梵行；","至誠安徐，|口無麤言，|不瞋彼所，|是謂梵行；","垂拱無為，|不害眾生，|無所嬈惱，|是應梵行。","常以慈哀，|淨如佛教，|知足、知止，|是度生死。","少欲好學，|不惑於利，|仁而不犯，|世上所稱。","仁壽無犯，|不興變快，|人為諍擾，|慧以默安。","普憂賢友，|哀加眾生，|常行慈心，|所適者安。","仁儒不邪，|安止無憂，|上天衛之；","智者樂慈，|晝夜念慈，|心無尅伐，|不害眾生。","是行無仇，|不慈則殺，|違戒言妄，|過不與他。","不觀眾生，|酒致失志，|為放逸行，|後墮惡道。","無誠不真，|履仁行慈，|博愛濟眾，|有十一譽：|福常隨身、|臥安、覺安、|不見惡夢、|天護、人愛、|不毒、不兵、|水火不喪、|在所得利、|死昇梵天，|是為十一。","若念慈心，|無量不廢，|生死漸薄，|得利度世。","仁無亂志，|慈最可行，|愍傷眾生，|此福無量。","假令盡壽命，|懃事天下人，|象馬以祠天，|不如行一慈。"]},"8":{"n":"言語品","s":"言語品者，所以戒口，發說、談論當用道理。","t":["惡言罵詈，|憍陵蔑人，|興起是行，|疾怨滋生；","遜言順辭，|尊敬於人，|棄結忍惡，|疾怨自滅。","夫士之生，|斧在口中，|所以斬身，|由其惡言。","諍為少利，|如掩失財，|從彼致諍，|令意向惡。","譽惡、惡所譽，|是二俱為惡，|好以口儈鬪，|是後皆無安。","無道墮惡道，|自增地獄苦，|遠愚修忍意，|念諦則無犯。","從善得解脫，|為惡不得解，|善解者為賢，|是為脫惡惱。","解自挹損意，|不躁言得中，|義說如法說，|是言柔軟甘。","是以言語者，|必使己無患，|亦不尅眾人，|是為能善言。","言使投意可，|亦令得歡喜，|不使至惡意，|出言眾悉可。","至誠甘露說，|如法而無過，|諦如義、如法，|是為近道立。","說如佛言者，|是吉得滅度，|為能作浩際，|是謂言中上。"]},"9":{"n":"雙要品","s":"雙要品者，兩兩相明，善惡有對，舉義不單。","t":["心為法本，|心尊心使，|中心念惡，|即言即行，|罪苦自追，|車轢于轍；","心為法本，|心尊心使，|中心念善，|即言即行，|福樂自追，|如影隨形。","隨亂意行，|拘愚入冥，|自大無法，|何解善言？","隨正意行，|開解清明，|不為妬嫉，|敏達善言。","慍於怨者，|未甞無怨；","不慍自除，|是道可宗。","不好責彼，|務自省身，|如有知此，|永滅無患。","行見身淨，|不攝諸根，|飲食不節，|慢墮怯弱，|為邪所制，|如風靡草；","觀身不淨，|能攝諸根，|食知節度，|常樂精進，|不為邪動，|如風大山。","不吐毒態，|欲心馳騁，|未能自調，|不應法衣；","能吐毒態，|戒意安靜，|降心已調，|此應法衣。","以真為偽、|以偽為真，|是為邪計，|不得真利；","知真為真、|見偽知偽，|是為正計，|必得真利。","蓋屋不密，|天雨則漏，|意不惟行，|淫泆為穿；","蓋屋善密，|雨則不漏，|攝意惟行，|淫泆不生。","鄙夫染人，|如近臭物，|漸迷習非，|不覺成惡；","賢夫染人，|如近香熏，|進智習善，|行成潔芳。","造憂後憂，|行惡兩憂，|彼憂惟懼，|見罪心懅；","造喜後喜，|行善兩喜，|彼喜惟歡，|見福心安；","今悔後悔，|為惡兩悔，|厥為自殃，|受罪熱惱；","今歡後歡，|為善兩歡，|厥為自祐，|受福悅豫。","巧言多求，|放蕩無戒，|懷婬怒癡，|不惟止觀，|聚如群牛，|非佛弟子；","時言少求，|行道如法，|除婬怒癡，|覺正意解，|見對不起，|是佛弟子。"]},"10":{"n":"放逸品","s":"放逸品者，引律戒情，防邪撿失，以道勸賢。","t":["戒為甘露道，|放逸為死徑，|不貪則不死，|失道為自喪；","慧智守道勝，|終不為放逸，|不貪致歡喜，|從是得道樂。","常當惟念道，|自強守正行，|健者得度世，|吉祥無有上。","正念常興起，|行淨惡易滅，|自制以法壽，|不犯善名增。","發行不放逸，|約以自調心，|慧能作定明，|不返冥淵中。","愚人意難解，|貪亂好諍訟，|上智常重慎，|護斯為寶尊。","莫貪、莫好諍、|亦莫嗜欲樂，|思心不放逸，|可以獲大安。","放逸如自禁，|能却之為賢，|已昇智慧閣，|去危為即安。","明智觀於愚，|譬如山與地，|居亂而身正，|彼為獨覺悟，|是力過師子，|棄惡為大智。","睡眠重若山，|癡冥為所弊，|安臥不計苦，|是以常受胎。","不為時自恣，|能制漏得盡，|自恣魔得便，|如師子搏鹿。","能不自恣者，|是為戒比丘，|彼思正淨者，|常當自護心。","比丘謹慎樂，|放逸多憂𠎝，|變諍小致大，|積惡入火焰。","守戒福致善，|犯戒有懼心，|能斷三界漏，|此乃近泥洹。","若前放逸，|後能自禁，|是炤世間，|念定其宜；","過失為惡，|追覆以善，|是炤世間，|念善其宜；","少壯捨家，|盛修佛教，|是炤世間，|如月雲消；","人前為惡，|後止不犯，|是炤世間，|如月雲消。","生不施惱、|死而不慼，|是見道悍，|應中勿憂。","斷濁黑法，|學惟清白，|度淵不反，|棄猗行止，|不復染樂，|欲斷無憂。"]},"11":{"n":"心意品","s":"心意品者，說意精神雖空無形，造作無竭。","t":["意使作㺃，|難護、難禁，|慧正其本，|其明乃大。","輕躁難持，|唯欲是從，|制意為善，|自調則寧。","意微難見，|隨欲而行，|慧常自護，|能守即安。","獨行遠逝，|覆藏無形，|損意近道，|魔繫乃解。","心無住息，|亦不知法，|迷於世事，|無有正智。","念無適止，|不絕無邊，|福能遏惡，|覺者為賢。","佛說心法，|雖微非真，|當覺逸意，|莫隨放心。","見法最安，|所願得成，|慧護微意，|斷苦因緣。","有身不久，|皆當歸土，|形壞神去，|寄住何貪？","心豫造處，|往來無端，|念多邪僻，|自為招惡。","是意自造，|非父母為，|可勉向正，|為福勿回。","藏六如龜，|防意如城，|慧與魔戰，|勝則無患。"]},"12":{"n":"華香品","s":"華香品者，明學當行，因華見實，使偽反真。","t":["孰能擇地，|捨鑑取天？|誰說法句，|如擇善華？","學者擇地，|捨鑑取天；","善說法句，|能採德華。","知世坏喻，|幻法忽有，|斷魔華敷，|不覩生死；","見身如沫，|幻法自然，|斷魔華敷，|不覩生死。","身病則萎，|若華零落；","死命來至，|如水湍驟。","貪欲無厭，|消散人念，|邪致之財，|為自侵欺。","如蜂集華，|不嬈色香，|但取味去，|仁入聚然。","不務觀彼，|作與不作，|常自省身，|知正不正。","如可意華，|色好無香，|工語如是，|不行無得；","如可意華，|色美且香，|工語有行，|必得其福。","多作寶花，|結步搖綺，|廣積德者，|所生轉好。","奇草芳花，|不逆風熏，|近道敷開，|德人逼香。","旃檀多香，|青蓮芳花，|雖曰是真，|不如戒香。","華香氣微，|不可謂真，|持戒之香，|到天殊勝。","戒具成就，|行無放逸，|定意度脫，|長離魔道。","如作田溝，|近于大道，|中生蓮華，|香潔可意。","有生死然，|凡夫處邊，|慧者樂出，|為佛弟子。"]},"13":{"n":"愚闇品","s":"愚闇品者，將以開曚，故陳其態，欲使闚明。","t":["不寐夜長、|疲惓道長、|愚生死長，|莫知正法。","癡意常冥，|逝如流川，|在一行彊，|獨而無偶。","愚人着數，|憂慼久長，|與愚居苦，|於我猶怨。","有子、有財，|愚惟汲汲，|我且非我，|何憂子財？","暑當止此、|寒當止此，|愚多務慮，|莫知來變。","愚曚愚極，|自謂我智，|愚而勝智，|是謂極愚。","頑闇近智，|如瓢斟味，|雖久狎習，|猶不知法；","開達近智，|如舌甞味，|雖須臾習，|即解道要。","愚人施行，|為身招患，|快心作惡，|自致重殃。","行為不善，|退見悔悋，|致涕流面，|報由宿習；","行為德善，|進覩歡喜，|應來受福，|喜笑悅習。","過罪未熟，|愚以恬惔，|至其熟處，|自受大罪。","愚所望處，|不謂適苦，|臨墮厄地，|乃知不善。","愚憃作惡，|不能自解，|殃追自焚，|罪成熾燃。","愚好美食，|月月滋甚，|於十六分，|未一思法。","愚生念慮，|至終無利，|自招刀杖，|報有印章。","觀處知其愚，|不施而廣求，|所墮無道智，|往往有惡行。","遠道近欲者，|為食在學名，|貪猗家居故，|多取供異姓。","學莫墮二望，|莫作家沙門，|貪家違聖教，|為後自匱乏。","此行與愚同，|但令欲慢增，|利求之願異，|求道意亦異。","是以有識者，|出為佛弟子，|棄愛捨世習，|終不墮生死。"]},"14":{"n":"明哲品","s":"明哲品者，舉智行者，修福進道，法為明鏡。","t":["深觀善惡，|心知畏忌，|畏而不犯，|終吉無憂。","故世有福，|念思紹行，|善致其願，|福祿轉勝。","信善作福，|積行不厭，|信知陰德，|久而必彰。","常避無義，|不親愚人，|思從賢友，|押附上士。","喜法臥安，|心悅意清，|聖人演法，|慧常樂行。","仁人智者，|齋戒奉道，|如星中月，|照明世間。","弓工調角、|水人調船、|材匠調木、|智者調身。","譬如厚石，|風不能移，|智者意重，|毀譽不傾；","譬如深淵，|澄靜清明，|慧人聞道，|心淨歡然。","大人體無欲，|在所照然明，|雖或遭苦樂，|不高現其智。","大賢無世事，|不願子財國，|常守戒慧道，|不貪邪富貴。","智人知動搖，|譬如沙中樹，|朋友志未強，|隨色染其素。","世皆沒淵，|鮮尅度岸，|如或有人，|欲度必奔。","誠貪道者，|覽受正教，|此近彼岸，|脫死為上。","斷五陰法，|靜思智慧，|不反入淵，|棄猗其明。","抑制情欲，|絕樂無為，|能自拯濟，|使意為慧。","學取正智，|意惟正道，|一心受諦，|不起為樂，|漏盡習除，|是得度世。"]},"15":{"n":"羅漢品","s":"羅漢品者，言真人性脫欲、無着、心不渝變。","t":["去離憂患，|脫於一切，|縛結已解，|冷而無煖。","心淨得念，|無所貪樂，|已度癡淵，|如鴈棄池。","量腹而食，|無所藏積，|心空無想，|度眾行地。","如空中鳥，|遠逝無礙，|世間習盡，|不復仰食。","虛心無患，|已到脫處，|譬如飛鳥，|暫下輒逝。","制根從止，|如馬調御，|捨憍慢習，|為天所敬。","不怒如地、|不動如山，|真人無垢，|生死世絕。","心已休息，|言行亦止，|從正解脫，|寂然歸滅。","棄欲無着，|缺三界障，|望意已絕，|是謂上人。","在聚若野，|平地高岸，|應真所過，|莫不蒙祐。","彼樂空閑，|眾人不能，|快哉無望，|無所欲求。"]},"16":{"n":"述千品","s":"述千品者，示學者經多而不要，不如約明。","t":["雖誦千言，|句義不正，|不如一要，|聞可滅意；","雖誦千言，|不義何益？|不如一義，|聞行可度；","雖多誦經，|不解何益？|解一法句，|行可得道。","千千為敵，|一夫勝之，|未若自勝，|為戰中上。","自勝最賢，|故曰人雄，|護意調身，|自損至終。","雖曰尊天，|神魔梵釋，|皆莫能勝，|自勝之人。","月千反祠，|終身不輟，|不如須臾，|一心念法，|一念道福，|勝彼終身；","雖終百歲，|奉事火祠，|不如須臾，|供養三尊，|一供養福，|勝彼百年。","祭神以求福，|從後觀其報，|四分未望一，|不如禮賢者。","能善行禮節，|常敬長老者，|四福自然增，|色力壽而安。","若人壽百歲，|遠正不持戒，|不如生一日，|守戒正意禪；","若人壽百歲，|邪偽無有智，|不如生一日，|一心學正智；","若人壽百歲，|懈怠不精進，|不如生一日，|勉力行精進；","若人壽百歲，|不知成敗事，|不如生一日，|見微知所忌；","若人壽百歲，|不見甘露道，|不如生一日，|服行甘露味；","若人壽百歲，|不知大道義，|不如生一日，|學推佛法要。"]},"17":{"n":"惡行品","s":"惡行品者，感切惡人動有罪報，不行無患。","t":["見善不從，|反隨惡心，|求福不正，|反樂邪婬。","凡人為惡，|不能自覺，|愚癡快意，|令後欝毒。","𣧑人行虐，|沈漸數數，|快欲為人，|罪報自然；","吉人行德，|相隨積增，|甘心為之，|福應自然。","妖𦾨見福，|其惡未熟，|至其惡熟，|自受罪虐；","貞祥見禍，|其善未熟，|至其善熟，|必受其福。","擊人得擊、|行怨得怨、|罵人得罵、|施怒得怒。","世人無聞，|不知正法。","生此壽少，|何宜為惡？|莫輕小惡，|以為無殃，|水渧雖微，|漸盈大器，|凡罪充滿，|從小積成；","莫輕小善，|以為無福，|水滴雖微，|漸盈大器，|凡福充滿，|從纖纖積。","夫士為行，|好之與惡，|各自為身，|終不敗亡。","好取之士，|自以為可，|沒取彼者，|人亦沒之。","惡不即時，|如搆牛乳，|罪在陰祠，|如灰覆火。","戲笑為惡，|以作身行，|號泣受報，|隨行罪至。","作惡不覆，|如兵所截，|牽往乃知，|已墮惡行。","後受苦報，|如前所習。","如毒摩瘡，|船入洄澓，|惡行流衍，|靡不傷尅。","加惡誣罔人，|清白猶不污，|愚殃反自及，|如塵逆風坌。","過失犯非惡，|能追悔為善，|是明照世間，|如日無雲曀。","夫士所以行，|然後身自見，|為善則得善、|為惡則得惡。","有識墮胞胎、|惡者入地獄、|行善上昇天、|無為得泥洹。","非空、非海中、|非隱山石間，|莫能於此處，|避免宿惡殃。","眾生有苦惱，|不得免老死，|唯有仁智者，|不念人非惡。"]},"18":{"n":"刀杖品","s":"刀杖品者，教習慈仁，無行刀杖賊害眾生。","t":["一切皆懼死，|莫不畏杖痛，|恕己可為譬，|勿殺勿行杖。","能常安群生，|不加諸楚毒，|現世不逢害，|後世長安隱。","不當麤言，|言當畏報，|惡往禍來，|刀杖歸軀；","出言以善，|如叩鐘磬，|身無論議，|度世則易。","歐杖良善、|妄讒無罪，|其殃十倍，|災迅無赦：|生受酷痛；","形體毀折；","自然惱病；","失意恍惚；","人所誣咎；","或縣官厄；","財產耗盡；","親戚離別；","舍宅所有，|災火焚燒；","死入地獄。","如是為十。","雖倮剪髮，|長服草衣，|沐浴踞石，|奈癡結何？","不伐殺燒，|亦不求勝，|人愛天下，|所適無怨。","世黨有人，|能知慚愧，|是名誘進，|如策良馬、|如策善馬，|進道能遠。","人有信戒，|定意精進，|受道慧成，|便滅眾苦。","自嚴以修法，|滅損受淨行，|杖不加群生，|是沙門道人。","無害於天下，|終身不遇害，|常慈於一切，|孰能與為怨？"]},"19":{"n":"老耗品","s":"老耗品者，誨人懃仂，不與命競，老悔何益？","t":["何喜？何笑？|命常熾然，|深弊幽冥，|如不求錠。","見身形範，|倚以為安，|多想致病，|豈知非真？","老則色衰，|病無光澤，|皮緩肌縮，|死命近促。","身死神徙，|如御棄車，|肉消骨散，|身何可怙？","身為如城，|骨幹肉塗，|生至老死，|但藏恚慢。","老則形變，|喻如故車，|法能除苦，|宜以仂學。","人之無聞，|老若特牛，|但長肌肥，|無有福慧。","生死無聊，|往來艱難，|意猗貪身，|生苦無端。","慧以見苦，|是故棄身，|滅意斷行，|愛盡無生。","不修梵行、|又不富財，|老如白鷺，|守伺空池。","既不守戒、|又不積財，|老羸氣竭，|思故何逮？","老如秋葉，|何穢鑑錄？|命疾脫至，|亦用後悔。","命欲日夜盡，|及時可懃力，|世間諦非常，|莫惑墮冥中。","當學燃意燈，|自練求智慧，|離垢勿染污，|執燭觀道地。"]},"20":{"n":"愛身品","s":"愛身品者，所以勸學，終有益己——滅罪、興福。","t":["自愛身者，|慎護所守，|悕望欲解，|學正不寐。","為身第一，|常自勉學，|利乃誨人，|不惓則智。","學先自正，|然後正人，|調身入慧，|必遷為上。","身不能利，|安能利人？|心調體正，|何願不至？","本我所造，|後我自受，|為惡自更，|如剛鑽珠。","人不持戒，|滋蔓如藤，|逞情極欲，|惡行日增。","惡行危身，|愚以為易；","善最安身，|愚以為難。","如真人教，|以道法身，|愚者疾之，|見而為惡。","行惡得惡，|如種苦種，|惡自受罪、|善自受福，|亦各須熟，|彼不自代；","習善得善，|亦如種甜，|自利利人，|益而不費，|欲知利身，|戒聞為最。","如有自憂，|欲生天上，|敬樂聞法，|當念佛教。","凡用必豫慮，|勿以損所務，|如是意日修，|事務不失時。","夫治事之士，|能至終成利，|真見身應行，|如是得所欲。"]},"21":{"n":"世俗品","s":"世俗品者，說世幻夢，當捨浮華，勉修道用。","t":["如車行道，|捨平大途，|從邪徑敗，|生折軸憂。","離法如是，|從非法增，|愚守至死，|亦有折患。","順行正道，|勿隨邪業，|行住臥安，|世世無患。","萬物如泡，|意如野馬，|居世若幻，|奈何樂此？","若能斷此，|伐其樹根，|日夜如是，|必至于定。","一施如信，|如樂之人，|或從惱意，|以飯食眾。","此輩日夜，|不得定意，|世俗無眼，|莫見道真。","如少見明，|當養善意，|如鴈將群，|避羅高翔。","明人導世，|度脫邪眾。","世皆有死，|三界無安，|諸天雖樂，|福盡亦喪。","觀諸世間，|無生不終，|欲離生死，|當行道真。","癡覆天下，|貪令不見，|邪疑却道，|苦愚從是。","一法脫過，|謂妄語人，|不免後世，|靡惡不更。","雖多積珍寶，|嵩高至于天，|如是滿世間，|不如見道迹。","不善像如善，|愛如似無愛，|以苦為樂像，|狂夫為所厭。"]},"22":{"n":"述佛品","s":"述佛品者，道佛神德，無不利度，明為世則。","t":["己勝不受惡，|一切勝世間，|叡智廓無彊，|開曚令入道。","決網無罣礙，|愛盡無所積，|佛意深無極，|未踐迹令踐。","勇健立一心，|出家日夜滅，|根斷無欲意，|學正念清明。","見諦淨無穢，|已度五道淵，|佛出照世間，|為除眾憂苦。","得生人道難、|生壽亦難得；","世間有佛難，|佛法難得聞。","我既無歸保，|亦獨無伴侶，|積一行得佛，|自然通聖道。","船師能渡水，|精進為橋梁，|人以種姓繫，|度者為健雄。","壞惡度為佛，|止地為梵志，|除饉為學法，|斷種為弟子。","觀行忍第一，|佛說泥洹最，|捨罪作沙門，|無嬈害於彼。","不嬈亦不惱，|如戒一切持，|少食捨身貪，|有行幽隱處。","意諦以有𭶑，|是能奉佛教。","諸惡莫作，|諸善奉行，|自淨其意，|是諸佛教。","佛為尊貴，|斷漏無婬，|諸釋中雄，|一群從心。","快哉福報，|所願皆成，|敏於上寂，|自致泥洹。","或多自歸，|山川樹神，|廟立圖像，|祭祠求福；","自歸如是，|非吉、非上，|彼不能來，|度我眾苦。","如有自歸，|佛法聖眾，|道德四諦，|必見正慧。","生死極苦，|從諦得度，|度世八道，|斯除眾苦。","自歸三尊，|最吉、最上，|唯獨有是，|度一切苦。","士如中正，|志道不慳，|利哉！斯人，|自歸佛者。","明人難值，|亦不比有，|其所生處，|族親蒙慶。","諸佛興快，|說經道快，|眾聚和快，|和則常安。"]},"23":{"n":"安寧品","s":"安寧品者，差次安危，去惡即善，快而不墮。","t":["我生已安，|不慍於怨，|眾人有怨，|我行無怨；","我生已安，|不病於病，|眾人有病，|我行無病；","我生已安，|不慼於憂，|眾人有憂，|我行無憂。","我生已安，|清淨無為，|以樂為食，|如光音天。","我生已安，|澹泊無事，|彌薪國火，|安能燒我？","勝則生怨、|負則自鄙，|去勝負心，|無爭自安。","熱無過婬、|毒無過怒、|苦無過身、|樂無過滅。","無樂、小樂、|小辯、小慧，|觀求大者，|乃獲大安。","我為世尊，|長解無憂，|正度三有，|獨降眾魔。","見聖人快，|得依附快，|得離愚人，|為善獨快、|守正道快、|工說法快，|與世無諍；","戒具常快、|依賢居快，|如親親會，|近仁智者，|多聞高遠。","壽命鮮少，|而棄世多，|學當取要，|令至老安。","諸欲得甘露，|棄欲滅諦快，|欲度生死苦，|當服甘露味。"]},"24":{"n":"好喜品","s":"好喜品者，禁人多喜，能不貪欲，則無憂患。","t":["違道則自順、|順道則自違，|捨義取所好，|是為順愛欲。","不當趣所愛、|亦莫有不愛，|愛之不見憂、|不愛見亦憂；","是以莫造愛，|愛憎惡所由，|已除縛結者，|無愛無所憎。","愛喜生憂，|愛喜生畏；","無所愛喜，|何憂？何畏？|好樂生憂，|好樂生畏；","無所好樂，|何憂？何畏？|貪欲生憂，|貪欲生畏；","解無貪欲，|何憂？何畏？|貪法戒成，|至誠知慚，|行身近道，|為眾所愛。","欲態不出，|思正乃語，|心無貪愛，|必截流渡。","譬人久行，|從遠吉還，|親厚普安，|歸來喜歡。","好行福者，|從此到彼，|自受福祚，|如親來喜。","起從聖教，|禁制不善，|近道見愛、|離道莫親。","近與不近，|所住者異，|近道昇天，|不近墮獄。"]},"25":{"n":"忿怒品","s":"忿怒品者，見瞋恚害，寬弘慈柔，天祐人愛。","t":["忿怒不見法，|忿怒不知道，|能除忿怒者，|福喜常隨身；","貪婬不見法，|愚癡意亦然，|除婬去癡者，|其福第一尊。","恚能自制，|如止奔車，|是為善御，|棄冥入明。","忍辱勝恚，|善勝不善，|勝者能施，|至誠勝欺。","不欺、不怒、|意不多求，|如是三事，|死則上天。","常自攝身，|慈心不殺，|是生天上，|到彼無憂。","意常覺寤，|明慕勤學，|漏盡意解，|可致泥洹。","人相謗毀，|自古至今，|既毀多言、|又毀訥忍、|亦毀中和，|世無不毀，|欲意非聖，|不能制中。","一毀、一譽，|但為利名，|明智所譽，|唯稱是賢。","慧人守戒，|無所譏謗，|如羅漢淨，|莫而誣謗。","諸人咨嗟，|梵釋所稱，|常守慎身，|以護瞋恚；","除身惡行，|進修德行，|常守慎言，|以護瞋恚；","除口惡言，|誦習法言，|常守慎心，|以護瞋恚。","除心惡念，|思惟念道，|節身慎言，|守攝其心。","捨恚行道，|忍辱最強；","捨恚離慢，|避諸愛會。","不著名色，|無為滅苦，|起而解怒，|婬生自禁。","捨不明健，|斯皆得安，|瞋斷臥安，|恚滅婬憂。","怒為毒本，|軟意梵志，|言善得譽，|斷為無患。","同志相近，|詳為作惡，|後別餘恚，|火自燒惱。","不知慚愧，|無戒有怒，|為怒所牽，|不厭有務。","有力近兵，|無力近軟，|夫忍為上，|宜常忍羸；","舉眾輕之，|有力者忍，|夫忍為上，|宜常忍羸。","自我與彼，|大畏有三，|如知彼作，|宜滅己中；","俱兩行義，|我為彼教，|如知彼作，|宜滅己中。","苦智勝愚，|麤言惡說，|欲常勝者，|於言宜默。","夫為惡者，|怒有怒報，|怒不報怒，|勝彼鬪負。"]},"26":{"n":"塵垢品","s":"塵垢品者，分別清濁，學當潔白，無行污辱。","t":["生無善行，|死墮惡道，|住疾無間，|到無資用。","當求智慧，|以然意定，|去垢勿污，|可離苦形。","慧人以漸，|安徐稍進，|洗除心垢，|如工鍊金；","惡生於心，|還自壞形，|如鐵生垢，|反食其身。","不誦為言垢、|不勤為家垢、|不嚴為色垢、|放逸為事垢、|慳為惠施垢、|不善為行垢，|今世亦後世，|惡法為常垢。","垢中之垢，|莫甚於癡，|學當捨惡，|比丘無垢。","苟生無恥，|如鳥長喙，|強顏耐辱，|名曰穢生；","廉恥雖苦，|義取清白，|避辱不妄，|名曰潔生。","愚人好殺，|言無誠實，|不與而取，|好犯人婦，|逞心犯戒，|迷惑於酒，|斯人世世，|自掘身本。","人如覺是，|不當念惡，|愚近非法，|久自燒沒。","若信布施，|欲揚名譽，|會人虛飾，|非入淨定。","一切斷欲，|截意根原，|晝夜守一，|必入定意。","著垢為塵，|從染塵漏，|不染、不行，|淨而離愚。","見彼自侵，|常內自省，|行漏自欺，|漏盡無垢。","火莫熱於婬，|捷莫疾於怒，|網莫密於癡，|愛流駛乎河。","虛空無轍迹，|沙門無外意，|眾人盡樂惡，|唯佛淨無穢；","虛空無轍迹，|沙門無外意，|世間皆無常，|佛無我所有。"]},"27":{"n":"奉持品","s":"奉持品者，解說道義，法貴德行，不用貪侈。","t":["好經道者，|不競於利，|有利、無利，|無欲不惑，|常愍好學，|正心以行，|擁懷寶慧，|是謂為道。","所謂智者，|不必辯言；","無恐、無懼，|守善為智。","奉持法者，|不以多言；","雖素少聞，|身依法行，|守道不忘，|可謂奉法。","所謂老者，|不必年耆，|形熟髮白，|憃愚而已；","謂懷諦法，|順調慈仁，|明遠清潔，|是為長老。","所謂端政，|非色如花，|慳嫉虛飾，|言行有違；","謂能捨惡，|根原已斷，|慧而無恚，|是為端政。","所謂沙門，|非必除髮，|妄語貪取，|有欲如凡；","謂能止惡，|恢廓弘道，|息心滅意，|是為沙門。","所謂比丘，|非時乞食，|邪行婬彼，|稱名而已；","謂捨罪福，|淨修梵行，|慧能破惡，|是為比丘。","所謂仁明，|非口不言，|用心不淨，|外順而已；","謂心無為，|內行清虛，|此彼寂滅，|是為仁明。","所謂有道，|非救一物；","普濟天下，|無害為道。","戒眾不言，|我行多誠。","得定意者，|要由閉損，|意解求安。","莫習凡人，|使結未盡，|莫能得脫。"]},"28":{"n":"道行品","s":"道行品者，旨說大要度脫之道，此為極妙。","t":["八直最上道，|四諦為法迹，|不婬行之尊，|施燈必得眼。","是道無復畏，|見淨乃度世，|此能壞魔兵，|力行滅邪苦。","我已開正道，|為大現異明，|已聞當自行，|行乃解邪縛。","生死非常苦，|能觀見為慧，|欲離一切苦，|行道一切除；","生死非常空，|能觀見為慧，|欲離一切苦，|但當勤行道。","起時當即起，|莫如愚覆淵，|與墮無瞻聚，|計罷不進道。","念應念則正，|念不應則邪，|慧而不起邪，|思正道乃成。","慎言守意念，|身不善不行，|如是三行除，|佛說是得道。","斷樹無伐本，|根在猶復生，|除根乃無樹，|比丘得泥洹。","不能斷樹，|親戚相戀，|貪意自縛，|如犢慕乳；","能斷意本，|生死無彊，|是為近道，|疾得泥洹。","貪婬致老、|瞋恚致病、|愚癡致死，|除三得道。","釋前解後，|脫中度彼，|一切念滅，|無復老死。","人營妻子，|不觀病法，|死命卒至，|如水湍驟。","父子不救，|餘親何望？|命盡怙親，|如盲守燈。","慧解是意，|可修經戒，|勤行度世，|一切除苦。","遠離諸淵，|如風却雲，|已滅思想，|是為知見。","智為世長，|惔樂無為，|知受正教，|生死得盡。","知眾行空，|是為慧見，|罷厭世苦，|從是道除；","知眾行苦，|是為慧見，|罷厭世苦，|從是道除；","眾行非身，|是為慧見，|罷厭世苦，|從是道除。","吾語汝法，|愛箭為射，|宜以自勗，|受如來言。","吾為都以滅，|往來生死盡，|非一情以解，|所演為道眼。","駛流澍于海，|潘水漾疾滿，|故為智者說，|可趣服甘露。","前未聞法輪，|轉為哀眾生，|於是奉事者，|禮之度三有。","三念可念善，|三亦難不善，|從念而有行，|滅之為正斷。","三定為轉念，|棄猗行無量，|得三三窟除，|解結可應念。","知以戒禁惡，|思惟慧樂念，|已知世成敗，|息意一切解。"]},"29":{"n":"廣衍品","s":"廣衍品者，言凡善、惡，積小致大，證應章句。","t":["施安雖小，|其報彌大；","慧從小施，|受見景福。","施勞於人，|而欲望祐，|殃咎歸身，|自遘廣怨。","已為多事，|非事亦造，|伎樂放逸，|惡習日增。","精進惟行，|習是捨非，|修身自覺，|是為正習。","既自解慧，|又多學問，|漸進普廣，|油酥投水；","自無慧意，|不好學問，|凝縮狹小，|酪酥投水。","近道名顯，|如高山雪，|遠道闇昧，|如夜發箭。","為佛弟子，|常寤自覺，|晝夜念佛，|惟法思眾；","為佛弟子，|當寤自覺，|日暮思禪，|樂觀一心。","人當有念意，|每食知自少，|則是痛欲薄，|節消而保壽。","學難、捨罪難，|居在家亦難，|會止同利難，|難難無過有。","比丘乞求難，|何可不自勉？|精進得自然，|後無欲於人。","有信則戒成，|從戒多致寶，|亦從得諧偶，|在所見供養。","一坐、一處臥，|一行無放恣，|守一以正身，|心樂居樹間。"]},"30":{"n":"地獄品","s":"地獄品者，道泥犁事，作惡受惡，罪牽不置。","t":["妄語地獄近，|作之言不作，|二罪後俱受，|是行自牽往。","法衣在其身，|為惡不自禁，|苟沒惡行者，|終則墮地獄。","無戒受供養，|理豈不自損？|死噉燒鐵丸，|然熱劇火炭。","放逸有四事，|好犯他人婦，|臥險非福利，|毀三淫泆四。","不福利墮惡，|畏惡、畏樂寡，|王法重罰加，|身死入地獄。","譬如拔菅草，|執緩則傷手，|學戒不禁制，|獄錄乃自賊。","人行為慢惰，|不能除眾勞，|梵行有玷缺，|終不受大福。","常行所當行，|自持必令強，|遠離諸外道，|莫習為塵垢。","為所不當為，|然後致欝毒，|行善常吉順，|所適無悔恡。","其於眾惡行，|欲作若已作，|是苦不可解，|罪近難得避。","妄證求敗，|行已不正，|怨譖良人，|以抂治士。","罪縛斯人，|自投于坑，|如備邊城，|中外牢固。","自守其心，|非法不生，|行缺致憂，|令墮地獄。","可羞不羞，|非羞反羞，|生為邪見，|死墮地獄；","可畏不畏，|非畏反畏，|信向邪見，|死墮地獄。","可避不避，|可就不就，|翫習邪見，|死墮地獄；","可近則近，|可遠則遠，|恒守正見，|死墮善道。"]},"31":{"n":"象喻品","s":"象喻品者，教人正身，為善得善，福報快焉。","t":["我如象鬪，|不恐中箭，|常以誠信，|度無戒人。","譬象調正，|可中王乘，|調為尊人，|乃受誠信。","雖為常調，|如彼新馳，|亦最善象，|不如自調。","彼不能適，|人所不至，|唯自調者，|能到調方。","如象名財守，|猛害難禁制，|繫絆不與食，|而猶暴逸象。","沒在惡行者，|恒以貪自繫，|其象不知厭，|故數入胞胎。","本意為純行，|及常行所安，|悉捨降伏結，|如鉤制象調。","樂道不放逸，|能常自護心，|是為拔身苦，|如象出于塪。","若得賢能伴，|俱行行善悍，|能伏諸所聞，|至到不失意；","不得賢能伴，|俱行行惡悍，|廣斷王邑里，|寧獨不為惡。","寧獨行為善，|不與愚為侶，|獨而不為惡，|如象驚自護。","生而有利安，|伴軟和為安，|命盡為福安，|眾惡不犯安。","人家有母樂，|有父斯亦樂，|世有沙門樂，|天下有道樂。","持戒終老安，|信正所正善，|智慧最安身，|不犯惡最安。","如馬調軟，|隨意所如，|信戒精進，|定法要具。","明行成立，|忍和意定，|是斷諸苦，|隨意所如。","從是往定，|如馬調御，|斷恚無漏，|是受天樂。","不自放恣，|從是多寤，|羸馬比良，|棄惡為賢。"]},"32":{"n":"愛欲品","s":"愛欲品者，賤婬恩愛，世人為此，盛生災害。","t":["心放在婬行，|欲愛增枝條，|分布生熾盛，|超躍貪果猴。","以為愛忍苦，|貪欲著世間，|憂患日夜長，|莚如蔓草生。","人為恩愛惑，|不能捨情欲，|如是憂愛多，|潺潺盈于池。","夫所以憂悲，|世間苦非一，|但為緣愛有，|離愛則無憂。","己意安棄憂，|無愛何有世？|不憂不染求，|不愛焉得安？","有憂以死時，|為致親屬多，|涉憂之長塗，|愛苦常墮危。","為道行者，|不與欲會，|先誅愛本，|無所植根，|勿如刈葦，|令心復生。","如樹根深固，|雖截猶復生，|愛意不盡除，|輒當還受苦。","猨猴得離樹，|得脫復趣樹，|眾人亦如是，|出獄復入獄。","貪意為常流，|習與憍慢并，|思想猗婬欲，|自覆無所見。","一切意流衍，|愛結如葛藤，|唯慧分別見，|能斷意根原。","夫從愛潤澤，|思想為滋蔓，|愛欲深無底，|老死是用增。","所生枝不絕，|但用食貪欲，|養怨益丘塜，|愚人常汲汲。","雖獄有鉤鍱，|慧人不謂牢，|愚見妻子息，|染著愛甚牢。","慧說愛為獄，|深固難得出，|是故當斷棄，|不視欲能安。","見色心迷惑，|不惟觀無常，|愚以為美善，|安知其非真？","以婬樂自裹，|譬如蠶作繭，|智者能斷棄，|不眄除眾苦。","心念放逸者，|見婬以為淨，|恩愛意盛增，|從是造獄牢。","覺意滅婬者，|常念欲不淨，|從是出邪獄，|能斷老死患。","以欲網自蔽，|以愛蓋自覆，|自恣縛於獄，|如魚入笱口，|為老死所伺，|若犢求母乳。","離欲滅愛迹，|出網無所弊，|盡道除獄縛，|一切此彼解，|已得度邊行，|是為大智士。","勿親遠法人，|亦勿為愛染，|不斷三世者，|會復墮邊行。","若覺一切法，|能不著諸法，|一切愛意解，|是為通聖意。","眾施經施勝、|眾味道味勝、|眾樂法樂勝，|愛盡勝眾苦。","愚以貪自縛，|不求度彼岸，|貪為敗處故，|害人亦自害。","愛欲意為田，|婬怒癡為種，|故施度世者，|得福無有量。","伴少而貨多，|商人怵惕懼，|嗜欲賊害命，|故慧不貪欲。","心可則為欲，|何必獨五欲？|違可絕五欲，|是乃為勇士。","無欲無有畏，|恬惔無憂患，|欲除使結解，|是為長出淵。","欲我知汝本，|意以思想生，|我不思想汝，|則汝而不有。","伐樹忽休，|樹生諸惡，|斷樹盡株，|比丘滅度。","夫不伐樹，|少多餘親，|心繫於此，|如犢求母。"]},"33":{"n":"利養品","s":"利養品者，勵己防貪，見德思議，不為穢生。","t":["芭蕉以實死，|竹蘆實亦然，|駏驉坐妊死，|士以貪自喪。","如是貪無利，|當知從癡生，|愚為此害賢，|首領分于地。","天雨七寶，|欲猶無厭，|樂少苦多，|覺者為賢。","雖有天欲，|慧捨無貪，|樂離恩愛，|為佛弟子。","遠道順邪，|貪養比丘，|止有慳意，|以供彼姓。","勿猗此養，|為家捨罪，|此非至意，|用用何益？","愚為愚計，|欲慢用增，|異哉失利，|泥洹不同。","諦知是者，|比丘佛子，|不樂利養，|閑居却意。","自得不恃，|不從他望，|望彼比丘，|不至正定。","夫欲安命，|息心自省，|不知計數，|衣服飲食；","夫欲安命，|息心自省，|取得知足，|守行一法；","夫欲安命，|息心自省，|如鼠藏穴，|潛隱習教。","約利約耳，|奉戒思惟，|為慧所稱，|清吉勿怠。","如有三明，|解脫無漏，|寡智鮮識，|無所憶念。","其於食飲，|從人得利，|而有惡法，|從供養嫉。","多結怨利，|強服法衣，|但望飲食，|不奉佛教。","當知是過，|養為大畏，|寡取無憂，|比丘釋心。","非食命不濟，|孰能不揣食？|夫立食為先，|知是不宜嫉。","嫉先創己，|然後創人，|擊人得擊，|是不得除。","寧噉燒石、|吞飲洋銅，|不以無戒，|食人信施。"]},"34":{"n":"沙門品","s":"沙門品者，訓以法正，弟子受行，得道解淨。","t":["端目、耳、鼻、口，|身意常守正，|比丘行如是，|可以免眾苦。","手足莫妄犯，|節言順所行，|常內樂定意，|守一行寂然。","學當守口，|宥言安徐，|法義為定，|言必柔軟。","樂法欲法，|思惟安法，|比丘依法，|正而不費。","學無求利，|無愛他行，|比丘好他，|不得定意。","比丘少取，|以得無積，|天人所譽，|生淨無穢。","比丘為慈，|愛敬佛教，|深入止觀，|滅行乃安。","一切名色，|非有莫惑，|不近不憂，|乃為比丘。","比丘扈船，|中虛則輕，|除婬怒癡，|是為泥洹。","捨五斷五，|思惟五根，|能分別五，|乃渡河淵。","禪無放逸，|莫為欲亂，|不吞洋銅，|自惱燋形。","無禪不智、|無智不禪，|道從禪智，|得至泥洹。","當學入空，|靜居止意，|樂獨屏處，|一心觀法。","常制五陰，|伏意如水，|清淨和悅，|為甘露味。","不受所有，|為慧比丘，|攝根知足，|戒律悉持。","生當行淨，|求善師友，|智者成人，|度苦致喜。","如衛師華，|熟如自墮，|釋婬怒癡，|生死自解。","止身、止言，|心守玄默，|比丘棄世，|是為受寂。","當自勅身，|內與心爭，|護身念諦，|比丘惟安。","我自為我，|計無有我，|故當損我，|調乃為賢。","喜在佛教，|可以多喜，|至到寂寞，|行滅永安。","儻有少行，|應佛教戒，|此照世間，|如日無曀。","棄慢無餘憍，|蓮華水生淨，|學能捨此彼，|知是勝於故。","割愛無戀慕，|不受如蓮華，|比丘渡河流，|勝欲明於故。","截流自恃，|逝心却欲，|仁不割欲，|一意猶走。","為之！為之！|必強自制，|捨家而懈，|意猶復染。","行懈緩者，|勞意弗除？|非淨梵行，|焉致大寶？","沙門何行？|如意不禁，|步步著粘，|但隨思走。","袈裟披肩，|為惡不損，|惡惡行者，|斯墮惡道。","不調難誡，|如風枯樹，|作自為身，|曷不精進？","息心非剔，|慢訑無戒，|捨貪思道，|乃應息心；","息心非剔，|放逸無信，|能滅眾苦，|為上沙門。"]},"35":{"n":"梵志品","s":"梵志品者，言行清白，理學無穢，可稱道士。","t":["截流而渡，|無欲如梵，|知行已盡，|是謂梵志；","以無二法，|清淨渡淵，|諸欲結解，|是謂梵志；","適彼無彼，|彼彼已空，|捨離貪婬，|是謂梵志；","思惟無垢，|所行不漏，|上求不起，|是謂梵志。","日照於晝、|月照於夜、|甲兵照軍、|禪照道人；","佛出天下，|照一切冥。","非剃為沙門，|稱吉為梵志，|謂能捨眾惡，|是則為道人；","出惡為梵志，|入正為沙門，|棄我眾穢行，|是則為捨家。","若猗於愛，|心無所著，|已捨、已正，|是滅眾苦。","身、口與意，|淨無過失，|能捨三行，|是謂梵志。","若心曉了，|佛所說法，|觀心自歸，|淨於為水。","非蔟結髮，|名為梵志；","誠行法行，|清白則賢。","飾髮無慧，|草衣何施？|內不離著，|外捨何益？","被服弊惡，|躬承法行，|閑居思惟，|是謂梵志；","佛不教彼，|讚己自稱，|如諦不妄，|乃為梵志；","絕諸可欲，|不婬其志，|委棄欲數，|是謂梵志；","斷生死河，|能忍起度，|自覺出塹，|是謂梵志；","見罵見擊，|默受不怒，|有忍辱力，|是謂梵志；","若見侵欺，|但念守戒，|端身自調，|是謂梵志；","心棄惡法，|如蛇脫皮，|不為欲污，|是謂梵志；","覺生為苦，|從是滅意，|能下重擔，|是謂梵志；","解微妙慧，|辯道不道，|體行上義，|是謂梵志；","棄捐家居，|無家之畏，|少求寡欲，|是謂梵志；","棄放活生，|無賊害心，|無所嬈惱，|是謂梵志；","避爭不爭，|犯而不慍，|惡來善待，|是謂梵志；","去婬怒癡，|憍慢諸惡，|如蛇脫皮，|是謂梵志；","斷絕世事，|口無麤言，|八道審諦，|是謂梵志；","所世惡法，|修短巨細，|無取、無捨，|是謂梵志；","今世行淨、|後世無穢，|無習、無捨，|是謂梵志；","棄身無猗，|不誦異行，|行甘露滅，|是謂梵志；","於罪與福，|兩行永除，|無憂、無塵，|是謂梵志；","心喜無垢，|如月盛滿，|謗毀已除，|是謂梵志；","見癡往來，|墮塹受苦，|欲單渡岸，|不好他語，|唯滅不起，|是謂梵志；","已斷恩愛，|離家無欲，|愛有已盡，|是謂梵志；","離人聚處，|不墮天聚，|諸聚不歸，|是謂梵志；","棄樂無樂，|滅無熅燸，|健違諸世，|是謂梵志；","所生已訖，|死無所趣，|覺安無依，|是謂梵志；","已度五道，|莫知所墮，|習盡無餘，|是謂梵志；","于前、于後，|乃中無有，|無操、無捨，|是謂梵志；","最雄、最勇，|能自解度，|覺意不動，|是謂梵志；","自知宿命，|本所更來，|得要生盡，|叡通道玄，|明如能默，|是謂梵志。"]},"36":{"n":"泥洹品","s":"泥洹品者，敘道大歸，恬惔寂滅，度生死畏。","t":["忍為最自守，|泥洹佛稱上，|捨家不犯戒，|息心無所害。","無病最利、|知足最富、|厚為最友、|泥洹最快；","飢為大病、|行為最苦，|已諦知此，|泥洹最樂；","少往善道，|趣惡道多，|如諦知此，|泥洹最安。","從因生善、|從因墮惡，|由因泥洹，|所緣亦然。","麋鹿依野、|鳥依虛空，|法歸其報，|真人歸滅。","始無如不？|始不如無，|是為無得，|亦無有思。","心難見，習可覩，|覺欲者，乃具見。","無所樂，為苦際，|在愛欲，為增痛，|明不清，淨能御，|無所近，為苦際。","見有見、聞有聞、|念有念、識有識，|覩無著，亦無識，|一切捨，為得際。","除身想，滅痛行，|識已盡，為苦竟，|猗則動，虛則淨，|動非近，非有樂，|樂無近，為得寂，|寂已寂，已往來，|來往絕，無生死，|生死斷，無此彼，|此彼斷，為兩滅，|滅無餘，為苦除。","比丘有世生，|有有有作行，|有無生無有，|無作無所行。","夫唯無念者，|為能得自致，|無生無復有，|無作無行處。","生有作行者，|是為不得要，|若已解不生，|不有不作行。","則生有得要，|從生有已起，|作行致死生，|為開為法果。","從食因緣有，|從食致憂樂，|而此要滅者，|無復念行迹。","諸苦法已盡，|行滅湛然安，|比丘吾已知，|無復諸入地。","無有虛空入，|無諸入用入，|無想不想入，|無今世、後世，|亦無日月想，|無往、無所懸。","我已無往反，|不去而不來，|不沒不復生，|是際為泥洹。","如是像無像，|苦樂為以解，|所見不復恐，|無言言無疑。","斷有之射箭，|遘愚無所猗，|是為第一快，|此道寂無上。","受辱心如地，|行忍如門閾，|淨如水無垢，|生盡無彼受。","利勝不足恃，|雖勝猶復苦，|當自求去勝，|已勝無所生。","畢故不造新，|厭胎無婬行，|種燋不復生，|意盡如火滅。","胞胎為穢海，|何為樂婬行？|雖上有善處，|皆莫如泥洹。","悉知一切斷，|不復著世間，|都棄如滅度，|眾道中斯勝。","佛以現諦法，|智勇能奉持，|行淨無瑕穢，|自知度世安。","道務先遠欲，|早服佛教戒，|滅惡極惡際，|易如鳥逝空。","若已解法句，|至心體道行，|是度生死岸，|苦盡而無患。","道法無親疎，|正不問羸強，|要在無識想，|結解為清淨。","上智饜腐身，|危脆非實真，|苦多而樂少，|九孔無一淨。","慧以危貿安，|棄猗脫眾難，|形腐銷為沫，|慧見捨不貪。","觀身為苦器，|生老病無痛，|棄垢行清淨，|可以獲大安。","依慧以却邪，|不受漏得盡，|行淨致度世，|天人莫不禮。"]},"37":{"n":"生死品","s":"生死品者，說諸人魂，靈亡神在，隨行轉生。","t":["命如菓待熟，|常恐會零落。","已生皆有苦，|孰能致不死？|從初樂恩愛，|可婬入泡影，|受形命如電，|晝夜流難止。","是身為死物，|精神無形法，|假令死復生，|罪福不敗亡。","終始非一世，|從癡愛久長，|自此受苦樂，|身死神不喪。","身四大為色，|識四陰曰名，|其情十八種，|所緣起十二。","神止凡九處，|生死不斷滅，|世間愚不聞，|蔽闇無天眼。","自塗以三垢，|無目意妄見，|謂死如生時，|或謂死斷滅。","識神造三界，|善不善五處，|陰行而默到，|所往如響應。","欲色不色有，|一切因宿行，|如種隨本像，|自然報如意。","神以身為名，|如火隨形字，|著燭為燭火，|隨炭草糞薪。","心法起則起、|法滅而則滅，|興衰如雨雹，|轉轉不自識。","識神走五道，|無一處不更，|捨身復受身，|如輪轉著地。","如人一身居，|去其故室中，|神以形為廬，|形壞神不亡；","精神居形軀，|猶雀藏器中，|器破雀飛去，|身壞神逝生。","性癡淨常想，|樂身想疑想，|嫌望非上要，|佛說是不明。","一本二展轉，|三垢五彌廣，|諸海十三事，|淵銷越度歡。","三事斷絕時，|知身無所直，|命氣熅煖識，|捨身而轉逝。","當其死臥地，|猶草無所知，|觀其狀如是，|但幻而愚貪。"]},"38":{"n":"道利品","s":"道利品者，君父師行，開示善道，率之以正。","t":["人知奉其上，|君父師道士，|信戒施聞慧，|終吉所生安。","宿命有福慶，|生世為人尊，|以道安天下，|奉法莫不從。","王為臣民長，|常以慈愛下，|身率以法戒，|示之以休咎。","處安不忘危，|慮明福轉厚，|福德之反報，|不問尊以卑。","夫為世間將，|修正不阿抂，|心調勝諸惡，|如是為法王。","見正能施惠，|仁愛好利人，|既利以平均，|如是眾附親。","如牛厲渡水，|導正從亦正，|奉法心不邪，|如是眾普安。","勿妄嬈神象，|以招苦痛患，|惡意為自煞，|終不至善方。","戒德可恃怙，|福報常隨己，|見法為人長，|終遠三惡道。","戒慎除苦畏，|福德三界尊，|鬼龍邪毒害，|不犯持戒人。","無義不誠信，|欺妄好鬪諍，|當知遠離此，|近愚興罪多；","仁賢言誠信，|多聞戒行具，|當知親附此，|近智誠善多。","善言不守戒，|志亂無善行，|雖身處潛隱，|是為非學法。","美說正為上，|法說為第二，|愛說可彼三，|誠說不欺四。","無便獲利刃，|自以剋其身，|愚學好妄說，|行牽受幸戾。","貪婬、瞋恚、癡，|是三非善本，|身以斯自害，|報由癡愛生。","有福為天人，|非法受惡形，|聖人明獨見，|常善承佛令。","戒德後世業，|以作福追身，|天人稱譽善，|心正無不安。","為惡不念止，|日縛不自悔，|命逝如川流，|是恐宜守戒。","今我上體首，|白生為被盜，|已有天使召，|時正宜出家。"]},"39":{"n":"吉祥品","s":"吉祥品者，修己之術，去惡就善，終厚景福。","t":["佛尊過諸天，|如來常現義，|有梵志道士，|來問何吉祥？","於是佛愍傷，|為說真有要，|已信樂正法，|是為最吉祥；","若不從天人，|希望求僥倖，|亦不禱祠神，|是為最吉祥；","友賢擇善居，|常先為福德，|勅身從真正，|是為最吉祥；","去惡從就善，|避酒知自節，|不婬于女色，|是為最吉祥；","多聞如戒行，|法律精進學，|修已無所爭，|是為最吉祥；","居孝事父母，|治家養妻子，|不為空之行，|是為最吉祥；","不慢不自大，|知足念反復，|以時誦習經，|是為最吉祥；","所聞常以忍，|樂欲見沙門，|每講輒聽受，|是為最吉祥；","持齋修梵行，|常欲見賢聖，|依附明智者，|是為最吉祥；","以信有道德，|正意向無疑，|欲脫三惡道，|是為最吉祥；","等心行布施，|奉諸得道者，|亦敬諸天人，|是為最吉祥；","常欲離貪欲，|愚癡瞋恚意，|能習誠道見，|是為最吉祥；","若以棄非務，|能勤修道用，|常事於可事，|是為最吉祥；","一切為天下，|建立大慈意，|修仁安眾生，|是為最吉祥。","欲求吉祥福，|當信敬於佛；","欲求吉祥福，|當聞法句義；","欲求吉祥福，|當供養眾僧。","戒具清淨者，|是為最吉祥；","智者居世間，|常習吉祥行，|自致成慧見，|是為最吉祥。","梵志聞佛教，|心中大歡喜，|即前禮佛足，|歸命佛法眾。"]}};

 h+=styles("st2")+'<img class="cimg" id="goldimg" alt="金句圖卡" src="'+cvG.toDataURL("image/png")+'"><div class="acts"><button data-a="gsave">儲存圖卡</button><button data-a="gshare">分享</button></div><p class="ref">按「儲存圖卡」會放大預覽，長按圖片即可存入相簿；若手機無法下載，這個方法一定可以。</p>';
 $("pg-gold").innerHTML=h}

function cardClick(e){var t=e.target.closest("button");if(!t)return;
 if(t.hasAttribute("data-s")){SET.cs=+t.getAttribute("data-s");W_("dhp2-set",SET);renderToday();renderGold();return}

/* 設定 */
function renderSet(){
 function sel(id,opts,v){return '<select id="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]==v?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'}
 var h='<h2 class="ut">設定</h2>';
 h+='<label class="row"><span>色系</span>'+sel("s_pal",Object.keys(PAL).map(function(k){return [k,PAL[k][0]]}),SET.pal)+'</label>';
 h+='<label class="row"><span>明暗</span>'+sel("s_mode",[["auto","跟隨系統"],["light","淺色"],["dark","深色"]],SET.mode)+'</label>';
 h+='<label class="row"><span>品序</span>'+sel("s_ord",[["pali","巴利本順序"],["wu","吳譯本順序"]],SET.ord)+'</label>';
 h+='<label class="row"><span>字體</span>'+sel("s_ff",[["m","明體"],["k","楷體"],["h","黑體"]],SET.ff)+'</label>';
 h+='<label class="row"><span>字級</span><input type="range" id="s_fs" min="14" max="24" step="1" value="'+SET.fs+'"></label>';
 h+='<label class="row"><span>行距</span><input type="range" id="s_lh" min="1.5" max="2.5" step="0.1" value="'+SET.lh+'"></label>';
 h+='<label class="row"><span>段距</span><input type="range" id="s_gap" min="6" max="28" step="2" value="'+SET.gap+'"></label>';
 h+='<details class="help"><summary>使用說明</summary><p><b>用途</b>　用故事對照偈頌，幫你熏習《法句經》：每日讀一則、反覆回顧，慢慢把經文用在生活裡。</p><p><b>設計邏輯</b>　一則故事配一首偈，逐步螺旋，加深加廣。同一則可以回來多次，每次多一圈。</p><p><b>四圈</b>　讀（故事、原文、白話）、詞（字詞與巴利對照）、義（義理連結）、行（實踐與回顧）。點上方圓圈切換，不必依序。</p><p><b>全文與影音</b>　目錄裡每一品都可讀吳譯全文；目前有導讀的是無常品、雙要品、放逸品，其他品先提供全文。「影音」收錄《法句經》講法。</p><p><b>今日・金句</b>　「今日」依日期顯示當日經文，附白話與巴利，並有同一句的圖卡；「金句」可挑十句選風格下載。</p><p><b>四種漢譯</b>　《法句經》（東吳維祇難等譯，上下二卷、39 品、758 偈）只有短偈；《法句譬喻經》（西晉法炬、法立譯，四卷、39 品、284 偈）、《出曜經》（姚秦竺佛念譯，三十卷、34 品、934 偈）、《法集要頌經》（北宋天息災譯，四卷、33 品、933 偈）都是在譬喻中夾短偈。本工具的全文是第一種。依法鼓講堂課程投影片。</p><p><b>資料</b>　進度與心得只存在這支手機的瀏覽器。</p></details>';
 h+='<p class="src">偈頌原文：大正藏第 210 號《法句經》（維祇難等譯），依 CBETA 電子佛典集成。巴利文：Dhammapada。故事：雙要品、放逸品依巴利 Dhammapada 註釋（Dhammapada-aṭṭhakathā）的傳統說法概述，參考 Daw Mya Tin 英譯；無常品只在有確切出處時附故事。《法句譬喻經》（T211）的故事目前只整理了第 1–15 品的目錄與要點，其餘品尚未收入。漢譯與巴利偈的對應，由編者依內容比對，供學習參考。</p>';
 $("pg-set").innerHTML=h;
 [["s_ord","ord"],["s_pal","pal"],["s_mode","mode"],["s_ff","ff"],["s_fs","fs"],["s_lh","lh"],["s_gap","gap"]].forEach(function(p){var el=$(p[0]);el.oninput=function(){SET[p[1]]=(p[1]=="pal"||p[1]=="mode"||p[1]=="ff"||p[1]=="ord")?this.value:+this.value;apply()}})}
/* 全文閱讀 */
function renderRead(){
 var d=FULL[readW],h="",prev=readW>0?readW-1:-1,next=readW<39?readW+1:-1;
 if(readW==0){h+='<h2 class="ut">法句經序</h2><div class="ref">吳譯《法句經》（大正藏第 210 號）</div>'+d.p.map(function(p){return '<p class="pre">'+p+'</p>'}).join("")}
 else{var b=null;BOOKS.forEach(function(x){if(x.wno==readW)b=x});
  h+='<h2 class="ut">'+d.n+'</h2><div class="ref">吳譯第 '+readW+' 品・'+(d.t.length)+' 段'+(b?'・<a href="#" data-a="gostudy">有導讀</a>':'')+'</div><p class="sm" style="text-align:center">'+d.s+'</p>'+d.t.map(function(t){return '<p class="rs">'+t.split("|").join("<br>")+'</p>'}).join("")+storyBox(readW)}
 h+='<div class="rnav"><button data-a="rprev"'+(prev<0?" disabled":"")+'>‹ '+(prev>=0?FULL[prev].n:"")+'</button><button data-a="rtoc">目錄</button><button data-a="rnext"'+(next<0?" disabled":"")+'>'+(next>=0?FULL[next].n:"")+' ›</button></div><p class="src" style="text-align:center">經文依 CBETA 電子佛典集成；分段為閱讀便利所設。</p>';
 $("pg-read").innerHTML=h}
$("pg-read").onclick=function(e){var t=e.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a");
 if(a=="gostudy"){e.preventDefault();BOOKS.forEach(function(x,i){if(x.wno==readW)go(i,0)});return}
 if(a=="rprev"&&readW>0){readW--;renderRead();window.scrollTo(0,0)}else if(a=="rnext"&&readW<39){readW++;renderRead();window.scrollTo(0,0)}else if(a=="rtoc"){openToc()}};
/* 影音 */

 var h='<h2 class="ut">影音</h2><div class="ref">《法句經》講法</div>';
 MEDIA.forEach(function(m,i){h+='<div class="sec"><div class="lb">'+m.t+'</div><div class="vp" data-v="'+i+'"><img src="https://i.ytimg.com/vi/'+m.id+'/hqdefault.jpg" alt="" loading="lazy" onerror="this.hidden=true"><span class="pl">▶</span></div><a class="ext" href="https://www.youtube.com/watch?v='+m.id+'" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>'});
 h+='<p class="src" style="text-align:center">點縮圖即可在這裡播放；若無法播放，請按「在 YouTube 開啟」。影音內容與版權屬原作者。</p>';
 $("pg-media").innerHTML=h}

 v.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+m.id+'?autoplay=1&rel=0&playsinline=1" title="'+m.t+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>'};

function renderHome(){
 var A=items(),it=A[today()%A.length],u=BU(),tot=0,dd=0,h="";
 BOOKS.forEach(function(b){b.u.forEach(function(x){tot++;if(dcount(x)==4)dd++})});
 h+='<div class="hero"><svg class="enso" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 14 A46 46 0 1 1 28 26" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg><div class="ht">法句經</div><div class="hs">DHAMMAPADA</div><p class="hp">熏習《法句經》，看見起心動念，言行漸趨清明。</p><button class="go" data-a="cont">繼續學習<span>'+BOOKS[cb].n+'・第 '+(cu+1)+' 則　'+u.t+'</span></button></div>';
 h+='<div class="sec tap" data-a="today"><div class="lb">今日經文</div><p class="vs">'+it.k.h.join("<br>")+'</p><div class="ref">'+it.b.n+'　第 '+it.k.n+' 偈</div></div>';
 h+='<div class="sec"><div class="lb">各品・已完成 '+dd+'/'+tot+' 則</div>'+ordSeg()+ordIdx().map(function(i){var b=BOOKS[i],d1=0,pc=0;b.u.forEach(function(x){if(dcount(x)==4)d1++;pc+=dcount(x)});pc=Math.round(pc*100/(4*b.u.length));return '<button class="bk" data-bk="'+i+'"><span class="bkn">'+b.n+'<small>'+bkLabel(b)+'</small></span><span class="pb"><i style="width:'+pc+'%"></i></span><span class="bkc">'+d1+'/'+b.u.length+'</span></button>'}).join("")+'</div>';
 h+='<div class="qk"><button data-a="toc">目錄</button><button data-a="gold">金句圖卡</button><button data-a="media">影音</button></div>';
 $("pg-home").innerHTML=h}
$("pg-home").onclick=function(e){var t=e.target.closest("[data-a],[data-bk],[data-o]");if(!t)return;
 if(t.hasAttribute("data-o")){setOrd(t.getAttribute("data-o"));return}
 if(t.hasAttribute("data-bk")){var bi=+t.getAttribute("data-bk"),b=BOOKS[bi],k=0;for(var i=0;i<b.u.length;i++){if(dcount(b.u[i])<4){k=i;break}}go(bi,k);return}
 var a=t.getAttribute("data-a");
 if(a=="cont")show("learn");else if(a=="today")show("today");else if(a=="toc"){show("learn");openToc()}else if(a=="gold")show("gold");else if(a=="media")show("media")};
/* 頁面 */
function show(p){page=p;["home","learn","today","gold","media","set","read"].forEach(function(k){$("pg-"+k).hidden=(k!=p);var b=document.querySelector('[data-p="'+k+'"]');if(b)b.className=((k==p||(p=="read"&&k=="learn"))?"on":"")});
 if(p=="home")renderHome();else if(p=="learn")renderLearn();else if(p=="today")renderToday();else if(p=="gold")renderGold();else if(p=="media")renderMedia();else if(p=="read")renderRead();else renderSet();window.scrollTo(0,0)}
[].forEach.call(document.querySelectorAll("#tb button"),function(b){b.onclick=function(){show(b.getAttribute("data-p"))}});
if(ST.last&&BOOKS[ST.last[0]]&&BOOKS[ST.last[0]].u[ST.last[1]]){cb=ST.last[0];cu=ST.last[1]}else{BOOKS.forEach(function(b,i){if(b.wno==1)cb=i})}
apply();show("home");
