籽的情節是佛陀在她喪子時所說（那時說的是另一偈，第 287 偈，她證初果）；後來她出家，輪到點燈，看著火焰起滅，佛陀送出光明影像對她說第 114 偈：活一百年不見不死的境界，不如活一天見到，她證阿羅漢。連結程度：較鬆，要分清楚。芥菜籽的故事對應她領悟死亡人人都有，而第 114 偈對應的是她後來看火焰起滅的修行。"]], "x": "今天遇到難過的人，陪著就好，不急著解決；晚上想想：什麼能讓我在失去時仍站得穩？", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}, {"id": "s12", "t": "沒有法的百年", "s": "一位育有七子七女的母親，把財產分給眾多兒女，後來卻被他們冷落。她出家為比丘尼，夜裡專心禪修。佛陀以光明現身在她面前，說：一個人活一百年而沒有見到最上的法，不如活一天，見到最上的法。她聽後證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "115", "h": ["若人壽百歲，", "不知大道義，", "不如生一日，", "學推佛法要。"], "p": ["Yo ca vassasataṃ jīve, apassaṃ dhammamuttamaṃ;", "ekāhaṃ jīvitaṃ seyyo, passato dhammamuttamaṃ."], "hm": "漢傳第 16 偈與巴利第 115 偈的對應，是編者依內容與順序比對；蘇錦坤對讀表此處未能完整核對。", "d": "若有人活一百年，卻沒有見到最上的法；不如活一天，見到最上的法的人。"}], "g": [["dhamma", "法"], ["uttama", "最上"], ["apassaṃ", "沒有看見"], ["passato", "正看見者"], ["vassasata", "一百年"], ["jīvitaṃ", "生命"]], "w": [["大道義", "大道的義理"], ["學推佛法要", "學習探究佛法的要點"], ["百歲", "一百歲"]], "i": [["最後一偈", "從 110 到 115，是同一句型六次：活一百年，不如活一天。最後落在「最上的法」。"], ["述千品的總結", "這一品從「千句話」開始，到「一天的法」結束。看重的是：把一件事真正看懂。"],["故事與偈的連結","註釋的安排：佛陀從香室送出光明影像，在比丘尼面前說第 115 偈：活一百年不見最上之法，不如活一天見到最上之法，她當下證阿羅漢。連結程度：直接。故事前半（分財產被冷落而出家）是她出家的原因，偈對應的是她夜裡修行時的開示。"]], "x": "整理這一品，選一句你最想留在心裡的偈，今天用一件小事去活出它。", "q": {"q": "?", "o": [["a", "b", 1], ["c", "d"], ["e", "f"]]}}]});

var QFIX={"y1": {"q": "長老無意踩死小蟲而無過，前世的醫生卻受惡報，差別在哪？", "o": [["起心動念：有沒有惡意", "是的。同樣傷了生命，一個無心、一個有意，業就不同。「心為法本」：做之前那一念，已經決定了方向。", 1], ["小蟲有沒有死", "兩件事裡生命都受了傷，如果只看結果，兩人該同罪。可見業不只看發生了什麼，更看為什麼發生。"], ["是否已經出家", "身分只是外在的標籤。同樣的身分，起心不同，果報就不同。"]]}, "y2": {"q": "少年沒有機會布施、持戒，臨終一念淨信卻生善處，這說明什麼？", "o": [["有錢就能得到好的來生", "故事裡的父親很有錢，卻吝嗇到不肯為兒子請醫生，並沒有因財富得到什麼。心的質地，比擁有多少更重要。"], ["清淨的心念本身就有力量", "是的。善不只是大動作，一念清淨，也能成為轉向光明的力道；平日多養這樣的念頭，臨事才用得上。", 1], ["從此不必布施、持戒", "這樣理解會錯過故事後半：父親聽法後，反而把大半財產供養。淨信是起點，不是免除修行的理由。"]]}, "y3": {"q": "偈頌說怨恨要怎樣才平息？", "o": [["等對方先道歉", "道歉是好事，但偈頌把鑰匙放在自己手上：等對方，就是把自己的平靜交給別人掌控。"], ["找機會報復回去", "報復會讓念頭轉得更勤、更深，怨恨因此被養大。偈頌的方向正好相反：不再懷抱。"], ["不再把受傷的念頭一直放在心上", "是的。事件發生一次，反覆回想卻能「再發生」一百次；放下回想，怨恨便失去了燃料。", 1]]}, "y4": {"q": "兩個女子轉世多次互相報復，佛陀指出的出路是？", "o": [["以無怨回應，讓怨結停下來", "是的。怨恨從來靠怨恨止不了，總要有一方先放下。這一句話，成了千年不變的法則。", 1], ["讓力量較強的一方獲勝", "強弱只決定一時的輸贏，下一世角色對調，怨仇照舊循環。贏，不是出路。"], ["各自遠離，永不相見", "躲開可以暫時平靜，但心裡的結還在。故事裡是面對面、真正放下，怨才解開。"]]}, "y5": {"q": "偈頌說智者的爭執為什麼平息？", "o": [["因為辯論贏了", "贏了辯論，常常只換來另一次的不服氣。偈頌談的不是技巧，而是看事情的高度。"], ["想到「我們都會死」，爭執就沒那麼重要了", "是的。看見生命有限，很多「非贏不可」的事便鬆開了。這份體悟，比任何道理都更有說服力。", 1], ["因為有人出來裁判", "裁判可以結束一場爭吵，卻不一定結束心裡的火。偈頌說的是從內在平息。"]]}, "y6": {"q": "同樣面對魔的考驗，一個像弱樹、一個像岩山，差別在哪？", "o": [["年紀的大小", "年紀不保證什麼。偈頌看的是修行的態度：有沒有守護，有沒有精進。"], ["家產的多少", "財產與風吹不倒無關。能不能穩住，要看內在的功夫。"], ["是否守護諸根、飲食知量、持續精進", "是的。岩山不是天生堅硬，而是日日守護、日日修習。穩，是練出來的。", 1]]}, "y7": {"q": "偈頌說怎樣的人才真正配得袈裟？", "o": [["已去除染污，持戒、調御並真誠", "是的。袈裟是外相，內在的清淨才是實質。穿上它容易，名實相符，要用一生去做。", 1], ["穿著最貴重的袈裟", "故事裡那件袈裟貴重，卻穿在不相稱的人身上，反而成了諷刺。價值不在布料。"], ["出家年資最久", "年資只說明時間長短，不說明心有多淨。偈頌看的是戒與真實。"]]}, "y8": {"q": "刪闍耶為什麼不肯跟隨弟子去見佛陀？", "o": [["路途太遙遠", "路遠只是藉口。故事的重點是他心裡的門沒有打開。"], ["老師的身分與我慢，讓他不願低頭", "是的。我慢最難察覺：它讓人把「面子」當成「真理」。看清這一點，才可能轉向。", 1], ["他不知道佛陀是誰", "兩位弟子已經詳細告訴他了。他不是不知道，而是不肯。"]]}, "y9": {"q": "偈頌用「漏雨的屋頂」比喻什麼？", "o": [["房子要蓋得堅固才安全", "這是譬喻，指的不是房子。真正要修補的，是心。"], ["雨季要先準備糧食", "譬喻的重點不在天氣，而在「事先修補」，也就是平日修習自心。"], ["心若沒有修習，貪欲就會滲進來", "是的。屋頂要在天晴時修，心也一樣：平日的修習，是為了不被忽然襲來的雨淋濕。", 1]]}, "y10": {"q": "作惡者的憂苦，從什麼時候開始？", "o": [["看見自己污濁行為的時候，今生就開始", "是的。良心不必等別人審判；每次回頭看見自己做了什麼，那份不安就已經在了。", 1], ["要等死後才會", "偈頌說「此世、彼世皆憂」。憂不必等到死後，今生看見自己所為的時候就開始了。"], ["要等被別人發現才會", "被發現只是外在的壓力。偈頌談的是更內在的：自己知道自己做了什麼。"]]}, "y11": {"q": "達摩迦的歡喜來自哪裡？", "o": [["別人的稱讚與名聲", "稱讚來來去去，靠它得到的歡喜也跟著來去。偈頌說的是更穩的歡喜。"], ["看見自己行為清淨，內心安穩", "是的。這種喜悅不依賴他人，因為來源是自己：做了該做的事，睡得安穩。", 1], ["財富增加", "財富能帶來方便，卻帶不來「行為清淨」的安心。"]]}, "y12": {"q": "偈頌說作惡的人，最後的感受是？", "o": [["得意與滿足", "得意只在作惡的當下；偈頌看的是後來：今生灼惱，來世更甚。"], ["什麼感覺也沒有", "不去感覺，不等於沒有。偈頌說「灼惱」，是像被燒灼般的悔恨。"], ["悔恨，而且越來越重", "是的。惡業的苦不只是外來的，更是心裡那句「我造了惡」；它只會越來越沉。這也是及時回頭的理由。", 1]]}, "y13": {"q": "蘇摩那稱父親為「弟弟」，是因為？", "o": [["她的證悟階位比父親高", "是的。她已證斯陀含，父親是須陀洹。歡喜行善的人，看人的角度也不同：看的是彼此在道上的位置。", 1], ["她年紀比父親大", "這是我們日常的想法。故事的答案不在年紀，而在道上的進步。"], ["她當時神智不清", "佛陀明確說她神智清明。這是一個提醒：別用平常的標準衡量證悟者。"]]}, "y14": {"q": "「牧牛人替別人數牛」的比喻，要提醒我們什麼？", "o": [["多讀經的人最有福", "偈頌恰好相反：多讀而不行，像在替別人數牛。福在於行。"], ["只讀不行，就得不到修行的果實", "是的。數得再清楚，牛還是別人的。經讀得再多，沒有落實，果實仍不屬於自己。", 1], ["不需要讀經", "偈頌並不否定讀經，而是強調讀了要做；少讀而實行，更勝多讀不行。"]]}, "z1": {"q": "偈頌說的「不死」是什麼意思？", "o": [["身體永遠不衰老", "註釋明確說不是指肉身。所有有形之物都會壞，偈頌指向的是更根本的出路。"], ["死後生到天上享福", "天界仍在輪迴之中，福盡仍會墮落，不算「不死」。"], ["不再輪迴，證得涅槃", "是的。「不死」說的是超越生死輪迴；不放逸，就是走向這條路的方式。", 1]]}, "z2": {"q": "偈頌說名聲是怎樣增長的？", "o": [["勤奮、正念、清淨、依法而活，名聲自然增長", "是的。名聲是行為的影子，而不是目標。把腳步走好，影子自己會跟上來。", 1], ["靠宣傳與包裝", "包裝來得快，也散得快。偈頌談的是行為累積出來的名聲。"], ["靠運氣與機會", "運氣也許帶來一時的曝光，但偈頌說的名聲，是勤奮與清淨一天天累積的。"]]}, "z3": {"q": "周利槃特最後是怎麼開悟的？", "o": [["把經典背得滾瓜爛熟", "他到最後也背不住。這個故事正是在說：成就不取決於記憶力。"], ["專心搓一塊白布，看見它變髒，領悟心垢", "是的。連經文都背不住的人，從一個簡單的動作看見無常與心垢。開悟不是聰明的專利，而是專一與誠懇。", 1], ["靠哥哥耐心的教導", "哥哥後來曾經放棄他。真正帶他前進的，是佛陀給的簡單方法，與他自己的專一。"]]}, "z4": {"q": "偈頌說智者視為最珍貴的「財寶」是什麼？", "o": [["財富", "偈頌借「財寶」作比喻，說的是智者珍惜的東西，不是錢。"], ["名聲", "名聲得靠別人給，不放逸卻是自己能守護的。"], ["不放逸", "是的。智者守護的不是金銀，而是每個當下的覺察。這份財，不會被偷走。", 1]]}, "z5": {"q": "佛陀對大迦葉說「這不是你該費心的事」，用意是？", "o": [["眾生無量，這份知見屬於諸佛的領域，不必為此耗神", "是的。知道自己能力的邊界，也是一種智慧：把心力放在能修、能行的地方。", 1], ["他不夠聰明", "不是能力問題。有些事再有能力，也不是此刻最該做的。"], ["天眼其實沒有用", "天眼有用，但用在不必要的地方，就成了負擔。"]]}, "z6": {"q": "偈頌裡的「快馬」比喻什麼？", "o": [["跑得最快的修行者", "偈頌不是在比賽誰快，而是說在昏睡的人群裡保持清醒。"], ["在眾人放逸時，仍保持警醒的智者", "是的。快不在速度，而在眾人鬆懈時，自己仍清醒。", 1], ["身體強健的人", "這是比喻，快馬指的是心的警醒。"]]}, "z7": {"q": "摩伽故事裡的「不放逸」，具體表現是？", "o": [["整天打坐，不做其他事", "故事裡他做的是修路與造福。不放逸表現在行動，不只在打坐。"], ["隆重祭祀天神", "他得到天界的地位，是因為持續的善行，而不是祭祀。"], ["持續不懈地修路、造福眾人，守住誓願", "是的。不放逸不是神祕的境界，而是把善行日復一日做下去。", 1]]}, "z8": {"q": "比丘從大火領悟到什麼？", "o": [["聖道的智慧，能像火一樣燒盡大大小小的束縛", "是的。看見火，不只看見災難，也看見「燒盡」的力量；修行者處處都是老師。", 1], ["要遠離火災", "這是一般人的反應。比丘卻能從火的樣子，連到修行。"], ["世界終將毀滅", "那是另一種聯想。這則故事要說的是：從火看見「燒盡束縛」的力量。"]]}, "z9": {"q": "佛陀為何稱讚提舍？", "o": [["他最有名", "故事裡的他其實默默無名。偈頌稱讚的是內在的少欲。"], ["他少欲知足，不攀緣、不求名", "是的。少欲的人看似平凡，卻最少被牽動；這份安定，就是接近涅槃的樣子。", 1], ["他最富有", "他生活簡樸。真正的富有，是知足。"]]}, "a1": {"q": "第二偈給的結論是什麼？", "o": [["一切都會消失，所以沒有意義", "這是常見的誤解。偈頌的結論不是虛無，而是「止息為樂」。"], ["既然無常，就要及時享樂", "享樂也屬於會消逝的一部分。偈頌指向的是不再被它牽引的安樂。"], ["生滅止息，才是真正的安樂", "是的。看見無常不是為了悲觀，而是看見：當不再被生滅牽著走，心才安。", 1]]}, "a2": {"q": "河水的比喻要提醒我們什麼？", "o": [["過去的時間一去不返，要珍惜當下", "是的。同一條河，你不會踏進第二次。這個提醒不是為了焦慮，而是為了把今天過好。", 1], ["河水的水量很大", "重點不是水量，而是「奔去不回」。"], ["河流終有乾涸的一天", "這個比喻說的是水一去不回，而不是水會乾。"]]}, "a3": {"q": "牧牛人用杖趕牛，這裡的「杖」比喻什麼？", "o": [["對惡行的懲罰", "這裡不是談懲罰。衰老與疾病落在每個人身上，不分善惡。"], ["衰老與疾病，把壽命一步步趕向終點", "是的。杖不是懲罰，而是催促：它讓我們看見時間不等人，趁還能行動時多做該做的事。", 1], ["財富與地位", "財富不是驅趕壽命的力量。杖指的是衰老與病。"]]}, "a4": {"q": "第六偈說，人辛苦積聚的財富，最後會怎樣？", "o": [["全部留給子孫", "即使留給子孫，自己也帶不走，而且子孫同樣要面對無常。"], ["越存越多，永不減少", "這正與偈頌相反：一切積聚，以耗盡為終。"], ["終究要離開，帶不走", "是的。重點不是不能擁有，而是知道它不是最後的依靠。", 1]]}, "a5": {"q": "「合會有離」說的是？", "o": [["相聚的終點，是分離", "是的。這句話不是要我們冷淡，而是要我們在相聚的時候，更用心。", 1], ["分開之後一定能再相聚", "相聚之後能不能再見，誰也不能保證。正因為不一定，才要珍惜現在。"], ["相聚的緣分可以永遠不變", "一切會合，以分離為終。把相聚當成永恆，反而更容易受傷。"]]}, "a6": {"q": "第十偈說智者看見老病死之後，心裡會怎樣？", "o": [["更加緊抓著生命不放", "這是世人常有的反應，偈頌說的是智者的另一條路：放下。"], ["心生捨離，放下對家的牽絆", "是的。看見老病死，不是為了恐懼，而是看清什麼才是真正值得依靠。", 1], ["只剩下絕望", "絕望是被擊倒；偈頌中的智者是看清之後，心反而輕了。"]]}, "a7": {"q": "「少水魚」的比喻提醒我們什麼？", "o": [["魚在水裡很快樂", "偈頌問的是「有何可樂」，語氣正好相反。"], ["應該多多養魚", "這個比喻與養魚無關，說的是壽命一天天減少。"], ["日夜消逝，時間漸少，要把握當下修行", "是的。水一天比一天少，魚是知道的：此刻不做，就沒有「以後」可以倚靠。", 1]]}, "a8": {"q": "優多羅比丘尼聽完佛陀的偈後，得到什麼？", "o": [["證得初果", "是的。看清身體的真相，不是為了嫌棄它，而是不再把它當作最後的依靠，心便有了出路。", 1], ["決定還俗回家", "故事的方向相反，她因聽法而向前走。"], ["感到失望而離開精舍", "她沒有離開，而是在法中得到了安穩。"]]}, "a9": {"q": "偈頌說放縱嗜欲的結果是？", "o": [["帶來更多快樂", "快樂只在當下；偈頌關心的是後續：越放縱，越看不清楚。"], ["不合法的事增加，也看不見無常", "是的。放縱的代價不是立刻出現，而是一點一點蒙蔽了看見的能力。", 1], ["沒有什麼影響", "習慣會自己加深。看似沒事，其實正在變成更深的慣性。"]]}, "a10": {"q": "第十七偈想說明什麼？", "o": [["親人其實不重要", "親情當然重要，只是面對死亡時有它的極限。看見極限，反而更懂得珍惜。"], ["兒子才是真正的依靠", "連兒子也不是庇護。偈頌把依靠指向法與自己的修行。"], ["面對死亡，連最親的人也無法替自己承擔", "是的。這不是說親情不重要，而是提醒：最終的功課，要自己完成。", 1]]}, "a11": {"q": "「四種弊病」是在提醒什麼？", "o": [["我們其實是在傷害、欺騙自己", "是的。偈頌的矛頭指向自己：懶惰、貪欲、吝嗇、不受教，傷的都是自己。", 1], ["別人身上的毛病", "偈頌說的是自己，不是別人。拿它去看別人，反而錯過了。"], ["年輕人才會有的問題", "偈頌特別點到老人，說明這些習氣不因年紀而消失。"]]}, "a12": {"q": "第十九偈列出哪些地方，說明死亡無處可逃？", "o": [["城市與村落", "偈頌列的是人們以為最能躲的地方：空中、海中、山洞。"], ["空中、海中、山洞", "是的。天上、海底、山中，哪裡都躲不開。這不是恐嚇，而是邀請：既然無處可逃，不如好好面對。", 1], ["寺院與森林", "偈頌列舉的是空中、海中與山洞，這兩處不在其中。"]]}, "a13": {"q": "第二十一偈給的出路是？", "o": [["加倍努力工作", "第二十偈描述的正是這種「忙了這個又忙那個」，沒有盡頭。"], ["離開社會，躲到山裡", "偈頌講的是心的安定，不是地點的逃離。"], ["安定禪思、精勤修行", "是的。第二十偈的忙亂沒有盡頭；停下來、安定，才看得見生與老的盡頭。", 1]]}, "c1": {"q": "梅吉亞在芒果園坐了一整天沒進展，佛陀點出的重點是？", "o": [["心本來就搖動，需要調伏；環境不是關鍵", "是的。好環境能幫忙，但心沒有調過，換到哪裡都一樣。先調心，再談地方。", 1], ["芒果園不夠安靜", "也許不夠安靜，但偈頌沒有往外找原因，而是回頭看心：它像離水的魚，一直在跳。"], ["他根本不該出家", "故事結尾，他證得初果。修行遇到阻礙，不代表走錯路，而是看見了功課。"]]}, "c2": {"q": "怕被讀心的比丘回來見佛陀，佛陀教他怎麼做？", "o": [["離開那個村子，不再回去", "躲開可以暫時避免，卻治不了怕被看見的心。佛陀要他回去面對。"], ["不躲開，回去守護自己的心、專注禪修", "是的。怕被看見，是因為念頭不穩；念頭穩了，就不必害怕。", 1], ["找女居士談清楚", "談清楚也許能安心一時，但根本在自己的念頭。佛陀的處方是守心。"]]}, "c3": {"q": "偈頌說心「極難見」，這提醒我們修行要從哪裡開始？", "o": [["直接把念頭壓下去", "壓制往往讓念頭更用力反彈。偈頌的字眼是「守護」，像看顧一個孩子。"], ["放棄，因為心本來就難掌握", "難，不等於不能。偈頌說：守護好的心，會帶來安樂。"], ["先看見念頭，再談守護", "是的。看不見的東西沒辦法守，這也是為什麼要先「看見起心動念」。", 1]]}, "c4": {"q": "偈頌說心「獨行」，意思最接近？", "o": [["沒有人能代替你看管自己的心", "是的。念頭只有你看得見，也只有你能調伏。這是困難，也是自由。", 1], ["心不喜歡與人相處", "這不是在說性格，而是說念頭生在每個人自己的裡面。"], ["要請別人幫忙管心", "別人的提醒能幫忙，但最終是自己調伏。外甥的幻想，只有他自己看得見。"]]}, "c5": {"q": "長老反覆出家、還俗，最後為什麼能定下來？", "o": [["有人規定他不能再還俗", "故事裡沒有人強迫他。真正的轉折，在他看見熟睡的妻子那一刻。"], ["他看清身體的無常，心才安住", "是的。不是環境變了，而是看見的方式變了，心才不再來回擺盪。", 1], ["僧團供養豐厚", "供養的多少改變不了心。是他自己的領悟，讓他定下來。"]]}, "c6": {"q": "偈頌說要用什麼和魔作戰？", "o": [["更堅強的意志力", "意志力有用，但偈頌點名的武器是「慧」：看清楚，比硬撐更有力。"], ["遠離一切人群", "比丘們是進入森林，用慈心與智慧面對，不是逃避。"], ["智慧，並守住心這座城", "是的。故事裡先用慈心化解外在的敵意，再用智慧守住內心。外靠慈，內靠慧。", 1]]}, "c7": {"q": "第 41 偈說身體失去「識」後像一根木頭，這提醒我們什麼態度？", "o": [["現在好好善待身體，也不執著它", "是的。身體是借來修行的房子：好好照顧，也不抓牢。", 1], ["身體像寶塔，要永遠保存", "偈頌的比喻正好相反。身體沒有識，就像被丟棄的木頭。"], ["身體不重要，不必照顧", "偈頌不是輕視身體；佛陀還親自為病中的提舍洗浴。"]]}, "c8": {"q": "比丘問：難陀被殺，是不是因為佛陀來訪？佛陀怎麼回應？", "o": [["是的，佛陀不該去", "佛陀沒有把原因歸給任何人，而是把焦點從外在事件，轉回心的方向。"], ["死不可免；而放錯方向的心，傷害比仇敵更大", "是的。外在的危險是有限的，內心方向若偏了，連自己都成了敵人。", 1], ["獵人必定受報，所以不必在意", "佛陀的重點不在追究他人的報應，而是看見自己的心。"]]}, "c9": {"q": "第 43 偈把「正確安置的心」與什麼相比？", "o": [["財富與權勢", "偈頌談的是更內在的東西。財富給不了「心的方向」。"], ["神通與法力", "偈頌談的是日常念頭的方向，不是特殊的能力。"], ["父母與親族能給的幫助", "是的。父母的愛很珍貴，偈頌說：心的方向，終究要自己來定。", 1]]}, "p1": {"q": "佛陀為何對談論土地的比丘說「採花」的偈？", "o": [["把目光從外在的土地，轉回自己的身心", "是的。學習的材料，隨時都在眼前；最近的一塊土地，是自己。", 1], ["要他們別再聊天", "佛陀沒有要他們沉默，而是把話題引向更有益處的觀察。"], ["要他們去種花", "花是比喻：從善說的法句中採擷，像花匠一樣用心。"]]}, "p2": {"q": "比丘是怎麼體會到身體不實的？", "o": [["讀了許多經典", "故事裡是從一次次的觀察開始。經典是指路，看見才是自己的。"], ["從海市蜃樓與水泡，親身觀察到的", "是的。道理聽過很多遍，不如親眼看見一個泡泡破掉。", 1], ["聽別人轉述", "別人的轉述不能代替自己的看見。"]]}, "p3": {"q": "第 47 偈用什麼比喻死亡的來臨？", "o": [["一陣輕輕的微風", "偈頌強調的是突然與無法抵擋，不是輕柔。"], ["野獸的追逐", "偈頌用的是洪水與沉睡的村莊，重點在「沒有防備」。"], ["洪水突然沖走沉睡的村莊", "是的。人在忙著採花，不知洪水已漲。提醒的不是恐懼，而是清醒。", 1]]}, "p4": {"q": "第 48 偈提醒我們欲樂的哪一個特性？", "o": [["永遠沒有「夠」的時候，而死亡不會等待", "是的。與其等「滿足了再說」，不如現在就練習知足。", 1], ["欲樂能帶來長久的滿足", "偈頌正相反：還沒滿足，死神就先到了。"], ["只要賺夠錢就不受死亡影響", "財富與死亡無關；死亡平等地來到每個人。"]]}, "p5": {"q": "偈頌用蜜蜂比喻什麼樣的相處？", "o": [["不停地到處飛行", "蜜蜂的重點不是飛，而是採蜜時的分寸。"], ["取用所需，卻不損傷對方的好", "是的。蜂取蜜，花依舊美麗芬芳。與人往來也可以這樣：拿走需要的，留下原有的好。", 1], ["盡量囤積成果", "偈頌說「只取味而去」，是節制，不是囤積。"]]}, "p6": {"q": "第 50 偈建議我們把觀察放在哪裡？", "o": [["別人的過失", "盯著別人，常讓自己的功課荒廢。偈頌請我們收回目光。"], ["別人的成就", "拿別人的成就來比較，一樣是向外看。偈頌請我們向內看。"], ["自己做了與沒做的事", "是的。別人的是非很難改變，自己的作為卻是此刻能做的功課。", 1]]}, "p7": {"q": "兩首偈用「有香與無香的花」，比喻什麼差別？", "o": [["善說的法，有沒有被實行", "是的。花的美不變，香是從「做」來的。", 1], ["花的種類不同", "花是同一朵，差別只在有沒有香。"], ["說話聲音的大小", "偈頌不在乎聲音，在乎行不行。"]]}, "p8": {"q": "第 53 偈用「花堆編成花環」，鼓勵我們怎樣行善？", "o": [["等有能力時，做一件大事", "偈頌鼓勵的是「多」做，從眼前開始。"], ["把一件件小善，串成許多善行", "是的。不必等大事，眼前的一朵花，就能成為花環的一部分。", 1], ["只做最有名的善行", "善不在大小與名聲；一朵朵的小花，才編成花環。"]]}, "p9": {"q": "第 55 偈說最上的香是？", "o": [["旃檀的香", "旃檀已是名貴的香，但偈頌說戒香勝過它。"], ["花的香", "花香最淡，也不能逆風。"], ["戒香", "是的。戒不是限制，而是讓人身上沒有臭味，別人才放心靠近；這份香連逆風都能傳。", 1]]}, "p10": {"q": "大迦葉選擇到貧窮人家托缽，用意是？", "o": [["給窮人一個成就大福德的機會", "是的。接受供養，也是在成全對方；有時，願意「接受」也是慈悲。", 1], ["因為那裡的食物最好", "故事中他受供養的只是簡單飯菜，重點在成全布施的人。"], ["為了避開富人", "他不是避開誰，而是想到窮人也需要布施的機會。"]]}, "p11": {"q": "瞿提迦被病打斷六次，仍回來修行，這個態度像偈頌裡的什麼？", "o": [["貪著安樂，多多休息", "他知道休息，但沒有因此放棄；決心是他的關鍵。"], ["不放逸：一次次回到該做的事", "是的。不放逸不是從不跌倒，而是每次跌倒都再起來。", 1], ["等一切順利才開始", "故事反而是在逆境中完成的。"]]}, "p12": {"q": "偈頌用「垃圾堆裡的蓮花」比喻什麼？", "o": [["外貌出眾的人", "偈頌談的不是外貌，而是智慧。"], ["富有的人", "財富與蓮花的比喻無關；光彩來自智慧。"], ["身處盲目的凡夫之中，仍綻放智慧的佛弟子", "是的。蓮花不挑泥，也不被泥污。環境不能決定我們開不開花。", 1]]}, "b1": {"q": "偈頌說的「愚人」指的是誰？", "o": [["不了解正法的人", "是的。這個「愚」不是智商，而是還不認識正法；不認識，是可以學習的。", 1], ["智商較低的人", "偈頌談的不是聰明與否，而是有沒有看見正法。"], ["年紀小的人", "與年紀無關；年長的人也可能不明白正法。"]]}, "b2": {"q": "佛陀對「與愚昧的同伴同住」的建議是什麼？", "o": [["努力說服對方改變", "可以給善意，但對方不願改時，佛陀的建議是保護自己的修行。"], ["與其與愚為伍，不如獨自前行", "是的。這不是要孤僻，而是不為了合群而放低自己的標準。", 1], ["以牙還牙，教訓他", "那只會增加怨恨，方向正好與佛法相反。"]]}, "b3": {"q": "偈頌說「連自己都不屬於自己」，用意是？", "o": [["要大家別照顧子女", "照顧子女是責任；偈頌要放下的，是「這是我的」那份緊抓。"], ["財富都是壞的", "財富本身不是問題，緊抓不放才是。"], ["連最親近的「我」都無法完全掌控，子與財更是借來的", "是的。看見「我的」並不牢靠，抓得就沒那麼緊，也就沒那麼苦。", 1]]}, "b4": {"q": "偈頌說，「真正的愚人」是？", "o": [["自以為聰明的人", "是的。知道自己不懂，門就開著；以為自己懂了，門便關上了。", 1], ["知道自己不足的人", "這樣的人反而近於智者，因為他願意學。"], ["沒有讀過書的人", "偈頌不談學歷。有學問也可能自以為是。"]]}, "b5": {"q": "「勺子嘗不出湯味」說的是什麼狀況？", "o": [["智者的口才不好", "重點不在智者，而在自己有沒有用心體會。"], ["天天親近智者，卻沒用心去體會", "是的。泡在湯裡不等於知味；要「嘗」，才懂。", 1], ["湯太淡所以沒味道", "這是比喻：湯有味，是勺子沒有感受的能力。"]]}, "b6": {"q": "與第 64 偈相比，第 65 偈想說明什麼？", "o": [["親近越久越有收穫", "不是時間決定的，是心有沒有打開。"], ["只有出家人才能領會", "能不能領會，看的是心明不明白，而不是身分；偈頌說的是「明智者」。"], ["心開通的人，短時間也能領會", "是的。舌頭一碰就知，是因為它有能知的「感受力」。", 1]]}, "b7": {"q": "帝釋用財富誘惑善覺放棄三寶，善覺怎麼回應？", "o": [["說自己已有信、戒、慧等聖財，不為所動", "是的。真正的富有，是內心的聖財；外在的財富換不走它。", 1], ["接受財富，繼續信佛", "故事裡他婉拒了，因為他已經很富足。"], ["沉默不語，拖延回答", "他明確而安然地回答，沒有動搖。"]]}, "b8": {"q": "偈頌用什麼標準，來判斷「不好的事」？", "o": [["別人會不會看見", "沒人看見也一樣有果報。偈頌看的是自己的心。"], ["做了之後會讓自己後悔", "是的。這是很實用的提問：做之前，想一想做完會不會後悔。", 1], ["能不能賺到錢", "賺到的錢也可能帶來後悔，就像故事裡的農夫。"]]}, "b9": {"q": "須摩那的供養為什麼被稱為「好事」？", "o": [["因為花的價值很高", "供養的價值不在花的貴賤，而在當下的心。"], ["因為國王賞賜了他", "賞賜是後來的事；偈頌看的是做的當下心裡有沒有悔。"], ["做了之後不後悔，心中歡喜", "是的。他冒著受罰的風險，卻毫無遲疑與後悔；這份無悔，是善行的味道。", 1]]}, "b10": {"q": "偈頌說愚人把惡業當成「蜜」，是在什麼時候？", "o": [["惡業還沒成熟的時候", "是的。果子還沒熟，不代表沒有種下；等到成熟，後悔就來不及了。", 1], ["惡業成熟之後", "那時愚人已經受苦，不再覺得甜。"], ["做善事的時候", "偈頌談的是惡業，不是善事。"]]}, "b11": {"q": "第 70 偈要比較的是什麼？", "o": [["吃得多與吃得少", "偈頌談的不是食量，而是苦行與智慧的比較。"], ["外表的苦行，與了知法的智慧", "是的。吃得再少、苦行再久，若沒有智慧，還是比不上了知法。", 1], ["有錢與沒錢的人", "偈頌談的不是貧富。"]]}, "b12": {"q": "偈頌用什麼比喻惡業的後果？", "o": [["水面的漣漪", "漣漪會散去；偈頌的重點是它一直跟著。"], ["熟透的果子", "那是第 69 偈的比喻；這一偈說的是火。"], ["被灰蓋住的火", "是的。灰下的火看起來冷，實際仍燙。惡業不立刻發作，不代表消失。", 1]]}, "b13": {"q": "偈頌認為愚人得到知識，會怎樣？", "o": [["知識反而傷害自己", "是的。沒有善心與智慧引導，技能像刀，會割傷持刀的人。", 1], ["使他更成功", "短期也許如此，偈頌看的是長遠：損害自己。"], ["使他更快樂", "偈頌說的是「為無益」，不是快樂。"]]}, "b14": {"q": "第 74 偈說，愚人的欲望會與什麼一同增長？", "o": [["智慧", "智慧會減少我慢；偈頌說的是相反。"], ["我慢", "是的。想被需要、想說了算，都是「我」在長大。", 1], ["謙卑", "愚人的想法是「都要聽我的」，與謙卑相反。"]]}, "b15": {"q": "第 75 偈說，比丘不應怎樣？", "o": [["接受任何食物", "偈頌談的是貪著，不是接受。"], ["學習佛法", "偈頌鼓勵修行。"], ["貪著供養與尊敬", "是的。被供養是結果，不是目標。把目標放在遠離與修行。", 1]]}, "m1": {"q": "偈頌把「指出過失的人」比作什麼？", "o": [["指出寶藏的人", "是的。我們自己看不到的盲點，就是藏起來的寶；有人替你指出來，是省了你許多冤枉路。", 1], ["與你爭辯的人", "偈頌說的是「指出過失」，不是爭辯。好的指正，是為了對方好，而不是為了贏。"], ["奉承你的人", "奉承讓人舒服，卻不會讓人進步。偈頌選的是願意直說的人。"]]}, "m2": {"q": "偈頌說，勸誡、教導、制止他人錯誤的人，會怎樣？", "o": [["人人都喜歡他", "如果人人都喜歡，那多半沒有真的說到重點。偈頌說得更真實：有人不喜歡，是正常的。"], ["善人喜愛他，惡人討厭他", "是的。勸人一定有代價，偈頌說得很坦白：先想清楚，我是為了對方好，還是為了被人喜歡。", 1], ["他一定會得到回報", "偈頌沒有承諾回報。它只說了人們的反應，其餘由我們自己決定要不要做。"]]}, "m3": {"q": "從車匿的故事，我們可以怎麼用在自己身上？", "o": [["遠離所有不同意自己的人", "偈頌說的是惡友，不是「不同意見的人」。能指出你過失的人，是第 76 偈的寶藏。"], ["只要自己意志堅定，朋友怎樣都沒關係", "漢譯說「朋友志未強，隨色染其素」：意志未堅定時，朋友的氣氛特別有影響。"], ["留意身邊的人，也問自己是不是別人的損友", "是的。環境會悄悄改變人。故事最後，車匿是被冷處理之後才反省的，這提醒我們：最好的反省，不必等到別人不理你。", 1]]}, "m4": {"q": "「dhammapīti」的意思是？", "o": [["喝法、以法為喜的人", "是的。聽法、讀經不是任務，是讓心變清澈的水。能喝到的人，連睡覺都安穩。", 1], ["學問很高的人", "偈頌用的是「喝」，不是「學」。重點不是知道多少，而是有沒有喝到。"], ["擁有很多經書的人", "擁有不等於喝到。重點是自己心裡的感受。"]]}, "m5": {"q": "偈頌說，智者做什麼和農夫、造箭人、木匠相似？", "o": [["改造環境", "偈頌說的是調伏「自己」。環境可以參考，但先處理的是自己。"], ["調伏自己", "是的。他們用工夫調整水、箭、木，智者則把同樣的工夫用在自己身上。", 1], ["與人比賽技藝", "偈頌沒有比賽的意思，講的是各自在專業上的專注，轉到自己的心。"]]}, "m6": {"q": "偈頌用「岩石不被風吹動」，說的是智者面對什麼？", "o": [["困難和危險", "偈頌指名的是「毀謗與讚美」，兩種都是來自別人的評價。"], ["朋友與敵人", "偈頌談的是評價，不是人的身分。"], ["毀謗與讚美", "是的。偈頌把讚美和批評都當成風：被讚美，心不飄；被批評，心不沉。", 1]]}, "m7": {"q": "聽法後，智者的心像什麼？", "o": [["澄淨的深湖", "是的。湖水不是不被攪動，而是讓泥沙慢慢沉澱；聽法讓心慢慢澄清。", 1], ["燃燒的火", "偈頌的比喻是平靜的湖，不是火。"], ["堅硬的岩石", "岩石是第 81 偈的比喻，講的是毀譽不動。這一偈用的是湖水的澄淨。"]]}, "m8": {"q": "偈頌說智者面對苦與樂，會怎樣？", "o": [["完全沒有感覺", "偈頌用的是「被觸動」，不是沒感覺；差別在是否讓它主導。"], ["不顯出高低起伏", "是的。苦樂都會觸動，但智者不讓它寫在臉上、說在話裡、反映在選擇中。", 1], ["盡量避開", "偈頌不是教人躲開苦樂，而是在經歷它們時保持穩定。"]]}, "m9": {"q": "第 84 偈的重點是？", "o": [["不要為別人做事", "偈頌說的是動機不被私心綁架，不是冷漠。"], ["不要擁有財富", "偈頌談的是求取的方式，不是擁有本身。"], ["不用不正當的方法求取自己的成功", "是的。這不是不要成功，而是成功的方式要乾淨。最難的是：偏偏走捷徑最容易。", 1]]}, "m10": {"q": "第 85 偈說，大多數人像什麼？", "o": [["沿著這一岸跑來跑去", "是的。漢譯說「世皆沒淵」，巴利說「沿岸奔跑」：一個沉沒，一個忙碌，都是沒到岸。", 1], ["已經到達彼岸", "偈頌說的正好相反：到彼岸的人是少數。"], ["停在原地不動", "偈頌描繪的是「跑」：忙碌卻沒有方向。"]]}, "m11": {"q": "這三偈（87–89）的順序，給我們什麼啟示？", "o": [["先證果，再放下", "順序正好相反。放下是起點。"], ["先放下，再淨化，最後才談證果", "是的。順序很實際：不是一步登天，而是先捨黑法、養白法，才有後面的事。", 1], ["三偈各講不相干的事", "這三偈是連續的步驟：放下、清心、成就。"]]}, "r1": {"q": "偈頌說阿羅漢不再有什麼？", "o": [["感覺", "偈頌說的是熱惱，不是沒有感覺。覺知仍然在，只是火沒了。"], ["朋友", "偈頌談的是內心的火，與朋友無關。"], ["熱惱（pariḷāha）", "是的。pariḷāha 是燒灼感：焦慮、怒氣、追逐。偈頌把阿羅漢形容為冷卻，不是麻木，而是不再被火燒。", 1]]}, "r2": {"q": "偈頌用「鵝離開池塘」，說的是？", "o": [["不把住處當成自己的", "是的。鵝離池不回頭，不是冷漠，是不把池塘當成自己的。", 1], ["必須離開所有地方", "大迦葉就是留下來處理事務的人。重點不在去或留，而在黏不黏。"], ["拋棄所有人", "偈頌說的是不執著於住處，不是拋棄人。"]]}, "r3": {"q": "「pariññātabhojanā」指的是？", "o": [["不吃東西", "偈頌說的是了知飲食，不是不吃。"], ["徹底了知飲食，吃到剛好", "是的。不貪、不拒，剛剛好。這是在日常裡最容易檢查的修行：現在是在吃，還是在被食物拉著走？", 1], ["只吃很簡單的食物", "偈頌談的是對飲食的態度，不是種類。"]]}, "r4": {"q": "偈頌說，阿羅漢「對飲食沒有依賴」，是什麼意思？", "o": [["絕對不接受供養", "阿那律的故事裡，食物是天女供養的，他沒有拒絕，也沒有開口求。"], ["食物對他沒有味道", "不依賴不等於沒有感覺。重點是心不被牽著。"], ["吃，但不把心交給吃", "是的。anissita 是不依賴。吃是日常，不依賴是心的狀態。", 1]]}, "r5": {"q": "偈頌用什麼來比喻調伏好的諸根？", "o": [["被駕馭者調好的馬", "是的。好馬不是不跑，是跑得有節奏。諸根也是：看、聽、想，都在掌握之中。", 1], ["被關起來的野獸", "偈頌用的是「被調好的馬」，不是被關住。調伏不是壓制。"], ["不會動的石頭", "調伏不是不動，是有節奏、聽指揮。"]]}, "r6": {"q": "舍利弗被誣告後，如何回應？", "o": [["憤怒地反駁", "偈頌說阿羅漢像大地，不嗔怒。反駁會讓衝突升高。"], ["以大地、門閂、清湖自比，並接受對方的懺悔", "是的。最動人的是：他接受懺悔之後，也請對方原諒自己。穩定，不是高高在上。", 1], ["保持沉默，不理會", "故事裡他明白地說了自己的狀態，並與對方和好，不是冷處理。"]]}, "r7": {"q": "第 96 偈說，阿羅漢的什麼是寂靜的？", "o": [["只有外表", "偈頌談的是內在的寂靜，延伸到語言與行為。"], ["只有身體", "偈頌包括心、語、行三者，不只身體。"], ["心、語、行", "是的。偈頌不只說心靜，說話與做事也要靜。這是一整套。", 1]]}, "r8": {"q": "第 97 偈有雙關，我們可以怎麼讀？", "o": [["字面像貶義，傳統讀作稱讚阿羅漢", "是的。這是提醒：讀經要看全文與傳統，不要斷章取義。", 1], ["只能照字面讀", "註釋與多數譯者都指出雙關。照字面讀，會讀成罵人。"], ["一定是翻譯錯誤", "不是錯誤，是文字本身有兩種讀法。"]]}, "r9": {"q": "第 98 偈說，哪裡是令人歡喜的地方？", "o": [["風景最漂亮的地方", "偈頌說的是「阿羅漢住的地方」，不是風景。"], ["阿羅漢居住的地方", "是的。地方因人而美，與環境無關。雷婆多在多刺的樹林中，也是歡喜地。", 1], ["沒有人的地方", "偈頌包括村落，不要求遠離人群。"]]}, "r10": {"q": "為什麼一般人在森林裡找不到樂趣？", "o": [["因為森林太危險", "偈頌沒有說危險，說的是欲求。"], ["因為他們不喜歡自然", "偈頌指的是尋求欲樂的心，不是對自然的態度。"], ["因為他們要的是欲樂與刺激", "是的。森林沒有熱鬧，一般人找不到樂。離貪的人樂在其中，因為他們要的不是刺激。", 1]]}, "s1": {"q": "偈頌用什麼標準，來衡量一句話的價值？", "o": [["聽了之後，心有沒有平靜", "是的。標準不是話多不多，也不是有多深奧，而是聽了之後，心有沒有靜下來。", 1], ["字數多少", "偈頌說的正好相反：千句無義，不如一句有義。"], ["聽起來深不深", "偈頌的標準是「聽了能平息」，不是深奧。"]]}, "s2": {"q": "巴提亞的故事提醒我們什麼？", "o": [["穿衣服不重要", "故事重點不在衣服，而在誤認自己。"], ["被供養，不等於證果", "是的。別人的看法與自己的感覺，都不是最後的標準；他最後去見佛，才得到真正的教導。", 1], ["一定要見到佛才能證果", "偈頌談的是一句有義的話，重點是專注地聽。"]]}, "s3": {"q": "第 102 偈出現的 dhammapada，是什麼意思？", "o": [["一首很長的詩", "dhammapada 是一句法義，不是長詩。"], ["一種祭祀的名稱", "那是第 106、107 偈談的，不是這裡。"], ["法句，也就是這部經名稱的由來", "是的。dhammapada 是「法句」。偈頌說：誦很多，不如懂一句。", 1]]}, "s4": {"q": "偈頌說，最難贏的對手是誰？", "o": [["自己", "是的。對手每天都在，最了解你的弱點。因此勝過自己，比勝過任何別人更不容易，也更不會被奪走。", 1], ["別人", "別人是外在的對手。偈頌說：外在的勝利，不如自勝。"], ["命運", "偈頌沒有談命運，談的是自己的調伏。"]]}, "s5": {"q": "偈頌比較的是什麼？", "o": [["大祭祀與小祭祀", "偈頌比較的是祭祀與恭敬修行者。"], ["百年的形式，與對修行者片刻的恭敬", "是的。不是否定供養，而是比「在哪裡」。對一位真正在修自己的人，片刻的恭敬，勝過長年的形式。", 1], ["出家與在家", "偈頌談的是供養的對象與態度，不是出家或在家。"]]}, "s6": {"q": "第 109 偈說，恭敬長者的人，哪四件事會增長？", "o": [["財富、名聲、地位、權力", "偈頌說的是壽、色、樂、力，不是外在的東西。"], ["知識、技術、人脈、經驗", "偈頌談的是身心的福，不是能力。"], ["壽命、容色、安樂、力量", "是的。這是在說：習慣尊敬別人，也在養自己的心與身。", 1]]}, "s7": {"q": "第 110 偈說，百年勝不過一天，是哪一天？", "o": [["有戒行、能修禪的一天", "是的。偈頌不用長度算生命，用品質算。該問的不是活多久，而是怎麼活。", 1], ["很長的一天", "偈頌用的是品質，不是長度。"], ["最快樂的一天", "偈頌談的是戒與定，不是感受。"]]}, "s8": {"q": "第 110 與 111 偈合起來，說了哪三件事？", "o": [["布施、持戒、禪定", "第 110、111 偈談的是戒、定、慧。"], ["戒、定、慧", "是的。110 談戒與定，111 談慧與定；連起來，就是戒、定、慧。", 1], ["信、勤、念", "那是另一組法，不在這兩偈。"]]}, "s9": {"q": "第 112 偈鼓勵我們把力氣用在什麼時候？", "o": [["等到狀態最好時", "偈頌說的是「一天」，不是等待最佳時機。"], ["把所有力氣留到最後", "偈頌鼓勵的是現在發起精進。"], ["當下這一天", "是的。「一天」是人真正能掌握的單位。累是可以被看見的，不必否定。", 1]]}, "s10": {"q": "波吒遮羅的領悟，來自什麼？", "o": [["看見水流自然消失", "是的。她悲痛至極，領悟卻來自最平常的畫面：水會起，也會滅。", 1], ["聽到很深的道理", "她的領悟來自觀察水，不是長篇大論。"], ["旅行見聞", "故事裡的畫面是洗腳時倒水。"]]}, "s11": {"q": "芥菜籽的方法，給吉莎·瞿曇彌什麼？", "o": [["找到起死回生的方法", "佛陀沒有給她藥，而是讓她自己看見死亡是人人會遇到的。"], ["看見：我不是唯一一個失去的人", "是的。這份看見，使悲傷能被承載。不是否定她的痛。", 1], ["忘記孩子", "故事沒有叫她忘記，而是讓她接受。"]]}, "s12": {"q": "這一品從哪裡開始，到哪裡結束？", "o": [["從祭祀到持戒", "這只是中間的幾個主題，不是整品的開頭與結尾。"], ["從一天到一百年", "順序相反：從「千」到「一」。"], ["從「千句話」到「一天的法」", "是的。整品的邏輯是：看重的是把一件事真正看懂。", 1]]}};BOOKS.forEach(function(b){b.u.forEach(function(u){if(QFIX[u.id])u.q=QFIX[u.id]})});
BOOKS.push({"id": "e", "n": "惡行品", "p": "Pāpavagga", "d": "惡不會因為小而消失，善也不會因為小而沒有力量。", "note": "巴利本的第九品；在《法句經》中為第十七品。故事依巴利註釋（Dhammapada-aṭṭhakathā）傳統，參考 ancient-buddhist-texts.net 的英譯，由編者摘要；第 117 偈的故事找不到可核對的來源，故不附。偈頌對應依蘇錦坤對讀表；漢譯全文第 13 段（惡不即時，如搆牛乳）見〈愚闇品〉第 12 則。", "u": [{"id": "e1", "t": "只有一件衣服的婆羅門", "s": "舍衛城裡有一位婆羅門，名叫小一衣（Cūḷa-ekasāṭaka）。他和妻子只有一件上衣，兩人只能輪流出門。他聽了佛陀說法，很想把這件衣服供養給佛陀，卻擔心供養之後夫妻兩人就沒有衣服可穿，心裡猶豫了整整前兩個夜分，直到最後一個夜分才下定決心供養。國王波斯匿聽說這件事很感動，一再贈送他東西，他也把這些轉而供養佛陀。佛陀說：善念生起時就要馬上去做，如果第一時間就供養，得到的果報會更大。接著說了這一偈。聽法的許多比丘證得初果。（依註釋傳統概述）", "k": [{"n": "116", "h": ["見善不從，", "反隨惡心，", "求福不正，", "反樂邪婬。"], "p": ["Abhittharetha kalyāṇe, pāpā cittaṃ nivāraye;", "dandhañhi karato puññaṃ, pāpasmiṃ ramatī mano."], "hm": "漢譯全文第 1 段與此偈對應（大正藏 T04, 564c）。", "d": "要趕快去做善事，約束心不去造惡；因為行善遲緩的人，心就容易喜歡上惡。"}], "g": [["abhittharetha", "趕快、不要拖延"], ["kalyāṇa", "善的"], ["pāpā", "從惡"], ["cittaṃ nivāraye", "要約束心"], ["dandha", "遲緩"], ["puñña", "福、善行"], ["ramati", "喜歡、樂於"], ["mano", "心"]], "w": [["見善不從", "看見善事卻不跟著做"], ["反隨惡心", "反而順著惡念走"], ["樂邪婬", "貪樂不正當的欲樂"]], "i": [["善念有保存期限", "一個好念頭來得快，也消失得快。偈頌的提醒很實際：想到就做，因為「再想一想」的那一刻，常常就是心轉向的那一刻。"], ["猶豫不是錯", "故事裡的婆羅門猶豫了整整兩個夜分，也不是壞人。重點是：他最後還是做了，而且做了之後，好事一件接著一件來。"],["故事與偈的連結","註釋的安排：比丘們在法堂驚嘆小一衣剛行善就得到「四」的賞賜，佛陀說：若他在初夜就供養，會得到十六倍；中夜供養，八倍；他拖到後夜，只得到四倍，所以做善事要趕快，不要壓抑善念，然後說第 116 偈。連結程度：直接。故事裡的「猶豫整夜」就是偈要提醒的拖延。"]], "x": "今天心裡冒出一個好念頭（打電話問候、讓座、道謝）時，三秒內就去做。", "q": {"q": "故事裡的婆羅門猶豫了很久才供養。佛陀為什麼說「善念生起，要立刻去做」？", "o": [["善念一拖，心就容易被別的念頭拉走", "是的。善念像剛點起的火，一陣猶豫就可能被風吹滅。偈頌並沒有責怪猶豫，只是提醒：把握念頭最亮的那一刻。", 1], ["因為供養得越快，福報越大是一種交易", "不是這個意思。重點不在換算多少福，而在心的方向：行善遲緩，心就容易滑向惡。"], ["因為做好事一定要有人看見", "偈頌沒有談觀眾。故事裡婆羅門的好事，是在自己的衣服與心念之間完成的。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-01.htm", "st": "The Story about the Brahmin Culla Ekasāṭaka"}, {"id": "e2", "t": "一再重複的惡", "s": "賽亞薩卡（Seyyasaka）住在祇園，與優陀夷長老同住，修行得不開心，反覆犯同一條嚴重的戒（僧殘罪之一）。佛陀聽說後把他叫來，問他是否屬實，他承認。佛陀責備他，說這樣的行為今生來世都會帶來苦，並說了第 117 偈。許多聽眾證得初果。（依註釋傳統概述）", "k": [{"n": "117", "h": ["𣧑人行虐，", "沈漸數數，", "快欲為人，", "罪報自然；"], "p": ["Pāpañce puriso kayirā, na naṃ kayirā punappunaṃ;", "na tamhi chandaṃ kayirātha, dukkho pāpassa uccayo."], "hm": "漢譯全文第 3 段與此偈對應（大正藏 T04, 564c）。", "d": "若一個人做了惡，不要一再重複去做；不要對惡生起喜好，因為惡的累積帶來苦。", "nc": true}, {"n": "漢2", "h": ["凡人為惡，", "不能自覺，", "愚癡快意，", "令後欝毒。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "凡夫造惡，自己卻沒有察覺；愚癡的人一時痛快，讓後來積成鬱結與毒害。"}, {"n": "漢14", "h": ["戲笑為惡，", "以作身行，", "號泣受報，", "隨行罪至。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "把造惡當成玩笑、當成身體的遊戲；將來號泣著承受果報，罪隨著所做的事到來。"}], "g": [["pāpa", "惡"], ["kayirā", "做"], ["punappunaṃ", "一再"], ["chanda", "喜好、意欲"], ["dukkha", "苦"], ["uccayo", "累積"]], "w": [["沈漸數數", "一次又一次地沉溺下去"], ["快欲", "痛快地、想要地"], ["欝毒", "鬱結與毒害"], ["戲笑", "當作玩笑"]], "i": [["第一次與第二次", "偈頌沒有說「做了就完了」，而是說「不要一再重複」：第一次可能是錯誤，第二次就開始成為習慣。"], ["「快」是陷阱", "漢譯兩次說到「快」（快欲、快意）：惡之所以重複，常常是因為當下很痛快。看見那個痛快，就是鬆手的開始。"],["故事與偈的連結","註釋的安排：佛陀問明後責備賽亞薩卡，說這樣的行為今生後世都會帶來苦，然後說第 117 偈：做了錯事就不要一再重複，不要把心放在上面，因為作惡的苦會累積。連結程度：直接。他一次次因為不樂而犯同一條戒，正是偈所說的「反覆」。（註釋對所犯戒條的細節，這裡從略。）"]], "x": "今天回想一件「當時覺得痛快、後來才發現不妥」的小事，下次做之前先停三秒。", "q": {"q": "偈頌為什麼特別說「不要一再重複」，而不是「一次都不能做錯」？", "o": [["因為重複會把一次的失誤變成習慣", "是的。人都會有一次失誤，真正難的是第二次、第三次：重複，讓惡累積成力量。看見第一次，是最好的開始。", 1], ["因為只要做過一次就已經無法挽回", "偈頌的口氣不是絕望，而是提醒：現在停下來，後面的累積就不會發生。"], ["因為重複做才比較不會被發現", "偈頌談的是累積造成的苦，與是否被發現無關。"]]}}, {"id": "e3", "t": "一粒炒米的供養", "s": "王舍城附近，一位少女在田裡工作時，把一份炒米供養給住在畢缽羅石窟的大迦葉尊者。回家途中她被蛇咬傷，帶著清淨的信心去世，投生到三十三天，成為天女（Lājā）。她發現自己的福報來自那一份供養，便到人間為大迦葉掃地、準備飲水。大迦葉請她不要再做；她懇求繼續，尊者卻彈指表示拒絕，她在空中哭泣。佛陀放光現身，告訴她：行善要一再地做；並說了這一偈。天女在說法結束時證得初果。（依註釋傳統概述）", "k": [{"n": "118", "h": ["吉人行德，", "相隨積增，", "甘心為之，", "福應自然。"], "p": ["Puññañce puriso kayirā, kayirā naṃ punappunaṃ;", "tamhi chandaṃ kayirātha, sukho puññassa uccayo."], "hm": "漢譯全文第 4 段與此偈對應（大正藏 T04, 564c）。", "d": "若一個人做了善事，要一再地去做；對善生起喜好，因為善的累積帶來樂。"}], "g": [["puñña", "福、善行"], ["kayirā", "做"], ["punappunaṃ", "一再"], ["chanda", "喜好、意欲"], ["sukha", "樂"], ["uccayo", "累積"]], "w": [["吉人行德", "善良的人行善"], ["相隨積增", "一件接著一件，越積越多"], ["甘心", "心甘情願"]], "i": [["一次與一百次", "「一粒炒米」是一次小小的善；它之所以能成為福，是因為後來一再地被記得、被延續。偈頌說的，就是這種累積。"], ["與上一則對看", "上一則說「惡」要避免重複，這一則說「善」要一再地做：同樣的「重複」，方向不同，結果完全不同。"],["故事與偈的連結","註釋的安排：佛陀在祇園香室聽到天女的哭泣，送出光明影像對她說：大迦葉的克制是他的本分，想積福的人就該把行善當作主要的事，然後說第 118 偈：若要行善，就一再地做，樂於其中。連結程度：直接。偈是對天女想繼續供養卻被拒絕所作的回應；大迦葉的婉拒也有他的理由，註釋並未批評他。"]], "x": "今天做了一件好事之後，明天再做一次同樣的。", "q": {"q": "天女為什麼要一再地為大迦葉做事？故事想說明什麼？", "o": [["因為善的累積帶來樂，而且是越做越有力", "是的。一次善行是種子，一再地做才是長成的樹。這位天女的歡喜，正是偈頌所說的「善的累積帶來樂」。", 1], ["因為尊者需要有人幫忙", "故事重點不在尊者的需要，而在她從善行中得到的歡喜與成長。"], ["因為一次善行不算數", "一次善行當然算數；偈頌只是鼓勵：喜歡它、一再地做，它的力量會更大。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-03.htm", "st": "The Story about the Devadhītā Lāja"}, {"id": "e4", "t": "惡人也有好日子", "s": "舍衛城的給孤獨長者（Anāthapiṇḍika）樂於供養佛陀與僧團，後來家道中落，仍然不改。住在他家門口的一位天神（devatā）勸他：別再供養了，趕快重新累積財富。長者不接受，反而請她離開。失去住處的天神四處求助，最後找到帝釋天，帝釋要她把長者失去的財富重新找回來。她做到了，恢復了長者的家產，並請求原諒。長者帶她去見佛陀，佛陀說：惡人在惡業還沒成熟之前也會有好運；善人在善業還沒成熟之前也會遇到困難。天神聽後證得初果。（依註釋傳統概述）", "k": [{"n": "119", "h": ["妖𦾨見福，", "其惡未熟，", "至其惡熟，", "自受罪虐；"], "p": ["Pāpopi passati bhadraṃ, yāva pāpaṃ na paccati;", "yadā ca paccati pāpaṃ, atha pāpo pāpāni passati."], "hm": "漢譯全文第 5 段與此偈對應（大正藏 T04, 564c）。", "d": "惡人在惡業還沒成熟之前，也會見到好運；等到惡業成熟，才見到惡的果報。", "nc": true}, {"n": "120", "h": ["貞祥見禍，", "其善未熟，", "至其善熟，", "必受其福。"], "p": ["Bhadropi passati pāpaṃ, yāva bhadraṃ na paccati;", "yadā ca paccati bhadraṃ, atha bhadro bhadrāni passati."], "hm": "漢譯全文第 6 段與此偈對應（大正藏 T04, 564c）。", "d": "善人在善業還沒成熟之前，也會遇到不好；等到善業成熟，才見到善的果報。"}], "g": [["pāpa", "惡（人）"], ["bhadra", "善、吉祥（人）"], ["passati", "看見"], ["yāva", "直到"], ["paccati", "成熟"], ["yadā", "當……的時候"]], "w": [["妖𦾨見福", "凶惡的人也見到福（𦾨是「孽」的異體字）"], ["其惡未熟", "他的惡業還沒成熟"], ["貞祥見禍", "正直吉祥的人也見到災禍"]], "i": [["時間差", "這兩偈講的是「時間差」：行為與結果之間有距離。看到惡人風光、善人受苦，常常只是果報還沒成熟。"], ["不是用來羨慕或詛咒", "偈頌不是叫人幸災樂禍，而是提醒自己：眼前的順逆，不能直接判斷這件事好不好。"],["故事與偈的連結","註釋的安排：天神向長者道歉、被帶到佛陀面前，佛陀對兩人說：作惡的人在惡業成熟前也能享福，行善的人在善業成熟前也可能受苦，然後說第 119、120 偈。連結程度：直接。長者家道中落仍供養（善人受苦），天神勸他不要供養（希望他停止行善），正好對應兩首偈。"]], "x": "今天做了一件善事卻沒有看到回應時，提醒自己：善的果報還在成熟，不急。", "q": {"q": "偈頌說「善人也會遇到不好」。這句話對我們的提醒是？", "o": [["眼前的順逆，不一定能直接說明一件事的好壞", "是的。結果和行為之間有時間差。看見這一點，就不會因為一時沒有回報而放棄善行，也不會因為一時順利而放鬆。", 1], ["既然善人也會遇到不好，行善就沒有意義", "偈頌的重點剛好相反：善業成熟時，一定會見到善的果報；只是時間未到。"], ["惡人過得好，所以可以學他", "偈頌明講：惡業成熟時，惡人會見到惡的果報。眼前的好運不是依據。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-04.htm", "st": "The Story about the Wealthy Anāthapiṇḍika"}, {"id": "e5", "t": "沒有收起來的床椅", "s": "有一位比丘把自己的床和椅子留在戶外，任由雨淋、日曬、白蟻蛀蝕。其他比丘提醒他收起來，他卻說這只是小過失，沒什麼好擔心，仍然照舊。比丘們把這件事告訴佛陀；佛陀問他，他也是同樣回答。佛陀提醒：不要把惡看得太輕，水一滴一滴落下，水罐也會裝滿，愚人就這樣一點一點被惡裝滿。許多聽眾證得初果以上；佛陀並因此制定了戒條：在戶外鋪好的床具不得不收。（依註釋傳統概述）", "k": [{"n": "121", "h": ["生此壽少，", "何宜為惡？", "莫輕小惡，", "以為無殃，", "水渧雖微，", "漸盈大器，", "凡罪充滿，", "從小積成；"], "p": ["Māvamaññetha pāpassa, 'na maṃ taṃ āgamissati';", "udabindunipātena, udakumbhopi pūrati;", "bālo pūrati pāpassa, thokathokampi ācinaṃ."], "hm": "漢譯全文第 9 段與此偈對應（大正藏 T04, 565a）。", "d": "不要輕視惡，以為「它不會到我身上來」；水一滴一滴落下，連水罐也會裝滿；愚人一點一點積惡，終究被惡裝滿。"}, {"n": "漢8", "h": ["世人無聞，", "不知正法。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "世人沒有聽聞，不知道正法。"}], "g": [["mā avamaññetha", "不要輕視"], ["pāpassa", "對於惡"], ["udabindu", "水滴"], ["udakumbha", "水罐"], ["pūrati", "被裝滿"], ["bālo", "愚人"], ["thokathoka", "一點一點"], ["ācinaṃ", "累積"]], "w": [["莫輕小惡", "不要輕視小的惡"], ["水渧", "水滴"], ["漸盈大器", "慢慢盈滿大的容器"], ["殃", "災殃、惡果"]], "i": [["小事不是小事", "那位比丘說「只是小過失」。偈頌的回應是水罐：沒有一滴水是「大到」足以讓罐子滿的，也沒有一滴是「小到」可以不算。"], ["不是自責用的偈", "這首偈不是叫人緊張，而是教人看見：今天少做一件小錯，就是在減少那個罐子裝滿的速度。"],["故事與偈的連結","註釋的安排：比丘不聽勸，佛陀問他，他也是同樣回答，佛陀就說不要輕視任何錯，如水罐被水滴漸漸裝滿，然後說第 121 偈，並因此制定「在戶外鋪設的床具不收起來」的戒。連結程度：直接。「把小錯當小事」正是偈所警告的。"]], "x": "今天找一件你覺得「只是小事」的壞習慣（東西亂放、拖著不回訊息），現在就處理掉。", "q": {"q": "「水一滴一滴，水罐也會裝滿」這個比喻，最想說明什麼？", "o": [["小惡不起眼，累積起來就會成為大惡", "是的。每一滴水都「不算什麼」，但罐子就是這樣滿的。小事上的鬆懈，也是這樣一點一點長成習慣。", 1], ["要避免任何一點錯誤，否則人生就完了", "偈頌並不是要人恐慌，而是提醒累積的力量，從小處留意就好。"], ["惡行終究會被善行沖淡", "這個比喻說的是「裝滿」，不是「沖淡」；同一品的下一偈，才用同樣的比喻說善行。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-05.htm", "st": "The Story about a Bhikkhu Unrestrained with the Requisites"}, {"id": "e6", "t": "一把米，也是供養", "s": "有位財主因為腳掌像貓腳一樣，被稱為「貓腳」（Biḷālapāda）。他對僧團很吝嗇。有一位在家居士邀請佛陀的比丘們用餐，並請全村出資；財主只給了幾粒米、一點酥油和黑糖。居士把財主的東西另外放置，每個缽只放一點點，財主派僕人偷偷監視，打算居士若當眾批評他，就要去找他的麻煩。想不到居士在用餐時為每一位施主祝福，包括這位財主，財主因此向居士道歉。佛陀對財主與大眾說：不要輕視善行，智者就是一點一點積福，像水罐一滴一滴裝滿。（依註釋傳統概述）", "k": [{"n": "122", "h": ["莫輕小善，", "以為無福，", "水滴雖微，", "漸盈大器，", "凡福充滿，", "從纖纖積。"], "p": ["Māvamaññetha puññassa, 'na maṃ taṃ āgamissati';", "udabindunipātena, udakumbhopi pūrati;", "dhīro pūrati puññassa, thokathokampi ācinaṃ."], "hm": "漢譯全文第 10 段與此偈對應（大正藏 T04, 565a）。", "d": "不要輕視善，以為「它不會到我身上來」；水一滴一滴落下，連水罐也會裝滿；智者一點一點積福，終究被福裝滿。"}], "g": [["puññassa", "對於善、福"], ["dhīro", "智者"], ["udakumbha", "水罐"], ["pūrati", "被裝滿"], ["thokathoka", "一點一點"], ["ācinaṃ", "累積"]], "w": [["莫輕小善", "不要輕視小的善"], ["纖纖", "一點一點、很細小"], ["凡福充滿", "所有的福德滿起來"]], "i": [["同一個比喻，反過來用", "上一則的水罐裝的是惡，這一則裝的是善。兩偈放在一起，是要看見：累積的力量，向哪一邊，都一樣有效。"], ["那位居士的做法", "居士沒有批評財主，而是把那一小份也好好地接下、祝福。這是「不輕視小善」最具體的樣子。"],["故事與偈的連結","註釋的安排：財主懺悔後，佛陀確認事情，說善行不要看輕，智者一點一點積福，如水罐滴水而滿，然後說第 122 偈；財主聽法證初果。連結程度：直接。財主只捐一小撮卻仍得到祝福，說明「不要輕視微小的善」。"]], "x": "今天做一件很小的善事（讓座、道謝、撿垃圾），並告訴自己：一滴也算數。", "q": {"q": "居士為什麼對吝嗇財主的一小份供養，也同樣誠心祝福？", "o": [["他看見：再小的善，也是善的累積", "是的。居士不是用數量衡量，而是用方向衡量。這也是偈頌「不要輕視善」的實際樣子。", 1], ["為了讓財主以後多布施", "故事裡的居士並沒有算計，他只是平等對待每一份供養。"], ["因為財主地位很高", "故事重點不在身分，而在每一滴都算數。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-06.htm", "st": "The Story about the Rich Man Biḷālapādaka"}, {"id": "e7", "t": "護衛太少的商人", "s": "大富商 Mahādhana 帶著五百輛車的貨物，邀請一群比丘同行。路上，五百名盜賊埋伏在森林裡，其中一位盜賊的朋友事先通知了富商。富商先想折返，後來決定先留在附近村子裡不走。比丘們回到舍衛城，把這件事告訴佛陀。佛陀以此為例：就像富商因為護衛少、貨物多而避開危險的路，像想活命的人避開毒藥，人也要避開惡行。聽法的比丘們證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "123", "hn": "漢傳〈惡行品〉沒有對應偈；大正藏 T04, 571b（本品之外）有類似的偈：「伴少而貨多，商人怵惕懼，嗜欲賊害命，故慧不貪欲」。", "p": ["Vāṇijova bhayaṃ maggaṃ, appasattho mahaddhano;", "visaṃ jīvitukāmova, pāpāni parivajjaye."], "d": "就像護衛很少而財貨很多的商人，會避開危險的道路；就像想活命的人避開毒藥；同樣地，要遠離各種惡行。"}], "g": [["vāṇija", "商人"], ["bhayaṃ maggaṃ", "有危險的道路"], ["appasattho", "護衛少的"], ["mahaddhano", "財貨很多的"], ["visaṃ", "毒藥"], ["jīvitukāma", "想活命的人"], ["parivajjaye", "要遠離"]], "w": [["伴少而貨多", "同伴少、貨物多"], ["怵惕", "警戒、恐懼"], ["嗜欲", "貪愛與欲求"]], "i": [["為什麼是「商人」", "商人貨物多，所以處處小心；同樣地，修學的人覺得自己要守的東西（心、戒、善）越珍貴，越懂得避開危險。"], ["避開，不是逃避", "「遠離」不是逃走，而是聰明地選路：同樣的目的地，有的路風險小，有的路風險大。"],["故事與偈的連結","註釋的安排：比丘們回到舍衛城向佛陀報告，佛陀以商人為了活命而避開危險的路作比，說比丘也要避開惡行，然後說第 123 偈：如商隊少護衛、財貨多，避開險路；如想活命的人避開毒藥，避開惡行。連結程度：直接。故事是偈的比喻本身，但故事裡的商人並沒有「作惡」，是佛陀借他的謹慎作比。"]], "x": "今天走到一個「風險不明」的選擇前，先停一下，問自己：這條路，我準備夠了嗎？", "q": {"q": "商人為什麼要避開危險的路？這對修學的人有什麼提醒？", "o": [["越珍惜自己擁有的，越要小心選擇走哪條路", "是的。避開危險不是膽小，是因為知道自己守著珍貴的東西。對修學的人來說，珍貴的是清淨的心與善行。", 1], ["因為商人膽子特別小", "偈頌用商人比喻的是「謹慎」，不是膽小。"], ["因為所有道路本來都危險", "偈頌說的是「危險的路」要避開，並不是說每條路都危險。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-07.htm", "st": "The Story about the Merchant Mahā Dhana"}, {"id": "e8", "t": "沒有傷口的手", "s": "王舍城的獵人 Kukkuṭamitta 以獵鹿為生。一位富家女愛上他，隨他出走，嫁給他，生了七個兒子。有一天，佛陀走過獵人設下的網（網裡什麼也沒有），坐在灌木下。獵人發現佛陀的腳印，拿弓去找，卻在佛陀面前動彈不得，他的兒子們也一樣。他們的母親前來，請求大家放下弓、請佛陀原諒。佛陀為他們說法，一家十五人都證得初果。比丘們問：已證初果的妻子，怎麼還會把弓箭網具遞給丈夫打獵？佛陀說了這一偈：手上沒有傷口，就能拿毒；沒做惡的人，惡不會沾上他。（依註釋傳統概述）", "k": [{"n": "124", "hn": "漢傳〈惡行品〉沒有對應偈。", "p": ["Pāṇimhi ce vaṇo nāssa, hareyya pāṇinā visaṃ;", "nābbaṇaṃ visamanveti, natthi pāpaṃ akubbato."], "d": "若手上沒有傷口，就可以用手拿毒；毒不會進入沒有傷口的地方；沒有做惡的人，惡不會沾上他。"}, {"n": "漢17", "h": ["如毒摩瘡，", "船入洄澓，", "惡行流衍，", "靡不傷尅。"], "pn": "巴利本沒有找到明確對應；內容同樣以毒藥作比喻，放在這裡一起讀。", "d": "像把毒藥塗在傷口上，像船被捲入漩渦；惡行流散蔓延，沒有不受傷害的。"}], "g": [["pāṇi", "手"], ["vaṇo", "傷口"], ["visaṃ", "毒"], ["hareyya", "可以拿取"], ["abbaṇa", "沒有傷口的"], ["akubbato", "不去做（惡）的人"]], "w": [["如毒摩瘡", "像把毒塗在傷口上"], ["洄澓", "漩渦"], ["流衍", "流散蔓延"], ["尅", "傷害"]], "i": [["「傷口」是什麼", "傷口是心裡的執著、貪瞋、傾向。有傷口，毒才進得來；沒有傷口，同樣的環境也傷不了人。"], ["一個提醒", "要避免的不是「碰到毒」，而是讓自己有傷口。這也是為什麼同一品的第一偈，說要約束心。"],["故事與偈的連結","註釋的安排：比丘們問：已證初果的妻子，怎麼還一直遞弓箭給丈夫打獵？佛陀說她是出於順從，沒有害心，並以「手上無傷，可以拿毒」作比，說了第 124 偈。連結程度：直接。偈的比喻（無傷之手拿毒不受害）正是回答比丘的疑問。"]], "x": "今天發現一個小小的不妥行為正在變成習慣（例如一再取巧），在它蔓延之前，今天先停一次。", "q": {"q": "「手上沒有傷口，就能拿毒」這個比喻，在說什麼？", "o": [["真正讓惡進來的，是心裡的缺口，而不是外在的事物", "是的。同樣面對誘惑，有的人被拖走，有的人不受影響，差別在內心有沒有「傷口」。所以修心，就是慢慢讓傷口癒合。", 1], ["毒本來就沒有危險", "偈頌沒有說毒沒有危險，而是說：對沒有傷口的手，毒進不去。"], ["只要不碰外在的東西就好", "偈頌說的重點是內在狀態；一味避開外境，並不是它的意思。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-08.htm", "st": "The Story about Kukkuṭamitta"}, {"id": "e9", "t": "逆風的塵土", "s": "獵人 Koka 帶著獵狗出門打獵，一整天一無所獲，心情很差。路上遇到一位比丘，他認定是這位比丘帶來壞運，放狗去咬。比丘爬上樹逃命，獵人又用箭射他的腳。比丘的外衣掉下來，罩住了獵人；獵狗誤把主人當成獵物，咬了他，然後跑掉。比丘擔心自己的衣服害死了人，去問佛陀自己有沒有過失。佛陀說他沒有過失，是獵人自己的惡行招來的後果，並說了這一偈：傷害沒有惡意的人，惡果回到愚人自己身上，像逆風揚起的細塵。比丘後來證得阿羅漢。（依註釋傳統概述）", "k": [{"n": "125", "h": ["加惡誣罔人，", "清白猶不污，", "愚殃反自及，", "如塵逆風坌。"], "p": ["Yo appaduṭṭhassa narassa dussati, suddhassa posassa anaṅgaṇassa;", "tameva bālaṃ pacceti pāpaṃ, sukhumo rajo paṭivātaṃva khitto."], "hm": "漢譯全文第 18 段與此偈對應（大正藏 T04, 565a）。", "d": "傷害沒有惡意、清淨、無垢的人，那惡果會回到這個愚人自己身上，像逆風揚起的細塵。"}, {"n": "漢7", "h": ["擊人得擊、", "行怨得怨、", "罵人得罵、", "施怒得怒。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "打人的會被打，結怨的會得怨，罵人的會被罵，對人發怒的會被怒。"}, {"n": "漢12", "h": ["好取之士，", "自以為可，", "沒取彼者，", "人亦沒之。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "喜歡奪取的人自以為無妨；他奪取別人的，別人也會奪取他的。"}], "g": [["appaduṭṭha", "沒有惡意的"], ["dussati", "傷害、害"], ["suddha", "清淨的"], ["anaṅgaṇa", "無垢的"], ["pacceti", "回到、反撲"], ["sukhuma", "細微的"], ["rajo", "塵土"], ["paṭivāta", "逆風"]], "w": [["加惡誣罔", "把惡加在別人身上、誣陷"], ["坌", "塵土飛揚"], ["逆風", "迎著風的方向"], ["愚殃反自及", "愚人的災殃反而回到自己"]], "i": [["一個畫面", "「逆風揚塵」不是詛咒，而是一個物理畫面：你把塵土往逆風處丟，風會把它吹回你臉上。"], ["漢譯多出的兩偈", "漢譯在這裡加了「擊人得擊、罵人得罵」等偈，把「回到自己」說得更直接：你給出去的，會以某種方式回來。"],["故事與偈的連結","註釋的安排：比丘問佛陀自己有沒有過失，佛陀說他沒有，並講了貪心的醫生讓孩子被蛇咬、反被蛇咬死的前世，然後說第 125 偈：傷害清淨無過的人，惡果回到愚人自己身上，如逆風揚塵。連結程度：直接。偈的比喻就是對這個事件的結論。"]], "x": "今天想說別人壞話或責備別人時，先想一次：這句話會不會像逆風的塵土，回到我身上？", "q": {"q": "獵人放狗咬人，結果被自己的狗咬傷。這個故事和「逆風揚塵」有什麼關係？", "o": [["傷害別人的力量，最後常常反過來傷到自己", "是的。偈頌不是在嚇人，而是在描述一個事實：你把力氣用在傷人，這股力氣的方向，常常會轉回來。", 1], ["無辜的人一定會被保護", "偈頌的重點是「惡果回到做惡者」，並不是保證每個無辜的人都不會受傷。"], ["獵狗特別會咬人", "故事的重點不是狗，而是行為的後果回到行為者身上。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-09.htm", "st": "The Story about the Hunter Koka's Dogs"}, {"id": "e10", "t": "堤沙長老的遭遇", "s": "提沙長老（Tissa）常在一位金匠家受供養，已有十二年。有一天，國王波斯匿送來一顆寶石，請金匠清洗、穿孔；金匠把寶石放下，被金匠家養的鷺鷥當成肉吞下去。金匠以為是提沙長老偷的，把他的頭綁起來毆打，血流出來，鷺鷥又靠近喝血，結果被金匠不小心打死。長老這才說出寶石被鷺鷥吞了。金匠剖開鷺鷥找到寶石，向長老道歉並請他入座，長老卻說從此只在門口托缽，不久因傷去世。佛陀說：有的眾生入胎，作惡的入地獄，行善的上天，無煩惱的人入涅槃。許多聽眾證得初果。（依註釋傳統概述）", "k": [{"n": "126", "h": ["有識墮胞胎、", "惡者入地獄、", "行善上昇天、", "無為得泥洹。"], "p": ["Gabbhameke uppajjanti, nirayaṃ pāpakammino;", "saggaṃ sugatino yanti, parinibbanti anāsavā."], "hm": "漢譯全文第 21 段與此偈對應（大正藏 T04, 565a）。", "d": "有些眾生入胎；作惡的人入地獄；行善的人上天；沒有煩惱的人般涅槃。"}, {"n": "漢11", "h": ["夫士為行，", "好之與惡，", "各自為身，", "終不敗亡。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "一個人的所作所為，好或壞，各自歸於自己，果報不會憑空消失（字句較古，依編者理解）。"}, {"n": "漢20", "h": ["夫士所以行，", "然後身自見，", "為善則得善、", "為惡則得惡。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "人做了什麼事，後來自己會看見結果：為善得善，為惡得惡。"}], "g": [["gabbhaṃ", "胎"], ["upapajjanti", "投生"], ["niraya", "地獄"], ["pāpakammino", "作惡業的人"], ["sagga", "天界"], ["sugatino", "行善的人"], ["parinibbanti", "般涅槃"], ["anāsavā", "無漏者（沒有煩惱的人）"]], "w": [["有識墮胞胎", "有識的眾生落入胞胎"], ["泥洹", "涅槃"], ["無為", "不造作（涅槃的一種說法）"]], "i": [["四條路", "偈頌把眾生分成四條路：入胎（一般的人）、地獄（作惡）、天（行善）、涅槃（無漏）。最後一條，是離開這個循環。"], ["故事裡的難題", "提沙長老無辜受難，這個故事不容易讀。偈頌沒有替每個遭遇解釋原因，只是說：行為與去向是相連的，而最終可以離開這一切。"],["故事與偈的連結","註釋的安排：長老去世後，比丘們問起相關人物的去處，佛陀說：有的眾生入胎，作惡者入地獄，行善者上天，無漏者入涅槃，然後說第 126 偈。連結程度：較鬆。偈是談「去處」的一般原則，故事則提供具體例子（金匠入地獄、妻子上天、鷺鷥投胎）；偈本身並沒有談到提沙長老無辜受苦的事。"]], "x": "今天做決定前問自己：這件事會把我帶往哪一個方向——更輕，還是更重？", "q": {"q": "偈頌把眾生的去向分成四種。這四種的差別，主要取決於什麼？", "o": [["所做的業，以及心是否還有煩惱", "是的。入胎、地獄、天、涅槃，各自對應不同的行為與心的狀態；最後的「無漏」，指的是不再被煩惱帶著走。", 1], ["出身與地位", "偈頌從頭到尾沒有提到出身，說的是行為與煩惱。"], ["運氣", "偈頌正是在說：去處與行為有關，不是任意的。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-10.htm", "st": "The Story about Elder Tissa, Who Frequented a Jeweller"}, {"id": "e11", "t": "無處可躲", "s": "三群比丘前往見佛陀，沿途分別看見三件事：一隻烏鴉飛入燃燒的草堆而被燒死；一位婦人在無風的船上被丟下海，被魚龜咬死；七位比丘被落下的巨石困在山洞裡七天。佛陀說明：每一位都曾對其他生命做過類似的事——烏鴉曾把一頭牛燒死，婦人曾淹死自己忠心的狗，七位比丘曾把蜥蜴困在蟻丘裡不給食物。有比丘問：作惡的人，能不能飛上天、潛入水、躲進洞而避開後果？佛陀答：世上沒有任何地方可以，並說了這一偈。聽法的比丘們證得初果。（依註釋傳統概述）", "k": [{"n": "127", "h": ["非空、非海中、", "非隱山石間，", "莫能於此處，", "避免宿惡殃。"], "p": ["Na antalikkhe na samuddamajjhe, na pabbatānaṃ vivaraṃ pavissa;", "na vijjatī so jagatippadeso, yatthaṭṭhito mucceyya pāpakammā."], "hm": "漢譯全文第 22 段與此偈對應（大正藏 T04, 565a）。巴利第 128 偈（脫離死亡）見〈無常品〉。", "d": "不在空中，不在海中，也不進入山的縫隙；世上沒有哪一處，能讓人站在那裡就脫離惡業。"}, {"n": "漢15", "h": ["作惡不覆，", "如兵所截，", "牽往乃知，", "已墮惡行。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "作惡不遮蓋，像被兵器截斷；被牽走時才知道自己已墮入惡行。"}, {"n": "漢16", "h": ["後受苦報，", "如前所習。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "後來承受苦報，就像先前所習慣的。"}, {"n": "漢19", "h": ["過失犯非惡，", "能追悔為善，", "是明照世間，", "如日無雲曀。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "有過失、犯了不好的事，若能追悔而轉為善，就像太陽沒有雲遮蔽，照亮世間。"}, {"n": "漢23", "h": ["眾生有苦惱，", "不得免老死，", "唯有仁智者，", "不念人非惡。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "眾生有苦惱，免不了老與死；只有仁慈而有智慧的人，不去惦記別人的過錯。"}], "g": [["antalikkhe", "空中"], ["samuddamajjhe", "海中"], ["pabbatānaṃ vivaraṃ", "山的縫隙、洞穴"], ["jagatippadeso", "世間的某一處"], ["mucceyya", "能脫離"], ["pāpakammā", "惡業"]], "w": [["宿惡殃", "過去所造惡業的後果"], ["追悔", "回頭悔改"], ["曀", "陰暗"], ["仁智者", "仁慈而有智慧的人"]], "i": [["哪裡都躲不開", "偈頌用三個地方（空中、海中、山洞）說明：不是逃到哪裡的問題，因為業跟著人走。"], ["漢譯的出口", "同一品最後幾偈，漢譯補上出口：「過失犯非惡，能追悔為善」，就像太陽從雲裡出來。躲不開，不是結論；面對、改正，才是。"],["故事與偈的連結","註釋的安排：有比丘問：作惡的人能不能飛上天、潛入海、躲進山洞而避開惡果？佛陀答：沒有任何地方，並說第 127 偈。三群比丘各自看見的三件事（烏鴉、婦人、七比丘），是佛陀以前世因緣解釋的案例。連結程度：直接。偈的「天空、海洋、山洞」就是比丘提問的三個地方。"]], "x": "今天想起一件一直躲著不處理的小錯，不躲了——今天就面對它。", "q": {"q": "偈頌說「世上沒有任何地方可以躲開惡業」，最後給人的啟示是？", "o": [["與其逃避，不如面對、改正，這是真正的出路", "是的。躲不掉，不是要人絕望，而是提醒：能做的就是現在面對與改變。漢譯同一品的「追悔為善，如日無雲」就是這個意思。", 1], ["既然躲不掉，做錯了也就算了", "偈頌沒有這個意思；同一品強調的恰恰是「追悔轉善」的可能。"], ["只要躲得夠遠就好", "這正是偈頌否定的：空中、海中、山洞，沒有一個地方可以。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/09-11.htm", "st": "The Story about Three Groups"}], "ss": 1, "ps": 1});
BOOKS.push({"id": "f", "n": "刀杖品", "p": "Daṇḍavagga", "d": "從「我怕痛，所以別人也怕」出發，學習放下刀杖。", "note": "巴利本的第十品；在《法句經》中為第十八品。故事依巴利註釋（Dhammapada-aṭṭhakathā）傳統，參考 ancient-buddhist-texts.net 的英譯，由編者摘要。巴利偈頌依 PTS 本核對；漢巴對應是編者依內容與順序的比對，蘇錦坤對讀表此處未能完整核對，已在頁面標明。", "u": [{"id": "f1", "t": "人人都怕刀杖", "s": "祇園精舍裡，六群比丘與十七群比丘為了一處住處起了衝突；六群比丘動手打了十七群比丘，十七群比丘則以威嚇的手勢回應。吵鬧聲傳到佛陀那裡，佛陀問明原因，因此制定戒律：不可打人、也不可做出威嚇的動作。接著佛陀請比丘們想一想：別人也怕刀杖、也怕死、也愛惜生命，把自己放在別人的位置來看，就不要殺、也不要叫人殺。（依註釋傳統概述）", "k": [{"n": "129", "h": ["一切皆懼死，", "莫不畏杖痛，", "恕己可為譬，", "勿殺勿行杖。"], "p": ["Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno;", "attānaṃ upamaṃ katvā, na haneyya na ghātaye."], "hm": "漢譯全文第 1 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "人人都怕刀杖，人人都怕死；把自己比作別人，不要殺，也不要叫人殺。"}, {"n": "130", "hn": "漢傳〈刀杖品〉第 1 偈的內容與第 129、130 偈相近，沒有另外分開的對應偈。", "p": ["Sabbe tasanti daṇḍassa, sabbesaṃ jīvitaṃ piyaṃ;", "attānaṃ upamaṃ katvā, na haneyya na ghātaye."], "d": "人人都怕刀杖，人人都愛惜生命；把自己比作別人，不要殺，也不要叫人殺。"}], "g": [["sabbe", "一切人"], ["tasanti", "害怕、發抖"], ["daṇḍa", "棍棒、刀杖"], ["maccu", "死"], ["jīvitaṃ piyaṃ", "生命是可愛的"], ["attānaṃ upamaṃ katvā", "把自己當作比喻"], ["na haneyya na ghātaye", "不要殺，也不要叫人殺"]], "w": [["恕己可為譬", "用自己的心去推想別人"], ["莫不畏杖痛", "沒有不怕杖打的痛"], ["行杖", "用杖打人"]], "i": [["最小的倫理", "這一偈沒有複雜道理，只要求一件事：把自己放在對方的位置。我怕痛，所以別人也怕；我想活，所以別人也想活。"], ["「刀杖」不只是刀杖", "現代的「刀杖」，可能是一個眼神、一句重話、一次冷落。每個人都怕的，不只是肉體的痛。"],["故事與偈的連結","註釋的安排：註釋把第 129、130 偈分成兩則，但場景相同：祇園精舍裡，六群比丘動手打十七群比丘（第 129 偈的由來，並制定「不可打人」的戒，即波逸提第 74 條），十七群比丘以威嚇的手勢回應（第 130 偈的由來，另制「不可威嚇」的戒）。佛陀兩次都請比丘「以己度人」，然後說偈。連結程度：直接。偈講的「人人怕刀杖、怕死」，正是對這場打鬥所下的結論。"]], "x": "今天遇到想用力氣壓過別人的時刻（語氣、音量、眼神），先停一下，想：換成是我，會怎麼樣？", "q": {"q": "偈頌說「把自己比作別人」，這個方法為什麼有效？", "o": [["因為我怕的，別人也怕；用自己的感受就能知道別人的感受", "是的。這是最簡單的同理：不需要學多少道理，只要想起「我自己不願被這樣對待」。", 1], ["因為這樣可以避免被別人報復", "偈頌沒有談報復，而是從「大家都一樣」的事實出發。"], ["因為佛陀規定一定要這樣做", "佛陀雖然也制定了戒律，但偈頌邀請的是理解，而不是只靠規定。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Buddhist-Legends/10-01.htm", "st": "Buddhist Legends X.1–2 The Band of Six"}, {"id": "f2", "t": "打蛇的孩子們", "s": "舍衛城附近，一群孩子拿著棍棒打一條家蛇，因為怕被牠咬。佛陀托缽經過，看見了，問他們在做什麼。孩子們說怕蛇咬人。佛陀說：想要自己快樂的人，不應該傷害別人；用棍棒傷害有情的人，來世也得不到快樂；不傷害的人才會得到快樂。他說了這兩首偈。五百位孩子在說法結束時證得初果。（依註釋傳統概述）", "k": [{"n": "131", "hn": "漢傳〈刀杖品〉第 2 偈偏向第 132 偈，沒有另外分開的對應偈。", "p": ["Sukhakāmāni bhūtāni, yo daṇḍena vihiṃsati;", "attano sukhamesāno, pecca so na labhate sukhaṃ."], "d": "眾生都想要快樂；若有人用棍棒傷害它們，他自己追求快樂，來世卻得不到快樂。"}, {"n": "132", "h": ["能常安群生，", "不加諸楚毒，", "現世不逢害，", "後世長安隱。"], "p": ["Sukhakāmāni bhūtāni, yo daṇḍena na hiṃsati;", "attano sukhamesāno, pecca so labhate sukhaṃ."], "hm": "漢譯全文第 2 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "眾生都想要快樂；若有人不用棍棒傷害它們，他自己追求快樂，來世便能得到快樂。"}], "g": [["sukhakāma", "想要快樂的"], ["bhūtāni", "眾生"], ["daṇḍena", "用棍棒"], ["vihiṃsati", "傷害"], ["sukhamesāno", "尋求快樂的人"], ["pecca", "死後、來世"], ["na labhate", "得不到"]], "w": [["能常安群生", "常常讓眾生安穩"], ["楚毒", "痛苦與毒害"], ["安隱", "安穩"]], "i": [["快樂的方向", "兩首偈只差一個「不」：同樣想要快樂，用傷害別人的方式，快樂會離你更遠；不傷害，快樂才靠近。"], ["從怕蛇到善待", "孩子怕蛇是真的。佛陀沒有責怪孩子，而是教他們：怕，也有不傷害的方式。"],["故事與偈的連結","註釋的安排：佛陀托缽進舍衛城，看見孩子們用棍棒打家蛇，孩子說怕被咬。佛陀說：為了自己的快樂而傷害別人的人，來世得不到快樂；不傷害的人才得到快樂，然後說第 131、132 偈。連結程度：直接。偈的內容幾乎就是對孩子們說的話；故事只是佛陀把「怕被咬」翻成「想要快樂」。"]], "x": "今天做一件讓身邊的人（或小動物、植物）更安心的小事：輕聲、輕手、留一份餘地。", "q": {"q": "孩子們因為怕蛇才打牠。佛陀的回應給我們什麼啟示？", "o": [["害怕是真的，但傷害別人不是得到安全或快樂的好方法", "是的。偈頌沒有否定孩子的恐懼，而是指出：用傷害換來的快樂，不長久，也不真實。", 1], ["蛇其實不危險，所以不用怕", "故事並沒有說蛇不危險，而是說對待牠的方式。"], ["孩子還小，所以不用管", "佛陀認真對待孩子，並為他們說法；五百位孩子因此受益。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-03.htm", "st": "The Story about a Company of Boys"}, {"id": "f3", "t": "話出口，回頭來", "s": "尊者君荼提那（Kuṇḍadhāna）出家後，無論走到哪裡，都有一位只有別人看得見的女子跟著他，供養者還會替她多備一份食物。註釋說，這來自迦葉佛時代：一位天神嫉妒兩位形影不離的比丘，讓其中一人看起來像是犯了梵行戒，後來她向兩人認錯、使他們和好；她因此墮入阿鼻地獄，後來轉生成君荼提那，那位女子再次跟著他。比丘們向長者與毗舍佉訴苦，兩人都不幫忙；比丘們便告到國王那裡。國王設法查證，判定那是幻影而不是真的女人，反而邀請尊者接受自己的供養。於是有比丘譏諷他是「國王的私生子」，他也用難聽的話回敬。佛陀問明後，把他現在的處境與過去的邪見連在一起，說了關於不說粗惡的話、保持沉默的偈頌；許多聽眾證得初果，君荼提那證得阿羅漢，後來被稱為領取籌食者中的第一。（依註釋傳統概述）", "k": [{"n": "133", "h": ["不當麤言，", "言當畏報，", "惡往禍來，", "刀杖歸軀；"], "p": ["Māvoca pharusaṃ kañci, vuttā paṭivadeyyu taṃ;", "dukkhā hi sārambhakathā, paṭidaṇḍā phuseyyu taṃ."], "hm": "漢譯全文第 3 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "不要對任何人說粗話；被你說的人會以同樣的話回你；爭吵的言語是苦，報復會落到你身上。"}, {"n": "134", "h": ["出言以善，", "如叩鐘磬，", "身無論議，", "度世則易。"], "p": ["Sace neresi attānaṃ, kaṃso upahato yathā;", "esa patto'si nibbānaṃ, sārambho te na vijjati."], "hm": "漢譯全文第 4 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "如果你能讓自己像一面被敲後不再作響的銅鑼那樣安靜下來，你就已經接近涅槃了，因為你不再有爭吵。"}], "g": [["mā avoca", "不要說"], ["pharusaṃ", "粗話"], ["paṭivadeyyu", "會回嘴"], ["sārambhakathā", "爭吵的話語"], ["paṭidaṇḍā", "反擊、報復"], ["kaṃso upahato", "被敲過（不再作響）的銅鑼"], ["nibbānaṃ", "涅槃"]], "w": [["麤言", "粗話"], ["畏報", "怕有報應"], ["叩鐘磬", "敲鐘與磬"], ["論議", "被議論、被指責"]], "i": [["兩種聲音", "一種是「回嘴」：你說我，我說你，越吵越響。另一種是「銅鑼被按住」：不再響，吵架就沒有了。"], ["故事的諷刺", "尊者因為被誤會而生氣、回罵，結果反而讓自己更難受。偈頌的建議，正是這樣情況下的出路：先不回。"],["故事與偈的連結","註釋的安排：整則故事很長，大半在講君荼提那身邊的幻影女子（來自前世天神的嫉妒）。但第 133、134 偈只對應最後一小段：同修們譏諷他，他也惡言回敬，佛陀問明後說：不要說粗惡的話，別人會回你；若能沉默，像破裂的鑼不再發聲，就接近涅槃。連結程度：較鬆。偈只對應「口出惡言」這一段，不是對幻影女子的回應。故事本身（前世因果、國王查證）是在鋪陳他的處境。"]], "x": "今天想回一句重話之前，先停三秒，想想這句話會怎麼回到我身上。", "q": {"q": "偈頌說「像一面被敲過後不再作響的銅鑼」，這個畫面的意思是？", "o": [["不再用語言回擊，讓爭吵自己停下來", "是的。銅鑼不響，吵架就沒了。要停下來，往往需要有一個人先「不再回聲」。", 1], ["要變得像銅一樣冷硬", "偈頌的重點不是冷漠，而是靜下來；這樣的人其實更接近涅槃的平靜。"], ["沉默代表你輸了", "偈頌正是在說：不爭，才是真正的平靜。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-04.htm", "st": "The Story about the Elder Kuṇḍadhāna"}, {"id": "f4", "t": "牧牛人與老死", "s": "舍衛城的毗舍佉（Visākhā）是佛陀的大施主。有一次布薩日，她帶著五百位也守八關齋戒的女眾到精舍，一一詢問她們為什麼守齋：年長的希望生天，中年的希望擺脫丈夫的管束，年輕的妻子希望早日懷孕，少女希望早些出嫁。毗舍佉把這些回答帶去見佛陀。佛陀說：生、老、病、死像牧牛人拿著棍棒驅趕牛群，驅趕眾生向前；可是大多數人仍然想要再生，而不是結束它。他說了這一偈：老與死像牧牛人趕牛去牧場，驅趕眾生的壽命。許多聽眾證得初果以上。（依註釋傳統概述）", "k": [{"n": "135", "hn": "漢傳〈刀杖品〉沒有對應偈；〈無常品〉有：「譬人操杖，行牧食牛；老死猶然，亦養命去」。", "p": ["Yathā daṇḍena gopālo, gāvo pāceti gocaraṃ;", "evaṃ jarā ca maccu ca, āyuṃ pācenti pāṇinaṃ."], "d": "就像牧牛人用棍棒把牛趕向牧場，老與死也這樣驅趕眾生的壽命。"}], "g": [["yathā", "就像"], ["daṇḍena", "用棍棒"], ["gopālo", "牧牛人"], ["gāvo", "牛"], ["pāceti", "驅趕"], ["jarā", "老"], ["maccu", "死"], ["āyuṃ", "壽命"], ["pāṇinaṃ", "眾生的"]], "w": [["操杖", "拿著杖"], ["行牧食牛", "趕牛去吃草"], ["養命去", "（老死）把命一天天養著、趕著走"]], "i": [["「被趕著走」的感覺", "偈頌的畫面很生活：每個人都像被什麼推著走，只是不一定看得見推的是老、是死。看見，就是自由的開始。"], ["五百位女眾的願望", "年長、中年、年輕、少女，各有各的願望，都很真實。佛陀沒有責怪，只是把視野再拉遠一些。"],["故事與偈的連結","註釋的安排：毗舍佉帶五百位女眾到佛陀面前，說明她們守齋的各種心願（生天、擺脫丈夫、早懷孕、早出嫁）。佛陀說：生老病死像牧牛人拿棍子驅趕牛群，眾生卻還想著再生，然後說第 135 偈。連結程度：直接，但要轉一步。女眾的願望都是「再得一個好的來生」，佛陀回應的是：連來生也逃不開老與死的驅趕。偈沒有批評守齋，只是指出更大的圖像。"]], "x": "今天留意一件正在「催著你走」的事（行程、待辦），挑一件今天不趕，慢慢做。", "q": {"q": "偈頌用「牧牛人趕牛」來比喻老與死，想說明什麼？", "o": [["時間在推著我們走，看見它，才能選擇怎麼走", "是的。與其被趕著走卻不自知，不如看清楚被什麼推著，再決定要把力氣用在哪裡。", 1], ["人生就是被逼迫，沒有選擇", "偈頌是邀請看見，而不是宣布無奈；佛陀接著指出的是出路。"], ["老與死是壞人", "偈頌沒有責備老與死，只是描述它們如何推動眾生。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-05.htm", "st": "The Story about Visākhā and Others Observing the Observance Days"}, {"id": "f5", "t": "燒著自己的火", "s": "目犍連尊者與羅漢尊者 Lakkhaṇa 從靈鷲山下來時，目犍連看見一隻形如巨蟒、周身火燄的餓鬼，微微一笑。佛陀說他以前也見過這隻餓鬼，並說起迦葉佛時代的事：一位富人 Sumaṅgala 不斷被一個盜賊縱火損失財物，富人回應的是布施，並把功德迴向給那位盜賊，盜賊深受感動，求他原諒；但他的惡業仍使他墮入阿鼻地獄，後來成為這隻餓鬼。佛陀說：愚人在作惡時並不覺悟，之後被自己的業所燒，像一把自己點的火。許多聽眾證得初果。（依註釋傳統概述）", "k": [{"n": "136", "hn": "漢傳〈刀杖品〉沒有對應偈。", "p": ["Atha pāpāni kammāni, karaṃ bālo na bujjhati;", "sehi kammehi dummedho, aggidaḍḍhova tappati."], "d": "愚人在做惡業時並不覺悟；愚昧的人被自己的業折磨，像被火燒傷一樣。"}], "g": [["pāpāni kammāni", "惡業"], ["karaṃ", "做的時候"], ["bālo", "愚人"], ["na bujjhati", "不覺悟"], ["dummedho", "愚昧的人"], ["sehi kammehi", "被自己的業"], ["aggidaḍḍha", "被火燒的"], ["tappati", "受煎熬"]], "w": [], "i": [["「當時沒有覺察」", "偈頌最關鍵的一句是：愚人在做的時候，並不覺悟。很多後悔，不是因為不知道，而是做的當下沒有看見。"], ["自己的火", "這團火不是別人點的，是自己的業。看見這一點，也代表有機會不再添柴。"],["故事與偈的連結","註釋的安排：目犍連看見形如巨蟒、全身著火的餓鬼而微笑，回到王舍城後說明所見。佛陀證實，並說這個餓鬼在迦葉佛時代是個縱火的盜賊（把富人 Sumaṅgala 的田、屋、香室燒了），雖然後來懺悔，惡業依然成熟，墮阿鼻地獄後成為餓鬼。佛陀說第 136 偈：愚人作惡時不覺悟，之後被自己的業所燒。連結程度：直接。偈的「不覺悟、被自己的業燒」就是那個盜賊的歷程。（註釋沒有說懺悔能完全抵消惡業，這是故事的重點之一。）"]], "x": "今天做事時，偶爾問一次自己：我現在做的，是不是「明知不太好，還在做」的事？", "q": {"q": "偈頌說愚人「在做的時候並不覺悟」。這句話對我們有什麼提醒？", "o": [["很多錯誤不是故意，而是當下沒有覺察；培養覺察，就是在減少後悔", "是的。覺察是在做的當下發生的，不是事後。每一次「停三秒」，都是在練習這一點。", 1], ["既然沒有覺悟，就不用負責", "偈頌恰恰相反：沒有覺悟，所以更需要練習覺察。"], ["愚人一定是壞人", "偈頌說的是「沒有覺察」，不是品行的好壞。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-06.htm", "st": "The Story about the Python Peta"}, {"id": "f6", "t": "十種災難", "s": "外道修行者嫉妒目犍連尊者說法帶來的供養，雇用盜賊要殺他。目犍連兩次避開，第三個月卻沒有逃，因為他正面對過去惡業的結果。盜賊殺死了他；去世前，他去見過佛陀、說了法，才離世。阿闍世王處死了那些盜賊和雇用的外道。比丘們問佛陀：這是怎麼回事？佛陀說，目犍連在過去世曾在妻子影響下殺害父母，所以這一世的死與那個舊業相應。接著佛陀說了偈頌：對沒有傷害人的人加以傷害，會遇到十種災難之一。許多聽眾證得初果。（依註釋傳統概述）", "k": [{"n": "137", "h": ["歐杖良善、", "妄讒無罪，", "其殃十倍，", "災迅無赦：", "生受酷痛；"], "p": ["Yo daṇḍena adaṇḍesu, appaduṭṭhesu dussati;", "dasannamaññataraṃ ṭhānaṃ, khippameva nigacchati."], "hm": "漢譯全文第 5 段對應（大正藏 T04, 565c）。漢譯全文第 5 至 15 段合起來列出「十種災」，與巴利第 137 至 140 偈對應。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "用刀杖傷害沒有刀杖、沒有惡意的人，很快就會落入十種處境之一。"}, {"n": "138", "h": ["形體毀折；", "自然惱病；", "失意恍惚；"], "p": ["Vedanaṃ pharusaṃ jāniṃ, sarīrassa ca bhedanaṃ;", "garukaṃ vāpi ābādhaṃ, cittakkhepañca pāpuṇe."], "hm": "漢譯全文第 6 至 8 段（形體毀折、惱病、失意恍惚）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "劇烈的痛苦、身體的毀壞、嚴重的疾病，或是心神錯亂；"}, {"n": "139", "h": ["人所誣咎；", "或縣官厄；", "財產耗盡；", "親戚離別；"], "p": ["Rājato vā upassaggaṃ, abbhakkhānañca dāruṇaṃ;", "parikkhayañca ñātīnaṃ, bhogānañca pabhaṅguraṃ."], "hm": "漢譯全文第 9 至 12 段（誣咎、縣官、財產耗盡、親戚離別）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "或來自國王的災難、嚴重的誣陷、親人的離散、財產的毀損；"}, {"n": "140", "h": ["舍宅所有，", "災火焚燒；", "死入地獄。", "如是為十。"], "p": ["Atha vāssa agārāni, aggi ḍahati pāvako;", "kāyassa bhedā duppañño, nirayaṃ so upapajjati."], "hm": "漢譯全文第 13 至 15 段（火焚舍宅、死入地獄、如是為十）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "或是房屋被猛火燒毀；身壞命終之後，愚昧的人墮入地獄。"}], "g": [["daṇḍena", "用刀杖"], ["adaṇḍesu", "沒有刀杖的人"], ["appaduṭṭhesu", "沒有惡意的人"], ["dasannaṃ", "十種之中的"], ["khippaṃ", "很快"], ["vedanaṃ pharusaṃ", "劇烈的痛苦"], ["abbhakkhānaṃ", "誣陷"], ["agārāni", "房屋"]], "w": [["歐杖", "毆打、杖打"], ["妄讒無罪", "無端誣陷沒有過錯的人"], ["縣官厄", "官府的災難"], ["舍宅", "房屋"]], "i": [["十種清單", "清單看起來很嚇人，但它真正的功能是提醒：傷害無辜之人，不是「小事」，它可能在各個層面（身體、心、名譽、財產、關係）回來。"], ["故事不好讀", "目犍連的故事很沉重。註釋的解釋是：這與他自己的舊業有關，而不是「無辜者必有此報」的一般說法。讀的時候，請特別留意這一點。"],["故事與偈的連結","註釋的安排：外道雇盜賊殺目犍連，他前兩個月脫身，第三個月不逃，被殺後入滅。比丘們在法堂議論：這樣的聖者為何死得這麼慘？佛陀說這是前世殺父母的業報，並說第 137–140 偈：傷害無辜的人，會遇到十種災難之一。連結程度：較鬆。偈講的是「傷害無辜者的果報」，故事裡的目犍連是無辜的被害者；註釋靠「前世他曾經傷害無辜（父母）」把兩者接起來。如果不讀前世，偈與今生的死並不對得上，這是此組最需要說明的地方。"]], "x": "今天想批評或指責別人之前，先確認：對方真的有錯嗎？我說的有沒有誇大？", "q": {"q": "偈頌列出十種災難。這個清單最想提醒我們什麼？", "o": [["傷害無辜的人，後果會牽涉很多面向，不是只有一件事", "是的。身體、心、名譽、財產、親人……清單是在說：這種行為的後果是全面的，所以值得慎重。", 1], ["這十種災難一定會準時降臨", "偈頌是在強調後果的嚴重與廣度，不是預告一張時間表。"], ["受害的人都有前世的責任", "註釋對目犍連的解釋是個別情形，偈頌本身沒有把這個說法推廣到所有受害者；請不要這樣用。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-07.htm", "st": "The Story about the Elder Mahā Moggallāna"}, {"id": "f7", "t": "身外之物，修行不了", "s": "一位在家人在妻子去世後出家，卻仍有很多財物：儲藏室放滿食物，有自己的僕人，還有好幾套衣服。其他比丘告訴佛陀，佛陀當面問他。他被責備而生氣，把外衣脫掉，只穿一件站在大眾面前。佛陀提醒他，過去世他曾做過水羅剎，那時他培養過慚愧與對惡的畏懼，比丘因此恢復了羞恥心，穿回衣服。佛陀還說了一則本生故事：比丘前世是個夜叉，考驗王子們什麼是真正的神性，弟弟們答不出來而被抓，菩薩王子（佛陀的前世）回答：在於慚與愧，夜叉因此受持五戒、放了他們。佛陀總結：穿袈裟並不等於是比丘；裸形、苦行、艱難都無法淨化尚未斷疑的人。許多聽眾證得初果。（依註釋傳統概述）", "k": [{"n": "141", "h": ["雖倮剪髮，", "長服草衣，", "沐浴踞石，", "奈癡結何？"], "p": ["Na naggacariyā na jaṭā na paṅkā, nānāsakā thaṇḍilasāyikā vā;", "rajojallaṃ ukkuṭikappadhānaṃ, sodhenti maccaṃ avitiṇṇakaṅkhaṃ."], "hm": "漢譯全文第 16 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "不是裸行、不是結髮、不是塗泥、不是斷食、不是睡在硬地、不是滿身塵垢、不是蹲著苦修，這些都不能使還沒有度過疑惑的人清淨。"}], "g": [["naggacariyā", "裸行"], ["jaṭā", "結髮"], ["paṅka", "泥"], ["anāsakā", "斷食"], ["thaṇḍilasāyikā", "睡在硬地"], ["rajojalla", "塵垢"], ["ukkuṭikappadhāna", "蹲著用功"], ["avitiṇṇakaṅkha", "還沒有度過疑惑的人"]], "w": [["倮", "裸"], ["草衣", "草編的衣服"], ["踞石", "坐在石頭上"], ["癡結", "愚癡的繫縛"]], "i": [["外在形式與內在清淨", "偈頌列出一長串當時流行的苦行，最後的結論只有一句：這些不能讓「還有疑惑的人」清淨。真正要處理的是疑惑與煩惱。"], ["現代版本", "今天的「形式」可能是打卡、貼文、穿著、頭銜。重點不是否定它們，而是看清：它們不能代替內心的功課。"],["故事與偈的連結","註釋的安排：比丘因為被責備生氣，把外衣脫掉站在大眾前。佛陀說：不是披上袈裟就是比丘，並說第 141 偈：裸形、結髮、塗泥、斷食、臥地、蹲踞，都不能淨化還沒斷疑的人。連結程度：較鬆。偈列的是外道的苦行，比丘的問題是「囤積財物」與「發脾氣脫衣」，兩者只在「外在形式不等於清淨」這點相接。比丘恢復慚愧心，主要靠水羅剎的前世故事，而不是這首偈。"]], "x": "今天檢視一個「做給別人看的修行形式」（打卡、轉貼、外表），問自己：這對我的心有幫助嗎？", "q": {"q": "偈頌列舉各種苦行，最後說它們不能讓人清淨。真正缺少的是什麼？", "o": [["對疑惑與煩惱的處理：內心的功課不能被外在形式取代", "是的。外在形式可以幫助，但不能代替內心的看清與放下。", 1], ["苦修得還不夠多", "偈頌的重點是方向，不是強度；再多的苦修也不能代替內在的功課。"], ["應該完全不要形式", "偈頌並沒有否定所有形式，而是說形式本身不等於清淨。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-08.htm", "st": "The Story about the Bhikkhu with Many Possessions"}, {"id": "f8", "t": "打扮整齊的阿羅漢", "s": "憍薩羅國的大臣 Santati 平定邊境叛亂後，國王把王權借給他七天，並賜給他一位舞女，他整整七天都在飲酒作樂。第七天，他盛裝騎象出遊，在路上遇見佛陀托缽，只在象背上點頭致意。佛陀微笑，告訴阿難：他今天就會證得阿羅漢。那位舞女當晚在表演時突然去世，Santati 悲痛不已，去見佛陀尋求安慰。佛陀為他說了偈頌，勸他讓過去乾涸、不要執著現在。Santati 證得阿羅漢，升到空中，說起自己在毗婆尸佛時代宣揚佛法而受國王賞賜的前世，然後在禪定中圓寂，遺骨被供奉。比丘們問：該稱他為婆羅門還是沙門？佛陀說：凡是平和、調伏、放下刀杖的人，即使裝飾華麗，也值得這些稱呼。（依註釋傳統概述）", "k": [{"n": "142", "h": ["自嚴以修法，", "滅損受淨行，", "杖不加群生，", "是沙門道人。"], "p": ["Alaṅkato cepi samaṃ careyya, santo danto niyato brahmacārī;", "sabbesu bhūtesu nidhāya daṇḍaṃ, so brāhmaṇo so samaṇo sa bhikkhu."], "hm": "漢譯全文第 20 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "即使打扮得很華麗，只要行為平和、寂靜、調伏、克制、行梵行，對一切眾生放下刀杖，他就是婆羅門、就是沙門、就是比丘。"}, {"n": "漢17", "h": ["不伐殺燒，", "亦不求勝，", "人愛天下，", "所適無怨。"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "不砍伐、殺害、焚燒，也不求勝過別人；愛天下人，到哪裡都沒有怨敵。"}, {"n": "漢21", "h": ["無害於天下，", "終身不遇害，", "常慈於一切，", "孰能與為怨？"], "pn": "巴利本此品沒有找到明確對應；放在這裡一起讀（編者依內容與位置安排）。", "d": "不加害於天下，終身不遇害；常懷慈心對待一切，誰能與他結怨？"}], "g": [["alaṅkato", "裝飾過的"], ["samaṃ careyya", "行為平和"], ["santo", "寂靜"], ["danto", "調伏"], ["niyato", "克制"], ["brahmacārī", "行梵行者"], ["nidhāya daṇḍaṃ", "放下刀杖"], ["bhikkhu", "比丘"]], "w": [["自嚴", "自己嚴整"], ["滅損", "減損（煩惱）"], ["沙門道人", "修道的人"], ["孰能", "誰能"]], "i": [["名稱不在外表", "這一偈說，即使穿著華麗，只要「對一切眾生放下刀杖」，就配得上婆羅門、沙門、比丘之名。重點是內在的和平，而不是穿什麼。"], ["與上一偈對看", "上一則說外在苦行不能代替內心；這一則說外在裝飾也不能否定內心。兩偈合起來：看內心，不看外表。"],["故事與偈的連結","註釋的安排：比丘們在法堂討論：Santati 盛裝而證阿羅漢，該稱他婆羅門還是沙門？佛陀說都可以稱，然後說第 142 偈：即使裝飾華麗，只要內心平和、調伏、放下傷害一切眾生的人，就是婆羅門、沙門、比丘。連結程度：直接。偈的「即使有裝飾」正好對應這位盛裝入滅的大臣。（註釋裡佛陀對 Santati 本人說的是另一首偈，不是這一首。）"]], "x": "今天出門前整理儀容時，提醒自己：外表之外，我今天要用哪一個行為，讓別人感覺到平和？", "q": {"q": "偈頌說「即使裝飾華麗，仍然可以是比丘」。這是在說什麼？", "o": [["名實不在外表，而在是否放下傷害、保持調伏", "是的。判斷一個人，不看打扮，而看他對眾生的態度與內心的調伏。", 1], ["打扮華麗也沒關係，可以隨意", "偈頌並不是鼓勵華麗，而是說外表不是標準。"], ["出家人不該穿得整齊", "偈頌沒有這種意思，重點是內在，不是排斥外在。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-09.htm", "st": "The Story about the Minister Santati"}, {"id": "f9", "t": "聽見責備就警醒的馬", "s": "阿難尊者為一位貧窮青年皮羅提卡（Pilotika）授了戒。他漸漸習慣了比丘的供養，心生厭倦，想回頭穿舊破衣，便走到掛著舊衣的樹下；可是一見舊衣，他就責備自己是無慚的愚人，心反而安靜下來，回到精舍。這樣來回三次，每次都以自責作為修行的題目，最後證得阿羅漢。其他比丘問起他是否去拜訪「老師」，他說已經斷了世俗關係，不再去了。佛陀證實他所說的是真話，並說了偈頌：自我克制的人，像受過訓練、聽到鞭響就奔馳的良馬。許多聽眾證得初果等果位。（依註釋傳統概述）", "k": [{"n": "143", "h": ["世黨有人，", "能知慚愧，", "是名誘進，", "如策良馬、", "如策善馬，", "進道能遠。"], "p": ["Hirīnisedho puriso, koci lokasmiṃ vijjati;", "yo nindaṃ appabodhati, asso bhadro kasāmiva."], "hm": "漢譯全文第 18 段與此偈對應（大正藏 T04, 565c）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "世間有沒有這樣的人：因為慚愧而自制，聽到責備就警醒，像良馬看見鞭影就奔馳？"}, {"n": "144", "h": ["人有信戒，", "定意精進，", "受道慧成，", "便滅眾苦。"], "p": ["Asso yathā bhadro kasāniviṭṭho, ātāpino saṃvegino bhavatha;", "saddhāya sīlena ca vīriyena ca, samādhinā dhammavinicchayena ca;", "sampannavijjācaraṇā patissatā, pahassatha dukkhamidaṃ anappakaṃ."], "hm": "漢譯全文第 19 段（信戒定意精進，受道慧成，便滅眾苦）對應此偈的後半（編者比對）。漢巴對應是編者依內容與順序比對，蘇錦坤對讀表此處未能核對。", "d": "像受過鞭策的良馬，要有熱忱、有警覺；以信、戒、精進、定與抉擇法義，具足明與行、保持正念，你們就能斷除這無量的苦。"}], "g": [["hirī", "慚"], ["nisedho", "自制"], ["nindaṃ", "責備"], ["appabodhati", "被喚醒"], ["asso bhadro", "良馬"], ["kasā", "鞭"], ["ātāpino", "熱忱精進的"], ["saṃvegino", "有警覺的"]], "w": [["世黨", "世間"], ["誘進", "被引導而進步"], ["策", "鞭策"], ["受道慧成", "領受道理，智慧成就"]], "i": [["好馬與鞭", "好馬不是等鞭子打到身上才動，而是看見鞭影就懂。同樣，聰明的人聽到一句提醒，就能反省，不需要重話。"], ["皮羅提卡的歷程", "他在「回去、舊衣服、責備自己」中反覆，反而因此看見了自己，是這首偈很真實的例子。"],["故事與偈的連結","註釋的安排：比丘們報告：皮羅提卡說他去「見老師」，後來又說不再去了，是不是說謊。佛陀說：他說的是真話——所謂「老師」就是掛在樹上的舊破衣，他看著它責備自己，已證阿羅漢，不再需要回去。佛陀接著說第 143、144 偈：被慚愧心制約的人，像受過訓練的好馬，不必常常用鞭子；要以信、戒、精進、定、擇法勤奮。連結程度：直接。「受慚愧與自責激勵而醒悟」就是偈說的「好馬」。"]], "x": "今天被人提醒一個小缺點時，不辯解，先說「謝謝」。", "q": {"q": "偈頌用「良馬」比喻什麼樣的人？", "o": [["一點提醒就能反省、不需要重話的人", "是的。良馬看見鞭影就奔馳；有智慧的人，一句提醒就能調整。這樣的人省力，也省下別人的力氣。", 1], ["需要被鞭打才會進步的人", "偈頌正好相反：良馬是不用打的。"], ["很快就生氣的人", "偈頌談的是對責備的反應：警醒，而不是發怒。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-10.htm", "st": "The Story about the Elder Pilotika"}, {"id": "f10", "t": "七歲沙彌", "s": "七歲的沙彌須佉（Sukha）是支持舍利弗長老的家庭的兒子。他跟著舍利弗走去村裡，看見灌溉的人引水、造箭的人整直箭桿、木匠削整木材，心想：我也可以調伏自己的心。他請舍利弗先回村裡取供養的餐點，自己留在精舍獨自禪修；帝釋與四大天王替他看守，不讓人打擾。佛陀知道須佉快要覺悟，親自站在門口，不讓舍利弗太早回來；須佉在吃飯之前證得阿羅漢。佛陀說了這一偈：引水的、造箭的、削木的，都能調整他們的對象，善行的智者，調伏自己。許多聽眾證得初果。（依註釋傳統概述）", "k": [{"n": "145", "hn": "漢傳〈刀杖品〉沒有對應偈；〈明哲品〉有相同的偈：「弓工調角、水人調船、材匠調木、智者調身」。", "p": ["Udakañhi nayanti nettikā, usukārā namayanti tejanaṃ;", "dāruṃ namayanti tacchakā, attānaṃ damayanti subbatā."], "d": "引水的人引導水流，造箭的人矯正箭桿，木匠整治木材；善守戒行的智者調伏自己。"}], "g": [["udaka", "水"], ["nayanti", "引導"], ["nettikā", "引水的人（灌溉工）"], ["usukārā", "造箭的人"], ["namayanti", "使彎曲、矯正"], ["tacchakā", "木匠"], ["attānaṃ damayanti", "調伏自己"], ["subbatā", "善守戒行的人"]], "w": [["弓工", "做弓的人"], ["調角", "調整弓角"], ["調身", "調伏自己"]], "i": [["三個工匠，一個目標", "水、箭、木，三種材料都是外面的東西；而偈頌說：最難也最值得調的，是自己。"], ["七歲的領悟", "小沙彌沒有學過很多道理，他只是看見工匠調整材料，就想到自己也可以。學習，有時只需要一個眼神。"],["故事與偈的連結","註釋的安排：須佉證阿羅漢的那天，比丘們覺得早晨特別長、傍晚特別慢。佛陀說明是因為須佉在修行（天神讓鳥安靜、日月暫停），並回顧他看見灌溉的人、造箭的人、木匠調整對象，而想「他們能調伏物，我為何不能調伏心」，然後說第 145 偈。連結程度：直接。偈把三位工匠的比喻原樣收進來，是全書故事與偈連結最緊密的一則。"]], "x": "今天調整自己的一件小事（姿勢、語速、作息），像木匠削木那樣，一點一點修正。", "q": {"q": "偈頌用水、箭、木三種例子，想要強調什麼？", "o": [["調伏自己和調整外物一樣，是可以練習的技術", "是的。工匠不是天生會，而是練出來的。自己也能這樣，一點一點校正。", 1], ["要像對待木頭一樣嚴厲對待自己", "偈頌的比喻是技巧與耐心，不是粗暴。"], ["只有工匠才能修行", "偈頌用工匠只是為了比喻；沙彌就是從看見工匠得到啟發的。"]]}, "su": "https://ancient-buddhist-texts.net/English-Texts/Dhamma-Verses-Comm/10-11.htm", "st": "The Story about the Novice Sukha"}], "ss": 1, "ps": 1});

var TL={"y1":{"學":[["心情糟的時候讀書，怎麼讀都累。先把心安下來，再翻開書。","今天坐下來讀書前，先深呼吸三次，再翻開第一頁。"]],"事":[["帶著一肚子氣去開會，說出口的話多半會後悔。先停一下，再開口。","今天開會或回信前，先停三秒，問自己：我現在是氣的，還是清楚的？"],["做事前先看看自己的心：是急、是氣、還是怕？先安心，再開始。","今天開始做事前，先停三秒，檢查自己的心。"]],"命":[["用染污的心說話做事，苦就跟著來，像車輪跟著牛蹄。","今天發現自己心煩時，先不說話，過一分鐘再開口。"]]},"y2":{"友":[["用好心情跟朋友相處，一句話、一個笑，快樂就會跟著你。","今天對一位朋友說一句真心的好話。"]],"情":[["帶著善意去愛，對方感受到的是安心，不是壓力。","今天對在乎的人，用溫和的語氣說一句關心。"]],"命":[["一切由心主導。帶著清淨的心做事，快樂像影子一樣跟著你。","今天做一件事前，先問自己的心：現在是什麼狀態？"]]},"y4":{"人":[["被同事嗆了一句，你嗆回去，只會多一場戰爭。不回嘴，事情才會結束。","今天被嗆時，先不回嘴，深呼吸一次，看看事情會不會自己過去。"]],"情":[["吵架時用氣話回擊，怨只會越滾越大。有一方先不加料，才吵得完。","下次吵架，試著先說一句「我們先冷靜一下」。"],["想放下一個怨，不必說得很大聲，先從不再重播開始。","今天想起那個怨，對自己說：「不再重播。」"]],"家":[["家人吵架，誰先不加料，誰就先讓這個家安靜下來。","今天家人吵起來時，你先沉默，等一下再說。"]],"放":[["怨恨不能用怨恨止息，只有放下怨才會平息。放下，不是說對方沒錯，也不是回去繼續被傷害，而是你不再為他受傷。","今天想起一個讓你不舒服的人，對自己說：這件事，我不再背著它。"]]},"y5":{"人":[["為了一點小事爭到面紅耳赤，想想人生這麼短，值得嗎？","今天遇到想爭的事，先問自己：一個月後我還在乎嗎？"]],"友":[["跟朋友為小事冷戰，只要有一個人先想到「日子很短」，就和好了。","找一位冷戰中的朋友，先傳一句輕鬆的問候。"]],"家":[["為了誰洗碗、誰說錯而失和，想想日子很短，家人比對錯重要。","今天遇到想吵的小事，先問：這件事值得嗎？"]],"放":[["明白我們都會死，爭執就平息了。想到終點，很多堅持就放得下。","今天遇到想爭贏的事，問自己：一百年後，這還重要嗎？"]],"活":[["爭吵常常是因為忘了：大家都會老、都會死。想起這點，氣常常就退一點。","今天想吵架時，想一想：這個人，我還能陪多久？"]]},"y6":{"學":[["一直滑手機、貪吃貪玩、又懶得動，書就讀不進去。守住入口，心才不會被拖走。","讀書時把手機放到看不到的地方，二十五分鐘後再看。"]],"事":[["眼睛耳朵一直被吸走、作息亂、懶得動，工作怎麼會順？先守住自己的習慣。","今天挑一個容易讓你分心的入口，例如手機，伸手前先覺察一次。"]],"健":[["飲食沒有節制、作息放縱，身心容易被拖垮。守住吃飯和睡覺的分寸。","今天吃飯吃七分飽，慢慢吃。"]],"存":[["吃得沒節制、不守護自己的感官，容易被煩惱打倒。照顧好身體，是活下去的第一步。","今天吃飯時，留意第一口的味道，吃的時候不滑手機。"]]},"y7":{"事":[["嘴上說得好聽、做起來卻不一樣，頭銜再漂亮也撐不住。先讓行為配得上位置。","今天挑一件你說過的承諾，認真做完它。"],["別讓頭銜走在實力前面。先把本事練到位。","今天挑一項實力，練習十分鐘。"]],"命":[["自己的染污未除，卻披上外衣，不相稱。外表和內心，要一致。","今天誠實想想：我外表做的，和內心想的一致嗎？"]]},"y8":{"事":[["忙了一整天，卻都在不重要的事上打轉？先分清楚什麼才是真正重要的。","早上寫下今天最重要的一件事，先做它。"]],"學":[["把力氣花在漂亮的筆記、新買的文具，卻沒真正理解。分清楚什麼才是重點。","讀書前先問：這一段的重點是什麼？用一句話寫下來。"]],"財":[["把錢花在沒有本質的東西上，就像把力氣花在泡沫。分清楚什麼才重要。","今天花錢前，問：這個是重要的，還是一時的？"]],"向":[["把沒有價值的當成有價值，就永遠到不了真正有價值的地方。先分清楚什麼重要。","今天寫下三件最重要的事，把最不重要的一件刪掉。"]]},"y9":{"情":[["心像屋頂：平時修補好，誘惑和心動來的時候，才不會滲進來。","今天心動或煩躁時，先數三次呼吸，再決定要不要行動。"]],"學":[["平常把心練穩，考前、誘惑多的時候，才不會被拉走。","今天誘惑出現時（手機、零食），先等五分鐘。"]],"健":[["心像屋頂：平時修補，壓力來時才不容易漏。每天留一點時間讓心安靜。","今天花五分鐘靜靜坐著，讓心安靜。"]],"存":[["屋頂沒修好，雨就漏進來；心沒練好，煩惱就滲進來。","找出一個總讓你破功的時刻（例如睡前滑手機），先補這一個洞。"]]},"y10":{"事":[["做了違背良心的事，就算沒人發現，自己心裡也不安。","今天做決定時，問自己：這樣做，我晚上睡得著嗎？"]],"財":[["做了違背良心而賺的錢，晚上睡不安穩。","今天做每個賺錢的決定時，問：我晚上睡得著嗎？"]],"過":[["做了違心的事，心裡會一直有個結。","今天處理一件讓你心裡有結的小事。"]]},"y11":{"事":[["做一件對得起良心的事，下班那一刻，心裡是踏實的。","今天結束時，想一件你做得坦蕩的事，感受一下那份踏實。"]],"友":[["幫朋友一個忙，看見自己做得坦蕩，自己也跟著開心。","主動幫朋友一個小忙，不求回報。"]],"未":[["行善的人今生歡喜，來世也歡喜。現在種下的好，是給未來的自己。","今天做一件好事，不求回報。"]]},"y12":{"人":[["一時衝動傷了人，事後想起來，最難受的是自己。開口前，先想會不會後悔。","今天說重話前，先停三秒，想想會不會後悔。"]],"事":[["為了業績動歪腦筋，做完後悔的是自己。","今天遇到想走捷徑的時刻，先停一下，問自己會不會後悔。"]],"家":[["對家人說了重話，事後最難受的是自己。開口前，先停三秒。","今天想說重話時，先停三秒。"]],"過":[["後悔，是提醒你下次做得更好；不是要你一直折磨自己。","今天寫下一件後悔的事，再寫一句「下次我會…」。"]]},"y13":{"友":[["替朋友做了件好事，想起來心裡就暖。","想一件你為朋友做過的好事，讓自己笑一下。"]],"情":[["為在乎的人做了件好事，想起來心裡是甜的。","今天為在乎的人做一件小事，做完留意自己的心情。"]],"家":[["替家人做一件小事，想起來，心裡就暖。","今天幫家人做一件小事，不求回應。"]],"過":[["做過的善，想起來就歡喜。把這些好事記下來。","今天寫下三件過去做得還不錯的事。"]]},"y14":{"學":[["書讀得多，不如做得到。學到的一句話，今天就用上。","今天挑一句學到的話，真的做一次。"]],"事":[["不用懂很多大道理，把學到的一件事實際做出來，就夠了。","今天把學過的一個方法，用在手邊的工作上。"]],"過":[["讀過、聽過很多，如果沒有實行，也只是路過。","今天做一件你「早就知道該做」的事。"]]},"z1":{"事":[["每天都有一件該做的事，別拖到最後一刻。認真過的日子，才算活著。","今天找出一件拖著的事，現在就開始做五分鐘。"],["拖延是在偷自己的日子。今天先動手做那件最怕的事。","今天找出一件最怕的事，現在做五分鐘。"]],"學":[["今天該讀的今天讀完。認真過的日子才算活著，混過去的，等於沒活。","今天把該讀的份量讀完，再休息。"]],"家":[["陪孩子的時間不會等人。今天就留一段專心陪伴的時間。","今天留三十分鐘，專心陪孩子，不看手機。"]],"現":[["不放逸是通往不死的路。今天不放逸，就是今天的路。","今天選一件拖延的事，現在做五分鐘。"]]},"z2":{"事":[["勤奮、踏實、做事小心，名聲會慢慢長出來，不必刻意經營。","今天把一件小事做到最細心，不求被看見。"]],"學":[["每天踏實用功，成績和名聲會慢慢跟上，不必急著證明。","今天照自己的進度讀完，不跟別人比。"]],"現":[["正念不是遠方的事，是此刻手上這件事。","今天吃一餐飯，只吃飯，不做別的事。"]]},"z3":{"學":[["別人比你快也沒關係。持續努力、自己管好自己，就是替自己造一座不會被淹沒的島。","今天不跟別人比速度，只把自己的一頁讀完。"]],"事":[["笨拙也沒關係，只要一直走。長期的踏實，比一時的聰明可靠。","今天做一件需要耐心的事，一步一步來。"]],"向":[["為自己造一座洲島，洪水來了也不被淹沒。方向穩了，風浪就沒那麼可怕。","今天寫下一條你一定守住的原則，當作自己的洲島。"]]},"z4":{"友":[["朋友聚會玩得開心沒問題，但別把時間都泡進去，自己的事也要顧。","聚會中留一點時間，回家早一點，把自己的事也顧好。"]],"事":[["別一直沉溺在玩樂和應酬，留一點安靜的時間，才有真正的安樂。","今天留十分鐘什麼都不滑，靜靜坐著。"]],"向":[["智者守護不放逸，像守護財寶。方向要靠每天守。","今天設一個提醒，守住最重要的一件事。"]]},"z5":{"事":[["當你把自己的事顧好、心站得高一點，別人慌亂時，你看得更清楚。","手邊有件事心慌時，先離開座位站起來，看一下遠處，再回頭處理。"]],"人":[["別人亂成一團時，你不跟著慌，站高一點看，反而幫得上忙。","別人慌亂時，先深呼吸，再問「我可以幫什麼？」"]],"向":[["站上智慧的高樓，就看得見地上的人憂愁。拉高視野，方向就清楚。","今天遇到煩惱，先想：一個月後，我怎麼看這件事？"]]},"z6":{"友":[["身邊的人都在混的時候，你仍然保持清醒，這需要一點定力。","大家都在聊八卦時，你可以安靜或轉個話題。"]],"學":[["班上都在偷懶，你仍照自己的進度走，領先就是這樣來的。","今天按自己的計畫念書，不被別人的節奏影響。"]],"現":[["在放逸的人中保持警醒，像快馬把劣馬拋在後面。周圍的人都在滑手機時，你可以選擇清醒。","今天有一段時間，把手機放遠。"]]},"z7":{"事":[["以前荒廢過沒關係，從今天開始收心，一樣能像光一樣照亮身邊。","從今天起，挑一件小事開始收心，做到最好。"]],"友":[["過去混過也沒關係，現在重新振作，朋友看了也會被帶動。","傳訊給久沒聯絡的朋友，說一聲你想重新開始。"]],"命":[["先前放逸，後來能自我約束，像光照亮世間。重新開始，不晚。","今天做一件你一直說「明天開始」的事。"]]},"z9":{"事":[["喜歡認真過日子，也看見拖延的可怕，就不容易退步。","今天看到自己想拖延時，說一句「現在就做」，動手一分鐘。"]]},"a1":{"情":[["心情不好也會過去，開心也會過去。知道一切都在變，反而比較安心。","心情不好時，對自己說一句：「這也會過去。」"]],"事":[["現在的壓力和困難，都不是永遠。知道事情會變，就不用那麼緊繃。","壓力大時，提醒自己：這個狀態不是永遠。"]],"健":[["身體不舒服、情緒低落，也都是會變的。別把一時的狀態當成永遠。","今天身體或心情不舒服時，對自己說：「這會過去。」"]],"存":[["經文開頭，先叫人從昏沉中醒來。醒得清楚，從睡夠開始。","今晚固定時間上床，明早起來先喝杯水。"]],"現":[["驅散昏沉，讓心歡喜，是出發的第一步。早上醒來的第一個念頭，選歡喜的。","今天醒來先對自己說：今天，又是新的一天。"]]},"a2":{"事":[["再精緻的成品也會壞，再穩的位子也會換。珍惜現在做的事，比執著結果實在。","今天把手上的事專心做完，不去想結果。"]],"情":[["器皿終會破碎，相處的時光也不是永遠。今天好好對待身邊的人。","今天對在乎的人，好好說一聲謝謝。"]],"家":[["家人像精緻的器皿，都有一天會離開。現在好好說一聲謝謝。","今天對一位家人，說聲「謝謝你」。"]],"命":[["陶器終要破，生命也是。知道會結束，反而更清楚什麼重要。","今天問自己：如果今天很特別，我最想做什麼？"]],"放":[["陶器終要破。別把它當成永遠，用得好，也放得開。","今天用心使用一件物品，用完好好收起來。"]],"未":[["生命終將結束。想想你想感謝的人與事。","今天寫下三件想謝謝的人或事。"]]},"a3":{"學":[["時間像被驅趕著往前走，不等人。今天該念的，今天就開始。","現在就翻開書，讀十分鐘。"]],"事":[["日子被往前趕，不能拖。把最重要的那件事，先做。","現在就做最重要的那一件事，十分鐘也好。"]],"未":[["衰老和死亡像牧人趕牛，驅趕著壽命。時間不等人。","今天把一件「以後再說」的重要小事，現在就做。"]],"存":[["老與死像牧人趕牛，催著日子往前走。趕不停，就把今天過得踏實。","今天安排一個固定的休息時段，好好用它。"]]},"a4":{"事":[["賺很多、存很多，最後都帶不走。想想：現在拚命，是為了什麼？","今天問自己：我現在拚命，是為了什麼？寫下一句答案。"]],"財":[["賺得再多，最後都帶不走。想想現在拚命，是為了什麼？","今天問自己：我現在賺或存，是為了什麼？"]],"放":[["再多的財富，終要放手。賺得認真，也別抱得太緊。","今天用一小筆錢或一點時間，分給需要的人。"]],"存":[["財富帶不走，但生活需要穩當。賺得認真，別被它綁住。","今天看一下收支，記下一筆最近的花費。"]]},"a5":{"事":[["職位升得再高，也有下來的一天。位子高的時候，對人好一點。","今天對一位下屬或晚輩，多一分溫和與感謝。"]],"人":[["今天在一起的人，總有分開的時候。見面時，好好對待彼此。","今天見到人時，好好打招呼，認真聽他說一句話。"]],"家":[["一家人團聚的時光，終有分開的一天。今天吃飯時，把手機放下。","今天吃飯時，手機放在別處，看著家人的臉。"]],"財":[["財富像高處，終有落下的一天。賺到的時候，也記得留一點給別人。","今天分享或請人吃一點東西，哪怕很小。"]],"情":[["有相聚就有分開。今天在一起，就好好珍惜。","今天見到在乎的人時，好好看著他。"]],"放":[["聚積終會耗盡，相聚終會分離。握得太緊，放手時會更痛。","今天挑一樣握得很緊的東西或念頭，試著鬆開一點。"]]},"a6":{"情":[["看過身邊的人生病、變老，才明白：很多執著，其實放得下。","想一件你一直放不下的事，問問自己：我在怕什麼？"]],"家":[["看著父母慢慢變老，才懂得珍惜眼前這段時間。","今天問問父母：今天身體好嗎？"]],"放":[["老、病、死會來，人卻還貪戀著家，像被關在牢裡。看見這一點，是放下的開始。","今天找一件放不下的事，問自己：它是在幫我，還是在拉我？"]],"未":[["老，是一定會到的路。現在就開始照顧。","今天為「老了以後的自己」做一件小準備：運動、存錢，或結善緣。"]]},"a7":{"學":[["一天過一天，時間像水越來越少。現在讀的每一頁，都值得。","今天花十分鐘專心讀，不看手機。"]],"事":[["日子一天少一天，把時間用在真正重要的事上。","今天把一小時留給真正重要的事。"]],"家":[["陪爸媽吃飯的次數是有限的，約好下一次吧。","今天約爸媽下次吃飯的日子。"]],"健":[["日子一天少一天。睡好、吃好、動一動，就是對自己最實在的善待。","今天比平常早十分鐘睡覺。"]],"情":[["時間一天天少。想說的話，別留到最後。","今天把一句想說的話，現在就說。"]],"存":[["縱使活到百歲，老、病、死仍會來。身體顧好，是對自己負責。","今天預約或安排一件拖著的健康檢查或看診。"]],"未":[["縱使活到百歲，老、病、死仍會來。早一點，為身體、為家人做準備。","今天預約健康檢查，或整理一份緊急聯絡資料。"]]},"a8":{"情":[["外表終究會變，別把自己的價值都押在外表上。","今天稱讚一個人的品格，而不是外表。"]],"健":[["這個身體會老、會病、會壞。與其苛責它，不如好好善待，也學著放下對它的執著。","今天伸展身體五分鐘，謝謝它。"]],"存":[["這個身體是疾病的窩，終會壞散。別等它抗議才照顧它。","今天散步或伸展十分鐘，今晚早一點睡。"]]},"a9":{"情":[["只順著慾望走，不合宜的事會越來越多。懂得踩煞車，是對自己也對關係負責。","今天一個想衝動的念頭出現時，先等十秒再決定。"]],"健":[["一直順著慾望走，身心都會越來越亂。懂得踩煞車，就是照顧自己。","今天一個想放縱的念頭出現時，先等十秒。"]],"存":[["放縱嗜欲、看不見無常，容易把身體透支。","今天有一項「明知太過」的習慣，少一點。"]]},"a10":{"情":[["面對生老病死，再親的人也替代不了。所以平時就好好陪伴，別等失去才後悔。","今天打電話或傳訊給你在乎的人，說一句「想你」。"]],"家":[["再親的家人，也替代不了彼此面對生老病死。趁現在多陪伴，比任何東西都實在。","今天打電話給爸媽，聊十分鐘。"]],"未":[["到最後，親人也不能替你擋。早一點，把關係處理好。","今天對一位家人說一句平常說不出口的好話。"]],"放":[["面對死亡，親人無法替代。所以相聚時，多一點珍惜，少一點控制。","今天對家人的一件事，放手讓他自己決定，只說一句關心。"]]},"a11":{"事":[["整天拖延、有餘力卻不願分享、聽不進勸，這幾樣都會拖垮自己。","今天不拖延一件小事，也聽進一句別人的建議。"]],"人":[["有能力卻不肯幫人、聽不進別人的勸，人際會越走越窄。","今天主動幫別人一個小忙，也認真聽一句別人的提醒。"]],"財":[["有餘力卻不願分享，錢再多也不踏實。","今天分享一點東西，或幫一個人一個小忙。"]],"存":[["日夜懶惰、有錢不肯施、不聽勸，是在傷害自己。生存要靠勤，也要靠善。","今天把一件拖著的實際事情（繳費、整理、回覆）做掉。"]]},"a12":{"事":[["有些事躲不掉，與其逃避，不如好好面對、把握現在。","今天挑一件一直躲的事，先做一小步。"]],"健":[["有些事躲不掉，例如生老病死。與其害怕，不如把握能做的小事。","今天做一件對身體好的小事，例如喝水、走路。"]],"未":[["沒有任何地方能躲開死亡。既然都會來，就好好活。","今天寫下一件想在「以後」完成的事，訂個日期。"]],"存":[["沒有哪裡能躲開死亡，所以平安活著的每一天，都值得珍惜。","今天花一分鐘，對還好好的生活說聲謝謝。"]]},"a13":{"事":[["總覺得「做完這件就能休息」，卻永遠做不完。偶爾停下來，問問什麼才是真正重要的。","今天做完一件事後，不急著接下一件，停下來喝杯水，問自己什麼最重要。"]],"學":[["一直趕進度、一直補習，卻忘了停下來想：我到底為什麼而學？","今天先停十分鐘，問自己：我為什麼要學這個？"]],"向":[["「做完這個，再做那個」，忙著忙著，老與死就來了。別只顧著趕，先看路。","今天把待辦清單刪到三件，只做最重要的。"]],"過":[["忙了很多年，回頭看，哪些真的值得？","今天回想過去一年，寫下三件最值得的事。"]]},"c1":{"學":[["心很難靜下來是正常的。像削箭桿一樣，一點一點把它調直。","分心時，不責備自己，輕輕把注意力拉回書上。"]],"事":[["工作中容易分心是人之常情。慢慢練習，把心拉回來。","今天工作被打斷後，深呼吸一次，回到手邊的事。"]],"健":[["心緒亂是人之常情。每天用幾分鐘把心拉回來，比硬撐有用。","今天心亂時，數十次呼吸。"]],"命":[["心會顫動、飄來飄去。智者把它調直，像匠人削直箭桿。","今天心亂時，深呼吸三次，把注意力放回手上這件事。"]],"向":[["心像箭，要削直才射得準。","今天做事前，先想清楚目標，再動手。"]]},"c2":{"事":[["心像脫韁的馬，想到哪就跑到哪。能把它拉回來，工作和生活都會更安穩。","今天遇到想發脾氣的時刻，先數三次呼吸。"]],"健":[["心跑來跑去很累。能把心調順，身體也會跟著輕鬆。","今天遇到煩事，先深呼吸三次。"]],"現":[["心很輕快、很會飄，調伏之後就安樂。","今天心飄走時，輕輕叫它回來，不責備自己。"]]},"c3":{"事":[["心裡的念頭很細，不留意就溜走。每天留一點時間，看看自己在想什麼。","睡前花三分鐘，回想今天自己最常想的是什麼。"]],"學":[["心很容易飄，所以要時時看著它。守好心，讀書才有效率。","開始讀書前，先閉眼三次呼吸，看看現在心在哪裡。"]],"命":[["心很細微、不容易看見。把它守好，就安樂。","今天找三分鐘，什麼都不做，只看自己的念頭。"]]},"c4":{"學":[["心像看不見的旅人，會跑很遠。把它收回來，才能靜下來學習。","讀書前把手機關靜音，專心三十分鐘。"]],"友":[["和朋友相聚時，心卻一直在手機上？把心帶回來，眼前的人才看得見。","和朋友見面時，把手機放進包包，專心聽他說話。"]],"命":[["心走得遠、獨自行動。能約束它的人，從繫縛中解脫。","今天覺得心跑遠了，輕輕叫它回來三次。"]]},"c5":{"情":[["心一會兒這樣、一會兒那樣，感情與判斷都會搖擺。先安定自己，再做決定。","今天要做決定前，先給自己一個晚上。"],["感情裡搖擺不定時，先別急著決定，等心安下來再說。","今天有感情上的決定，先放一晚。"]],"事":[["心定不下來，就看不清楚。重大決定前，先讓心靜下來。","今天做重要決定前，先安靜五分鐘再說。"]],"現":[["心不安定，智慧就無法圓滿。心慌時，先回到呼吸。","今天心慌時，慢慢吸氣四拍、吐氣六拍，做三次。"]]},"c6":{"友":[["知道自己和身邊的人都很脆弱，就會多一分體諒。","今天對一位朋友的小缺點，多包容一次。"]],"學":[["把心守得像一座城，用智慧面對干擾，才不會被輕易擊垮。","遇到干擾時，對自己說：「先做完這一段。」"]],"命":[["把心安立得像一座城，用智慧守住它。","今天做一件事前，先深呼吸，守住心的城門。"]]},"c7":{"情":[["想到有一天我們都會離開，今天就別再為了小事計較了。","今天遇到想計較的事，問自己：一年後這還重要嗎？"]],"健":[["身體終究會躺下，所以趁還能動，好好照顧它，也別為小事耗掉心力。","今天走路十分鐘，感受腳踩地的感覺。"]],"存":[["身體不久就會歸土。現在還能動、能吃、能睡，已經是福。","今天對自己的身體說聲謝謝，並做一件對它好的事。"]]},"c8":{"事":[["最能傷害你的，常常不是對手，而是自己的壞念頭：怨、嫉、焦慮。","今天出現怨或焦慮的念頭時，對自己說：「這是念頭，不是事實。」"]],"健":[["最傷身的，常是自己反覆的怨和焦慮。學著不再重播它。","今天一個反覆的怨念出現時，對自己說「先放下」。"]],"向":[["一顆放錯方向的心，傷自己比仇人還重。方向錯了，越努力越偏。","今天停下來問：我現在用力的這件事，是朝我要的方向嗎？"]]},"c9":{"情":[["最能撫慰你的，終究是自己一顆安定的心。這件事，沒有人能替你做。","今天花五分鐘，靜靜陪自己，不做任何事。"]],"家":[["父母能給的很多，但心的安定要自己學。教孩子安住自己的心，是很好的禮物。","今天陪孩子安靜坐五分鐘，一起深呼吸。"]],"向":[["連父母都做不到的，一顆擺正的心能做到。方向，先從心的位置開始。","今天做事前，先問自己：我的心，現在是朝善的方向嗎？"]]},"p1":{"學":[["要學的很多，一次懂不完。像花匠挑花那樣，一朵一朵慢慢學。","今天只學一小段，把它學懂就好。"]],"向":[["像花匠挑花，要挑好的法句來學。選擇本身就是方向。","今天選一句話，當作今天的方向。"]]},"p2":{"事":[["成敗得失，都像泡沫一樣。盡力就好，別被結果綁住。","今天做完一件事，不要急著看結果，先謝謝自己。"]],"情":[["感情裡的患得患失，就像抓泡沫。看見它的短暫，反而能放鬆。","今天對感情裡的一個擔心，對自己說：「先放一放。」"]],"放":[["身體像泡沫，是幻影。看清這點，就不必看得那麼重。","今天笑自己一次，別太認真。"]]},"p3":{"人":[["忙著追逐想要的，卻忽略身邊的人，等到想珍惜時，已經來不及。","今天花十分鐘專心陪身邊的人，不看手機。"]],"事":[["只顧著衝業績、追目標，卻沒發覺生活已經被沖走。偶爾抬頭看看。","今天抬頭看看窗外，問自己：我的生活有被好好過嗎？"]],"財":[["一直追逐想要的，等到想停下來時，可能已經來不及。","今天停下來十分鐘，想想：我現在追的，是我真正要的嗎？"]],"現":[["只顧採花、心黏在別處，死亡來時就像洪水捲走睡著的村莊。別只想著下一步，錯過眼前。","今天走路時，看一樣沿途平常的東西。"]]},"p4":{"情":[["慾望永遠填不滿。懂得滿足，感情和日子才會輕鬆。","今天想一件你已經擁有的，說聲謝謝。"]],"人":[["總想要更多，就很難珍惜身邊已有的人。","今天對身邊一個人，說出一件他讓你感謝的事。"]],"財":[["慾望永遠填不滿。知道什麼叫夠了，才算真正有錢。","今天想一件「夠了」的事，對自己說：「這樣就夠了。」"]],"放":[["對欲樂永遠不滿足，死亡就來了。知足，是放下的開始。","今天對一樣已經擁有的東西，說一句：夠了。"]]},"p5":{"人":[["和人相處像蜜蜂採花：取你需要的，不傷害對方。","今天跟人互動時，只取你需要的，不多佔也不虧待別人。"]],"事":[["做生意、談合作也一樣，拿該拿的，不要傷害別人。","今天談事情時，想一想對方的需要。"]],"財":[["賺錢像蜜蜂採花：取該取的，不傷害別人。","今天做生意或談事時，取你該取的，也讓對方有利。"]],"現":[["蜜蜂取蜜，不傷花。與人相處，拿走需要的，不損壞對方。","今天跟人相處時，留意自己有沒有用得太多、拿得太多。"]]},"p6":{"人":[["少盯著別人哪裡沒做好，多看看自己今天做了什麼。","今天忍住一次想挑別人毛病的念頭。"],["別一直盯著誰沒做好，先做好自己能做的。","今天先做好你能做的一件事，不管別人。"]],"友":[["跟朋友相處，不挑他的毛病，多看看自己有沒有做到。","今天對朋友，只看他的優點。"]],"活":[["少看別人做了什麼、沒做什麼，多看自己做了什麼。關係會輕鬆很多。","今天有人讓你不舒服時，先看自己能做哪一件事。"]]},"p7":{"學":[["光說不練沒有用。學到的道理，用出來才會結果。","今天把學到的一件事，做出來給別人看。"]],"人":[["說得再好聽，要做到才有人信。","今天說出口的話，找一件做到。"]],"過":[["過去說過的好話，要實行才有香。","今天實踐一句你曾經說過的好話。"]]},"p8":{"人":[["一點一點累積，像花編成花環：今天多幫人一件小事。","今天幫人一個小忙，不求回報。"]],"情":[["感情要靠一件一件小事慢慢累積，不是一束花就夠，要常常用心。","今天為在乎的人做一件小事，哪怕只是一杯水。"]],"家":[["一個家是一件一件小事編起來的，今天多做一件。","今天為家人做一件小事，不用等他說。"]],"未":[["一點一點的善，編成未來的花環。","今天做一件小善，並記下來。"]]},"p9":{"友":[["真正的好朋友，不靠外表或名聲，人品的味道，自然傳得很遠。","今天以你的行為，而不是言語，對朋友表達一次善意。"]],"情":[["外表的吸引像花香，風一吹就散；人品的香，才讓人記得。","今天不為了外表花時間，把時間用在關心一個人。"]],"活":[["花香不逆風，有德的人香遍四方。好的氣質不用大聲，身邊的人自然感覺得到。","今天用溫和的方式對待一位家人或同事，不求回報。"]]},"p10":{"人":[["再貴的香水，也比不上一個品德好的人帶給人的感覺。","今天對一個人，用品德與尊重相待。"]],"友":[["朋友記住你，是因為你的為人，不是你的名牌。","今天做一件讓朋友記住你好的事。"]],"活":[["持戒的香，比花香傳得更遠。","今天守住一個小承諾，哪怕只是準時。"]]},"p11":{"事":[["守住自己的原則、不鬆懈，誘惑就找不到可以攻破的縫隙。","今天想清楚自己的一個底線，並守住它。"]],"學":[["守好規律、不放鬆，干擾就沒有機會得手。","今天把每天固定要做的事，一件件按時做完。"]],"現":[["安住在不放逸的人，魔找不到他們的去處。專心的時候，煩惱比較難插進來。","今天專心做一件事二十分鐘，不看手機。"]]},"p12":{"人":[["環境再糟，也能做個清清爽爽的人。別人怎樣，不代表你要怎樣。","遇到壞心情的環境時，對自己說：「我可以不一樣。」"]],"友":[["出身、環境不好，不代表人不好。從泥裡長出來的人，也很香。","今天對一個人不要先看出身或背景，只看他今天怎麼做。"]],"現":[["偈說：在混濁的地方，也有人清淨地開著。你也可以是其中一朵。","今天在不理想的處境裡，找一件可以做好的小事。"]]},"b1":{"情":[["睡不著的夜特別長，心裡煩亂的日子也是。找回一點平靜，時間就沒那麼難熬。","睡前做三次深長的呼吸，把今天放下。"]],"健":[["睡不著的夜特別長。別跟失眠對抗，先讓心慢慢平靜。","今天睡前，躺著做十次慢呼吸。"]],"存":[["疲倦的人，路特別長。累了就休息，是為了走得更遠。","今天累了就坐下休息五分鐘。"]]},"b2":{"友":[["跟總是讓你煩惱的人天天綁在一起，真的會累。慎選相處的人。","今天想想：有沒有一個總讓你煩的關係，適合先拉開一點距離？"]],"人":[["天天處不來的關係是一種消耗。適當保持距離，也是保護自己。","今天為一段讓你疲憊的關係，保留一點屬於自己的時間。"]],"向":[["找不到可以互相學習的同伴，寧可先自己走。方向一致的人，比人多更重要。","今天主動聯絡一位和你方向一致的人。"]]},"b3":{"情":[["總想著「他是我的」，煩惱就多了。放一點手，愛才輕鬆。","今天對在乎的人，少說一句「你應該」。"]],"事":[["別把成績、財富都看成「我的」；抓得越緊，越煩惱。","今天寫下三件你放不下的「我的」，對其中一件放一點手。"]],"家":[["孩子不是你的附屬品。放一點手，親子關係反而更輕鬆。","今天對孩子少說一次「你應該」，多問一次「你想怎麼做」。"]],"財":[["錢和財產都說是「我的」，其實連自己都不屬於自己。看淡一點，煩惱就少一點。","今天看看一個你很在乎的「我的」，想想：放一點手，會怎樣？"]],"放":[["連「我」都不真正屬於我，哪來的「我的孩子、我的錢」？少一點「我的」，少一點憂愁。","今天把一句「這是我的」，換成「這暫時在我這裡」。"]]},"b4":{"友":[["承認「我不懂」的人，反而進步最快。","今天對一件不懂的事，大方說：「我不懂，可以教我嗎？」"]],"人":[["自以為什麼都懂的人最難溝通。肯說「我不懂」，才有機會學。","今天遇到不懂的事，坦白說出「我不清楚」。"]],"過":[["承認自己過去不懂，是進步的開始。","今天對一件過去做不好的事說：那時我不懂，現在我知道了。"]]},"b5":{"學":[["在課堂裡不用心，坐再久也學不到東西，像勺子泡在湯裡嘗不出味道。","今天上課或讀書時，專心聽到最後，再做筆記。"],["有人教你、有書給你，若自己不用心，也是白費。","今天專心上完一堂課，不分心。"]],"友":[["身邊有再好的朋友，如果自己不用心去體會，也不會有收穫。","今天跟朋友聊天時，專心聽他說，不插話。"]],"過":[["終身親近智者卻不明白，像勺子嘗不出湯味。過去聽的，是否真的吸收了？","今天把以前讀過的一句話，真的用一次。"]]},"b6":{"學":[["用心的人，聽一堂課就懂；不用心的人，聽十堂也沒進。專心最重要。","今天專心聽一段課，不看手機。"],["只是聽、只是抄不夠，要用心想，才嘗得出味道。","今天上課時，專心想一個問題，而不只是記。"]],"友":[["遇到一個好朋友，用心相處，很快就懂得他的好。","今天花十分鐘，認真聽朋友說他的事。"]],"活":[["聰明的人親近智者片刻，就明白了。願意學，才學得到。","今天向一位前輩請教一個問題。"]]},"b7":{"人":[["一時為了痛快去傷人、佔便宜，等於在傷害自己。","今天忍住一個想佔便宜或出氣的念頭。"]],"過":[["過去對自己不夠好的選擇，今天開始，對自己好一點。","今天做一件對自己真正好的事。"]]},"b8":{"事":[["做決定前問問自己：做了之後，會不會後悔？會的話，先停一下。","今天做重要決定前，問自己：做了之後，我會後悔嗎？"]],"人":[["說一句話之前，想想會不會後悔。","今天出口前，先停三秒。"]],"財":[["花錢、投資前問自己：事後會不會後悔？會的話，先等一等。","今天要花錢前，先等一天再買。"]],"過":[["做了會後悔的事，不是好事。看清過去的選擇，是為了今天更清醒。","今天回想一個後悔的決定，找出你當時沒看見的一點。"]]},"b9":{"事":[["做完之後心裡安穩、不後悔的事，才是值得做的。","今天挑一件事，做完後安心，不後悔。"]],"財":[["花在事後不後悔的地方，才是值得的錢。","今天花錢前問：這筆錢，我事後會安心嗎？"]],"未":[["做了以後不會後悔的事，才是好事。","今天做決定前，想像一年後的自己。"]]},"b10":{"情":[["有些行為當下很甜，後果卻會苦。多想一句：「之後呢？」","今天遇到「當下很甜」的誘惑，問自己：「一週後呢？」"]],"財":[["容易賺的錢、當下很甜的好處，要多問一句：之後呢？","今天遇到容易的好處，問自己：「之後呢？」"]],"過":[["做了不好的事，結果可能晚一點才出現。","選一件拖著的小事（欠的道歉、承諾），今天補上。"]]},"b11":{"事":[["不是辛苦、熬夜就叫努力。方向對、懂得道理，才是真正的功夫。","今天花五分鐘想：我現在的努力，方向對嗎？"]],"存":[["形式上的苦修或享樂，都不如明白一句法。","今天吃飯時，留意第一口的味道，吃的時候不滑手機。"]]},"b12":{"人":[["以為沒被發現就沒事？做過的事，像灰裡的火，不會憑空消失。","今天回想一件你做過的小事，是否需要道歉。"]],"情":[["傷人的話，當下好像沒事，但關係裡的火會慢慢燒起來。","今天對在乎的人，把一句尖刻的話，換成溫和的說法。"]],"家":[["家裡沒說開的氣，像灰裡的火。找個平靜的時候，把話說清楚。","今天找一個平靜的時刻，把一件心裡的小事說開。"]],"過":[["惡業像灰蓋著的火，慢慢跟著你。早一點面對，早一點熄。","今天面對一件拖了很久的事：道歉、補救，或說清楚。"]]},"b13":{"人":[["知識和聰明若用來炫耀、傷人，反而害了自己。","今天用你知道的事幫一個人，而不是展示給人看。"]],"友":[["學到的東西不是用來贏過朋友，而是用來幫助彼此。","今天把學到的東西，分享給朋友一件。"]],"財":[["聰明若只用來算計，反而害了自己。","今天用你的聰明幫一個人，而不是算計一個人。"]]},"b14":{"友":[["想出名、想站最前面，朋友之間的情誼就變成競爭。","今天稱讚朋友的一個優點，而不是比較。"]],"人":[["愛搶功、想當老大，人際會越走越累。","今天把一件功勞，分給一位同事。"]],"財":[["為了名利爭得你死我活，不如想想自己真正要的是什麼。","今天想想：我真正想要的是什麼？"]],"放":[["想被看見、想居上位，是很重的包袱。","今天做一件好事，不讓人知道。"]]},"b15":{"學":[["為了名利而學，和為了真正理解而學，是兩條不同的路。選哪一條？","今天問自己：我現在學這個，是為了理解，還是為了名利？"]],"事":[["賺錢和修養自己是兩件事。別為了利益丟了本心。","今天面對一個利益誘惑時，問自己：這樣做，我還安心嗎？"]],"財":[["賺錢和修養自己是兩件事。別為了利益丟了本心。","今天問自己：我現在做這件事，是為了利，還是為了本心？"]],"向":[["通往利養的是一條路，通往寧靜的是另一條路。先看清自己走的是哪一條。","今天問自己：我追的這個，是「得到」，還是「安心」？"]]},"m1":{"學":[["老師指出你的錯，是在給你寶藏。感謝肯直接說你錯的人。","今天請一位你信任的人，指出你一個可以進步的地方。"],["把別人的批評當成一份禮物，拆開看看裡面有什麼。","今天請老師或朋友給你一個建議。"]],"友":[["願意說真話的朋友，比只會討好你的更珍貴。","今天對一位肯說真話的朋友，說聲謝謝。"]],"活":[["遇到願意直說你過失的人，像遇到指出寶藏的人。這樣的人，值得親近。","今天向一位信任的人問：我有什麼地方可以改進？"]]},"m2":{"友":[["為朋友好而說真話，可能被討厭，但這樣的朋友才是真朋友。","今天對朋友說一句真誠的提醒，語氣放軟。"],["朋友做錯事，當面、小聲、出於關心地說。","今天找一位朋友，小聲、溫和地說一件你擔心的事。"]],"人":[["說該說的話，有時會不被喜歡。但這樣的人，好人會喜歡。","今天遇到該說的話，鼓起勇氣說出口，並保持溫和。"]],"家":[["對家人說真話，他們不一定愛聽。出於關心、不帶火氣，才是真的為他好。","今天對家人說一句真話，語氣放軟，先說「我是擔心你」。"]],"活":[["勸人向善，善人喜歡，不善的人討厭。該說的話，別怕不被喜歡。","今天對一件不對的事，溫和說出你的看法。"]]},"m3":{"友":[["跟什麼樣的人在一起，就會變成什麼樣的人。選朋友，是在選自己。","今天想想：和誰在一起，讓你變得更好？多聯絡他。"],["不用跟所有人都好。把時間留給讓你變好的人。","今天花時間跟一個讓你變好的朋友聊。"]],"活":[["常和好朋友在一起，遠離損友。你和誰在一起，會慢慢變成什麼樣。","今天主動聯絡一位能讓你變好的朋友。"]]},"m4":{"學":[["讀到真正有收穫的東西，心是安靜的，晚上也睡得好。","今天讀完一小段，停一下，感受心裡的安靜。"]],"健":[["心澄明的人，睡得安穩。睡前，少想一件煩事。","今天睡前，把一件煩心事寫在紙上，明天再想。"]],"存":[["心裡沒有懸著的事，睡得就比較安穩。","今晚睡前，把今天做完的三件事想一遍，然後放下。"]]},"m5":{"事":[["工匠會把木頭整治好，你也可以。每天調整自己一點點。","今天挑一個小習慣，調整一點點。"]],"學":[["箭桿能一點一點削直，習慣也能一點一點調整。","今天調整一個影響念書的小習慣。"]],"情":[["感情裡最該調整的，常常是自己的脾氣。一點一點削，就會順。","今天感情裡挑一個習慣性的反應，改變一點點。"]],"命":[["弓匠調弓、木匠調木，智者調自己。人生要整理的，是自己。","今天挑一個自己的小習慣，調整一點點。"]],"向":[["弓匠調弓、木匠調木，智者調自己。方向對了，還要不斷微調。","今天對照一次目標，微調一個小地方。"]]},"m6":{"事":[["被誇不飄、被罵不倒，像岩石一樣穩。","今天聽到讚美或批評時，深呼吸，不立刻反應。"]],"人":[["別人說你好或壞，都只是風。做好自己的事就好。","今天別人說了你一句，先深呼吸，不放在心上。"]],"健":[["別人的評價，不必每一句都放進心裡，心才不累。","今天聽到一句評價，不放進心裡，深呼吸放下。"]],"現":[["像整塊岩石不被風吹動，面對毀譽也不動搖。此刻的稱讚或批評，都會過。","今天聽到一句讚美或批評，先深呼吸，不馬上回應。"]]},"m7":{"學":[["聽完課或讀完書，心變得清楚、安靜，才算真的學進去。","讀完一段後，閉眼十秒，感受心的清楚。"]],"命":[["像深湖一樣澄淨。聽到好的道理，心就靜下來。","今天讀或聽一段讓你平靜的話，靜靜想一分鐘。"]]},"m8":{"情":[["快樂和難過都會過去，不用被它們推著走。","今天心情起伏時，深呼吸三次，看著它過去。"]],"事":[["順利時不得意、挫折時不洩氣，能穩住的人走得遠。","今天順利或不順時，都對自己說：「穩住。」"]],"健":[["順和逆都是一時的，穩住呼吸，穩住心。","今天遇到順逆時，都做三次深呼吸。"]],"放":[["好事壞事來，智者不大起大落。不必壓住感受，只是別把一時的苦樂，當成全部的自己。","今天遇到順或逆時，先停一下，感受它，再看一次。"]]},"m9":{"事":[["成功不要靠不正當的手段。哪怕慢一點，也要走得正。","今天面對誘惑時，選擇慢但正的那條路。"]],"學":[["不作弊、不走捷徑，靠自己得到的才是自己的。","今天寫作業或準備考試時，堅持自己做。"]],"財":[["成功不要靠不正當的手段，慢一點，也要走得正。","今天面對一個走捷徑的機會，選擇正的那條路。"]],"放":[["不靠不正當的方法求成功，也不處處執著「一定要」。把「一定要」放下，心反而穩。","今天挑一件「一定要成功」的事，只問自己有沒有盡力，結果放一邊。"]]},"m10":{"事":[["多數人都在原地忙碌打轉，真正走出來的人很少。想想自己是不是在繞圈。","今天問自己：我最近的忙碌，是在往前，還是在繞圈？"]],"學":[["大家都在補習、堆資料，真正走到目的地的人很少。先想清楚方向。","今天花五分鐘，寫下自己學習的方向。"]],"向":[["岸就在那裡，多數人只是沿著這一岸跑來跑去。先決定要去哪一岸，再邁步。","今天寫下一個你真正想去的方向，再決定第一步。"]]},"m11":{"學":[["放掉壞習慣，養成好習慣，每天一點，日子就會越來越清明。","今天放掉一個壞習慣一天，換成一個好習慣。"]],"情":[["放下那些讓你痛苦的執著，心才會慢慢清明。","今天放下一個讓你痛苦的念頭，三分鐘。"]],"向":[["捨去讓人迷失的，修習讓人清明的，再往前走。","今天戒掉一件讓你偏離的小習慣。"]]},"r1":{"情":[["放下之後，心就不再灼熱。累了的時候，也可以停下來。","累的時候，找一個地方，什麼都不做，坐十分鐘。"]],"健":[["心裡不再燒著，身體才能真正放鬆。找回一個不煩惱的片刻。","今天找十分鐘，什麼都不做，只是休息。"]],"放":[["旅程走完、繫縛解開的人，不再有熱惱。背著的東西少一件，路就輕一點。","今天選一個還背著的念頭，想像把它放在桌上，然後離開座位。"]]},"r2":{"事":[["該離開時就好好離開，不拖泥帶水。轉換環境，不必太多執著。","今天整理一個舊的、不再需要的東西，放手。"]],"財":[["該放手的時候放手，不拖泥帶水。","今天放下一個不再需要的東西或念頭。"]],"放":[["像鵝離開池塘，不回頭戀棧。該離開的地方，輕輕離開。","今天整理一件不再需要的物品或訊息，說聲謝謝再放手。"]]},"r3":{"事":[["不貪多、不囤積，生活簡單，人就自由。","今天少買一樣東西，看看心裡的感覺。"]],"健":[["吃得知足、不過量，身體和心都輕。","今天吃飯時，吃到剛好，不過量。"]],"財":[["不囤積、不貪多，用得到的就夠，心反而富足。","今天少買一樣不必要的東西。"]],"存":[["吃得剛好、不囤積，日子就簡單。知足，是活下去的底氣。","今天算一下這個月真正必要的支出，把一項衝動花費延後。"]]},"r4":{"事":[["不被吃喝享受綁住，人就輕盈。","今天吃飯時，專心吃，不看手機。"]],"存":[["對飲食沒有依賴，心就自由。","今天一餐簡單吃，留意身體到底需要多少。"]]},"r5":{"人":[["不自大、情緒穩定的人，大家自然敬重。","今天遇到想爭高低的時刻，退一步。"]],"事":[["自己穩得住，別人才會信任你。","今天說到做到一件小事，讓人安心。"]],"未":[["現在練習調伏自己，未來才有力氣面對。","今天想說重話時，先停一下，換成「事實加感受」。"]]},"r6":{"人":[["像大地一樣，被踩也不發怒。心穩定，別人就難以惹怒你。","今天被人惹到時，深呼吸，穩住。"],["別人的情緒是他的天氣，你不用跟著下雨。","今天別人情緒不好時，你保持平靜。"]],"情":[["面對情緒，先穩住自己；關係才會有安全感。","今天情緒來時，先穩住自己，再說話。"]],"家":[["在家做一個像大地一樣穩的人，家人才有地方可以放心依靠。","今天家人情緒不好時，你先穩住，不跟著起伏。"]],"未":[["把心練得像山一樣穩，遇到風浪時，比較站得穩。","今天被惹到時，先停三秒，再決定怎麼回。"]]},"r7":{"學":[["年紀小也能把心安靜下來。靜下來，學習就容易。","今天安靜坐五分鐘，再開始讀書。"]],"命":[["心寂靜，言語和行為也寂靜。","今天說話前慢一拍，讓話從平靜的心裡出來。"]]},"r8":{"事":[["不輕易盲信、不被慾望牽著走的人，最令人敬佩。","今天面對一個資訊或要求，先想想再相信。"]],"人":[["不隨波逐流、不盲目相信，才是最值得敬重的人。","今天別人都說好時，你問自己：我真的認同嗎？"]]},"r9":{"情":[["心裡安定了，在哪裡都是好地方。","今天找一個地方，安靜待著，感受平靜。"]],"事":[["不論在哪個職場、哪個階段，心安定，就是好地方。","今天面對讓你煩的環境，先讓自己的心安定。"]],"健":[["心安定了，在哪裡都能休息。","今天在你所在的地方，安靜坐一分鐘。"]],"現":[["阿羅漢住的地方，就是令人歡喜的地方。心安的地方，就是好地方。","今天在你所在的地方，找一個舒服的小角落，靜一分鐘。"]]},"r10":{"情":[["不再一直想要更多，安靜的地方也能讓你快樂。","今天花十分鐘在安靜的地方，什麼都不求。"]],"健":[["安靜的地方能讓心休息。找一個地方，什麼都不想十分鐘。","今天找一個安靜的地方，什麼都不想十分鐘。"]],"放":[["離開貪求的人，在清靜處也歡喜，因為不再尋找欲樂。少一個「想要」，多一份清爽。","今天想買或想滑的時候，先停一分鐘，問自己真正要的是什麼。"]]},"s1":{"情":[["安慰人不用說很多，一句真心、讓人平靜的話就夠。","今天對在乎的人，說一句簡短、真誠、讓人平靜的話。"]],"學":[["讀一百頁，不如真的懂一句。","今天只讀一頁，把它真的讀懂。"]],"命":[["說千句沒有義理的話，不如一句能讓人平靜的。","今天只記一句好話，用一整天。"]]},"s2":{"學":[["不求量多，讀懂一句、能用在生活裡，就夠了。","今天挑一句學到的話，想一想它能怎麼用。"],["讀完一頁，問自己一句：今天能用在哪裡？","今天讀完一頁，寫一句今天能用的做法。"]],"現":[["讀得多，不如現在讀懂一句。","今天只讀一段，讀懂了再往下。"]]},"s3":{"學":[["贏過全班，不如贏過昨天的自己。","今天比昨天多做一點點，就好。"]],"命":[["懂得一句法句，照著做，就有收穫。","今天挑一句經文，一整天只想這一句。"]]},"s4":{"事":[["最難贏的對手，是想偷懶的自己。","今天最想偷懶的時刻，先動手五分鐘。"],["今天比昨天好一點，就是贏。","今天比昨天好一點點。"]],"學":[["別跟別人比，今天比昨天進步一點，就是贏。","今天比昨天多讀一頁。"]],"命":[["戰勝自己，勝過戰勝千百個人。","今天做一件你原本想拖、想逃的小事。"]]},"s5":{"人":[["一分真心，勝過一堆形式。對值得敬重的人，好好表達心意。","今天對一位值得敬重的人，表達一份心意。"]],"財":[["花很多錢做形式，不如對值得敬重的人，真心表達一份心意。","今天對一位值得敬重的人，真誠說一句感謝。"]]},"s6":{"人":[["對正直的人多一分敬重，比花錢求福更有福。","今天對一位正直的人，認真說聲謝謝。"]],"友":[["尊敬品行好的朋友，從他們身上學，比求任何東西都有用。","今天向一位品行好的朋友，請教一件事。"]],"家":[["對長輩多一分敬重，不是形式，是看見他們一路走來的辛苦。","今天對長輩，主動問候或幫忙一件事。"]],"財":[["花很多錢求福，不如對正直的人多一分敬重。","今天對一位正直的人，表達你的敬重。"]],"活":[["禮敬正直的人，勝過許多求福的儀式。敬重身邊有德的人。","今天對一位身邊正直的人說：謝謝你。"]]},"s7":{"事":[["守住原則、心定的一天，勝過渾渾噩噩的一年。","今天守住一個原則，哪怕小事。"]],"學":[["專心念一天，勝過混一整年。","今天專心讀一小時，不分心。"]],"命":[["活一百年卻不守戒、心不安定，不如活一天守住標準。長短不是重點，今天怎麼用才是。","今天做一件「守住自己標準」的事。"]]},"s8":{"學":[["動腦思考的一天，勝過糊裡糊塗過一年。","今天花十分鐘想：我今天學了什麼？"]],"事":[["每天留點時間想想：我在做什麼、為什麼做。","今天花五分鐘，問自己：我在做什麼？為什麼？"]],"現":[["活一百年沒有智慧，不如活一天有智慧、能靜下來。","今天靜坐三分鐘，只數呼吸。"]]},"s9":{"學":[["鼓起勁認真一天，勝過拖拖拉拉一整年。","今天做一件認真的小事，全力完成。"]],"事":[["今天全力以赴一次，比每天都鬆鬆垮垮更有價值。","今天挑一件事，全力做完。"]],"現":[["活一百年懶散，不如活一天精進。今天，就是你的那一天。","今天只選一件事，用全力做完。"]],"向":[["勉力精進的一天，勝過懈怠的百年。方向對了，就一步一步走。","今天往目標走一小步，只要十分鐘。"]]},"s10":{"學":[["學會觀察事情的起落，不被一時的得失牽著走。","今天遇到起伏時，對自己說：「這是一時的。」"]],"現":[["活一百年不見事物生滅，不如活一天看見。看見它正在變。","今天留意一個念頭：升起、停留、消失。"]]},"s11":{"情":[["找到讓心真正安定的地方，一天就勝過百年迷茫。","今天找一個讓心安的小方法，做十分鐘。"]]},"s12":{"學":[["遇到真正對你有幫助的道理，一次就能改變很多。","今天把一個你認同的道理，寫下來，貼在看得到的地方。"]],"事":[["一個真正有智慧的觀念，勝過十年混日子。","今天寫下一個你想做的觀念，貼在桌前。"]],"向":[["活一百年卻不明白最上的道理，不如明白它的一天。方向，比長度重要。","今天讀一句你認同的好話，想想怎麼用在今天。"]]},"e1":{"人":[["想幫人，就現在去做。拖久了，念頭就消失了。","今天想幫誰，現在就去做。"]],"事":[["想做的好事、該做的事，趁熱就做，拖了容易變成不做。","今天想做的好事，十分鐘內開始。"]],"家":[["想對爸媽說的話、想帶他們去的地方，別等。","今天傳訊給爸媽，約一個時間見面。"]],"情":[["想說的感謝、想做的好事，趁現在說、趁現在做。","今天把一句一直沒說的感謝，說出口。"]],"過":[["行善遲緩的人，
